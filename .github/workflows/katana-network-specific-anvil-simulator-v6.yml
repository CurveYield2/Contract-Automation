name: Katana Network Specific Anvil Simulator v6

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v6/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v6.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v6/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-katana-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve live proxy implementations and selectors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v6/results
          RESULT=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v6/results/KATANA_PROXY_ABI_RESULT_v6.md
          RPC=https://katana.drpc.org/
          MANAGER=0x27b3eE81DF2Dd7356D5ac282e2416991A616f96a
          FXUSD=0x4c03ff0f44A55e7098a09016E02a01d3cdC2FDF9
          SLOT=0x360894A13BA1A3210667C828492DB98DCA3E2076CC3735A920A3CA505D382BBC

          MANAGER_WORD="$(cast storage "$MANAGER" "$SLOT" --rpc-url "$RPC")"
          FXUSD_WORD="$(cast storage "$FXUSD" "$SLOT" --rpc-url "$RPC")"
          MANAGER_IMPL="0x$(echo "$MANAGER_WORD" | sed 's/^0x//' | tail -c 41)"
          FXUSD_IMPL="0x$(echo "$FXUSD_WORD" | sed 's/^0x//' | tail -c 41)"
          MANAGER_CODE="$(cast code "$MANAGER_IMPL" --rpc-url "$RPC")"
          FXUSD_CODE="$(cast code "$FXUSD_IMPL" --rpc-url "$RPC")"

          {
            echo '# Katana Proxy ABI Result v6'
            echo
            echo "- PoolManager_proxy: $MANAGER"
            echo "- PoolManager_implementation_word: $MANAGER_WORD"
            echo "- PoolManager_implementation: $MANAGER_IMPL"
            echo "- fxUSD_proxy: $FXUSD"
            echo "- fxUSD_implementation_word: $FXUSD_WORD"
            echo "- fxUSD_implementation: $FXUSD_IMPL"
            echo
            echo '## PoolManager implementation selectors'
            echo '~~~text'
            cast selectors "$MANAGER_CODE" --resolve 2>&1 || cast selectors "$MANAGER_CODE" 2>&1 || true
            echo '~~~'
            echo
            echo '## fxUSD implementation selectors'
            echo '~~~text'
            cast selectors "$FXUSD_CODE" --resolve 2>&1 || cast selectors "$FXUSD_CODE" 2>&1 || true
            echo '~~~'
          } > "$RESULT"

      - name: Persist Katana proxy ABI result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CurveYield2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v6/results/KATANA_PROXY_ABI_RESULT_v6.md
          if ! git diff --cached --quiet; then
            git commit -m 'sim: record Katana proxy ABI discovery v6 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

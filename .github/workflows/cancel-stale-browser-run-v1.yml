name: Cancel Stale Browser Run v1

on:
  push:
    paths:
      - 'process/browser-agent-home-exit-v10/cancel-stale-run-v1.txt'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale browser run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "36941704919"
        run: |
          set -euo pipefail
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel"
          echo "cancel requested for $RUN_ID"

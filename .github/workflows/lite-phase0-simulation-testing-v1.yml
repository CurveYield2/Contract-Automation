name: Lite Phase 0 Simulation Testing v1

# Proves production Phase-0 Medusa and/or ABI telemetry end to end on a local ephemeral Anvil fork with reduced
# call budgets before spending a full campaign simulation. Never publishes campaign evidence.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
      medusa_calls:
        required: false
        default: '1000'
        type: string
      telemetry_calls:
        required: false
        default: '0'
        type: string
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
      medusa_calls:
        required: false
        default: '1000'
        type: string
      telemetry_calls:
        required: false
        default: '0'
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lite-phase0-simulation-testing-${{ github.event.issue.number || inputs.campaign_id || github.run_id }}
  cancel-in-progress: true

jobs:
  simulation-testing:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == '/phase0-smoke' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve smoke invocation
        id: invocation
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          MANUAL_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          MANUAL_CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          MANUAL_AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
          MANUAL_MEDUSA_CALLS: ${{ inputs.medusa_calls }}
          MANUAL_TELEMETRY_CALLS: ${{ inputs.telemetry_calls }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
            test "$head_repo" = "$GITHUB_REPOSITORY" || { echo "::error::Connector smoke comments may only execute same-repository PR heads"; exit 1; }
            test -n "$head_sha" || { echo "::error::Could not resolve PR head SHA"; exit 1; }
            {
              echo "target_ref=$head_sha"
              echo "campaign_id=curveyield-dex-v16-source-r4"
              echo "campaign_path=campaigns/CurveYield DEX v16 Source r4"
              echo "audit_controller_ref=main"
              echo "medusa_calls=0"
              echo "telemetry_calls=300"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "target_ref=$GITHUB_SHA"
              echo "campaign_id=$MANUAL_CAMPAIGN_ID"
              echo "campaign_path=$MANUAL_CAMPAIGN_PATH"
              echo "audit_controller_ref=$MANUAL_AUDIT_CONTROLLER_REF"
              echo "medusa_calls=$MANUAL_MEDUSA_CALLS"
              echo "telemetry_calls=$MANUAL_TELEMETRY_CALLS"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.invocation.outputs.target_ref }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --force

      - uses: ./.github/actions/setup-v7-toolchain

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ steps.invocation.outputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "$AUDIT_CONTROLLER_REF"
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"

      - name: Deploy on Anvil and run requested smoke stages
        env:
          ETHEREUM_FORK_RPC_URL: https://eth.drpc.org/
          CAMPAIGN_PATH: ${{ steps.invocation.outputs.campaign_path }}
          MEDUSA_CALLS: ${{ steps.invocation.outputs.medusa_calls }}
          TELEMETRY_CALLS: ${{ steps.invocation.outputs.telemetry_calls }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MEDUSA_CALLS" =~ ^[0-9]{1,6}$ ]] || { echo "::error::medusa_calls must be an integer from 0 to 999999"; exit 1; }
          [[ "$TELEMETRY_CALLS" =~ ^[0-9]{1,6}$ ]] || { echo "::error::telemetry_calls must be an integer from 0 to 999999"; exit 1; }
          (( MEDUSA_CALLS > 0 || TELEMETRY_CALLS > 0 )) || { echo "::error::at least one smoke call budget must be greater than zero"; exit 1; }
          chain_id="$(curl -fsS --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test "$chain_id" = "0x1" || { echo "::error::Ethereum fork source did not report chain ID 1"; exit 1; }
          historical_code="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_getCode","params":["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2","0x112a880"]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test -n "$historical_code" && test "$historical_code" != "0x" || { echo "::error::Ethereum fork source did not return historical WETH code at block 18000000"; exit 1; }
          args=(scripts/run-phase0-randomized-simulation-v1.mjs --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" --output .phase0-medusa-smoke --fork-url "$ETHEREUM_FORK_RPC_URL")
          if (( MEDUSA_CALLS > 0 )); then args+=(--medusa-smoke-calls "$MEDUSA_CALLS"); fi
          if (( TELEMETRY_CALLS > 0 )); then args+=(--telemetry-smoke-calls "$TELEMETRY_CALLS"); fi
          node "${args[@]}"

      - name: Report and require requested smoke results
        if: ${{ always() }}
        env:
          MEDUSA_CALLS: ${{ steps.invocation.outputs.medusa_calls }}
          TELEMETRY_CALLS: ${{ steps.invocation.outputs.telemetry_calls }}
        shell: bash
        run: |
          set -euo pipefail
          summary=.phase0-medusa-smoke/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
          test -f "$summary" || { echo "::error::No simulation summary was produced"; exit 1; }
          echo "---- Deployment coverage ----"
          jq '.deployment.coverage // {}' "$summary"

          if (( TELEMETRY_CALLS > 0 )); then
            echo "---- Telemetry smoke summary ----"
            jq '.telemetry[] | {runId,minedSuccess,minedRevert,simulatedRejection,positiveTransitions,positiveEconomicTransitions,accountingActionShare,observationReads,accountingObservationCalls,skippedObservationCalls,observationReadsPerAccountingCall}' "$summary"
            echo "---- Top 15 decoded telemetry revert reasons ----"
            jq -r '[.telemetry[]?.decodedRevertReasons[]?] | group_by(.reason) | map({reason:.[0].reason,kind:.[0].kind,selector:.[0].selector,count:(map(.count)|add)}) | sort_by(-.count, .reason) | .[:15] | ("COUNT\tKIND\tSELECTOR\tREASON"), (.[] | [.count,.kind,(.selector // ""),.reason] | @tsv)' "$summary"
          fi

          fixture=.phase0-medusa-smoke/PHASE0_FIXTURE_SYNTHESIS_v1.json
          if [ -f "$fixture" ]; then
            echo "---- Fixture synthesis evidence ----"
            jq '.' "$fixture"
          elif jq -e '.fixtureSynthesis? != null' "$summary" >/dev/null; then
            echo "---- Fixture synthesis evidence ----"
            jq '.fixtureSynthesis' "$summary"
          fi

          if (( MEDUSA_CALLS > 0 )); then
            echo "---- Medusa smoke summary ----"
            jq '.medusa | del(.targetContracts, .achievedDispatchWeight.wrapperCounts, .achievedDispatchWeight.logicalCounts)' "$summary"
            raw="$(find .phase0-medusa-smoke -name MEDUSA_RAW_OUTPUT_v1.log -print -quit)"
            if [ -n "$raw" ]; then echo "---- Medusa raw output (tail) ----"; tail -n 120 "$raw" | sed -E 's#https?://[^ ]+#[URL]#g'; fi
            jq -e --argjson n "$MEDUSA_CALLS" '(.medusa.status=="PASS" or .medusa.status=="COMPLETE_WITH_ORACLE_GAPS") and (.medusa.observedCalls|tonumber)>=$n' "$summary" >/dev/null
          fi
          if (( TELEMETRY_CALLS > 0 )); then
            jq -e --argjson n "$TELEMETRY_CALLS" '(.telemetry|length)==1 and (.telemetry[0].status=="PASS") and (.telemetry[0].calls|tonumber)==$n' "$summary" >/dev/null
          fi

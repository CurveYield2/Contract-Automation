name: Lite Phase 0 Simulation Testing v1

# Proves the production Phase-0 Medusa stage end to end (real deployment on the Anvil fork, generated router,
# Medusa engine) with a small call budget before spending a full campaign simulation. Never publishes evidence.
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
      medusa_calls:
        required: false
        default: '1000'
        type: string

permissions:
  contents: read

concurrency:
  group: lite-phase0-simulation-testing-${{ inputs.campaign_id }}
  cancel-in-progress: true

jobs:
  simulation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --force

      - uses: ./.github/actions/setup-v7-toolchain

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "$AUDIT_CONTROLLER_REF"
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"

      - name: Deploy on Anvil and run Medusa with a reduced call budget
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
          CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          MEDUSA_CALLS: ${{ inputs.medusa_calls }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MEDUSA_CALLS" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::medusa_calls must be a positive integer"; exit 1; }
          node scripts/run-phase0-randomized-simulation-v1.mjs --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" \
            --output .phase0-medusa-smoke --fork-url "$ETHEREUM_FORK_RPC_URL" --medusa-smoke-calls "$MEDUSA_CALLS"

      - name: Report and require Medusa smoke result
        if: ${{ always() }}
        env:
          MEDUSA_CALLS: ${{ inputs.medusa_calls }}
        shell: bash
        run: |
          set -euo pipefail
          summary=.phase0-medusa-smoke/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
          test -f "$summary" || { echo "::error::No simulation summary was produced"; exit 1; }
          jq '.deployment.coverage // {}' "$summary"
          jq '.medusa | del(.targetContracts, .achievedDispatchWeight.wrapperCounts, .achievedDispatchWeight.logicalCounts)' "$summary"
          raw="$(find .phase0-medusa-smoke -name MEDUSA_RAW_OUTPUT_v1.log -print -quit)"
          if [ -n "$raw" ]; then echo "---- Medusa raw output (tail) ----"; tail -n 120 "$raw" | sed -E 's#https?://[^ ]+#[URL]#g'; fi
          jq -e --argjson n "$MEDUSA_CALLS" '(.medusa.status=="PASS" or .medusa.status=="COMPLETE_WITH_ORACLE_GAPS") and (.medusa.observedCalls|tonumber)>=$n' "$summary" >/dev/null

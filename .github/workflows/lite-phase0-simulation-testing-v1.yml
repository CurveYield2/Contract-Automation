name: Lite Phase 0 Forked Deploy Config Smoke v2
on:
  push:
    paths:
      - '.github/smoke-trigger/lite-phase0-simulation-testing-v1.json'
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
permissions:
  contents: read
jobs:
  fork-deploy-config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore dependencies
        uses: ./.github/actions/setup-phase0-node-cache
      - name: Enable native package Forge scripts
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1
      - name: Resolve smoke request
        id: request
        env:
          MANUAL_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          MANUAL_CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          MANUAL_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            file=.github/smoke-trigger/lite-phase0-simulation-testing-v1.json
            jq -e '.schemaVersion=="curveyield-lite-phase0-deploy-config-smoke-request-v1" and (.campaign_id|length>0) and (.campaign_path|startswith("campaigns/"))' "$file" >/dev/null
            id="$(jq -r '.campaign_id' "$file")"
            location="$(jq -r '.campaign_path' "$file")"
            ref="$(jq -r '.audit_controller_ref // "main"' "$file")"
          else
            id="$MANUAL_CAMPAIGN_ID"
            location="$MANUAL_CAMPAIGN_PATH"
            ref="${MANUAL_CONTROLLER_REF:-main}"
          fi
          test -n "$id" && [[ "$location" == campaigns/* ]]
          echo "campaign_id=$id" >> "$GITHUB_OUTPUT"
          echo "campaign_path=$location" >> "$GITHUB_OUTPUT"
          echo "controller_ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Checkout exact campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ steps.request.outputs.controller_ref }}
        run: bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF"
      - name: Run native deploy/config scripts on Anvil and validate evidence
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM missing"; exit 1; }
          timeout -s TERM -k 30s 2400s node scripts/run-phase0-fork-deploy-config-v1.mjs \
            --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" \
            --output .phase0-deploy-smoke --fork-url "$ETHEREUM_FORK_RPC_URL" | tee .phase0-deploy-smoke.log
          jq -e '
            .schemaVersion=="curveyield-lite-phase0-deploy-config-execution-v3"
            and .executionMode=="ANVIL_FORK_PACKAGE_DEPLOY_CONFIG_ONLY"
            and (.status=="PASS" or .status=="NOT_APPLICABLE_NO_DEPLOYMENT_SCRIPT")
            and (.status!="PASS" or (all(.scriptDispositions[]; .disposition=="EXECUTED_PASS") and all(.attempts[]; .status=="PASS" and .exitCode==0)))
            and (.fork.engine=="anvil" and .fork.chainId==1)
          ' .phase0-deploy-smoke/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json >/dev/null
      - name: Retain full smoke evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-deploy-smoke-${{ github.run_id }}
          path: |
            .phase0-deploy-smoke
            .phase0-deploy-smoke.log
          retention-days: 14
          if-no-files-found: warn

name: Archive Solidity Failure Diagnostic v1
on:
  push:
    branches: [main]
    paths: ['.github/smoke-trigger/archive-solidity-diagnostic-v1.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: boosthub
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11.zip
          - label: cyvlsdt
            archive: campaigns/cyvlSDT v30 Audit v29/source/CurveYield-cyvlSDT-Deployment-Package-v30.zip
    steps:
      - uses: actions/checkout@v4
      - name: Select GitHub source token
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Retrieve selected Solidity files from verified archived ZIP
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/CurveYield2/Audit-Controller.git .audit-controller
          git -C .audit-controller sparse-checkout set --no-cone "$SOURCE_ARCHIVE"
          mkdir -p .diagnostic
          python3 - <<'PY'
          import zipfile,os,hashlib,pathlib,json
          p=pathlib.Path('.audit-controller')/os.environ['SOURCE_ARCHIVE']
          out=pathlib.Path('.diagnostic')
          namewords=('CurveYieldVault','CurveYieldGovernanceToken','CurveYieldVlSDTToken','CurveYieldVlSDTBoostStaking','CurveYieldVlSDTRevenueStaking','CurveYieldCyGovYieldStaking','CurveYieldStakingStrategy','CurveYieldRevenueStrategy','CurveYieldVlSDTLocker','CurveYieldRevenueConverter','CurveYieldGovernanceMintController','CurveYieldVlSDTBoostMerchant')
          copied=[]
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            for item in z.infolist():
              pp=pathlib.PurePosixPath(item.filename)
              if not str(pp).endswith('.sol') or '..' in pp.parts:continue
              if not any(word in pp.name for word in namewords):continue
              data=z.read(item)
              if len(data)>250000:continue
              name=hashlib.sha256(str(pp).encode()).hexdigest()[:8]+'-'+pp.name
              (out/name).write_bytes(data)
              copied.append({'source':str(pp),'file':name,'bytes':len(data)})
          (out/'SOURCE_MANIFEST_v1.json').write_text(json.dumps({'source':os.environ['SOURCE_ARCHIVE'],'files':copied},indent=2))
          assert copied, 'no source files extracted'
          print(json.dumps(copied,indent=2))
          PY
      - name: Upload actual source code for root-cause inspection
        uses: actions/upload-artifact@v4
        with:
          name: archive-solidity-diag-${{ matrix.label }}-${{ github.run_id }}
          path: .diagnostic/
          include-hidden-files: true
          retention-days: 3

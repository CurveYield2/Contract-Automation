name: V26 Sync Feature With Main Once

on:
  push:
    branches:
      - feat/v26-machine-execution-v1
    paths:
      - '.github/workflows/v26-sync-feature-with-main-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v26-machine-execution-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CurveYield V26 Qualification'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git rm .github/workflows/v26-sync-feature-with-main-once.yml
          git commit -m 'chore(v26): remove one-shot branch synchronization workflow'
          git push origin HEAD:feat/v26-machine-execution-v1

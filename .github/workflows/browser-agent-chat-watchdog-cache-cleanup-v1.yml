name: Browser Agent Chat Watchdog Cache Cleanup v1

on:
  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-chat-watchdog/maintenance/cache-cleanup-v1.json'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only failed fork ChatGPT session caches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prefix='chatgpt-session-state-v1-chat-watchdog-'
          deleted=0
          while IFS=$'\t' read -r id key; do
            [ -n "$id" ] || continue
            case "$key" in
              "$prefix"*)
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY" --confirm
                deleted=$((deleted+1))
                ;;
            esac
          done < <(gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id,key --jq '.[] | [.id,.key] | @tsv')
          echo "Deleted $deleted failed-fork cache entries."

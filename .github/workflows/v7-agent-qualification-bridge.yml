name: V7 Agent Qualification Bridge

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: v7-agent-qualification-bridge
  cancel-in-progress: false

jobs:
  dispatch-and-observe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.title == '[agent] run-v7-qualification' &&
        (github.event.issue.user.login == 'CurveYield-Developer-DK' || github.event.issue.user.login == 'JamesNexus')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve oldest queued qualification issue
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          queue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,author,body)"
          selected="$(printf '%s' "$queue" | jq -c '[.[] | select(.title=="[agent] run-v7-qualification") | select(.author.login=="CurveYield-Developer-DK" or .author.login=="JamesNexus")] | sort_by(.number) | .[0] // empty')"
          if [ -z "$selected" ]; then
            echo 'has_issue=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="$(printf '%s' "$selected" | jq -r '.number')"
          issue_body_b64="$(printf '%s' "$selected" | jq -r '.body // ""' | base64 -w0)"
          echo 'has_issue=true' >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_body_b64=$issue_body_b64" >> "$GITHUB_OUTPUT"
          echo "queue_issue=$issue_number" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch canonical V7 qualification
        if: steps.queue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY_B64: ${{ steps.queue.outputs.issue_body_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_BODY="$(printf '%s' "$ISSUE_BODY_B64" | base64 -d)"
          workflow='v7-execution-infrastructure-qualification.yml'
          controller_ref="$(printf '%s\n' "$ISSUE_BODY" | awk -F= '/^[[:space:]]*controller_ref[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2}' | tail -n1)"
          requested_lane="$(printf '%s\n' "$ISSUE_BODY" | awk -F= '/^[[:space:]]*qualification_lane[[:space:]]*=/{gsub(/[[:space:]]/,"",$2); print $2}' | tail -n1)"
          if [ -n "$controller_ref" ] && ! [[ "$controller_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'controller_ref must be exact 40-hex commit' >&2
            exit 1
          fi
          case "$requested_lane" in
            '') if [ -n "$controller_ref" ]; then requested_lane='CONTROLLER_ONLY'; else requested_lane='FULL'; fi ;;
            FULL|CONTROLLER_ONLY) ;;
            *) echo 'qualification_lane must be FULL or CONTROLLER_ONLY' >&2; exit 1 ;;
          esac
          if [ "$requested_lane" = 'CONTROLLER_ONLY' ] && [ -z "$controller_ref" ]; then
            echo 'qualification_lane=CONTROLLER_ONLY requires controller_ref' >&2
            exit 1
          fi

          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          if [ -n "$controller_ref" ]; then
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f controller_ref="$controller_ref" -f qualification_lane="$requested_lane"
            echo "controller_ref=$controller_ref" >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main -f qualification_lane="$requested_lane"
          fi
          echo "qualification_lane=$requested_lane" >> "$GITHUB_STEP_SUMMARY"

          run_id=''
          for _ in $(seq 1 30); do
            sleep 2
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$candidate" != '0' ] && [ "$candidate" != "$before" ]; then
              run_id="$candidate"
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo 'Canonical qualification dispatch did not produce a discoverable workflow run' >&2
            exit 1
          fi
          echo "CANONICAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "canonical_run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe canonical V7 qualification
        if: steps.queue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$CANONICAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Publish last qualification attempt marker
        if: always() && steps.queue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v7-agent-qualification
          if [ -n "${CANONICAL_RUN_ID:-}" ]; then
            gh run view "$CANONICAL_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,status,conclusion,headSha,url,event,createdAt,updatedAt \
              > /tmp/v7-agent-qualification/canonical-run.json
          else
            printf '%s\n' '{"databaseId":null,"status":"unknown","conclusion":"dispatch_not_observed","headSha":null,"url":null,"event":null,"createdAt":null,"updatedAt":null}' \
              > /tmp/v7-agent-qualification/canonical-run.json
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const canonicalRun = JSON.parse(fs.readFileSync('/tmp/v7-agent-qualification/canonical-run.json', 'utf8'));
          const marker = {
            schemaVersion: 'curveyield-v7-agent-qualification-last-run-v1',
            bridgeWorkflowRunId: process.env.GITHUB_RUN_ID,
            triggerIssue: Number(process.env.ISSUE_NUMBER),
            recordedAt: new Date().toISOString(),
            canonicalRun,
          };
          fs.writeFileSync('/tmp/v7-agent-qualification/last-run.json', `${JSON.stringify(marker, null, 2)}\n`);
          NODE

          content="$(base64 -w0 /tmp/v7-agent-qualification/last-run.json)"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_LAST_RUN.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_LAST_RUN.json" \
              -f message='chore(v7): record latest qualification attempt' \
              -f content="$content" -f sha="$existing_sha" -f branch='main' >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_LAST_RUN.json" \
              -f message='chore(v7): record latest qualification attempt' \
              -f content="$content" -f branch='main' >/dev/null
          fi

      - name: Close trigger issue
        if: always() && steps.queue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.queue.outputs.issue_number }}
        shell: bash
        run: |
          run_id="${CANONICAL_RUN_ID:-unavailable}"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Canonical V7 qualification dispatch handled. Run ID: $run_id. See process/V7_QUALIFICATION_LAST_RUN.json for the recorded outcome."

      - name: Continue queued qualification issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,author --jq '[.[] | select(.title=="[agent] run-v7-qualification") | select(.author.login=="CurveYield-Developer-DK" or .author.login=="JamesNexus")] | length')"
          echo "remaining_qualification_issues=$remaining" >> "$GITHUB_STEP_SUMMARY"
          if [ "$remaining" -gt 0 ]; then
            gh workflow run v7-agent-qualification-bridge.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

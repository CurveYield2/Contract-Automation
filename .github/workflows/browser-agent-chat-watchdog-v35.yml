name: Browser Agent Chat Watchdog v35

on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-chat-watchdog/requests/*.json'

permissions:
  contents: write

env:
  CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
  CHATGPT_SESSION_STATE_KEY_B64: ${{ secrets.CHATGPT_SESSION_STATE_KEY_B64 }}
  BROWSER_HEADLESS: 'false'
  BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
  BROWSERLESS_PROFILE: ${{ vars.BROWSERLESS_PROFILE || 'chatgpt' }}
  BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
  BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
  BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve active chat watchdogs
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            request_path="$(
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^process/browser-agent-chat-watchdog/requests/[^/]+\.json$' |
              tail -n 1
            )"
            [ -n "$request_path" ] && [ -f "$request_path" ] || {
              echo "::error::No watchdog request JSON found."
              exit 2
            }

            chat_url="$(jq -r '.chat_url // empty' "$request_path")"
            [[ "$chat_url" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ ]] || {
              echo "::error::Invalid chat_url."
              exit 2
            }

            safe_id="$(basename "$request_path" .json | tr -c 'A-Za-z0-9._-' '_')"
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active/$safe_id.json"
            existing_json="$(gh api "$api?ref=main" 2>/dev/null || true)"
            existing_sha="$(jq -r '.sha // empty' <<<"$existing_json" 2>/dev/null || true)"
            [[ "$existing_sha" =~ ^[0-9a-f]{40}$ ]] || existing_sha=''

            deadline_epoch="$(( $(date -u +%s) + 43200 ))"
            jq -n \
              --arg id "$safe_id" \
              --arg chat "$chat_url" \
              --argjson deadline "$deadline_epoch" \
              '{
                schemaVersion:"curveyield-browser-agent-chat-watchdog-state-v35",
                id:$id,
                status:"ACTIVE",
                chatUrl:$chat,
                idleMessage:"GET BACK TO WORK",
                deadlineEpoch:$deadline,
                observation:{assistantCount:0,lastAssistantHash:""},
                pokeCount:0
              }' > /tmp/state.json

            content="$(base64 -w0 /tmp/state.json)"
            if [ -n "$existing_sha" ]; then
              gh api --method PUT "$api" \
                -f message="chore(chat-watchdog): restart $safe_id" \
                -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
            else
              gh api --method PUT "$api" \
                -f message="chore(chat-watchdog): arm $safe_id" \
                -f content="$content" -f branch=main >/dev/null
            fi

            jq -cn --arg id "$safe_id" '[$id]' > /tmp/targets.json
          else
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active?ref=main"
            if gh api "$api" --jq '.[]? | select(.type=="file" and (.name|endswith(".json"))) | .name' > /tmp/files.txt 2>/dev/null; then
              sed -n 's/\.json$//p' /tmp/files.txt | LC_ALL=C sort -u |
                jq -R -s 'split("\n") | map(select(length>0))' > /tmp/targets.json
            else
              printf '[]\n' > /tmp/targets.json
            fi
          fi

          count="$(jq 'length' /tmp/targets.json)"
          if [ "$count" -eq 0 ]; then
            echo 'targets=["__NONE__"]' >> "$GITHUB_OUTPUT"
            echo 'has_targets=false' >> "$GITHUB_OUTPUT"
          else
            echo "targets=$(jq -c . /tmp/targets.json)" >> "$GITHUB_OUTPUT"
            echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          fi

  supervise:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: browser-agent-chat-watchdog-v35-${{ matrix.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore known-good ChatGPT session state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/curveyield-browser-agent/session-state-v1.enc.json
          key: chatgpt-session-state-v1-36335218452-1-0

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Observe existing chat, then wake only if idle
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail

          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active/$WATCHDOG_ID.json"
          encoded="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"
          [ -n "$encoded" ] || exit 0
          printf '%s' "$encoded" | base64 -d > /tmp/state.json

          chat_url="$(jq -r '.chatUrl' /tmp/state.json)"
          deadline_epoch="$(jq -r '.deadlineEpoch' /tmp/state.json)"
          now_epoch="$(date -u +%s)"

          if [ "$now_epoch" -ge "$deadline_epoch" ]; then
            sha="$(gh api "$api?ref=main" --jq '.sha')"
            gh api --method DELETE "$api" \
              -f message="chore(chat-watchdog): expire $WATCHDOG_ID" \
              -f sha="$sha" -f branch=main >/dev/null
            echo "Watchdog $WATCHDOG_ID expired after 12 hours."
            exit 0
          fi

          export WAKE_MODE='resume_existing'
          export CHAT_URL="$chat_url"
          export WAKE_ID="$WATCHDOG_ID"
          export WAKE_ACTION='observe'
          export WAKE_RESULT_PATH='/tmp/observe.json'

          observe_rc=0
          xvfb-run -a node scripts/browser-agent-wake.mjs || observe_rc=$?

          challenge="$(
            jq -r '
              (.humanChallenge // false)
              or ([.providerFailures[]?.code, .failures[]?.code] | any(. == "BROWSER_CHALLENGE"))
            ' /tmp/observe.json 2>/dev/null || echo false
          )"

          if [ "$challenge" = true ]; then
            echo "Existing-chat deep link hit browser challenge; refreshing authenticated ChatGPT session on the home page."

            warmup_rc=0
            xvfb-run -a node --input-type=module <<'NODE' || warmup_rc=$?
            import fs from 'node:fs/promises';
            import path from 'node:path';
            import { createRequire } from 'node:module';
            import { pathToFileURL } from 'node:url';
            import {
              deriveSessionStateKeyB64,
              loadEncryptedSessionState,
              saveEncryptedSessionState,
              validateStorageState,
            } from './scripts/browser-session-state-v1.mjs';

            const env = process.env;
            const encryptedSessionPath = '/tmp/curveyield-browser-agent/session-state-v1.enc.json';
            const keyB64 = deriveSessionStateKeyB64({
              keyB64: env.CHATGPT_SESSION_STATE_KEY_B64,
              bootstrapStateB64: env.CHATGPT_STORAGE_STATE_B64,
            });

            let storage = await loadEncryptedSessionState({
              encryptedSessionPath,
              keyB64,
            });

            if (!storage && env.CHATGPT_STORAGE_STATE_B64) {
              const bootstrap = JSON.parse(
                Buffer.from(env.CHATGPT_STORAGE_STATE_B64, 'base64').toString('utf8'),
              );
              if (!validateStorageState(bootstrap)) {
                throw new Error('CHATGPT_STORAGE_STATE_B64 is invalid');
              }
              storage = bootstrap;
            }

            if (!storage) throw new Error('No ChatGPT session state available for warm-up');

            const runtimeRequire = createRequire(
              path.join(env.BROWSER_AGENT_RUNTIME_ROOT, 'package.json'),
            );
            const playwrightMod = await import(
              pathToFileURL(runtimeRequire.resolve('playwright-core')).href,
            );
            const chromium =
              playwrightMod.chromium ||
              playwrightMod.default?.chromium;
            if (!chromium) throw new Error('playwright-core chromium unavailable');

            const browser = await chromium.launch({
              headless: env.BROWSER_HEADLESS !== 'false',
              channel: 'chrome',
            });
            const context = await browser.newContext({ storageState: storage });
            const page = await context.newPage();

            try {
              await page.goto('https://chatgpt.com/', {
                waitUntil: 'domcontentloaded',
                timeout: 60000,
              });

              const deadline = Date.now() + 30000;
              let healthy = false;
              while (Date.now() < deadline) {
                const body = await page.locator('body').innerText().catch(() => '');
                const title = await page.title().catch(() => '');
                const challenged =
                  /Verify you are human|Checking your browser|Just a moment|Cloudflare|security challenge/i.test(body) ||
                  /Just a moment|Cloudflare/i.test(title);
                const login =
                  /\\bLog in\\b|\\bSign up\\b|Continue with Google|Welcome back/i.test(body);

                if (!challenged && !login) {
                  healthy = true;
                  break;
                }
                await page.waitForTimeout(1000);
              }

              if (!healthy) {
                throw new Error('ChatGPT homepage did not clear authentication/browser challenge');
              }

              const refreshed = await context.storageState({
                indexedDB: true,
                opfs: true,
              });
              const persisted = await saveEncryptedSessionState({
                encryptedSessionPath,
                keyB64,
                storage: refreshed,
              });
              if (!persisted) {
                throw new Error('Refreshed ChatGPT session state was not persisted');
              }

              await fs.writeFile(
                '/tmp/session-warmup.json',
                JSON.stringify({ ok: true, url: page.url() }, null, 2) + '\\n',
              );
            } finally {
              await browser.close().catch(() => {});
            }
            NODE

            if [ "$warmup_rc" -ne 0 ] || [ "$(jq -r '.ok // false' /tmp/session-warmup.json 2>/dev/null || echo false)" != true ]; then
              echo "::warning::Authenticated ChatGPT session refresh failed."
              exit 0
            fi

            export WAKE_MODE='resume_existing'
            export CHAT_URL="$chat_url"
            export WAKE_ACTION='observe'
            export WAKE_RESULT_PATH='/tmp/observe.json'

            retry_rc=0
            xvfb-run -a node scripts/browser-agent-wake.mjs || retry_rc=$?
            if [ "$retry_rc" -ne 0 ]; then
              echo "::warning::Existing-chat observation still failed after authenticated-session refresh."
              exit 0
            fi
          elif [ "$observe_rc" -ne 0 ]; then
            echo "::warning::Observation failed; next scheduled sweep will retry."
            exit 0
          fi

          generating="$(jq -r '.generating // false' /tmp/observe.json)"
          current_count="$(jq -r '.assistantCount // 0' /tmp/observe.json)"
          current_hash="$(jq -r '.lastAssistantHash // empty' /tmp/observe.json)"
          previous_count="$(jq -r '.observation.assistantCount // 0' /tmp/state.json)"
          previous_hash="$(jq -r '.observation.lastAssistantHash // empty' /tmp/state.json)"
          chat_viewable="$(jq -r '.chatViewable // false' /tmp/observe.json)"
          human_challenge="$(jq -r '.humanChallenge // false' /tmp/observe.json)"
          login_prompt="$(jq -r '.loginPrompt // false' /tmp/observe.json)"
          conversation_unavailable="$(jq -r '.conversationUnavailable // false' /tmp/observe.json)"

          if [ "$human_challenge" = true ] || [ "$login_prompt" = true ] || [ "$conversation_unavailable" = true ] || [ "$chat_viewable" != true ]; then
            echo "::warning::Existing chat is not safely viewable; next scheduled sweep will retry."
            exit 0
          fi

          productive=false
          if [ "$generating" = true ]; then
            productive=true
          elif [ "$current_count" -gt "$previous_count" ]; then
            productive=true
          elif [ -n "$current_hash" ] && [ "$current_hash" != "$previous_hash" ]; then
            productive=true
          fi

          if [ "$productive" = true ]; then
            jq --argjson count "$current_count" --arg hash "$current_hash" \
              '.observation.assistantCount=$count | .observation.lastAssistantHash=$hash' \
              /tmp/state.json > /tmp/state-next.json
            touch /tmp/chat-watchdog-session-healthy
            echo "Watchdog $WATCHDOG_ID: agent is active; no message sent."
          else
            export WAKE_ACTION='wake'
            export WAKE_MESSAGE='GET BACK TO WORK'
            export WAKE_RESULT_PATH='/tmp/wake.json'

            if xvfb-run -a node scripts/browser-agent-wake.mjs; then
              posted="$(jq -r '.posted // false' /tmp/wake.json)"
              after_challenge="$(jq -r '.after.humanChallenge // false' /tmp/wake.json)"
              after_login="$(jq -r '.after.loginPrompt // false' /tmp/wake.json)"
              after_viewable="$(jq -r '.after.chatViewable // false' /tmp/wake.json)"
              next_count="$(jq -r '.after.assistantCount // .assistantCount // 0' /tmp/wake.json)"
              next_hash="$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' /tmp/wake.json)"

              if [ "$posted" = true ] && [ "$after_challenge" != true ] && [ "$after_login" != true ] && [ "$after_viewable" = true ]; then
                jq --argjson count "$next_count" --arg hash "$next_hash" \
                  '.observation.assistantCount=$count | .observation.lastAssistantHash=$hash | .pokeCount=((.pokeCount // 0)+1)' \
                  /tmp/state.json > /tmp/state-next.json
                touch /tmp/chat-watchdog-session-healthy
                echo "Watchdog $WATCHDOG_ID: GET BACK TO WORK posted successfully in the existing chat."
              else
                echo "::warning::Wake was not healthy/verified; next scheduled sweep will retry."
                cp /tmp/state.json /tmp/state-next.json
              fi
            else
              echo "::warning::Wake failed; next scheduled sweep will retry."
              cp /tmp/state.json /tmp/state-next.json
            fi
          fi

          sha="$(gh api "$api?ref=main" --jq '.sha')"
          content="$(base64 -w0 /tmp/state-next.json)"
          gh api --method PUT "$api" \
            -f message="chore(chat-watchdog): sweep $WATCHDOG_ID" \
            -f content="$content" -f sha="$sha" -f branch=main >/dev/null


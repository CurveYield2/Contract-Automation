name: Katana cyavKAT v21 Existing Contract Check v1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/katana-cyavkat-v21-existing-contract-check-v1.yml'
      - 'scripts/katana/cyavkat-v21-existing-contract-check-v1.py'
permissions:
  contents: read
  actions: read
jobs:
  probe-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Retrieve exact previously compiled v21 artifacts
        uses: actions/download-artifact@v4
        with:
          name: cyavkat-v21-katana-simulation-v1
          run-id: 38142327965
          repository: CurveYield2/Contract-Automation
          github-token: ${{ github.token }}
          path: prior-artifact
      - name: Confirm matched build and inspect live Katana bytecode
        shell: bash
        run: |
          set -euo pipefail
          test -s prior-artifact/katana-cyavkat-v21-evidence/deployment_gas_v1.json
          test -s prior-artifact/cyavKAT/upgrade/out/BurnRequestFeeFuse.sol/BurnRequestFeeFuse.json
          python3 scripts/katana/cyavkat-v21-existing-contract-check-v1.py
      - name: Preserve verified read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-v21-existing-contract-check-v1
          path: cyavkat-v21-existing-check-v1/
          if-no-files-found: warn
          retention-days: 30

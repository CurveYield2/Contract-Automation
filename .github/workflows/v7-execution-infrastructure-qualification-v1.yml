name: V7 Execution Infrastructure Qualification v1

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Contract-Automation commit/ref to qualify for campaign admission
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-execution-infrastructure-qualification-v1.yml'
      - 'packages/github-native-sim/src/**'
      - 'packages/github-native-sim/test/**'
      - 'packages/runner/src/**'
      - 'packages/runner/test/**'
      - 'packages/protocol/src/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  qualify-v7-execution-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate infrastructure release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned repository dependencies
        run: npm install --no-package-lock

      - name: Initialize qualification evidence
        run: mkdir -p .audit-evidence/v7-infrastructure-qualification-v1

      - name: V2 request and evidence contract qualification
        run: node --test packages/github-native-sim/test/*.test.mjs

      - name: Anvil full-simulation qualification
        run: node --test packages/runner/test/anvil-*.test.mjs packages/runner/test/full-simulation-anvil-only-v1.test.mjs

      - name: Repository static checks
        run: node scripts/check.mjs

      - name: Repository build checks
        run: node scripts/build.mjs

      - name: Live Ethereum archive and Anvil preflight qualification
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { runPhase7ForkPreflightV1 } from './packages/github-native-sim/src/phase7-fork-preflight-v1.mjs';

          const expectedBlockHash = '0xb7f45fdc91b604d7c0450a505cf5c9571c9bb6267c86b6a8d535f4bc11b3f4ee';
          const request = {
            requestId: 'dar-00000000000000000000000000000000',
            phaseId: 'fork-simulation-lifecycle',
            profileId: 'github-native-simulate-v2',
            source: { commit: '0000000000000000000000000000000000000000' },
            configuration: {
              evmVersion: 'cancun',
              simulation: {
                chain: 'ethereum',
                block: 25817400,
                workflow: {
                  steps: [
                    {
                      action: 'staticCall',
                      target: '0x73968b9a57c6E53d41345FD57a6E6ae27d6CDB2F',
                      function: 'decimals() view returns (uint8)',
                      args: [],
                      label: 'repository qualification external-code target'
                    }
                  ]
                }
              }
            }
          };
          const preflight = await runPhase7ForkPreflightV1({ request, environment: process.env });
          const qualifiedCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const observedHash = preflight.observedPinnedBlockHash?.toLowerCase() ?? null;
          const campaignIndependentChecks = {
            preflightPass: preflight.status === 'PASS',
            ethereumArchiveOnly: preflight.chain === 'ethereum',
            anvilOnly: preflight.checks?.anvilLauncher?.engine === 'anvil',
            cancunAccepted: preflight.checks?.exactHardfork?.status === 'PASS' && preflight.checks?.exactHardfork?.requested === 'cancun',
            archiveIdentityReconciled: preflight.checks?.chainIdentity?.status === 'PASS',
            historicalStateAvailable: preflight.checks?.pinnedBlockState?.status === 'PASS',
            targetCodePresent: preflight.checks?.targetCode?.status === 'PASS',
            impersonationBalanceControl: preflight.checks?.impersonationBalanceControl?.status === 'PASS',
            fixtureBlockHashMatches: observedHash === expectedBlockHash,
            workflowAllowlist: preflight.checks?.workflowActions?.status === 'PASS'
          };
          const qualification = {
            schemaVersion: 'v7-execution-infrastructure-qualification-v1',
            status: Object.values(campaignIndependentChecks).every(Boolean) ? 'PASS' : 'FAIL',
            qualifiedCommit,
            requestSchema: 'deep-assurance-github-request-v2',
            profiles: ['github-native-compile-v2', 'github-native-simulate-v2'],
            fullSimulationBackend: 'anvil',
            archivePolicy: { supportedChains: ['ethereum'], rpcProfile: 'SIM_ARCHIVE_PRIMARY_ETHEREUM_01' },
            fixture: { chain: 'ethereum', block: 25817400, expectedBlockHash },
            checks: campaignIndependentChecks,
            preflight
          };
          fs.writeFileSync(
            '.audit-evidence/v7-infrastructure-qualification-v1/qualification-v1.json',
            `${JSON.stringify(qualification, null, 2)}\n`
          );
          console.log(`qualification_status=${qualification.status}`);
          console.log(`qualified_commit=${qualifiedCommit}`);
          console.log(`archive_reconciliation_mode=${preflight.checks?.chainIdentity?.reconciliationMode ?? 'unavailable'}`);
          console.log(`observed_block_hash=${preflight.observedPinnedBlockHash ?? 'unavailable'}`);
          if (qualification.status !== 'PASS') process.exit(1);
          NODE

      - name: Record immutable qualification identity
        if: success()
        run: |
          echo "qualification_schema=v7-execution-infrastructure-qualification-v1" >> "$GITHUB_STEP_SUMMARY"
          echo "qualified_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "request_schema=deep-assurance-github-request-v2" >> "$GITHUB_STEP_SUMMARY"
          echo "profiles=github-native-compile-v2,github-native-simulate-v2" >> "$GITHUB_STEP_SUMMARY"
          echo "full_simulation_backend=anvil" >> "$GITHUB_STEP_SUMMARY"
          echo "archive_chains=ethereum" >> "$GITHUB_STEP_SUMMARY"
          echo "archive_rpc_profile=SIM_ARCHIVE_PRIMARY_ETHEREUM_01" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-execution-infrastructure-qualification-v1
          path: .audit-evidence/v7-infrastructure-qualification-v1
          if-no-files-found: warn
          retention-days: 90

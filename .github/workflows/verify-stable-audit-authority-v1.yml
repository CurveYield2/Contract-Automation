name: Verify Stable Audit Authority Folder v1
on:
  push:
    branches: [main]
    paths:
      - ".github/verify-stable-audit-authority-trigger-v1"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Clone current Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-controller-verify
          gh repo clone CurveYield2/Audit-Controller .audit-controller-verify -- --branch main --depth 1

      - name: Verify Contract-Automation stable references
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I 'CurveYield2/Contract-Automation/Audit Skill - Current Authority' -- .github scripts packages ':!*.zip' ':!.github/workflows/verify-stable-audit-authority-v1.yml'; then
            echo "::error::Old Contract-Automation authority location remains in active code."
            exit 1
          fi
          if git grep -n -I 'Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway' -- .github scripts packages ':!*.zip' ':!.github/workflows/verify-stable-audit-authority-v1.yml'; then
            echo "::error::Version-specific legacy authority path remains in active code."
            exit 1
          fi
          git grep -n -I 'CurveYield2/Audit-Controller/Audit Skill - Current Authority' -- .github scripts packages ':!*.zip'

      - name: Verify Audit-Controller stable references and package
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller-verify
          if git grep -n -I 'CurveYield2/Contract-Automation/Audit Skill - Current Authority' --              'Audit Skill - Current Authority/Audit_Litemode_v10'              '.deep-assurance/active'              'audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json'              'packages/controller-core/src'; then
            echo "::error::Old Contract-Automation authority location remains in live Audit-Controller surfaces."
            exit 1
          fi
          mapfile -t packages < <(find 'Audit Skill - Current Authority' -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/SKILL.md' ';' -print | sort)
          [ "${#packages[@]}" -eq 1 ]
          [ "${packages[0]}" = 'Audit Skill - Current Authority/Audit_Litemode_v10' ]
          mapfile -t zips < <(find 'Audit Skill - Current Authority' -mindepth 1 -maxdepth 1 -type f -name '*.zip' -print | sort)
          [ "${#zips[@]}" -eq 1 ]
          [ "${zips[0]}" = 'Audit Skill - Current Authority/Audit_Litemode_v10.zip' ]
          unzip -tq "${zips[0]}" >/dev/null
          test -f 'Audit Skill - Current Authority/Audit_Litemode_v10/SKILL.md'
          test "$(jq -r '.packagePath' audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json)" = 'Audit Skill - Current Authority'
          test "$(jq -r '.homepagePath' audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json)" = 'SKILL.md'
          git grep -n -I 'CurveYield2/Audit-Controller/Audit Skill - Current Authority' --              'Audit Skill - Current Authority/Audit_Litemode_v10'              '.deep-assurance/active'              'audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json'              'packages/controller-core/src'

      - name: Run Contract-Automation regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/audit-source-initialization/run-v1.sh
          python3 -m py_compile scripts/audit-source-initialization/write-state-v1.py
          node --test packages/github-native-sim/test/browser-agent-interphase-gate-v1.test.mjs
          AUDIT_CONTROLLER_ROOT="$PWD/.audit-controller-verify" node --test packages/github-native-sim/test/lite-phase0-skill-outputs-v1.test.mjs

      - name: Run Audit-Controller regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller-verify
          node --test packages/controller-core/test/audit-workload-reduction-extended-v1.test.mjs
          node --test packages/controller-core/test/successor-wake-up-message-v1.test.mjs
          node --test packages/controller-core/test/audit-workload-reduction-v1.test.mjs
          node --test packages/controller-core/test/lite-current-work-packet-v1.test.mjs

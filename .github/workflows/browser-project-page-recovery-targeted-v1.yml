name: Browser Project Page Recovery Targeted v1

on:
  push:
    branches:
      - browser-project-page-recovery-v2
    paths:
      - '.github/workflows/browser-project-page-recovery-targeted-v1.yml'
      - '.github/workflows/browser-agent-home-exit-v10.yml'
      - 'packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs'
      - 'packages/github-native-sim/test/browser-agent-v10-visible-only-verification-v2.test.mjs'
      - 'process/browser-agent-home-exit-v10/current-request-v10.json'

permissions:
  contents: read

jobs:
  targeted-browser-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser worker
        run: node --check packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs
      - name: Run browser visible-only regression
        run: node --test packages/github-native-sim/test/browser-agent-v10-visible-only-verification-v2.test.mjs

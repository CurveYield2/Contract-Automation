name: Migrate Audit Authority To Stable Folder Pointer v1

on:
  push:
    branches: [main]
    paths:
      - ".github/migrate-audit-authority-folder-trigger-v1"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Patch Audit-Controller authority package and live references
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf /tmp/audit-controller
          gh repo clone CurveYield2/Audit-Controller /tmp/audit-controller -- --branch main
          cd /tmp/audit-controller
          git config user.name 'CurveYield Authority Migration'
          git config user.email 'authority-migration@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil, zipfile

          root = Path('/tmp/audit-controller')
          auth = root / 'Audit Skill - Current Authority'
          old = auth / 'Audit_Litemode_v9'
          old_zip = auth / 'Audit_Litemode_v9.zip'
          new = auth / 'Audit_Litemode_v10'
          new_zip = auth / 'Audit_Litemode_v10.zip'

          stable_repo = 'CurveYield2/Audit-Controller/Audit Skill - Current Authority'
          stable_url = 'https://github.com/CurveYield2/Audit-Controller/tree/main/Audit%20Skill%20-%20Current%20Authority'
          old_repo_exact = 'CurveYield2/Contract-Automation/Audit Skill - Current Authority/Audit_Litemode_v9/SKILL.md'
          old_url_exact = 'https://github.com/CurveYield2/Contract-Automation/blob/main/Audit%20Skill%20-%20Current%20Authority/Audit_Litemode_v9/SKILL.md'
          old_repo_folder = 'CurveYield2/Contract-Automation/Audit Skill - Current Authority'

          if not old.is_dir() or not old_zip.is_file():
              raise SystemExit('Expected v9 authority package is missing')
          if new.exists() or new_zip.exists():
              raise SystemExit('Refusing to overwrite pre-existing v10 authority package')

          shutil.copytree(old, new)

          text_ext = {'.md','.json','.yaml','.yml','.txt','.py','.js','.mjs','.cjs','.sh','.toml','.ini','.cfg'}
          for p in sorted(new.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace(old_url_exact, stable_url)
              s = s.replace(old_repo_exact, stable_repo)
              s = s.replace(old_repo_folder, stable_repo)
              s = s.replace('Audit_Litemode_v9', 'Audit_Litemode_v10')
              p.write_text(s, encoding='utf-8')

          skill = new / 'SKILL.md'
          s = skill.read_text(encoding='utf-8')
          s = s.replace('name: audit-litemode-v9', 'name: audit-litemode-v10')
          s = s.replace('Package revision: `v9`', 'Package revision: `v10`')
          s = s.replace(
              f'current authority Lite skill location: `{stable_repo}`;',
              f'current authority Lite authority folder: `{stable_repo}`; resolve the single unpacked package directory in that folder and read its root `SKILL.md`;'
          )
          skill.write_text(s, encoding='utf-8')

          prov = new / 'PACKAGE_PROVENANCE.md'
          s = prov.read_text(encoding='utf-8')
          marker = '**v9 migration repair:**'
          note = f'**v10 stable-authority repair:** durable authority references now point only to `{stable_repo}` ({stable_url}). Consumers must resolve the single unpacked package directory in that folder and then read its root `SKILL.md`. Version/revision/digest remain runtime evidence, not hard-coded routing.'
          if note not in s:
              pos = s.find('\n', s.find(marker))
              if pos != -1:
                  s = s[:pos+1] + '\n' + note + '\n' + s[pos+1:]
          prov.write_text(s, encoding='utf-8')

          replacements = {
              new / 'shared/handoff/START_HERE_SUCCESSOR_TEMPLATE.md': [
                  ('- Lite authority repository path:', '- Lite authority folder repository path:'),
                  ('- Human-readable URL:', '- Authority folder URL:'),
                  ('Read the current authority Lite `SKILL.md` first,', 'Open the authority folder above, resolve its single unpacked package directory containing root `SKILL.md`, read that `SKILL.md` first,'),
              ],
              new / 'shared/handoff/WAKE_UP_MESSAGE_TEMPLATE.md': [
                  ('The authoritative Lite audit skill is:', 'The authoritative Lite audit folder is:'),
                  ('- Repository path:', '- Authority folder repository path:'),
                  ('- Human-readable URL:', '- Authority folder URL:'),
                  ('The path above is the current authority location;', 'The folder above is the stable current-authority location; resolve its single unpacked package directory containing root `SKILL.md`;'),
                  ('Read the current authority Lite `SKILL.md` at the location above.', 'Open the authority folder above, resolve its single unpacked package directory, and read that package root `SKILL.md`.'),
              ],
              new / 'shared/handoff/SUCCESSOR_HANDOFF_PROTOCOL.md': [
                  ('current authority Lite `SKILL.md` repository path and URL', 'current authority folder repository path and URL'),
              ],
              new / 'shared/handoff/SUCCESSOR_HANDOFF_RECEPTION_CHECKLIST.md': [
                  ('current authority Lite `SKILL.md` location', 'current authority folder location'),
              ],
          }
          for p, reps in replacements.items():
              s = p.read_text(encoding='utf-8')
              for a,b in reps:
                  s = s.replace(a,b)
              p.write_text(s, encoding='utf-8')

          manifest_path = new / 'MANIFEST.json'
          old_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = []
          for p in sorted(new.rglob('*')):
              if not p.is_file() or p == manifest_path:
                  continue
              b = p.read_bytes()
              files.append({
                  'path': p.relative_to(new).as_posix(),
                  'bytes': len(b),
                  'sha256': hashlib.sha256(b).hexdigest(),
              })
          old_manifest['schemaVersion'] = 'audit-litemode-v10-manifest-v1'
          old_manifest['release'] = 'Audit_Litemode_v10'
          old_manifest['packageRevision'] = 'v10'
          old_manifest.setdefault('derivation', {})['stableAuthorityFolder'] = stable_repo
          old_manifest['derivation']['authorityResolution'] = 'EXACTLY_ONE_UNPACKED_PACKAGE_DIRECTORY_WITH_ROOT_SKILL_MD'
          old_manifest['files'] = files
          manifest_path.write_text(json.dumps(old_manifest, indent=2) + '\n', encoding='utf-8')

          if new_zip.exists():
              new_zip.unlink()
          with zipfile.ZipFile(new_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(new.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=(Path(new.name) / p.relative_to(new)).as_posix())

          with zipfile.ZipFile(new_zip) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP integrity failure: {bad}')
              members = [n for n in z.namelist() if not n.endswith('/')]
              if len(members) != len([p for p in new.rglob('*') if p.is_file()]):
                  raise SystemExit('ZIP member count mismatch')

          shutil.rmtree(old)
          old_zip.unlink()

          active = root / '.deep-assurance/active/curveyield-dex-fresh-lite-audit.json'
          if active.exists():
              obj = json.loads(active.read_text())
              obj['skillAuthorityReference'] = stable_repo
              active.write_text(json.dumps(obj, indent=2) + '\n')

          pointer = root / 'audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json'
          value = json.loads(pointer.read_text())
          value = {
              'schemaVersion': value.get('schemaVersion','audit-v7-lite-primary-skill-authority-v1'),
              'status': 'ACTIVE',
              'authorityScope': 'DEFAULT_FOR_NEW_OR_UNBOUND_LITE_CAMPAIGNS',
              'precedence': ['CAMPAIGN_BOUND_SKILL_AUTHORITY','LITE_PRIMARY_SKILL_AUTHORITY'],
              'repository': 'CurveYield2/Audit-Controller',
              'ref': 'main',
              'packagePath': 'Audit Skill - Current Authority',
              'authorityFolderRepositoryPath': stable_repo,
              'authorityFolderUrl': stable_url,
              'resolutionPolicy': 'EXACTLY_ONE_UNPACKED_PACKAGE_DIRECTORY_WITH_ROOT_SKILL_MD',
              'homepagePath': 'SKILL.md',
              'note': 'Stable authority pointer. Resolve the single unpacked package directory inside Audit Skill - Current Authority at runtime; record its version/revision/digest as evidence without changing this pointer.'
          }
          pointer.write_text(json.dumps(value, indent=2) + '\n')

          builder = root / 'packages/controller-core/src/successor-handoff-builder-v1.mjs'
          s = builder.read_text()
          s = re.sub(r"liteSkillRepositoryPath:\s*'[^']*Audit Skill - Current Authority[^']*'", f"liteSkillRepositoryPath: '{stable_repo}'", s)
          s = re.sub(r"liteSkillUrl:\s*'https://github\.com/CurveYield2/Contract-Automation/[^']*'", f"liteSkillUrl: '{stable_url}'", s)
          builder.write_text(s)

          cli = root / 'packages/controller-core/src/audit-operator-cli-v1.mjs'
          s = cli.read_text()
          s = s.replace(
              "function skillRelative(mode, phaseId, filename) { return mode === 'LITE' ? `optional-modes/lite-pathway/phases/${phaseId}/${filename}` : `phases/${phaseId}/${filename}`; }\n"
              "function skillHomepage(mode) { return mode === 'LITE' ? 'optional-modes/lite-pathway/SKILL.md' : 'SKILL.md'; }",
              "function skillRelative(mode, phaseId, filename, skillRoot) {\n"
              "  if (mode !== 'LITE') return `phases/${phaseId}/${filename}`;\n"
              "  const standalone = `phases/${phaseId}/${filename}`;\n"
              "  if (skillRoot && fs.existsSync(path.join(skillRoot, standalone))) return standalone;\n"
              "  return `optional-modes/lite-pathway/phases/${phaseId}/${filename}`;\n"
              "}\n"
              "function skillHomepage(mode, skillRoot) {\n"
              "  if (mode !== 'LITE') return 'SKILL.md';\n"
              "  if (skillRoot && fs.existsSync(path.join(skillRoot, 'phases'))) return 'SKILL.md';\n"
              "  return 'optional-modes/lite-pathway/SKILL.md';\n"
              "}"
          )
          pattern = re.compile(r"function primaryLiteSkillAuthorityOf\(controllerRoot\) \{.*?\n\}\nfunction normalizeObligations", re.S)
          repl = """function primaryLiteSkillAuthorityOf(controllerRoot) {
            const pointerFile = safeJoin(controllerRoot, PRIMARY_LITE_SKILL_AUTHORITY_PATH);
            if (!fs.existsSync(pointerFile)) return null;
            const value = readJson(pointerFile);
            if (value?.schemaVersion !== 'audit-v7-lite-primary-skill-authority-v1' || value.status !== 'ACTIVE') fail('Lite primary skill authority pointer is invalid or inactive');
            if (typeof value.packagePath !== 'string' || !value.packagePath) fail('Lite primary skill authority folder path is missing');
            const authorityFolder = safeJoin(controllerRoot, value.packagePath);
            if (!fs.existsSync(authorityFolder) || !fs.statSync(authorityFolder).isDirectory()) fail('Lite primary skill authority folder is missing');
            const candidates = fs.readdirSync(authorityFolder, { withFileTypes:true })
              .filter((entry) => entry.isDirectory() && fs.existsSync(path.join(authorityFolder, entry.name, 'SKILL.md')))
              .map((entry) => entry.name)
              .sort();
            if (candidates.length !== 1) fail('Lite primary skill authority folder must contain exactly one unpacked package directory with root SKILL.md');
            return { ...value, resolvedAuthorityPackageDirectory: path.posix.join(value.packagePath, candidates[0]), homepagePath: value.homepagePath ?? 'SKILL.md' };
          }
          function normalizeObligations"""
          s, n = pattern.subn(repl, s)
          if n != 1:
              raise SystemExit(f'Could not replace primaryLiteSkillAuthorityOf: {n}')
          s = s.replace("const canonicalPhaseContractRel = skillRelative(mode, phaseId, 'PHASE_CONTRACT.json');",
                        "const canonicalPhaseContractRel = skillRelative(mode, phaseId, 'PHASE_CONTRACT.json', skillRoot);")
          s = s.replace("const canonicalPhaseStartRel = skillRelative(mode, phaseId, 'START_HERE.md');",
                        "const canonicalPhaseStartRel = skillRelative(mode, phaseId, 'START_HERE.md', skillRoot);")
          s = s.replace("homepagePath:admittedSkill?.homepagePath ?? skillHomepage(mode),",
                        "homepagePath:admittedSkill?.homepagePath ?? skillHomepage(mode, skillRoot),")
          old_block = """let skillPackageDigest = null;
          {
            const skillPackageFile = requiredRelativeFile(controllerRoot, resolvedSkillPackagePath, 'skillPackagePath');
            skillPackageDigest = sha256File(skillPackageFile);
            if (admittedSkill?.sha256 && skillPackageDigest !== admittedSkill.sha256) fail('skill package digest does not match admitted skill authority');
            if (request.expectedSkillSha256 && skillPackageDigest !== request.expectedSkillSha256) fail('skill package digest does not match expectedSkillSha256');
          }"""
          new_block = """let skillPackageDigest = null;
          {
            const skillAuthorityTarget = safeJoin(controllerRoot, resolvedSkillPackagePath);
            if (!fs.existsSync(skillAuthorityTarget)) fail('skillPackagePath does not resolve');
            const stat = fs.statSync(skillAuthorityTarget);
            if (stat.isFile()) {
              skillPackageDigest = sha256File(skillAuthorityTarget);
              if (admittedSkill?.sha256 && skillPackageDigest !== admittedSkill.sha256) fail('skill package digest does not match admitted skill authority');
              if (request.expectedSkillSha256 && skillPackageDigest !== request.expectedSkillSha256) fail('skill package digest does not match expectedSkillSha256');
            } else if (stat.isDirectory()) {
              if (request.expectedSkillSha256) fail('expectedSkillSha256 is not valid for stable authority-folder routing');
            } else {
              fail('skillPackagePath must resolve to an admitted package file or stable authority folder');
            }
          }"""
          if old_block not in s:
              raise SystemExit('Could not find skill digest block')
          s = s.replace(old_block, new_block)
          s = s.replace("...(mode === 'LITE' ? { sha256: skillPackageDigest } : {}),",
                        "...(mode === 'LITE' && skillPackageDigest ? { sha256: skillPackageDigest } : {}),")
          cli.write_text(s)

          # Current test fixtures that assert the successor authority should follow the stable folder.
          for p in [
              root/'packages/controller-core/test/audit-workload-reduction-extended-v1.test.mjs',
              root/'packages/controller-core/test/successor-wake-up-message-v1.test.mjs',
          ]:
              if p.exists():
                  s = p.read_text()
                  s = s.replace('CurveYield2/Contract-Automation/Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway/SKILL.md', stable_repo)
                  s = s.replace('https://github.com/CurveYield2/Contract-Automation/blob/main/Audit%20Skill%20-%20Current%20Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway/SKILL.md', stable_url)
                  p.write_text(s)
          PY

          python3 -m json.tool 'Audit Skill - Current Authority/Audit_Litemode_v10/MANIFEST.json' >/dev/null
          python3 -m json.tool 'Audit Skill - Current Authority/Audit_Litemode_v10/shared/handoff/SUCCESSOR_HANDOFF_SCHEMA.json' >/dev/null
          test -f 'Audit Skill - Current Authority/Audit_Litemode_v10/SKILL.md'
          test -f 'Audit Skill - Current Authority/Audit_Litemode_v10.zip'
          test ! -e 'Audit Skill - Current Authority/Audit_Litemode_v9'
          test ! -e 'Audit Skill - Current Authority/Audit_Litemode_v9.zip'

          if git grep -n -I 'CurveYield2/Contract-Automation/Audit Skill - Current Authority' --              'Audit Skill - Current Authority/Audit_Litemode_v10'              '.deep-assurance/active'              'audit-process/v7/LITE_PRIMARY_SKILL_AUTHORITY_v1.json'              'packages/controller-core/src' ; then
            echo "::error::Stale Contract-Automation authority reference remains in live Audit-Controller surfaces."
            exit 1
          fi

          node --test packages/controller-core/test/audit-workload-reduction-extended-v1.test.mjs
          node --test packages/controller-core/test/successor-wake-up-message-v1.test.mjs

          git add -A
          git commit -m "Use stable Audit Skill authority folder pointer"
          git push origin HEAD:main

      - name: Patch Contract-Automation consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          stable_repo = 'CurveYield2/Audit-Controller/Audit Skill - Current Authority'
          stable_url = 'https://github.com/CurveYield2/Audit-Controller/tree/main/Audit%20Skill%20-%20Current%20Authority'
          old_repo = 'CurveYield2/Contract-Automation/Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway/SKILL.md'
          old_url = 'https://github.com/CurveYield2/Contract-Automation/blob/main/Audit%20Skill%20-%20Current%20Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway/SKILL.md'

          p = root/'.github/workflows/browser-agent-watchdog.yml'
          s = p.read_text().replace(old_repo, stable_repo)
          p.write_text(s)

          p = root/'.github/workflows/browser-agent-reviewer-repair-v1.yml'
          s = p.read_text()
          old = '''          authority_api="repos/$GITHUB_REPOSITORY/contents/Audit%20Skill%20-%20Current%20Authority?ref=main"
                    skill_path="$(GH_TOKEN="$CONTRACT_AUTOMATION_TOKEN" gh api "$authority_api" --jq '[.[] | select(.type=="dir" and (.name|startswith("Audit_V7_independent_Review_skill_")))] | if length==1 then .[0].path else empty end' 2>/dev/null || true)"
                    test -n "$skill_path"
                    skill_url="https://github.com/$GITHUB_REPOSITORY/tree/main/$(printf '%s' "$skill_path" | sed 's/ /%20/g')"
                    skill_authority_source="CONTRACT_AUTOMATION_CURRENT_AUTHORITY_FOLDER"'''
          new = '''          authority_repo="CurveYield2/Audit-Controller"
                    authority_path="Audit Skill - Current Authority"
                    GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$authority_repo/contents/Audit%20Skill%20-%20Current%20Authority?ref=main" >/dev/null
                    skill_path="CurveYield2/Audit-Controller/Audit Skill - Current Authority"
                    skill_url="https://github.com/CurveYield2/Audit-Controller/tree/main/Audit%20Skill%20-%20Current%20Authority"
                    skill_authority_source="AUDIT_CONTROLLER_CURRENT_AUTHORITY_FOLDER"'''
          if old not in s:
              raise SystemExit('reviewer repair authority block not found')
          p.write_text(s.replace(old,new))

          p = root/'.github/workflows/lite-phase0-intelligence-v1.yml'
          s = p.read_text()
          anchor = '''          git fetch origin "$destination_ref"
                    git checkout -B "$destination_ref" "origin/$destination_ref"
          '''
          insert = '''          git fetch origin "$destination_ref"
                    git checkout -B "$destination_ref" "origin/$destination_ref"

                    authority_folder="Audit Skill - Current Authority"
                    mapfile -t authority_packages < <(find "$authority_folder" -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/SKILL.md' ';' -print | sort)
                    [ "${#authority_packages[@]}" -eq 1 ] || { echo "::error::Authority folder must contain exactly one unpacked package directory with root SKILL.md."; exit 1; }
                    skill_root="${authority_packages[0]}"
          '''
          if anchor not in s:
              raise SystemExit('phase0 checkout anchor not found')
          s = s.replace(anchor, insert)
          s = s.replace('"../Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway"', '"$skill_root"')
          p.write_text(s)

          p = root/'scripts/audit-source-initialization/run-v1.sh'
          s = p.read_text()
          old = '''  skill_path='Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway/SKILL.md'
            skill_repo_path="CurveYield2/Contract-Automation/$skill_path"
            skill_release="$(sed -n 's/^Release identity: `\(.*\)`$/\1/p' "$ROOT/$skill_path" | head -n1)"
            skill_revision="$(sed -n 's/^Package revision: `\(.*\)`$/\1/p' "$ROOT/$skill_path" | head -n1)"
            skill_sha="$(sha256sum "$ROOT/$skill_path" | awk '{print $1}')"
            skill_blob="$(git -C "$ROOT" rev-parse "HEAD:$skill_path")"
            test -n "$skill_release"
            test -n "$skill_revision"

            repo='/tmp/audit-controller-source-init'
            rm -rf "$repo"
            gh repo clone CurveYield2/Audit-Controller "$repo" -- --branch main
            cd "$repo"
            git config user.name 'CurveYield Audit Source Initialization'
            git config user.email 'audit-source-initialization@users.noreply.github.com' '''
          new = '''  repo='/tmp/audit-controller-source-init'
            rm -rf "$repo"
            gh repo clone CurveYield2/Audit-Controller "$repo" -- --branch main
            cd "$repo"
            git config user.name 'CurveYield Audit Source Initialization'
            git config user.email 'audit-source-initialization@users.noreply.github.com'

            authority_folder='Audit Skill - Current Authority'
            mapfile -t authority_packages < <(find "$authority_folder" -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/SKILL.md' ';' -print | sort)
            [ "${#authority_packages[@]}" -eq 1 ] || { echo "::error::Authority folder must contain exactly one unpacked package directory with root SKILL.md."; exit 1; }
            skill_home="${authority_packages[0]}/SKILL.md"
            skill_repo_path='CurveYield2/Audit-Controller/Audit Skill - Current Authority'
            skill_release="$(sed -n 's/^Release identity: `\(.*\)`$/\1/p' "$skill_home" | head -n1)"
            skill_revision="$(sed -n 's/^Package revision: `\(.*\)`$/\1/p' "$skill_home" | head -n1)"
            skill_sha="$(sha256sum "$skill_home" | awk '{print $1}')"
            skill_blob="$(git rev-parse "HEAD:$skill_home")"
            test -n "$skill_release"
            test -n "$skill_revision" '''
          if old not in s:
              raise SystemExit('source init skill block not found')
          p.write_text(s.replace(old,new))

          p = root/'scripts/audit-source-initialization/write-state-v1.py'
          s = p.read_text()
          s = s.replace('"repository":"CurveYield2/Contract-Automation","ref":"main",\n   "homepagePath":"optional-modes/lite-pathway/SKILL.md","liteSkillPath":e["SKILL_REPO_PATH"].split("CurveYield2/Contract-Automation/",1)[-1],',
                        '"repository":"CurveYield2/Audit-Controller","ref":"main",\n   "homepagePath":"SKILL.md","liteSkillPath":"Audit Skill - Current Authority",')
          s = s.replace('"authorityBasis":"CURRENT_CONTRACT_AUTOMATION_LITE_AUTHORITY"', '"authorityBasis":"CURRENT_AUDIT_CONTROLLER_AUTHORITY_FOLDER"')
          p.write_text(s)

          p = root/'.github/workflows/audit-controller-execution.yml'
          s = p.read_text()
          old = '''          skill_zip=".controller-operation/$resolved_skill_path"
                    test -f "$skill_zip"
                    request_expected_sha="$(node -e "const r=require('./.controller-operation/' + process.env.AUDIT_CONTROLLER_REQUEST_PATH); process.stdout.write(r.expectedSkillSha256 || '')")"
                    expected_skill_sha="$request_expected_sha"
                    if [ -z "$expected_skill_sha" ]; then expected_skill_sha="$resolved_skill_sha"; fi
                    if [ -n "$expected_skill_sha" ]; then
                      [[ "$expected_skill_sha" =~ ^[0-9a-f]{64}$ ]]
                      observed_skill_sha="$(sha256sum "$skill_zip" | awk '{print $1}')"
                      test "$observed_skill_sha" = "$expected_skill_sha"
                    fi
                    echo "SKILL_PACKAGE_PATH=$resolved_skill_path" >> "$GITHUB_ENV"
                    rm -rf .audit-skill
                    mkdir -p .audit-skill
                    unzip -q "$skill_zip" -d .audit-skill
                    skill_home="$(find .audit-skill -type f -name SKILL.md -not -path '*/optional-modes/lite-pathway/SKILL.md' | head -n1)"
                    test -n "$skill_home"
                    echo "SKILL_ROOT=$(dirname "$skill_home")" >> "$GITHUB_ENV" '''
          new = '''          skill_target=".controller-operation/$resolved_skill_path"
                    test -e "$skill_target"
                    request_expected_sha="$(node -e "const r=require('./.controller-operation/' + process.env.AUDIT_CONTROLLER_REQUEST_PATH); process.stdout.write(r.expectedSkillSha256 || '')")"
                    expected_skill_sha="$request_expected_sha"
                    if [ -z "$expected_skill_sha" ]; then expected_skill_sha="$resolved_skill_sha"; fi
                    echo "SKILL_PACKAGE_PATH=$resolved_skill_path" >> "$GITHUB_ENV"

                    if [ -d "$skill_target" ]; then
                      [ -z "$expected_skill_sha" ] || { echo "::error::Stable authority-folder routing must not carry a package SHA expectation."; exit 1; }
                      mapfile -t skill_homes < <(find "$skill_target" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | sort)
                      [ "${#skill_homes[@]}" -eq 1 ] || { echo "::error::Stable authority folder must contain exactly one unpacked package directory with root SKILL.md."; exit 1; }
                      skill_home="${skill_homes[0]}"
                      echo "SKILL_ROOT=$(dirname "$skill_home")" >> "$GITHUB_ENV"
                    else
                      if [ -n "$expected_skill_sha" ]; then
                        [[ "$expected_skill_sha" =~ ^[0-9a-f]{64}$ ]]
                        observed_skill_sha="$(sha256sum "$skill_target" | awk '{print $1}')"
                        test "$observed_skill_sha" = "$expected_skill_sha"
                      fi
                      rm -rf .audit-skill
                      mkdir -p .audit-skill
                      unzip -q "$skill_target" -d .audit-skill
                      skill_home="$(find .audit-skill -type f -name SKILL.md -not -path '*/optional-modes/lite-pathway/SKILL.md' | head -n1)"
                      test -n "$skill_home"
                      echo "SKILL_ROOT=$(dirname "$skill_home")" >> "$GITHUB_ENV"
                    fi '''
          if old not in s:
              raise SystemExit('controller execution skill resolution block not found')
          p.write_text(s.replace(old,new))

          p = root/'packages/github-native-sim/test/browser-agent-interphase-gate-v1.test.mjs'
          s = p.read_text().replace(old_repo, stable_repo).replace(old_url, stable_url)
          p.write_text(s)

          # This old packaging machinery targeted the deleted Contract-Automation authority tree.
          for obsolete in [
              root/'.github/workflows/rebuild-current-audit-skill-package-v1.yml',
              root/'scripts/rebuild-current-audit-skill-manifests-v1.mjs',
          ]:
              if obsolete.exists():
                  obsolete.unlink()
          PY

          if git grep -n -I 'CurveYield2/Contract-Automation/Audit Skill - Current Authority' --              '.github' 'scripts' 'packages' ':!*.zip' ; then
            echo "::error::Stale current-authority repository reference remains in active Contract-Automation code."
            exit 1
          fi

          if git grep -n -I 'Audit_V7_independent_Review_skill_v38/optional-modes/lite-pathway' --              '.github' 'scripts' 'packages' ':!*.zip' ; then
            echo "::error::Stale version-specific current-authority layout reference remains in active Contract-Automation code."
            exit 1
          fi

          node --test packages/github-native-sim/test/browser-agent-interphase-gate-v1.test.mjs

          git config user.name 'CurveYield Authority Migration'
          git config user.email 'authority-migration@users.noreply.github.com'
          rm -f .github/migrate-audit-authority-folder-trigger-v1
          rm -f .github/workflows/migrate-audit-authority-folder-v1.yml
          rm -f .github/scan-audit-skill-refs-trigger-v1
          rm -f .github/workflows/scan-audit-skill-refs-v1.yml
          git add -A
          git commit -m "Use stable Audit-Controller authority folder pointer"
          git push origin HEAD:main

      - name: Remove temporary scanner from Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf /tmp/audit-controller-clean
          gh repo clone CurveYield2/Audit-Controller /tmp/audit-controller-clean -- --branch main
          cd /tmp/audit-controller-clean
          rm -f .github/scan-audit-skill-refs-trigger-v1
          rm -f .github/workflows/scan-audit-skill-refs-v1.yml
          git config user.name 'CurveYield Authority Migration'
          git config user.email 'authority-migration@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary authority reference scanner"
            git push origin HEAD:main
          fi

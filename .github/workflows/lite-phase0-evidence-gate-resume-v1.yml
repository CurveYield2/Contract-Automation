name: Lite Phase 0 Evidence Gate Resume v1
on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/lite-phase0-evidence-resume/*.json'
permissions:
  contents: write
  actions: write
concurrency:
  group: lite-phase0-evidence-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence-gate-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted current runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore pinned dependencies
        uses: ./.github/actions/setup-phase0-node-cache
      - name: Resolve single immutable evidence-resume request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[]? | select(.status!="removed") | .filename | select(startswith("process/agent-upload/lite-phase0-evidence-resume/") and endswith(".json"))')
          test "${#requests[@]}" -eq 1
          request="${requests[0]}"
          jq -e '.schemaVersion=="curveyield-lite-phase0-evidence-resume-request-v1" and (.campaign_id|length>0) and (.campaign_path|startswith("campaigns/")) and (.source_run_id|type=="number") and (.artifact_id|type=="number") and (.source_head_sha|test("^[0-9a-f]{40}$")) and (.artifact_digest|test("^sha256:[0-9a-f]{64}$")) and .audit_controller_ref=="main"' "$request" >/dev/null
          {
            echo "campaign_id=$(jq -r .campaign_id "$request")"
            echo "campaign_path=$(jq -r .campaign_path "$request")"
            echo "source_run_id=$(jq -r .source_run_id "$request")"
            echo "source_head_sha=$(jq -r .source_head_sha "$request")"
            echo "artifact_id=$(jq -r .artifact_id "$request")"
            echo "artifact_digest=$(jq -r .artifact_digest "$request")"
          } >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Checkout existing unchanged campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: main
        run: bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF"
      - name: Fetch exact previous failed-run evidence, not a new deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.request.outputs.source_run_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_head_sha }}
          ARTIFACT_ID: ${{ steps.request.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.request.outputs.artifact_digest }}
          CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)" = failure
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.id)" = "$SOURCE_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .digest)" = "$ARTIFACT_DIGEST"
          name="phase0-deploy-config-$CAMPAIGN_ID-$SOURCE_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .name)" = "$name"
          mkdir -p .phase0-resume
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$name" --dir .phase0-resume
          test -s .phase0-resume/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
      - name: Reclassify four blockers against unchanged source and raw evidence
        env:
          SOURCE_RUN: ${{ steps.request.outputs.source_run_id }}
          CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          input=.phase0-resume/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
          test "$(jq -r .campaignId "$input")" = "$CAMPAIGN_ID"
          test "$(jq -r .sourceSha256 "$input")" = "$(jq -r .source.sha256 ".audit-controller/$CAMPAIGN_PATH/receipts/PHASE_00_RECEIPT_v1.json")"
          node scripts/reconcile-phase0-deploy-evidence-v1.mjs \
            --input "$input" --output .phase0-resume-reconciled/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json \
            --campaign-root ".audit-controller/$CAMPAIGN_PATH" --source-run-id "$SOURCE_RUN"
          node --input-type=module -e 'import fs from "node:fs";import {assertDeployGateEvidenceV2} from "./scripts/lib/phase0-deploy-gate-v2.mjs";assertDeployGateEvidenceV2(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))' .phase0-resume-reconciled/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
      - name: Upload both original and reconciled evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-replay-${{ github.run_id }}
          path: |
            .phase0-resume
            .phase0-resume-reconciled
          include-hidden-files: true
          if-no-files-found: warn
      - name: Write Phase 0 evidence and Phase 6 matrices without recompiling
        env:
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-phase0-fork-deploy-outputs-v1.mjs \
            --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" \
            --simulation-output .phase0-resume-reconciled
      - name: Verify recovered Phase 0 evidence and finalize
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lite-phase0-finalize-no-telemetry-v1.mjs \
            --controller-root .audit-controller --campaign-path "$CAMPAIGN_PATH" \
            --contract-automation-sha "$GITHUB_SHA" --bootstrap-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" | tee /tmp/phase0-gate-replay-finalize.json
          test "$(jq -r .status /tmp/phase0-gate-replay-finalize.json)" = PASS
          echo "campaign_name=$(jq -r .campaignName /tmp/phase0-gate-replay-finalize.json)" >> "$GITHUB_OUTPUT"
      - name: Publish finalized Phase 0 to original campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
          CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Phase0 Evidence Gate Automation'
          git config user.email 'phase0-evidence-gate@users.noreply.github.com'
          git add -A -- "$CAMPAIGN_PATH" "Audit Campaign Directory/campaigns"
          git diff --cached --quiet && { echo "::error::No Phase-0 evidence/receipt change";exit 1; }
          git commit -m "audit(phase0): seal deployment evidence gate replay $CAMPAIGN_ID"
          git push origin HEAD:main
      - name: Dispatch Phase 1 through existing orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ steps.request.outputs.campaign_id }}
          CAMPAIGN_PATH: ${{ steps.request.outputs.campaign_path }}
          CAMPAIGN_NAME: ${{ steps.finalize.outputs.campaign_name }}
        shell: bash
        run: |
          gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f campaign_id="$CAMPAIGN_ID" -f campaign_name="$CAMPAIGN_NAME" \
            -f campaign_path="$CAMPAIGN_PATH" -f audit_controller_ref=main

              {
                cat /tmp/lite-successor-wake.txt
                printf '\n%s\n' '[VERIFIED_INTERPHASE_MECHANICAL_RESULTS_V2]'
                printf 'work_packet=%s\n' "$packet_path"
                printf 'completion_receipt=%s\n' "$completion_path"
                printf 'reconciliation_output=%s\n' "$reconciliation_output"
                printf 'verified_output_count=%s\n' "$verified_output_count"
                printf '%s\n' 'security_meaning=MECHANICAL_ONLY; these artifacts are not findings, severity decisions, exploit validation, remediation approval, or residual-risk conclusions.'
                printf '%s\n' 'read_order=Read the final reconciliation output first. Open individual unit outputs only when the active reviewer task needs the underlying mechanical detail.'
                printf '%s\n' 'verified_unit_outputs:'
                jq -r --arg reconciliation "$reconciliation_output" '.outputs[] | select(.path != $reconciliation) | "- " + .path' /tmp/lite-interphase-completion.json
              } > /tmp/lite-successor-wake-with-mechanical.txt
              mv /tmp/lite-successor-wake-with-mechanical.txt /tmp/lite-successor-wake.txt
            fi

            next_phase="$(jq -r '.nextMilestone.phaseRange[0] // empty' /tmp/lite-active-pointer.json)"
            if [ -n "$next_phase" ]; then next_phase="phase-$next_phase"; else next_phase="$next_id"; fi
            successor_wake_id="${campaign_id}-${next_id}-${GITHUB_RUN_ID}-${cycle}"
            wake_b64="$(base64 -w0 /tmp/lite-successor-wake.txt)"

            echo "Lite machine gate PASS: $expected_milestone -> $next_id. Creating fresh normal ChatGPT web successor."
            gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$successor_wake_id" \
              -f campaign_id="$campaign_id" \
              -f phase_id="$next_phase" \
              -f mode="create_fresh" \
              -f chat_url="" \
              -f wake_message_b64="$wake_b64" \
              -f watchdog_enabled="true" \
              -f watchdog_message_b64="" \
              -f gate_mode="LITE" \
              -f gate_repository="$gate_repo" \
              -f gate_ref="$gate_ref" \
              -f gate_state_path="$gate_path" \
              -f gate_expected_phase_id="$next_phase" \
              -f gate_expected_milestone_id="$next_id" \
              -f gate_active_pointer_path="$pointer_path"
            return 0
          }

          if ! fetch_state; then
            echo 'Watchdog state already retired; nothing to supervise.'

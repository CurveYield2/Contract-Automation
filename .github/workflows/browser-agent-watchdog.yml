                  printf '%s\n' 'prohibited_semantic_work=No finding promotion or rejection, severity grading, exploit or economic judgment, remediation approval, or residual-risk conclusions.'
                  printf '%s\n' 'required_outputs:'
                  jq -r '.requiredOutputs[].path' /tmp/lite-interphase-work-packet.json
                  printf '\n%s\n\n' 'You are a mechanical inter-phase worker. Perform only the deterministic/repetitive work in the packet below. Do not make, promote, reject, grade, or remediate security findings; do not reinterpret audit methodology. Use the GitHub repository tools to write the required outputs and the completion receipt. The completion receipt must use schema curveyield-lite-interphase-completion-v2, include one workUnitReceipt for every work unit, and include exact SHA-256 values for every required output. A PASS receipt certifies byte completeness only and never approves security conclusions.'
                  printf '%s\n' "$instructions"
                } > /tmp/lite-interphase-wake.txt
                mechanical_b64="$(base64 -w0 /tmp/lite-interphase-wake.txt)"


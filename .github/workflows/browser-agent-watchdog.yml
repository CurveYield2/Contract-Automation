name: Browser Agent Watchdog

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      wake_id:
        description: Optional single wake ID; empty scans all active watchdog states
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: browser-agent-watchdog
  cancel-in-progress: false

jobs:
  observe-and-poke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUESTED_WAKE_ID: \${{ inputs.wake_id }}
      CHATGPT_STORAGE_STATE_B64: \${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSERLESS_TOKEN: \${{ secrets.BROWSERLESS_TOKEN }}
      BROWSERLESS_PROFILE: \${{ vars.BROWSERLESS_PROFILE || 'chatgpt' }}
      BROWSERBASE_API_KEY: \${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: \${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: \${{ secrets.BROWSERBASE_CONTEXT_ID }}
      AUDIT_CONTROLLER_GITHUB_TOKEN: \${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ephemeral watchdog dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright @browserbasehq/sdk
          if [ -n "\${CHATGPT_STORAGE_STATE_B64:-}" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Observe active agents and poke only idle chats
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          states=(process/browser-agent-watchdog/active/*.json)
          if [ "\${#states[@]}" -eq 0 ]; then
            echo 'No active browser-agent watchdog states.'
            exit 0
          fi

          persist_state() {
            local file="$1"
            local safe_id="$2"
            local api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json"
            local sha
            sha="$(gh api "$api?ref=main" --jq '.sha')"
            local content
            content="$(base64 -w0 "$file")"
            gh api --method PUT "$api" -f message="chore(watchdog): observe $safe_id" -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          }

          complete_state() {
            local file="$1"
            local safe_id="$2"
            local active_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json"
            local completed_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/completed/$safe_id.json"
            jq '.status="COMPLETED" | .completedAt=(now|todate)' "$file" > /tmp/completed-state.json
            local content active_sha existing_completed
            content="$(base64 -w0 /tmp/completed-state.json)"
            active_sha="$(gh api "$active_api?ref=main" --jq '.sha')"
            existing_completed="$(gh api "$completed_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$existing_completed" ]; then
              gh api --method PUT "$completed_api" -f message="chore(watchdog): complete $safe_id" -f content="$content" -f sha="$existing_completed" -f branch=main >/dev/null
            else
              gh api --method PUT "$completed_api" -f message="chore(watchdog): complete $safe_id" -f content="$content" -f branch=main >/dev/null
            fi
            gh api --method DELETE "$active_api" -f message="chore(watchdog): retire $safe_id" -f sha="$active_sha" -f branch=main >/dev/null
          }

          for state in "\${states[@]}"; do
            wake_id="$(jq -r '.wakeId' "$state")"
            if [ -n "\${REQUESTED_WAKE_ID:-}" ] && [ "$wake_id" != "$REQUESTED_WAKE_ID" ]; then
              continue
            fi
            safe_id="$(basename "$state" .json)"
            chat_url="$(jq -r '.chatUrl // empty' "$state")"
            if [ -z "$chat_url" ]; then
              echo "::warning::Watchdog $wake_id has no chat URL; leaving active for repair."
              continue
            fi

            completion_repo="$(jq -r '.completion.repository // empty' "$state")"
            completion_ref="$(jq -r '.completion.ref // "main"' "$state")"
            completion_path="$(jq -r '.completion.path // empty' "$state")"
            status_field="$(jq -r '.completion.statusField // "status"' "$state")"

            terminal=false
            if [ -n "$completion_repo" ] && [ -n "$completion_path" ]; then
              token="$AUDIT_CONTROLLER_GITHUB_TOKEN"
              if [ "$completion_repo" = "$GITHUB_REPOSITORY" ]; then token="$GH_TOKEN"; fi
              if [ -n "$token" ]; then
                encoded="$(GH_TOKEN="$token" gh api "repos/$completion_repo/contents/$completion_path?ref=$completion_ref" --jq '.content' 2>/dev/null || true)"
                if [ -n "$encoded" ]; then
                  printf '%s' "$encoded" | base64 -d > /tmp/completion.json
                  status="$(jq -r --arg f "$status_field" 'getpath($f|split(".")) // empty' /tmp/completion.json 2>/dev/null || true)"
                  if jq -e --arg s "$status" '.completion.terminalValues | index($s) != null' "$state" >/dev/null; then
                    terminal=true
                  fi
                fi
              fi
            fi

            if [ "$terminal" = true ]; then
              echo "Watchdog $wake_id observed terminal completion; retiring."
              complete_state "$state" "$safe_id"
              continue
            fi

            export WAKE_ID="$wake_id"
            export WAKE_MODE='resume_existing'
            export CHAT_URL="$chat_url"
            export WAKE_ACTION='observe'
            export WAKE_RESULT_PATH="/tmp/$safe_id-observe.json"

            if ! node scripts/browser-agent-wake.mjs; then
              echo "::warning::Observation failed for $wake_id; next 5-minute watchdog cycle will retry."
              continue
            fi

            generating="$(jq -r '.generating // false' "$WAKE_RESULT_PATH")"
            current_count="$(jq -r '.assistantCount // 0' "$WAKE_RESULT_PATH")"
            current_hash="$(jq -r '.lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
            previous_count="$(jq -r '.observation.assistantCount // 0' "$state")"
            previous_hash="$(jq -r '.observation.lastAssistantHash // empty' "$state")"

            productive=false
            reason=''
            if [ "$generating" = true ]; then
              productive=true
              reason='GENERATING'
            elif [ "$current_count" -gt "$previous_count" ]; then
              productive=true
              reason='ADVANCED_MESSAGE_COUNT'
            elif [ -n "$current_hash" ] && [ "$current_hash" != "$previous_hash" ]; then
              productive=true
              reason='ADVANCED_CONTENT'
            fi

            if [ "$productive" = true ]; then
              echo "Watchdog $wake_id: PRODUCTIVE ($reason); no interruption."
              jq \
                --argjson count "$current_count" \
                --arg hash "$current_hash" \
                --arg reason "$reason" \
                '.observation.assistantCount=$count
                 | .observation.lastAssistantHash=$hash
                 | .observation.observedAt=(now|todate)
                 | .lastProductiveAt=(now|todate)
                 | .lastDecision=("PRODUCTIVE_"+$reason)' \
                "$state" > /tmp/watchdog-state.json
              cp /tmp/watchdog-state.json "$state"
              persist_state "$state" "$safe_id"
              continue
            fi

            echo "Watchdog $wake_id: IDLE; sending GET BACK TO WORK."
            export WAKE_ACTION='wake'
            export WAKE_MESSAGE="$(jq -r '.idleMessage' "$state")"
            export WAKE_RESULT_PATH="/tmp/$safe_id-poke.json"
            if node scripts/browser-agent-wake.mjs; then
              next_count="$(jq -r '.after.assistantCount // .assistantCount // 0' "$WAKE_RESULT_PATH")"
              next_hash="$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
              jq \
                --argjson count "$next_count" \
                --arg hash "$next_hash" \
                '.observation.assistantCount=$count
                 | .observation.lastAssistantHash=$hash
                 | .observation.observedAt=(now|todate)
                 | .lastPokedAt=(now|todate)
                 | .pokeCount=((.pokeCount // 0)+1)
                 | .lastDecision="IDLE_POKED"' \
                "$state" > /tmp/watchdog-state.json
              cp /tmp/watchdog-state.json "$state"
              persist_state "$state" "$safe_id"
            else
              echo "::warning::Idle poke failed for $wake_id; next cycle will retry."
            fi
          done

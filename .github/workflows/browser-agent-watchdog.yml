name: Browser Agent Watchdog

on:
  workflow_dispatch:
    inputs:
      wake_id:
        description: Active wake/watchdog identifier
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: browser-agent-watchdog-${{ inputs.wake_id }}
  cancel-in-progress: false

jobs:
  observe-and-poke:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      REQUESTED_WAKE_ID: ${{ inputs.wake_id }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
      BROWSERLESS_PROFILE: ${{ vars.BROWSERLESS_PROFILE || 'chatgpt' }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      AUDIT_CONTROLLER_GITHUB_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ephemeral watchdog dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright @browserbasehq/sdk
          if [ -n "\${CHATGPT_STORAGE_STATE_B64:-}" ]; then
            npx playwright install --with-deps chromium
          fi

      - name: Observe every five minutes and poke only idle chats
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          safe_id="$(printf '%s' "$REQUESTED_WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          active_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json"
          completed_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/completed/$safe_id.json"

          load_state() {
            local encoded
            encoded="$(gh api "$active_api?ref=main" --jq '.content' 2>/dev/null || true)"
            if [ -z "$encoded" ]; then return 1; fi
            printf '%s' "$encoded" | base64 -d > /tmp/watchdog-state.json
          }

          persist_state() {
            local sha content
            sha="$(gh api "$active_api?ref=main" --jq '.sha')"
            content="$(base64 -w0 /tmp/watchdog-state.json)"
            gh api --method PUT "$active_api" \
              -f message="chore(watchdog): observe $REQUESTED_WAKE_ID" \
              -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          }

          complete_state() {
            jq '.status="COMPLETED" | .completedAt=(now|todate)' /tmp/watchdog-state.json > /tmp/watchdog-completed.json
            local content active_sha existing_completed
            content="$(base64 -w0 /tmp/watchdog-completed.json)"
            active_sha="$(gh api "$active_api?ref=main" --jq '.sha')"
            existing_completed="$(gh api "$completed_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$existing_completed" ]; then
              gh api --method PUT "$completed_api" \
                -f message="chore(watchdog): complete $REQUESTED_WAKE_ID" \
                -f content="$content" -f sha="$existing_completed" -f branch=main >/dev/null
            else
              gh api --method PUT "$completed_api" \
                -f message="chore(watchdog): complete $REQUESTED_WAKE_ID" \
                -f content="$content" -f branch=main >/dev/null
            fi
            gh api --method DELETE "$active_api" \
              -f message="chore(watchdog): retire $REQUESTED_WAKE_ID" \
              -f sha="$active_sha" -f branch=main >/dev/null
          }

          completion_is_terminal() {
            local repo ref path field token encoded status
            repo="$(jq -r '.completion.repository // empty' /tmp/watchdog-state.json)"
            ref="$(jq -r '.completion.ref // "main"' /tmp/watchdog-state.json)"
            path="$(jq -r '.completion.path // empty' /tmp/watchdog-state.json)"
            field="$(jq -r '.completion.statusField // "status"' /tmp/watchdog-state.json)"
            [ -n "$repo" ] && [ -n "$path" ] || return 1
            token="$AUDIT_CONTROLLER_GITHUB_TOKEN"
            if [ "$repo" = "$GITHUB_REPOSITORY" ]; then token="$GH_TOKEN"; fi
            [ -n "$token" ] || return 1
            encoded="$(GH_TOKEN="$token" gh api "repos/$repo/contents/$path?ref=$ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded" ] || return 1
            printf '%s' "$encoded" | base64 -d > /tmp/completion.json
            status="$(jq -r --arg f "$field" 'getpath($f|split(".")) // empty' /tmp/completion.json 2>/dev/null || true)"
            jq -e --arg s "$status" '.completion.terminalValues | index($s) != null' /tmp/watchdog-state.json >/dev/null
          }

          # Wake workflow starts this watchdog immediately. Give the agent five full
          # minutes to work before the first liveness decision.
          sleep 300

          for iteration in $(seq 1 69); do
            if ! load_state; then
              echo "Watchdog state no longer active; stopping."
              exit 0
            fi

            if completion_is_terminal; then
              echo "Terminal audit completion observed; retiring watchdog."
              complete_state
              exit 0
            fi

            chat_url="$(jq -r '.chatUrl // empty' /tmp/watchdog-state.json)"
            if [ -z "$chat_url" ]; then
              echo "::warning::Watchdog has no chat URL; retrying after five minutes."
              sleep 300
              continue
            fi

            export WAKE_ID="$REQUESTED_WAKE_ID"
            export WAKE_MODE='resume_existing'
            export CHAT_URL="$chat_url"
            export WAKE_ACTION='observe'
            export WAKE_RESULT_PATH='/tmp/watchdog-observe.json'

            if ! node scripts/browser-agent-wake.mjs; then
              echo "::warning::All observation providers failed; retrying in five minutes."
              sleep 300
              continue
            fi

            generating="$(jq -r '.generating // false' "$WAKE_RESULT_PATH")"
            current_count="$(jq -r '.assistantCount // 0' "$WAKE_RESULT_PATH")"
            current_hash="$(jq -r '.lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
            previous_count="$(jq -r '.observation.assistantCount // 0' /tmp/watchdog-state.json)"
            previous_hash="$(jq -r '.observation.lastAssistantHash // empty' /tmp/watchdog-state.json)"

            productive=false
            reason=''
            if [ "$generating" = true ]; then
              productive=true
              reason='GENERATING'
            elif [ "$current_count" -gt "$previous_count" ]; then
              productive=true
              reason='ADVANCED_MESSAGE_COUNT'
            elif [ -n "$current_hash" ] && [ "$current_hash" != "$previous_hash" ]; then
              productive=true
              reason='ADVANCED_CONTENT'
            fi

            if [ "$productive" = true ]; then
              echo "PRODUCTIVE ($reason); watchdog will not interrupt."
              jq \
                --argjson count "$current_count" \
                --arg hash "$current_hash" \
                --arg reason "$reason" \
                '.observation.assistantCount=$count
                 | .observation.lastAssistantHash=$hash
                 | .observation.observedAt=(now|todate)
                 | .lastProductiveAt=(now|todate)
                 | .lastDecision=("PRODUCTIVE_"+$reason)' \
                /tmp/watchdog-state.json > /tmp/watchdog-next.json
              mv /tmp/watchdog-next.json /tmp/watchdog-state.json
              persist_state
            else
              echo "IDLE; sending the registered GET BACK TO WORK message."
              export WAKE_ACTION='wake'
              export WAKE_MESSAGE="$(jq -r '.idleMessage' /tmp/watchdog-state.json)"
              export WAKE_RESULT_PATH='/tmp/watchdog-poke.json'
              if node scripts/browser-agent-wake.mjs; then
                next_count="$(jq -r '.after.assistantCount // .assistantCount // 0' "$WAKE_RESULT_PATH")"
                next_hash="$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
                jq \
                  --argjson count "$next_count" \
                  --arg hash "$next_hash" \
                  '.observation.assistantCount=$count
                   | .observation.lastAssistantHash=$hash
                   | .observation.observedAt=(now|todate)
                   | .lastPokedAt=(now|todate)
                   | .pokeCount=((.pokeCount // 0)+1)
                   | .lastDecision="IDLE_POKED"' \
                  /tmp/watchdog-state.json > /tmp/watchdog-next.json
                mv /tmp/watchdog-next.json /tmp/watchdog-state.json
                persist_state
              else
                echo "::warning::Idle poke failed on all providers; retrying in five minutes."
              fi
            fi

            if [ "$iteration" -lt 69 ]; then sleep 300; fi
          done

          # GitHub-hosted jobs have a finite lifetime. Chain another watchdog run
          # rather than silently dropping supervision on a still-active audit.
          if load_state && ! completion_is_terminal; then
            echo "Watchdog window reached; self-dispatching continuation."
            gh workflow run browser-agent-watchdog.yml \
              --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$REQUESTED_WAKE_ID"
          elif load_state; then
            complete_state
          fi

              fi
            fi

            mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
            persist_state || true
           done

          if fetch_state; then
            echo 'Watchdog sweep complete; active state remains for the next scheduled sweep.'
          else
            echo 'Watchdog was retired during this sweep.'
          fi
\t' read -r unit_id unit_path; do
              [ -n "$unit_id" ] || continue
              unit_receipt_sha="$(jq -r --arg id "$unit_id" '.workUnitReceipts[] | select(.id==$id) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              output_sha="$(jq -r --arg p "$unit_path" '.outputs[] | select(.path==$p) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              [ "$unit_receipt_sha" = "$output_sha" ] || return 1
            done <<< "$packet_units"

            while IFS= read -r output_path; do
              [ -n "$output_path" ] || continue
              safe_repo_path "$output_path" || return 1
              expected_sha="$(jq -r --arg p "$output_path" '.outputs[] | select(.path==$p) | .sha256 // empty' /tmp/lite-interphase-completion.json | tail -n1)"
              [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || return 1
              output_encoded="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$output_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              [ -n "$output_encoded" ] || return 1

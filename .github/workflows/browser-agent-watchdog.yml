name: Browser Agent Watchdog

on:
  workflow_dispatch:
    inputs:
      wake_id:
        description: Active wake/watchdog identifier
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: browser-agent-watchdog-${{ inputs.wake_id }}
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WAKE_ID: ${{ inputs.wake_id }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
      BROWSERLESS_PROFILE: ${{ vars.BROWSERLESS_PROFILE || 'chatgpt' }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      AUDIT_CONTROLLER_GITHUB_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ephemeral watchdog dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core @browserbasehq/sdk

      - name: Supervise agent for four-hour segment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          active_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$safe_id.json"

          fetch_state() {
            local encoded
            encoded="$(gh api "$active_api?ref=main" --jq '.content' 2>/dev/null || true)"
            if [ -z "$encoded" ]; then return 1; fi
            printf '%s' "$encoded" | base64 -d > /tmp/watchdog-state.json
          }

          persist_state() {
            local sha content
            sha="$(gh api "$active_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            [ -n "$sha" ] || return 1
            content="$(base64 -w0 /tmp/watchdog-state.json)"
            gh api --method PUT "$active_api" \
              -f message="chore(watchdog): observe $WAKE_ID" \
              -f content="$content" -f sha="$sha" -f branch=main >/dev/null
          }

          retire_state() {
            local reason="$1"
            local active_sha completed_api completed_sha content
            active_sha="$(gh api "$active_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            [ -n "$active_sha" ] || return 0
            jq --arg reason "$reason" \
              '.status="COMPLETED_CANONICAL_GATE" | .completionReason=$reason | .completedAt=(now|todate)' \
              /tmp/watchdog-state.json > /tmp/watchdog-completed.json
            completed_api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/completed/$safe_id.json"
            completed_sha="$(gh api "$completed_api?ref=main" --jq '.sha' 2>/dev/null || true)"
            content="$(base64 -w0 /tmp/watchdog-completed.json)"
            if [ -n "$completed_sha" ]; then
              gh api --method PUT "$completed_api" -f message="chore(watchdog): retire $WAKE_ID" -f content="$content" -f sha="$completed_sha" -f branch=main >/dev/null
            else
              gh api --method PUT "$completed_api" -f message="chore(watchdog): retire $WAKE_ID" -f content="$content" -f branch=main >/dev/null
            fi
            gh api --method DELETE "$active_api" -f message="chore(watchdog): retire active $WAKE_ID" -f sha="$active_sha" -f branch=main >/dev/null
          }
          launch_lite_successor() {
            local pointer_path="$1"
            local expected_milestone="$2"
            local gate_repo="$3"
            local gate_ref="$4"
            local encoded_pointer completed_id completed_status next_id next_state handoff_path handoff_dir wake_path encoded_wake wake_b64 next_phase successor_wake_id

            [ -n "$pointer_path" ] || return 2
            encoded_pointer="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$pointer_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded_pointer" ] || return 2
            printf '%s' "$encoded_pointer" | base64 -d > /tmp/lite-active-pointer.json

            completed_id="$(jq -r '.completedMilestone.id // empty' /tmp/lite-active-pointer.json)"
            completed_status="$(jq -r '.completedMilestone.status // empty' /tmp/lite-active-pointer.json)"
            next_id="$(jq -r '.nextMilestone.id // empty' /tmp/lite-active-pointer.json)"
            next_state="$(jq -r '.nextMilestone.state // empty' /tmp/lite-active-pointer.json)"

            [ "$completed_id" = "$expected_milestone" ] || return 2
            case "$completed_status" in
              SEALED|COMPLETE|COMPLETED|PASS) ;;
              *) return 2 ;;
            esac
            [ -n "$next_id" ] || return 3
            case "$next_state" in
              WAITING_FOR_SUCCESSOR_AGENT|READY|NOT_STARTED|ACTIVE) ;;
              *) return 2 ;;
            esac

            handoff_path="$(jq -r '.authoritativeHandoff // empty' /tmp/lite-active-pointer.json)"
            [ -n "$handoff_path" ] || return 2
            handoff_dir="$(dirname "$handoff_path")"
            wake_path="$handoff_dir/WAKE_UP_MESSAGE.md"
            encoded_wake="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$wake_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded_wake" ] || return 2
            printf '%s' "$encoded_wake" | base64 -d > /tmp/lite-successor-wake.txt
            test -s /tmp/lite-successor-wake.txt
            if grep -Eiq '\b(TBD|TODO)\b|\{\{[^}]+\}\}|<[^>]*(placeholder|fill|insert)[^>]*>' /tmp/lite-successor-wake.txt; then
              echo "::warning::Lite successor wake packet contains unresolved placeholder material."
              return 2
            fi

            next_phase="$(jq -r '.nextMilestone.phaseRange[0] // empty' /tmp/lite-active-pointer.json)"
            if [ -n "$next_phase" ]; then next_phase="phase-$next_phase"; else next_phase="$next_id"; fi
            successor_wake_id="${campaign_id}-${next_id}-${GITHUB_RUN_ID}-${cycle}"
            wake_b64="$(base64 -w0 /tmp/lite-successor-wake.txt)"

            echo "Lite machine gate PASS: $expected_milestone -> $next_id. Creating fresh normal ChatGPT web successor."
            gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f wake_id="$successor_wake_id" \
              -f campaign_id="$campaign_id" \
              -f phase_id="$next_phase" \
              -f mode="create_fresh" \
              -f chat_url="" \
              -f wake_message_b64="$wake_b64" \
              -f watchdog_enabled="true" \
              -f watchdog_message_b64="" \
              -f gate_mode="LITE" \
              -f gate_repository="$gate_repo" \
              -f gate_ref="$gate_ref" \
              -f gate_state_path="$gate_path" \
              -f gate_expected_phase_id="$next_phase" \
              -f gate_expected_milestone_id="$next_id" \
              -f gate_active_pointer_path="$pointer_path"
            return 0
          }

          if ! fetch_state; then
            echo 'Watchdog state already retired; nothing to supervise.'
            exit 0
          fi

          jq --arg run "$GITHUB_RUN_ID" \
            '.watchdogRunId=$run | .watchdogSegmentStartedAt=(now|todate)' \
            /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
          mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
          persist_state || true

          for cycle in $(seq 1 46); do
            if ! fetch_state; then
              echo 'Watchdog state was retired by approved completion; exiting immediately.'
              exit 0
            fi

            campaign_id="$(jq -r '.campaignId' /tmp/watchdog-state.json)"
            phase_id="$(jq -r '.phaseId' /tmp/watchdog-state.json)"
            chat_url="$(jq -r '.chatUrl // empty' /tmp/watchdog-state.json)"

            gate_mode="$(jq -r '.gate.mode // "FULL_V26"' /tmp/watchdog-state.json)"
            gate_repo="$(jq -r '.gate.repository // "CurveYield2/Audit-Controller"' /tmp/watchdog-state.json)"
            gate_ref="$(jq -r '.gate.ref // "main"' /tmp/watchdog-state.json)"
            gate_path="$(jq -r '.gate.statePath // empty' /tmp/watchdog-state.json)"
            gate_expected_phase="$(jq -r '.gate.expectedPhaseId // empty' /tmp/watchdog-state.json)"
            gate_expected_milestone="$(jq -r '.gate.expectedMilestoneId // empty' /tmp/watchdog-state.json)"
            gate_pointer_path="$(jq -r '.gate.activePointerPath // empty' /tmp/watchdog-state.json)"

            if [ -n "$gate_path" ] && [ -n "${AUDIT_CONTROLLER_GITHUB_TOKEN:-}" ]; then
              encoded_state="$(GH_TOKEN="$AUDIT_CONTROLLER_GITHUB_TOKEN" gh api "repos/$gate_repo/contents/$gate_path?ref=$gate_ref" --jq '.content' 2>/dev/null || true)"
              if [ -n "$encoded_state" ]; then
                printf '%s' "$encoded_state" | base64 -d > /tmp/canonical-campaign-state.json

                if [ "$gate_mode" = "LITE" ]; then
                  lite_campaign_status="$(jq -r '.campaignStatus // empty' /tmp/canonical-campaign-state.json)"
                  lite_phase_id="$(jq -r '.phase.id // empty' /tmp/canonical-campaign-state.json)"
                  lite_phase_state="$(jq -r '.phase.state // empty' /tmp/canonical-campaign-state.json)"
                  lite_worker_status="$(jq -r --arg m "$gate_expected_milestone" '.routingPlan.workers[]? | select(.milestone==$m) | .status' /tmp/canonical-campaign-state.json | tail -n1)"

                  if [ "$lite_campaign_status" = "COMPLETE" ] || [ "$lite_phase_state" = "CLOSED" ]; then
                    echo "Lite campaign is complete; retiring watchdog."
                    retire_state "LITE_CAMPAIGN_COMPLETE"
                    exit 0
                  fi

                  case "$lite_worker_status" in
                    COMPLETE|COMPLETED|SEALED|PASS)
                      if [ "$gate_expected_milestone" = "P8_10" ]; then
                        echo "Final Lite milestone is sealed; retiring watchdog."
                        retire_state "LITE_FINAL_MILESTONE_$lite_worker_status"
                        exit 0
                      fi
                      if launch_lite_successor "$gate_pointer_path" "$gate_expected_milestone" "$gate_repo" "$gate_ref"; then
                        retire_state "LITE_SUCCESSOR_DISPATCHED_$gate_expected_milestone"
                        exit 0
                      else
                        rc=$?
                        if [ "$rc" -eq 3 ]; then
                          echo "Lite milestone is terminal with no successor; retiring watchdog."
                          retire_state "LITE_NO_SUCCESSOR_$gate_expected_milestone"
                          exit 0
                        fi
                        echo "::warning::Lite milestone is sealed but successor packet is not machine-ready yet; current agent remains supervised."
                      fi
                      ;;
                  esac

                  if [ -n "$gate_expected_phase" ] && [ -n "$lite_phase_id" ] && [ "$lite_phase_id" != "$gate_expected_phase" ] && [ "$lite_worker_status" != "ACTIVE" ]; then
                    echo "Lite phase moved beyond $gate_expected_phase but successor packet is not yet ready; keeping watchdog active for handoff completion."
                  fi
                else
                  canonical_state="$(jq -r '.state // empty' /tmp/canonical-campaign-state.json)"
                  canonical_campaign_status="$(jq -r '.campaignStatus // empty' /tmp/canonical-campaign-state.json)"
                  canonical_phase="$(jq -r '.currentPhase // empty' /tmp/canonical-campaign-state.json)"

                  if jq -e --arg s "$canonical_state" '.gate.stopStates | index($s) != null' /tmp/watchdog-state.json >/dev/null; then
                    echo "Canonical V26 gate reached terminal agent state $canonical_state; retiring watchdog."
                    retire_state "CANONICAL_GATE_STATE_$canonical_state"
                    exit 0
                  fi
                  if jq -e --arg s "$canonical_campaign_status" '.gate.stopCampaignStatuses | index($s) != null' /tmp/watchdog-state.json >/dev/null; then
                    echo "Canonical campaign status $canonical_campaign_status is terminal; retiring watchdog."
                    retire_state "CANONICAL_CAMPAIGN_STATUS_$canonical_campaign_status"
                    exit 0
                  fi
                  if [ -n "$gate_expected_phase" ] && [ -n "$canonical_phase" ] && [ "$canonical_phase" != "$gate_expected_phase" ]; then
                    echo "Canonical V26 gate advanced from $gate_expected_phase to $canonical_phase; retiring watchdog."
                    retire_state "CANONICAL_PHASE_ADVANCED_TO_$canonical_phase"
                    exit 0
                  fi
                fi
              else
                echo "::warning::Canonical campaign state could not be read; watchdog will continue and retry."
              fi
            fi

            if [ -z "$chat_url" ]; then
              echo "::warning::No chat URL for $WAKE_ID; retrying next cycle."
              sleep 300
              continue
            fi

            export WAKE_MODE='resume_existing'
            export CHAT_URL="$chat_url"
            export WAKE_ACTION='observe'
            export WAKE_RESULT_PATH="/tmp/$safe_id-observe.json"

            if ! node scripts/browser-agent-wake.mjs; then
              echo "::warning::Observation failed for $WAKE_ID on cycle $cycle; provider stack will retry in five minutes."
              jq '.lastDecision="OBSERVATION_FAILED" | .lastObservationFailureAt=(now|todate)' /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
              mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
              persist_state || true
              if [ "$cycle" -lt 46 ]; then sleep 300; fi
              continue
            fi

            generating="$(jq -r '.generating // false' "$WAKE_RESULT_PATH")"
            current_count="$(jq -r '.assistantCount // 0' "$WAKE_RESULT_PATH")"
            current_hash="$(jq -r '.lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
            previous_count="$(jq -r '.observation.assistantCount // 0' /tmp/watchdog-state.json)"
            previous_hash="$(jq -r '.observation.lastAssistantHash // empty' /tmp/watchdog-state.json)"

            productive=false
            reason=''
            if [ "$generating" = true ]; then
              productive=true
              reason='GENERATING'
            elif [ "$current_count" -gt "$previous_count" ]; then
              productive=true
              reason='ADVANCED_MESSAGE_COUNT'
            elif [ -n "$current_hash" ] && [ "$current_hash" != "$previous_hash" ]; then
              productive=true
              reason='ADVANCED_CONTENT'
            fi

            if [ "$productive" = true ]; then
              echo "Watchdog $WAKE_ID: PRODUCTIVE ($reason); no interruption."
              jq --argjson count "$current_count" --arg hash "$current_hash" --arg reason "$reason" \
                '.observation.assistantCount=$count | .observation.lastAssistantHash=$hash | .observation.observedAt=(now|todate) | .lastProductiveAt=(now|todate) | .lastDecision=("PRODUCTIVE_"+$reason)' \
                /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
            else
              echo "Watchdog $WAKE_ID: IDLE; sending configured GET BACK TO WORK message."
              export WAKE_ACTION='wake'
              export WAKE_MESSAGE="$(jq -r '.idleMessage' /tmp/watchdog-state.json)"
              export WAKE_RESULT_PATH="/tmp/$safe_id-poke.json"
              if node scripts/browser-agent-wake.mjs; then
                next_count="$(jq -r '.after.assistantCount // .assistantCount // 0' "$WAKE_RESULT_PATH")"
                next_hash="$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' "$WAKE_RESULT_PATH")"
                jq --argjson count "$next_count" --arg hash "$next_hash" \
                  '.observation.assistantCount=$count | .observation.lastAssistantHash=$hash | .observation.observedAt=(now|todate) | .lastPokedAt=(now|todate) | .pokeCount=((.pokeCount // 0)+1) | .lastDecision="IDLE_POKED"' \
                  /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
              else
                jq '.lastDecision="IDLE_POKE_FAILED" | .lastPokeFailureAt=(now|todate)' /tmp/watchdog-state.json > /tmp/watchdog-state-next.json
              fi
            fi

            mv /tmp/watchdog-state-next.json /tmp/watchdog-state.json
            persist_state || true
            if [ "$cycle" -lt 46 ]; then sleep 300; fi
          done

          if fetch_state; then
            echo 'Four-hour watchdog segment complete and audit is still active; chaining the next segment.'
            gh workflow run browser-agent-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_id="$WAKE_ID"
          else
            echo 'Watchdog was retired before segment rollover.'
          fi

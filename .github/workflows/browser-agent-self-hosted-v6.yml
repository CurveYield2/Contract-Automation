name: Original Phase0 Self-Hosted Browser v6

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Request JSON path
        required: true
        default: process/browser-agent-self-hosted-v6/requests/current-chat-test-v6.json
        type: string
  push:
    branches: [main]
    paths:
      - 'process/browser-agent-self-hosted-v6/requests/*.json'

permissions:
  contents: read

concurrency:
  group: original-phase0-self-hosted-browser-v6
  cancel-in-progress: false

jobs:
  browser:
    runs-on: [self-hosted, curveyield-browser]
    timeout-minutes: 30
    steps:
      - name: Checkout trusted browser package
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve request
        id: request
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $request = $env:DISPATCH_REQUEST_PATH
          } else {
            $files = git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA
            $request = $files | Where-Object { $_ -match '^process/browser-agent-self-hosted-v6/requests/.*\.json$' } | Select-Object -Last 1
          }
          if (-not $request) { throw 'No self-hosted browser request found.' }
          if (-not (Test-Path $request)) { throw "Request does not exist: $request" }
          "request_path=$request" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install isolated Playwright runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'packages/browser-agent-original-phase0-v6/runtime-v6'
          npm install --prefix $runtime --package-lock=false --ignore-scripts --no-audit --no-fund
          "BROWSER_AGENT_RUNTIME_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify local Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Google Chrome is not installed for the interactive self-hosted runner user.' }
          Write-Host "Chrome found: $chrome"

      - name: Run visible self-hosted browser
        shell: pwsh
        env:
          SELF_HOSTED_BROWSER_REQUEST: ${{ steps.request.outputs.request_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          node packages/browser-agent-original-phase0-v6/self-hosted-browser-v6.mjs

name: Browser Agent Chat Watchdog Cancel v3

on:
  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-chat-watchdog/cancel/*.json'

permissions:
  actions: write
  contents: read

jobs:
  cancel_watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve and cancel requested watchdog run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          request_path="$(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^process/browser-agent-chat-watchdog/cancel/[^/]+\.json$' |
            tail -n 1
          )"

          if [ -z "$request_path" ] || [ ! -f "$request_path" ]; then
            echo "::error::No watchdog cancel request JSON found in triggering commit."
            exit 2
          fi

          run_id="$(jq -r '.run_id // empty' "$request_path")"
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be a numeric GitHub Actions run id."
            exit 2
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          workflow_path="$(jq -r '.path // empty' <<<"$run_json")"
          status="$(jq -r '.status // empty' <<<"$run_json")"

          if [ "$workflow_path" != ".github/workflows/browser-agent-chat-watchdog-v6.yml" ]; then
            echo "::error::Refusing to cancel run $run_id because it is not Browser Agent Chat Watchdog v6."
            exit 3
          fi

          if [ "$status" = "completed" ]; then
            echo "Run $run_id is already completed; nothing to cancel."
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true

          for _ in 1 2 3 4 5; do
            sleep 3
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            [ "$status" = "completed" ] && break
          done

          if [ "$status" != "completed" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
          fi

          echo "Cancellation requested for Browser Agent Chat Watchdog v6 run $run_id." >> "$GITHUB_STEP_SUMMARY"

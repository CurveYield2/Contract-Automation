name: CurveYield DEX Master Targeted Tests v3

on:
  push:
    branches: [main]
    paths:
      - 'packages/github-native-sim/audit-harnesses/curveyield-dex-v16-r4-master-targeted-v1/requests/*.json'
  workflow_dispatch:
    # Re-run the existing frozen request without rewriting it or mutating sealed audit inputs.

permissions:
  contents: read

concurrency:
  group: curveyield-dex-v16-r4-master-targeted
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CAMPAIGN_ID: curveyield-dex-v16-source-r4
      REQUEST_ID: f6d461543d977824d0b14a5265278890f537b81dac853e6cdfd96884570962a1
      SOURCE_COMMIT: 68490f0ec79ff761ed9361af8afe180fd44f612d
      SOURCE_SHA256: 201a70f61f14e1919d111a972d090b07cf13e5fc06fee10738785adfb6760f4e
      SOURCE_ROOT: .audit-source/campaigns/CurveYield DEX v16 Source r4/source/CurveYield DEX v16 Source
      EVIDENCE_REL: campaigns/CurveYield DEX v16 Source r4/evidence/master-targeted-tests/f6d461543d977824d0b14a5265278890f537b81dac853e6cdfd96884570962a1

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Resolve exact request and frozen source
        id: source
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p targeted-output
          request_file="$(find packages/github-native-sim/audit-harnesses/curveyield-dex-v16-r4-master-targeted-v1/requests -maxdepth 1 -type f -name '*.json' -print | sort | tail -n1)"
          test -s "$request_file"
          jq -e --arg id "$REQUEST_ID" --arg campaign "$CAMPAIGN_ID" '
            .schemaVersion=="curveyield-master-targeted-execution-request-v1" and
            .requestId==$id and .campaignId==$campaign
          ' "$request_file" >/dev/null

          gh auth setup-git
          rm -rf .audit-source
          timeout -k 10s 240s gh repo clone CurveYield2/Audit-Controller .audit-source -- --filter=blob:none --no-checkout
          (
            cd .audit-source
            timeout -k 10s 180s git fetch --depth=1 origin "$SOURCE_COMMIT"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          )
          archive=".audit-source/campaigns/CurveYield DEX v16 Source r4/source/CurveYield DEX v16 Source.zip"
          test -s "$archive"
          observed="$(sha256sum "$archive" | awk '{print $1}')"
          test "$observed" = "$SOURCE_SHA256"
          test -d "$SOURCE_ROOT"

          cp packages/github-native-sim/audit-harnesses/curveyield-dex-v16-r4-master-targeted-v1/run-v1.mjs             "$SOURCE_ROOT/tooling/scripts/masterTargetedDexV16_v1.mjs"

          {
            echo "schemaVersion=curveyield-master-targeted-source-binding-v1"
            echo "campaignId=$CAMPAIGN_ID"
            echo "requestId=$REQUEST_ID"
            echo "sourceCommit=$SOURCE_COMMIT"
            echo "sourceArchiveSha256=$SOURCE_SHA256"
            echo "contractAutomationCommit=$GITHUB_SHA"
            echo "workflowRunId=$GITHUB_RUN_ID"
            echo "workflowUrl=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > targeted-output/SOURCE_BINDING_v1.txt

      - name: Install exact source dependencies
        id: install
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set +e
          python3 "$GITHUB_WORKSPACE/scripts/audit-command-guard-v1.py" --label npm-install --wall 900 --idle 360 --log "$GITHUB_WORKSPACE/targeted-output/NPM_INSTALL_v1.log" -- npm ci --force
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record toolchain
        if: steps.source.outcome == 'success'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          {
            echo "node=$(node --version 2>&1)"
            echo "npm=$(npm --version 2>&1)"
            echo "forge=$(forge --version 2>&1 | head -1)"
            echo "anvil=$(anvil --version 2>&1 | head -1)"
            echo "cast=$(cast --version 2>&1 | head -1)"
            if [ -f package-lock.json ]; then echo "packageLockSha256=$(sha256sum package-lock.json | awk '{print $1}')"; fi
            if [ -f package.json ]; then echo "packageSha256=$(sha256sum package.json | awk '{print $1}')"; fi
          } > "$GITHUB_WORKSPACE/targeted-output/TOOLCHAIN_v1.txt"

      - name: Run exact-source runtime controls
        id: controls
        if: steps.install.outputs.code == '0'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set +e
          ANVIL_PATH="$(command -v anvil)" python3 "$GITHUB_WORKSPACE/scripts/audit-command-guard-v1.py" --label runtime-controls --wall 1080 --idle 600 --log "$GITHUB_WORKSPACE/targeted-output/RUNTIME_CONTROLS_v1.log" -- ./node_modules/.bin/vitest run               tooling/test/curveYieldDexSettlementRuntime.test.mjs               tooling/test/curveYieldDexPermanentLiquidityRuntime.test.mjs               tooling/test/curveYieldCreatorConfigEpochRuntime.test.mjs               --reporter=verbose --no-file-parallelism
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preflight Katana fork upstream
        id: katana-rpc
        if: steps.install.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 --retry 2 --retry-delay 2 --retry-all-errors -H 'content-type: application/json' --data "$payload" https://katana.drpc.org/)"
          expected="$(printf '0x%x' 747474)"
          printf '%s' "$response" | jq -e --arg expected "$expected" '.result == $expected' >/dev/null || {
            echo "::error::Katana RPC unavailable or wrong chain; refusing long fork execution"
            exit 1
          }

      - name: Run source-native Katana fork deployment and handoff
        id: katana
        if: steps.install.outputs.code == '0' && steps.katana-rpc.outcome == 'success'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set +e
          FORK_RPC_URL="https://katana.drpc.org/" ANVIL_PATH="$(command -v anvil)" python3 "$GITHUB_WORKSPACE/scripts/audit-command-guard-v1.py" --label katana-deployment --wall 2280 --idle 720 --log "$GITHUB_WORKSPACE/targeted-output/KATANA_SOURCE_NATIVE_v1.log" -- node tooling/scripts/simulateCurveYieldDexKatanaFork.mjs
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"

          report_path="$(grep -oE 'Report: .+\.json' "$GITHUB_WORKSPACE/targeted-output/KATANA_SOURCE_NATIVE_v1.log" | tail -n1 | sed 's/^Report: //' || true)"
          if [ -n "$report_path" ] && [ -f "$report_path" ]; then
            state_path="${report_path%.json}.fork-state.hex"
            cp "$report_path" "$GITHUB_WORKSPACE/targeted-output/KATANA_DEPLOYMENT_REPORT_v1.json"
            if [ -f "$state_path" ]; then
              echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
              echo "state_path=$state_path" >> "$GITHUB_OUTPUT"
              echo "state_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "state_ready=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "state_ready=false" >> "$GITHUB_OUTPUT"
          fi
          summary="$(find deployment-artifacts -maxdepth 1 -type f -name 'katana-fork-simulation-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -n1 | cut -d' ' -f2- || true)"
          if [ -n "$summary" ] && [ -f "$summary" ]; then
            cp "$summary" "$GITHUB_WORKSPACE/targeted-output/KATANA_SIMULATION_SUMMARY_v1.json"
          fi
          exit 0

      - name: Run decisive real-integration targeted sequences
        id: integration
        if: steps.katana.outputs.state_ready == 'true' && steps.katana.outputs.code == '0'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set +e
          ANVIL_PATH="$(command -v anvil)" python3 "$GITHUB_WORKSPACE/scripts/audit-command-guard-v1.py" --label targeted-integration --wall 1440 --idle 480 --log "$GITHUB_WORKSPACE/targeted-output/TARGETED_INTEGRATION_v1.log" -- node tooling/scripts/masterTargetedDexV16_v1.mjs               --report "${{ steps.katana.outputs.report_path }}"               --state "${{ steps.katana.outputs.state_path }}"               --fork-url "https://katana.drpc.org/"               --output "$GITHUB_WORKSPACE/targeted-output/TARGETED_INTEGRATION_RESULT_v1.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Attempt Base production-profile deployment
        id: base
        if: steps.install.outputs.code == '0'
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set +e
          BASE_RPC=http://127.0.0.1:8656
          anvil --fork-url https://mainnet.base.org --port 8656 --retries 20 --fork-retry-backoff 1500 --silent             > "$GITHUB_WORKSPACE/targeted-output/BASE_ANVIL_v1.log" 2>&1 &
          anvil_pid=$!
          ready=0
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$BASE_RPC" >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "Base Anvil fork did not become ready" | tee "$GITHUB_WORKSPACE/targeted-output/BASE_DEPLOYMENT_v1.log"
            kill "$anvil_pid" 2>/dev/null || true
            echo "code=124" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wallet_json="$(cast wallet new --json 2>/dev/null)"
          deployer_key="$(printf '%s' "$wallet_json" | jq -r 'if type=="array" then .[0].private_key else .private_key end')"
          deployer_addr="$(printf '%s' "$wallet_json" | jq -r 'if type=="array" then .[0].address else .address end')"
          if [ -z "$deployer_key" ] || [ "$deployer_key" = null ] || [ -z "$deployer_addr" ] || [ "$deployer_addr" = null ]; then
            echo "Could not create temporary Base-fork signer" | tee "$GITHUB_WORKSPACE/targeted-output/BASE_DEPLOYMENT_v1.log"
            kill "$anvil_pid" 2>/dev/null || true
            echo "code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cast rpc anvil_setBalance "$deployer_addr" 0x21e19e0c9bab2400000 --rpc-url "$BASE_RPC" >/dev/null

          RPC_URL="$BASE_RPC"           DEPLOYER_PRIVATE_KEY="$deployer_key"           MAX_FEE_PER_GAS_WEI=1000000000000           MAX_PRIORITY_FEE_PER_GAS_WEI=1000000           timeout 28m node tooling/scripts/deployCurveYieldDexFresh.mjs --network base             2>&1 | tee "$GITHUB_WORKSPACE/targeted-output/BASE_DEPLOYMENT_v1.log"
          code=${PIPESTATUS[0]}
          report_path="$(grep -oE 'Report: .+\.json' "$GITHUB_WORKSPACE/targeted-output/BASE_DEPLOYMENT_v1.log" | tail -n1 | sed 's/^Report: //' || true)"
          if [ -n "$report_path" ] && [ -f "$report_path" ]; then
            cp "$report_path" "$GITHUB_WORKSPACE/targeted-output/BASE_DEPLOYMENT_REPORT_v1.json"
          fi
          {
            echo '{'
            echo '  "schemaVersion": "curveyield-base-governance-followup-limitation-v1",'
            echo '  "profile": "base",'
            echo '  "dao": "0x7142b1Cc5F91A736A62e77581F406338328F05bC",'
            echo '  "sourceNetworkConfigIncludesAdminPlugin": false,'
            echo '  "sourceBehavior": "existing external DAO must perform claimRoot and eleven acceptOwnership calls",'
            echo '  "testLimitation": "Frozen Base profile supplies the DAO address but no Admin-plugin address or authorized executor binding, so the source-defined deployment can prove pending handoff state but cannot itself execute the required real DAO/Admin-plugin acceptance transaction."'
            echo '}'
          } > "$GITHUB_WORKSPACE/targeted-output/BASE_GOVERNANCE_LIMITATION_v1.json"
          kill "$anvil_pid" 2>/dev/null || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build execution metadata
        if: always()
        shell: bash
        run: |
          jq -n             --arg schemaVersion "curveyield-master-targeted-execution-metadata-v1"             --arg campaignId "$CAMPAIGN_ID"             --arg requestId "$REQUEST_ID"             --arg workflowRunId "$GITHUB_RUN_ID"             --arg workflowUrl "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             --arg contractAutomationCommit "$GITHUB_SHA"             --arg sourceCommit "$SOURCE_COMMIT"             --arg sourceSha256 "$SOURCE_SHA256"             --arg installExit "${{ steps.install.outputs.code || 'not-run' }}"             --arg controlsExit "${{ steps.controls.outputs.code || 'not-run' }}"             --arg katanaExit "${{ steps.katana.outputs.code || 'not-run' }}"             --arg integrationExit "${{ steps.integration.outputs.code || 'not-run' }}"             --arg baseExit "${{ steps.base.outputs.code || 'not-run' }}"             '{
              schemaVersion:$schemaVersion,
              campaignId:$campaignId,
              requestId:$requestId,
              workflowRunId:($workflowRunId|tonumber),
              workflowUrl:$workflowUrl,
              contractAutomationCommit:$contractAutomationCommit,
              sourceCommit:$sourceCommit,
              sourceSha256:$sourceSha256,
              exitCodes:{install:$installExit,runtimeControls:$controlsExit,katanaSourceNative:$katanaExit,targetedIntegration:$integrationExit,baseDeployment:$baseExit}
            }' > targeted-output/EXECUTION_METADATA_v1.json

      - name: Persist raw campaign evidence with SHA-256 manifest
        id: persist
        if: always()
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-writeback
          gh auth setup-git
          gh repo clone CurveYield2/Audit-Controller .audit-writeback -- --filter=blob:none --no-checkout
          (
            cd .audit-writeback
            timeout -k 10s 180s git fetch origin main
            git checkout -B main origin/main
          )

          dest=".audit-writeback/$EVIDENCE_REL"
          mkdir -p "$dest"
          cp -f targeted-output/* "$dest/" 2>/dev/null || true

          (
            cd "$dest"
            find . -maxdepth 1 -type f ! -name 'EVIDENCE_DIGESTS_v1.json' -printf '%f\n' | sort |
              while read -r file; do
                printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$file"
              done > EVIDENCE_DIGESTS_v1.txt
            jq -Rn '
              [inputs | capture("^(?<sha256>[0-9a-f]{64})  (?<file>.+)$")] |
              {schemaVersion:"curveyield-master-targeted-evidence-digests-v1",files:.}
            ' < EVIDENCE_DIGESTS_v1.txt > EVIDENCE_DIGESTS_v1.json
          )

          (
            cd .audit-writeback
            git add -- "$EVIDENCE_REL"
            if git diff --cached --quiet; then
              echo "No new evidence to commit"
              exit 0
            fi
            git config user.name "CurveYield Master Targeted Test Runner"
            git config user.email "master-targeted-tests@users.noreply.github.com"
            git commit -m "audit(evidence): persist CurveYield DEX targeted tests v1"
            for attempt in 1 2 3 4 5; do
              timeout -k 10s 120s git pull --rebase origin main
              if timeout -k 10s 120s git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          )

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CurveYield DEX master targeted tests v1"
            echo "- campaign: $CAMPAIGN_ID"
            echo "- request: $REQUEST_ID"
            echo "- source commit: $SOURCE_COMMIT"
            echo "- source archive SHA-256: $SOURCE_SHA256"
            echo "- runtime controls exit: ${{ steps.controls.outputs.code || 'not-run' }}"
            echo "- Katana native exit: ${{ steps.katana.outputs.code || 'not-run' }}"
            echo "- targeted integration exit: ${{ steps.integration.outputs.code || 'not-run' }}"
            echo "- Base deployment exit: ${{ steps.base.outputs.code || 'not-run' }}"
            echo "- raw evidence persisted under: $EVIDENCE_REL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Test steps collect evidence on failure; enforce result only after writeback.
      - name: Enforce mandatory execution stages and qualified evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          check() {
            local stage="$1" code="$2"
            if [ "$code" != "0" ]; then
              echo "::error::${stage} failed: ${code}; 124=wall timeout, 125=inactivity timeout, not-run=missing"
              failed=1
            fi
          }
          check install "${{ steps.install.outputs.code || 'not-run' }}"
          check controls "${{ steps.controls.outputs.code || 'not-run' }}"
          check katana "${{ steps.katana.outputs.code || 'not-run' }}"
          check integration "${{ steps.integration.outputs.code || 'not-run' }}"
          check base "${{ steps.base.outputs.code || 'not-run' }}"
          if [ "${{ steps.persist.outcome }}" != "success" ]; then
            echo "::error::Durable audit evidence writeback did not succeed"
            failed=1
          fi
          result=targeted-output/TARGETED_INTEGRATION_RESULT_v1.json
          if [ ! -s "$result" ]; then
            echo "::error::Targeted integration result missing"
            failed=1
          elif ! jq -e '
            .fatalError == null and
            (.summary.assertions // 0) > 0 and
            (.summary.failedAssertions // -1) == 0 and
            (.candidates | type == "object" and (to_entries | all(.[]; (.value.executedCalls // 0) > 0)))
          ' "$result" >/dev/null; then
            echo "::error::Incomplete candidate execution or failed/missing targeted assertions"
            failed=1
          fi
          if [ "$failed" != "0" ]; then
            echo "::error::Audit tests NOT qualified; do not interpret this run as a PASS"
            exit 1
          fi
          echo "::notice::All mandatory stages and persisted targeted evidence passed"

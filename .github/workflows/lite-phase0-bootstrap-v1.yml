name: Lite Fully Automated Phase 0 v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact campaign ID created by Audit Source Initialization
        required: true
        type: string
      campaign_path:
        description: Exact Audit-Controller campaign workspace path
        required: true
        type: string
      audit_controller_ref:
        description: Audit-Controller ref containing the campaign
        required: false
        default: main
        type: string

      completed_stages_manifest:
        description: Campaign-relative manifest of source-bound completed Medusa and telemetry evidence; empty executes fresh stages
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lite-phase0-bootstrap-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  qualification:
    if: inputs.completed_stages_manifest == ''
    uses: ./.github/workflows/v7-execution-infrastructure-qualification.yml
    with:
      controller_ref: ${{ inputs.audit_controller_ref }}
      qualification_lane: FULL
    secrets: inherit

  resume-qualification:
    if: inputs.completed_stages_manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash automation/scripts/select-audit-controller-token.sh
      - name: Verify qualified runner code and controller admission before resuming
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json?ref=main" --jq '.content' | base64 -d > /tmp/v7-qualification.json
          test "$(jq -r '.status' /tmp/v7-qualification.json)" = PASS
          qualified="$(jq -r '.qualifiedCommit' /tmp/v7-qualification.json)"
          run_id="$(jq -r '.workflowRunId' /tmp/v7-qualification.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/qualified-run.json
          jq -e --arg sha "$qualified" '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .path==".github/workflows/v7-execution-infrastructure-qualification.yml"' /tmp/qualified-run.json >/dev/null
          git fetch --no-tags --depth=1 origin "$qualified"
          git diff --name-only "$qualified" "$GITHUB_SHA" > /tmp/resume-runner-delta.txt
          python3 - <<'PY'
          import re
          allowed=[r'automation/control-plane/V7_QUALIFICATION_(STATUS|LAST_RUN)\.json',r'automation/control-plane/agent-upload/lite-phase0-bootstrap-recovery/[^/]+\.json',r'automation/runtime/github-native-sim/audit-harnesses/phase0-simulation-testing-v1/HANDOFF_v[0-9]+\.md',r'PHASE0_MEDUSA_PROGRESS_UPDATE_v[0-9]+\.md']
          changed=open('/tmp/resume-runner-delta.txt').read().splitlines()
          blocked=[p for p in changed if not any(re.fullmatch(x,p) for x in allowed)]
          if blocked: raise SystemExit('Unqualified executable delta: '+repr(blocked))
          PY
          GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/CurveYield2/Audit-Controller/contents/packages/contract-automation-adapter/src/admitted-execution-contract-v1.mjs?ref=$AUDIT_CONTROLLER_REF" --jq '.content' | base64 -d > /tmp/admitted-execution-contract-v1.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('/tmp/v7-qualification.json','utf8'));
          const {ADMITTED_V7_EXECUTION_CONTRACT_V1:c}=await import('file:///tmp/admitted-execution-contract-v1.mjs');
          const p=c.v26QualificationPolicy;
          if(p.qualifiedCommit!==q.qualifiedCommit||String(p.canonicalQualificationRunId)!==String(q.workflowRunId)||q.phase6?.status!=='PASS'||q.phase7?.status!=='PASS'||!p.requiredCapabilities.every(x=>q.capabilities.includes(x))||!p.requiredRecipes.every(x=>q.recipes.includes(x)))throw new Error('Runner requires controller rebind');
          NODE

  intelligence:
    if: inputs.completed_stages_manifest == ''
    needs: qualification
    uses: ./.github/workflows/lite-phase0-intelligence-v1.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      campaign_path: ${{ inputs.campaign_path }}
      audit_controller_ref: ${{ inputs.audit_controller_ref }}
    secrets: inherit

  randomized-simulation:
    needs: [qualification, intelligence, resume-qualification]
    if: ${{ always() && ((inputs.completed_stages_manifest == '' && needs.qualification.result == 'success' && needs.intelligence.result == 'success') || (inputs.completed_stages_manifest != '' && needs.resume-qualification.result == 'success')) }}
    uses: ./.github/workflows/lite-phase0-randomized-simulation-v1.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      campaign_path: ${{ inputs.campaign_path }}
      audit_controller_ref: ${{ inputs.audit_controller_ref }}
      completed_stages_manifest: ${{ inputs.completed_stages_manifest }}
    secrets: inherit

  finalize-and-launch-reviewer1:
    needs: randomized-simulation
    if: ${{ always() && needs.randomized-simulation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash automation/scripts/select-audit-controller-token.sh

      - name: Fetch exact canonical qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json?ref=main" --jq '.content' | base64 -d > /tmp/v7-qualification.json
          test "$(jq -r '.status' /tmp/v7-qualification.json)" = PASS
          if [ -z "${{ inputs.completed_stages_manifest }}" ]; then
            test "$(jq -r '.qualifiedCommit' /tmp/v7-qualification.json)" = "$GITHUB_SHA"
          fi

      - name: Checkout exact Audit-Controller campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "$AUDIT_CONTROLLER_REF"
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"

      - name: Finalize machine Phase 0 receipt
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          node automation/scripts/lite-phase0-finalize-v1.mjs             --controller-root .audit-controller             --campaign-path "$CAMPAIGN_PATH"             --qualification-path /tmp/v7-qualification.json             --contract-automation-sha "$(jq -r '.qualifiedCommit' /tmp/v7-qualification.json)" --bootstrap-sha "$GITHUB_SHA"             --workflow-run-id "$GITHUB_RUN_ID" | tee /tmp/phase0-finalize.json
          test "$(jq -r '.status' /tmp/phase0-finalize.json)" = PASS
          echo "campaign_name=$(jq -r '.campaignName' /tmp/phase0-finalize.json)" >> "$GITHUB_OUTPUT"

      - name: Publish sealed Phase 0 receipt
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Phase0 Automation'
          git config user.email 'phase0-automation@users.noreply.github.com'
          git add -- "$CAMPAIGN_PATH" "Audit Campaign Directory/campaigns"
          if git diff --cached --quiet; then
            echo "::error::Phase 0 finalizer produced no durable changes"
            exit 1
          fi
          git commit -m "audit(phase0): seal automated bootstrap $CAMPAIGN_ID"
          git push origin "HEAD:$AUDIT_CONTROLLER_REF"

      - name: Activate first audit agent through existing orchestrator/watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main             -f campaign_id="$CAMPAIGN_ID"             -f campaign_name="${{ steps.finalize.outputs.campaign_name }}"             -f campaign_path="$CAMPAIGN_PATH"             -f audit_controller_ref="$AUDIT_CONTROLLER_REF"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Fully automated Lite Phase 0"
            echo
            echo "- Campaign: $CAMPAIGN_ID"
            echo "- Source input surface: one ZIP URL through Audit Source Initialization"
            echo "- Phase 0 agent: none"
            echo "- Phase-0 receipt: sealed and validated"
            echo "- Separate completion/validation/handoff receipt files: not created"
            echo "- First audit agent: reviewer-1 activation dispatched through the existing orchestrator/watchdog system"
          } >> "$GITHUB_STEP_SUMMARY"

name: Organize Audit Skill Current Authority v1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create work branch and organize authority package
        shell: bash
        run: |
          set -euo pipefail

          git switch -c organize-audit-skill-authority-v2

          mapfile -t zips < <(find . -maxdepth 1 -type f -name 'Audit_V7*.zip' -printf '%P\n')
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one root Audit_V7*.zip, found ${#zips[@]}: ${zips[*]-}"
            exit 1
          fi

          zip_name="${zips[0]}"
          target_dir='Audit Skill - Current Authority'
          mkdir -p "$target_dir"

          rm -f ./CurveYield_Audit_Automation_Upgrade_Handoff_v*.md
          mv "./$zip_name" "$target_dir/$zip_name"

          (
            cd "$target_dir"
            unzip -o "$zip_name"
          )

          rm -f .github/workflows/organize-audit-skill-authority-v1.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi

          git commit -m "chore: organize current audit skill authority"
          git push --set-upstream origin organize-audit-skill-authority-v2

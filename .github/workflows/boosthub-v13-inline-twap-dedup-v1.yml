name: BoostHub v13 Inline TWAP Dedup Qualification v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-dedup-v1.yml'
      - 'github-native-sim/boosthub-v13-inline-oracle-v1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Build three inline variants with compiler and runtime proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .boosthub-inline/base
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .boosthub-inline/base
          cd .boosthub-inline
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 -q https://github.com/foundry-rs/forge-std.git lib/forge-std
          for variant in baseline oracle oracle-base; do
            mkdir -p "$variant"
            cp -a base/beefy "$variant/"
            python3 "$GITHUB_WORKSPACE/github-native-sim/boosthub-v13-inline-oracle-v1/inline_refactor_v1.py" "$variant/beefy/contracts/converter" "$variant"
            cat > "$variant/foundry.toml" <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          test = "beefy/tests"
          out = "out"
          libs = ["../lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 20
          via_ir = true
          evm_version = "cancun"
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/","forge-std/=../lib/forge-std/src/"]
          EOF
            echo "=== TEST VARIANT $variant ==="
            cd "$variant"
            if forge build --skip test --silent 2>&1; then
              python3 - "$variant" <<'PY'
          import json,sys
          from pathlib import Path
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              j=json.loads(next(Path('out').rglob(name+'.json')).read_text())
              code=j['deployedBytecode']['object']
              n=(len(code)-2)//2
              print(f'INLINE_SIZE variant={sys.argv[1]} name={name} bytes={n} EIP170_headroom={24576-n}',flush=True)
          PY
              if [ "$variant" = "oracle-base" ]; then
                echo "Running oracle-base fork-simulation integration tests"
                ETHEREUM_RPC="${{ secrets.RPC_ETHEREUM }}" FRAXTAL_RPC="${{ secrets.RPC_FRAXTAL }}" forge test --match-path 'beefy/tests/BoostHubMultiOracleRoutes_v1.t.sol' -vv 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-inline-fork-tests-v1.log"
              fi
            else
              echo "VARIANT_FAILED variant=$variant"; exit 1
            fi
            cd ..
          done
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-eval-v1-${{ github.run_id }}
          path: boosthub-inline-fork-tests-v1.log
          if-no-files-found: warn
          retention-days: 7

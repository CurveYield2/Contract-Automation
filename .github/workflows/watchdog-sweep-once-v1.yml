name: One Shot Watchdog Sweep v1

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/watchdog-sweep-once/*.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Dispatch exact watchdog sweep
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'process/agent-upload/watchdog-sweep-once/*.json')
          [ "${#changed[@]}" -eq 1 ] || { echo "::error::Expected exactly one watchdog sweep request"; exit 1; }
          request="${changed[0]}"
          wake_id="$(jq -r '.wake_id // empty' "$request")"
          [ -n "$wake_id" ] || { echo "::error::wake_id is required"; exit 1; }
          gh workflow run browser-agent-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_id="$wake_id"

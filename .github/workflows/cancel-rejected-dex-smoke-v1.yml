name: Cancel Rejected DEX Smoke v1
on:
  push:
    paths:
      - '.github/workflows/cancel-rejected-dex-smoke-v1.yml'
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the DEX telemetry run rejected by user
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=38147364712
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target" --jq '.status')"
          if [ "$state" != completed ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$target/cancel"
            echo "Requested cancellation of rejected DEX run $target"
          else
            echo "Rejected DEX run $target already finished"
          fi

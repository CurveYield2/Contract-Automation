name: Original Phase0 Known-Good Resume v5

on:
  push:
    paths:
      - 'process/browser-agent-original-phase0-v1/known-good-requests/*-v*.json'

permissions:
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: "false"
      WAKE_ACTION: wake
      WAKE_RESULT_PATH: /tmp/original-phase0-known-good-v5-result.json
    steps:
      - name: Checkout request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up exact known-good browser runtime v5
        uses: ./packages/browser-agent-original-phase0-v5/setup-runtime-v5

      - name: Run exact known-good browser code in resume mode
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^process/browser-agent-original-phase0-v1/known-good-requests/.*-v[0-9]+[.]json$' | tail -n1)"
          test -n "$request"

          export WAKE_MODE='resume_existing'
          export WAKE_ID="$(jq -r '.wake_id' "$request")"
          export CHAT_URL="$(jq -r '.chat_url' "$request")"
          export WAKE_MESSAGE="$(jq -r '.wake_message' "$request")"

          test -n "$WAKE_ID"
          case "$CHAT_URL" in
            https://chatgpt.com/c/*) ;;
            *) echo "::error::Invalid ChatGPT conversation URL"; exit 1 ;;
          esac
          test -n "$WAKE_MESSAGE"

          command -v xvfb-run
          xvfb-run -a node packages/browser-agent-original-phase0-v5/browser-agent-wake-v5.mjs

      - name: Show result
        if: always()
        shell: bash
        run: |
          if [ -f "$WAKE_RESULT_PATH" ]; then
            cat "$WAKE_RESULT_PATH"
          fi

name: BoostHub v13 Multi-Oracle Converter Tests v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-v13-multioracle-v1.yml'
      - 'github-native-sim/boosthub-multi-oracle-v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Unpack and compile both converter implementations and their oracle tests
        run: |
          set -euo pipefail
          mkdir -p .boosthub-multioracle
          sha256sum github-native-sim/boosthub-multi-oracle-v1/BoostHub_multi_oracle_sources_v1.tar.xz
          echo '7096577d09e0cbfbb557a7963b8b7577071495bd90c19ac91947e39ee8de8bec  github-native-sim/boosthub-multi-oracle-v1/BoostHub_multi_oracle_sources_v1.tar.xz' | sha256sum -c
          tar -xJf github-native-sim/boosthub-multi-oracle-v1/BoostHub_multi_oracle_sources_v1.tar.xz -C .boosthub-multioracle
          cd .boosthub-multioracle
          mkdir -p lib
          git clone -q --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone -q --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          cat > foundry.toml <<'EOT'
          [profile.default]
          src = "beefy/contracts/converter"
          test = "beefy/tests"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 200
          remappings = [
            "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
            "forge-std/=lib/forge-std/src/"
          ]
          EOT
          forge build --skip test -vv 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v13-oracle-compile-v1.log"
      - name: Run live-fork Ethereum and Fraxtal EMA V2/V3 TWAP tests
        working-directory: .boosthub-multioracle
        env:
          ETHEREUM_RPC: ${{ secrets.RPC_ETHEREUM }}
          FRA_SECRET: ${{ secrets.RPC_FRAXTAL }}
        shell: bash
        run: |
          set -eo pipefail
          test -n "$ETHEREUM_RPC"
          export FRAXTAL_RPC="${FRA_SECRET:-https://rpc.frax.com}"
          forge test -vv --match-path 'beefy/tests/BoostHubMultiOracleRoutes_v1.t.sol' 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v13-oracle-fork-tests-v1.log"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v13-multioracle-v1-${{ github.run_id }}
          path: |
            boosthub-v13-oracle-compile-v1.log
            boosthub-v13-oracle-fork-tests-v1.log
          if-no-files-found: warn
          retention-days: 14

name: Browser Agent Chat Watchdog v25

on:
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-chat-watchdog/requests/*.json'

permissions:
  contents: write

env:
  CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
  CHATGPT_SESSION_STATE_KEY_B64: ${{ secrets.CHATGPT_SESSION_STATE_KEY_B64 }}
  BROWSER_HEADLESS: 'false'
  BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
  BROWSERLESS_PROFILE: ${{ vars.BROWSERLESS_PROFILE || 'chatgpt' }}
  BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
  BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
  BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - name: Resolve active chat watchdogs
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            request_path="$(
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^process/browser-agent-chat-watchdog/requests/[^/]+\.json$' |
              tail -n 1
            )"
            [ -n "$request_path" ] && [ -f "$request_path" ] || {
              echo "::error::No watchdog request JSON found."
              exit 2
            }

            chat_url="$(jq -r '.chat_url // empty' "$request_path")"
            [[ "$chat_url" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ ]] || {
              echo "::error::Invalid chat_url."
              exit 2
            }

            safe_id="$(basename "$request_path" .json | tr -c 'A-Za-z0-9._-' '_')"
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active/$safe_id.json"
            existing_sha="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
            existing_chat=''

            if [ -n "$existing_sha" ]; then
              existing_chat="$(
                gh api "$api?ref=main" --jq '.content' |
                base64 -d |
                jq -r '.chatUrl // empty'
              )"
            fi

            if [ -z "$existing_sha" ] || [ "$existing_chat" != "$chat_url" ]; then
              deadline_epoch="$(( $(date -u +%s) + 43200 ))"
              jq -n                 --arg id "$safe_id"                 --arg chat "$chat_url"                 --argjson deadline "$deadline_epoch"                 '{
                  schemaVersion:"curveyield-browser-agent-chat-watchdog-state-v25",
                  id:$id,
                  status:"ACTIVE",
                  chatUrl:$chat,
                  deadlineEpoch:$deadline,
                  pokeCount:0
                }' > /tmp/state.json

              content="$(base64 -w0 /tmp/state.json)"
              if [ -n "$existing_sha" ]; then
                gh api --method PUT "$api"                   -f message="chore(chat-watchdog): retarget $safe_id"                   -f content="$content" -f sha="$existing_sha" -f branch=main >/dev/null
              else
                gh api --method PUT "$api"                   -f message="chore(chat-watchdog): arm $safe_id"                   -f content="$content" -f branch=main >/dev/null
              fi
            fi

            jq -cn --arg id "$safe_id" '[$id]' > /tmp/targets.json
          else
            api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active?ref=main"
            if gh api "$api" --jq '.[]? | select(.type=="file" and (.name|endswith(".json"))) | .name' > /tmp/files.txt 2>/dev/null; then
              sed -n 's/\.json$//p' /tmp/files.txt | LC_ALL=C sort -u |
                jq -R -s 'split("\n") | map(select(length>0))' > /tmp/targets.json
            else
              printf '[]\n' > /tmp/targets.json
            fi
          fi

          count="$(jq 'length' /tmp/targets.json)"
          if [ "$count" -eq 0 ]; then
            echo 'targets=["__NONE__"]' >> "$GITHUB_OUTPUT"
            echo 'has_targets=false' >> "$GITHUB_OUTPUT"
          else
            echo "targets=$(jq -c . /tmp/targets.json)" >> "$GITHUB_OUTPUT"
            echo 'has_targets=true' >> "$GITHUB_OUTPUT"
          fi

  supervise:
    needs: discover
    if: needs.discover.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: browser-agent-chat-watchdog-v25-${{ matrix.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Check supplied existing chat and wake if idle
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail

          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-chat-watchdog/active/$WATCHDOG_ID.json"
          encoded="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"
          [ -n "$encoded" ] || exit 0
          printf '%s' "$encoded" | base64 -d > /tmp/state.json

          chat_url="$(jq -r '.chatUrl' /tmp/state.json)"
          deadline_epoch="$(jq -r '.deadlineEpoch' /tmp/state.json)"
          now_epoch="$(date -u +%s)"

          if [ "$now_epoch" -ge "$deadline_epoch" ]; then
            sha="$(gh api "$api?ref=main" --jq '.sha')"
            gh api --method DELETE "$api"               -f message="chore(chat-watchdog): expire $WATCHDOG_ID"               -f sha="$sha" -f branch=main >/dev/null
            echo "Watchdog $WATCHDOG_ID expired after 12 hours."
            exit 0
          fi

          export WAKE_MODE='resume_existing'
          export CHAT_URL="$chat_url"
          export WAKE_ID="$WATCHDOG_ID"
          export WAKE_ACTION='wake'
          export WAKE_MESSAGE='GET BACK TO WORK'
          export WAKE_RESULT_PATH='/tmp/wake.json'

          if xvfb-run -a node scripts/browser-agent-wake.mjs; then
            skipped="$(jq -r '.skipped // empty' /tmp/wake.json)"
            posted="$(jq -r '.posted // false' /tmp/wake.json)"
            provider="$(jq -r '.provider // empty' /tmp/wake.json)"

            if [ "$skipped" = "PRODUCTIVE_GENERATING" ]; then
              echo "Watchdog $WATCHDOG_ID: agent is actively generating; no message sent."
            elif [ "$posted" = true ]; then
              echo "Watchdog $WATCHDOG_ID: GET BACK TO WORK posted to existing chat via $provider."
              jq '.pokeCount=((.pokeCount // 0)+1)' /tmp/state.json > /tmp/state-next.json
              sha="$(gh api "$api?ref=main" --jq '.sha')"
              content="$(base64 -w0 /tmp/state-next.json)"
              gh api --method PUT "$api"                 -f message="chore(chat-watchdog): poke $WATCHDOG_ID"                 -f content="$content" -f sha="$sha" -f branch=main >/dev/null
            else
              echo "::warning::Wake helper returned without posting or active-generation skip."
            fi
          else
            echo "::warning::Existing-chat wake failed; next scheduled sweep will retry."
            if [ -s /tmp/wake.json ]; then
              jq '{ok,wakeId,failures}' /tmp/wake.json || true
            fi
          fi

name: Archived Campaign Source ABI Telemetry Smoke v2
# Run the production Phase-0 ABI telemetry engine against real bytecode extracted
# from archived campaign ZIPs that predate the Phase-0 v2 receipt/artifact schema.
# These source-fixture smokes never publish/rewrite campaign audit evidence.
on:
  push:
    branches: [main]
    paths:
      - '.github/smoke-trigger/archive-source-abi-telemetry-v2.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archived-campaign-source-abi-telemetry-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  source-abi-telemetry:
    name: ${{ matrix.label }} ABI calls
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BoostHub v11
            archive: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11.zip
            config: hardhat.config.v3.js
          - label: cyvlSDT v30
            archive: campaigns/cyvlSDT v30 Audit v29/source/CurveYield-cyvlSDT-Deployment-Package-v30.zip
            config: hardhat.config.js
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-phase0-node-cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate Audit-Controller source checkout
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh
      - name: Retrieve and verify exact archive
        id: source
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ matrix.archive }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 1 --filter=blob:none --sparse https://github.com/CurveYield2/Audit-Controller.git .audit-controller
          git -C .audit-controller sparse-checkout set --no-cone "$SOURCE_ARCHIVE"
          test -s ".audit-controller/$SOURCE_ARCHIVE"
          mkdir -p .archive-telemetry
          python3 - <<'PY'
          import os,zipfile,hashlib,json,pathlib,stat
          source=pathlib.Path('.audit-controller')/os.environ['SOURCE_ARCHIVE']
          assert zipfile.is_zipfile(source),'Invalid source archive'
          dest=pathlib.Path('.archive-source')
          dest.mkdir()
          total=0
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None,'Corrupt archive'
              for member in archive.infolist():
                  name=pathlib.PurePosixPath(member.filename)
                  assert not name.is_absolute() and '..' not in name.parts,'Archive traversal rejected'
                  assert not stat.S_ISLNK(member.external_attr >> 16),'Archive symlink rejected'
                  total+=member.file_size
                  assert total<250*1024*1024,'Expanded source exceeds cap'
              archive.extractall(dest)
          roots=[p for p in dest.iterdir() if p.is_dir()]
          project=roots[0] if len(roots)==1 else dest
          assert (project/'package.json').is_file(),'Missing package.json'
          assert (project/os.environ['SOURCE_CONFIG']).is_file(),'Missing Hardhat config'
          manifest={'schemaVersion':'archive-source-telemetry-identity-v1',
              'sourceArchive':os.environ['SOURCE_ARCHIVE'],
              'sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
              'bytes':source.stat().st_size,'project':str(project)}
          pathlib.Path('.archive-telemetry/source-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('.archive-telemetry/project-dir').write_text(str(project))
          print(json.dumps(manifest,indent=2))
          PY
          echo "project_dir=$(cat .archive-telemetry/project-dir)" >> "$GITHUB_OUTPUT"
      - name: Install archived project locked dependencies
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if test -f package-lock.json; then
            timeout 300s npm ci --no-audit --no-fund
          else
            timeout 300s npm install --no-audit --no-fund
          fi
      - name: Compile actual archived source bytecode
        id: compile
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
          SOURCE_CONFIG: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          timeout 600s npx --no-install hardhat compile --config "$SOURCE_CONFIG" 2>&1 | tee "$GITHUB_WORKSPACE/.archive-telemetry/compile.log"
          artifacts="$(HARDHAT_CONFIG="$SOURCE_CONFIG" node -e 'process.stdout.write(require("hardhat").config.paths.artifacts)')"
          test -d "$artifacts" || { echo "::error::Hardhat produced no artifact directory"; exit 1; }
          echo "artifact_dir=$artifacts" >> "$GITHUB_OUTPUT"
      - name: Verify private Ethereum fork source
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM secret missing"; exit 1; }
          chain_id="$(curl -fsS --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test "$chain_id" = '0x1' || { echo "::error::Ethereum RPC returned chain ID $chain_id instead of 1"; exit 1; }
          code="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_getCode","params":["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2","0x112a880"]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test -n "$code" && test "$code" != '0x' || { echo "::error::RPC_ETHEREUM lacks historical mainnet contract code"; exit 1; }
      - name: Execute 300 production-engine ABI telemetry calls
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          ARTIFACT_DIR: ${{ steps.compile.outputs.artifact_dir }}
        shell: bash
        run: |
          set -euo pipefail
          timeout -s TERM -k 30s 1050s node scripts/archive-source-abi-telemetry-smoke-v2.mjs \
            --artifact-dir "$ARTIFACT_DIR" \
            --archive-manifest .archive-telemetry/source-manifest.json \
            --output .archive-telemetry/results \
            --calls 300 2>&1 | tee .archive-telemetry/run.log
      - name: Report exact calls, failures and economic transitions
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          summary=.archive-telemetry/results/ARCHIVE_TELEMETRY_SMOKE_v2.json
          if test -s "$summary"; then
            jq '{passed,source:.source.sourceArchive,sourceSha256:.source.sha256,artifacts,deployedContracts:(.deployed|length),targetCount,calls,minedSuccess,minedRevert,simulatedRejection,positiveEconomicTransitions,accountingObservationCalls,observationReads,notDeployed:(.notDeployed|length)}' "$summary"
            jq -e '.passed==true and .calls==300 and .minedSuccess>0 and .positiveEconomicTransitions>0 and .economicFixtures.readyCount>0' "$summary" >/dev/null
          else
            echo "::error::No telemetry call summary; inspect artifact compile/run logs"
            exit 1
          fi
      - name: Preserve source and per-call raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: archive-source-abi-telemetry-${{ matrix.label }}-${{ github.run_id }}
          path: .archive-telemetry/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

name: BoostHub Live Depositor Binding Diagnostic v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-live-depositor-binding-diagnostic-v3.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Check current BoostHub depositor bindings and prove repair on fork
        env:
          PRIVATE_RPC: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p boosthub-binding-v3
          probe_rpc() {
            local url="$1"
            curl -sS --connect-timeout 4 --max-time 8 -X POST "$url" -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' | grep -q '"result":"0x'
          }
          RPC_URL=''
          RPC_LABEL=''
          if [ -n "${PRIVATE_RPC:-}" ] && probe_rpc "$PRIVATE_RPC"; then
            RPC_URL="$PRIVATE_RPC"; RPC_LABEL='configured-private'
          else
            for CANDIDATE in 'https://ethereum-rpc.publicnode.com' 'https://eth.llamarpc.com' 'https://1rpc.io/eth'; do
              if probe_rpc "$CANDIDATE"; then RPC_URL="$CANDIDATE"; RPC_LABEL="$CANDIDATE"; break; fi
            done
          fi
          test -n "$RPC_URL"
          LOCAL=http://127.0.0.1:8545
          anvil --fork-url "$RPC_URL" --host 127.0.0.1 --port 8545 > boosthub-binding-v3/anvil.log 2>&1 &
          APID=$!
          trap 'kill $APID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do cast block-number --rpc-url "$LOCAL" >/dev/null 2>&1 && break; sleep 1; done

          HUB=0xFbEF8941Da53EA724385B44E91ae9672061D0263
          SDCRV_STAKING=0xA6730b33203f005cab6c80a2fF1d8B73E1947F2C
          SDFXN_STAKING=0x7d53B437f950d6F515C8871aC985F1e875d6B52E
          SDCRV_STRAT=0x93DFEfeFd5D3736381086eFa5A8810F278138ADf
          SDFXN_STRAT=0xc202f5137DE30b8170874e1DE55d1DbB2FA4CD45
          CALLER=0x1000000000000000000000000000000000000001

          OUT=boosthub-binding-v3/result-v3.txt
          {
            echo "rpc=$RPC_LABEL"
            echo "block=$(cast block-number --rpc-url "$LOCAL")"
            echo "hub=$HUB"
            echo "owner=$(cast call "$HUB" 'owner()(address)' --rpc-url "$LOCAL" 2>&1 || true)"
            echo
            for PID in 0 1; do
              echo "pid=$PID"
              echo "poolDepositor=$(cast call "$HUB" 'poolDepositor(uint256)(address)' "$PID" --rpc-url "$LOCAL" 2>&1 || true)"
              echo "poolYieldBoostFeeBps=$(cast call "$HUB" 'poolYieldBoostFeeBps(uint256)(uint16)' "$PID" --rpc-url "$LOCAL" 2>&1 || true)"
              echo "poolGaugeDepositSelector=$(cast call "$HUB" 'poolGaugeDepositSelector(uint256)(bytes4)' "$PID" --rpc-url "$LOCAL" 2>&1 || true)"
              echo "poolAsset=$(cast call "$HUB" 'poolAsset(uint256)(address)' "$PID" --rpc-url "$LOCAL" 2>&1 || true)"
              echo
            done
            echo "expected_pid0=$SDCRV_STAKING"
            echo "expected_pid1=$SDFXN_STAKING"
            echo
            echo '--- current strategy harvest results ---'
            cast call "$SDCRV_STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" 2>&1 || true
            cast call "$SDFXN_STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" 2>&1 || true
          } | tee "$OUT"

          # Prove causality without touching mainnet: impersonate BoostHub owner on this disposable fork,
          # rebind only the two depositor addresses while preserving the historical production runtime parameters.
          OWNER=$(cast call "$HUB" 'owner()(address)' --rpc-url "$LOCAL" | awk '{print $1}')
          cast rpc anvil_impersonateAccount "$OWNER" --rpc-url "$LOCAL" >/dev/null
          cast rpc anvil_setBalance "$OWNER" 0x8ac7230489e80000 --rpc-url "$LOCAL" >/dev/null
          SNAP=$(cast rpc evm_snapshot --rpc-url "$LOCAL" | tr -d '"')
          {
            echo
            echo '--- fork-only causal repair test ---'
            echo "owner=$OWNER"
            if cast send "$HUB" 'setPoolRuntimeConfigs(uint256[],uint16[],address[],bytes4[])' '[0,1]' '[500,500]' "[$SDCRV_STAKING,$SDFXN_STAKING]" '[0x4b820093,0x4b820093]' --from "$OWNER" --unlocked --rpc-url "$LOCAL" --gas-limit 5000000 >/tmp/rebind-v3.txt 2>&1; then
              echo 'fork_rebind=PASS'
              echo "pid0_after=$(cast call "$HUB" 'poolDepositor(uint256)(address)' 0 --rpc-url "$LOCAL")"
              echo "pid1_after=$(cast call "$HUB" 'poolDepositor(uint256)(address)' 1 --rpc-url "$LOCAL")"
              if cast call "$SDCRV_STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" >/tmp/sdcrv-after-v3.txt 2>&1; then echo 'sdcrv_harvest_after_rebind=PASS'; else echo 'sdcrv_harvest_after_rebind=FAIL'; cat /tmp/sdcrv-after-v3.txt; fi
              if cast call "$SDFXN_STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" >/tmp/sdfxn-after-v3.txt 2>&1; then echo 'sdfxn_harvest_after_rebind=PASS'; else echo 'sdfxn_harvest_after_rebind=FAIL'; cat /tmp/sdfxn-after-v3.txt; fi
            else
              echo 'fork_rebind=FAIL'
              cat /tmp/rebind-v3.txt
            fi
          } | tee -a "$OUT"
          cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-live-depositor-binding-diagnostic-v3
          path: boosthub-binding-v3
          if-no-files-found: warn
          retention-days: 14

name: BoostHub Ethereum stETH Pool EMA Qualification v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-ethereum-steth-oracle-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compare live original and NG stETH pools against EMA requirement
        env:
          RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL"
          test "$(timeout 20s cast chain-id --rpc-url "$RPC_URL")" = '1'
          OLD=0xDC24316b9AE028F1497c275EB9192a3Ea0f67022
          NG=0x21E27a5E5513D6e65C4f830167390997aA84843a
          for name in OLD NG; do
            pool="${!name}"
            echo "POOL=$name $pool"
            for i in 0 1; do
              echo "coins[$i]=$(timeout 15s cast call "$pool" 'coins(uint256)(address)' "$i" --rpc-url "$RPC_URL" 2>&1 || true)"
            done
            echo "ema_unindexed=$(timeout 15s cast call "$pool" 'price_oracle()(uint256)' --rpc-url "$RPC_URL" 2>&1 || true)"
            echo "ema_index0=$(timeout 15s cast call "$pool" 'price_oracle(uint256)(uint256)' 0 --rpc-url "$RPC_URL" 2>&1 || true)"
            echo "get_dy_1to0=$(timeout 15s cast call "$pool" 'get_dy(int128,int128,uint256)(uint256)' 1 0 1000000000000000000 --rpc-url "$RPC_URL" 2>&1 || true)"
            echo "get_dy_0to1=$(timeout 15s cast call "$pool" 'get_dy(int128,int128,uint256)(uint256)' 0 1 1000000000000000000 --rpc-url "$RPC_URL" 2>&1 || true)"
          done

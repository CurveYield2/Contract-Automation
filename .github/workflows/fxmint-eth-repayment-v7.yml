name: fxMint ETH Repayment v7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fxmint-eth-repayment-v7.yml'
      - 'packages/github-native-sim/fxmint-eth-repayment/contracts/FxMintEthRepayer_v1.sol'
      - 'packages/github-native-sim/fxmint-eth-repayment/data_v3.mjs'
      - 'packages/github-native-sim/fxmint-eth-repayment/run_v5.mjs'
      - 'packages/github-native-sim/fxmint-eth-repayment/requests/simulate_v1.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        type: choice
        options: [simulate-only, collect-only, live-broadcast]
        default: simulate-only
      repayment_fxusd:
        description: Exact net debt repayment in fxUSD (positive decimal)
        type: string
        default: '10'
      owner_address:
        description: Simulate/collect owner; empty follows position_id or NFT 1920. Live derives DEPLOYER_FX
        type: string
        default: ''
      position_id:
        description: Leave empty to discover the unique eligible ETH long position
        type: string
        default: ''
      helper_address:
        description: Reuse this ETH helper; empty permits deployment in manual live mode
        type: string
        default: ''
      max_fee_gwei:
        description: Maximum total gas price in gwei
        type: string
        default: '1'
      max_base_gwei:
        description: Maximum current base fee allowed before submitting each transaction (gwei)
        type: string
        default: '0.09'
      confirmation:
        description: Live requires LIVE <repayment amount> FXUSD (example LIVE 100 FXUSD)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: fxmint-eth-deployer
  cancel-in-progress: false
jobs:
  resolve-owner:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'live-broadcast'
    environment: fxmint-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install address derivation dependency in GitHub only
        run: npm install --prefix "$RUNNER_TEMP/fxmint-deps" --no-package-lock --ignore-scripts ethers@6.15.0
      - name: Derive public position owner from DEPLOYER_FX without signing
        id: owner
        env:
          FXMINT_DEPS: ${{ runner.temp }}/fxmint-deps
          FXMINT_PRIVATE_KEY: ${{ secrets.DEPLOYER_FX }}
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { appendFileSync } from 'node:fs';
          const require = createRequire(process.env.FXMINT_DEPS + '/package.json');
          const { Wallet } = require('ethers');
          try {
            if (!process.env.FXMINT_PRIVATE_KEY) throw Error();
            const owner = new Wallet(process.env.FXMINT_PRIVATE_KEY).address;
            appendFileSync(process.env.GITHUB_OUTPUT, 'owner=' + owner + '\n');
            console.log('DEPLOYER_FX public address: ' + owner);
          } catch {
            console.error('DEPLOYER_FX is missing or invalid');
            process.exitCode = 1;
          }
          NODE
  simulation:
    needs: resolve-owner
    if: always() && !cancelled() && (needs.resolve-owner.result == 'success' || needs.resolve-owner.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install scoped dependencies in GitHub only
        run: npm install --prefix "$RUNNER_TEMP/fxmint-deps" --no-package-lock --ignore-scripts ethers@6.15.0 @openzeppelin/contracts@5.4.0
      - name: Discover position, compile, compare complete routes and verify repayment
        env:
          ETH_RPC_URL: ${{ secrets.SD_ETH_RPC_URL || secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
          FXMINT_DEPS: ${{ runner.temp }}/fxmint-deps
          FXMINT_MODE: ${{ inputs.mode == 'collect-only' && 'collect-only' || 'simulate-only' }}
          FXMINT_REPAYMENT_FXUSD: ${{ inputs.repayment_fxusd || '10' }}
          FXMINT_OWNER_ADDRESS: ${{ needs.resolve-owner.outputs.owner || inputs.owner_address }}
          FXMINT_POSITION_ID: ${{ inputs.position_id }}
          FXMINT_HELPER_ADDRESS: ${{ inputs.helper_address }}
          FXMINT_MAX_FEE_GWEI: ${{ inputs.max_fee_gwei || '1' }}
          FXMINT_MAX_BASE_GWEI: ${{ inputs.max_base_gwei || '0.09' }}
        run: timeout 1500s node packages/github-native-sim/fxmint-eth-repayment/run_v5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fxmint-eth-simulation-v7
          path: fxmint-output/
          retention-days: 30
          if-no-files-found: error
  live:
    needs: [resolve-owner, simulation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'live-broadcast'
    environment: fxmint-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install scoped dependencies in GitHub only
        run: npm install --prefix "$RUNNER_TEMP/fxmint-deps" --no-package-lock --ignore-scripts ethers@6.15.0 @openzeppelin/contracts@5.4.0
      - name: Repeat fresh route acceptance then perform manually requested broadcast
        env:
          ETH_RPC_URL: ${{ secrets.SD_ETH_RPC_URL || secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
          FXMINT_DEPS: ${{ runner.temp }}/fxmint-deps
          FXMINT_MODE: live-broadcast
          FXMINT_OWNER_ADDRESS: ${{ needs.resolve-owner.outputs.owner }}
          FXMINT_REPAYMENT_FXUSD: ${{ inputs.repayment_fxusd }}
          FXMINT_POSITION_ID: ${{ inputs.position_id }}
          FXMINT_HELPER_ADDRESS: ${{ inputs.helper_address }}
          FXMINT_MAX_FEE_GWEI: ${{ inputs.max_fee_gwei }}
          FXMINT_MAX_BASE_GWEI: ${{ inputs.max_base_gwei || '0.09' }}
          FXMINT_CONFIRMATION: ${{ inputs.confirmation }}
          FXMINT_PRIVATE_KEY: ${{ secrets.DEPLOYER_FX }}
        run: node packages/github-native-sim/fxmint-eth-repayment/run_v5.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fxmint-eth-broadcast-v7
          path: fxmint-output/
          retention-days: 30
          if-no-files-found: error

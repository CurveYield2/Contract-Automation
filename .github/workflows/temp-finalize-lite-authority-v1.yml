name: Temporary Finalize Lite Authority v1

on:
  push:
    branches:
      - upgrade/lite-phase-schema-policy-v1
    paths:
      - '.github/workflows/temp-finalize-lite-authority-v1.yml'

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/lite-phase-schema-policy-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh

      - name: Refresh manifest and deterministic ZIP
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin upgrade/lite-phase-schema-policy-v1
          git checkout -B upgrade/lite-phase-schema-policy-v1 origin/upgrade/lite-phase-schema-policy-v1

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('Audit Skill - Current Authority')
          packages=sorted(p for p in root.iterdir() if p.is_dir() and (p/'SKILL.md').is_file())
          if len(packages)!=1:
              raise SystemExit(f'expected exactly one unpacked Lite authority package, found {len(packages)}')
          pkg=packages[0]
          mp=pkg/'MANIFEST.json'
          manifest=json.loads(mp.read_text())
          files=[]
          for p in sorted(x for x in pkg.rglob('*') if x.is_file() and x.name!='MANIFEST.json'):
              b=p.read_bytes()
              files.append({'path':p.relative_to(pkg).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest['files']=files
          manifest['actionOutputPolicy']='ONE_SCHEMA_PER_PHASE_ALL_AGENT_ACTIONS_DATA_PRODUCING_END_OF_PHASE_CONTROLLER_BOOKKEEPING'
          mp.write_text(json.dumps(manifest,indent=2)+'\n')
          print(f'refreshed {len(files)} manifest entries')
          PY

          cp ../scripts/sync-lite-authority-zip-v1.py .sync-lite-authority-zip-v1.py
          python3 .sync-lite-authority-zip-v1.py
          rm .sync-lite-authority-zip-v1.py

          git config user.name 'CurveYield Lite Authority Finalizer'
          git config user.email 'lite-authority-finalizer@users.noreply.github.com'
          git add -- 'Audit Skill - Current Authority/'
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lite): refresh phase-schema authority manifest and zip'
            git push origin HEAD:upgrade/lite-phase-schema-policy-v1
          fi

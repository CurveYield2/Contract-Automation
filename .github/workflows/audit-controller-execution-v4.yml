name: V7 Audit Controller Execution v4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-controller-execution-v4.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/requests/**/request.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Repository-relative deep-assurance-github-request-v2 JSON path in Solo-Audit-Controller'
        required: true
        type: string
      controller_ref:
        description: 'Solo-Audit-Controller ref containing the request file'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  bridge-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Contract Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify V7 secret contract
        env:
          AUDIT_CONTROLLER_GITHUB_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          test -n "$AUDIT_CONTROLLER_GITHUB_TOKEN"
          if [ -n "$SIM_ARCHIVE_PRIMARY_ETHEREUM_01" ]; then
            echo "archive_rpc_configured=true" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "archive_rpc_configured=false" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prove authenticated private controller checkout
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Solo-Audit-Controller
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-smoke
          fetch-depth: 1
          persist-credentials: false

      - name: Record private checkout identity
        run: |
          echo "controller_checkout_sha=$(git -C .controller-smoke rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "trusted_runner_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test -f .controller-smoke/packages/contract-automation-adapter/src/v7-independent-review-v1.mjs

  execute-v7-request:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'github-native-sim/')) }}
    needs: bridge-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted Contract Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout atomic request source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .request-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract Automation dependencies on GitHub runner
        run: npm install --no-package-lock

      - name: Checkout private controller request repository for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Solo-Audit-Controller
          ref: ${{ inputs.controller_ref }}
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-request
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exactly one V7 request
        env:
          DISPATCH_REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          mkdir -p .v7-request
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_REQUEST_PATH" in
              campaigns/*/requests/*.json) ;;
              *) echo "Invalid V7 request path: $DISPATCH_REQUEST_PATH" >&2; exit 1 ;;
            esac
            test -f ".controller-request/$DISPATCH_REQUEST_PATH"
            cp ".controller-request/$DISPATCH_REQUEST_PATH" .v7-request/request.json
            echo "request_source=$DISPATCH_REQUEST_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            mapfile -t requests < <(find .request-source/github-native-sim/requests -mindepth 2 -maxdepth 2 -type f -name request.json | sort)
            test "${#requests[@]}" -eq 1
            cp "${requests[0]}" .v7-request/request.json
            echo "request_source=${requests[0]}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate V7 request envelope
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateDeepAssuranceRequestV2 } from './packages/github-native-sim/src/schema.mjs';
          const request = JSON.parse(fs.readFileSync('.v7-request/request.json', 'utf8'));
          const validated = validateDeepAssuranceRequestV2(request);
          console.log(`validated_request=${validated.requestId}`);
          console.log(`phase=${validated.phaseId}`);
          console.log(`source=${validated.source.repository}@${validated.source.commit}:${validated.source.projectPath}`);
          if (validated.source.archivePath) console.log(`archive=${validated.source.archivePath}@${validated.source.archiveSha256}`);
          NODE

      - name: Record Phase 7 archive RPC identity
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          mkdir -p .audit-evidence/v7-execution-v4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { CHAINS } from './packages/protocol/src/index.mjs';
          import { probeArchiveRpcIdentity } from './packages/github-native-sim/src/archive-rpc-identity-v1.mjs';
          import { validateDeepAssuranceRequestV2 } from './packages/github-native-sim/src/schema.mjs';

          const outputPath = '.audit-evidence/v7-execution-v4/archive-rpc-identity-v1.json';
          const request = validateDeepAssuranceRequestV2(JSON.parse(fs.readFileSync('.v7-request/request.json', 'utf8')));
          if (request.phaseId !== 'fork-simulation-lifecycle') {
            process.exit(0);
          }
          const simulation = request.configuration.simulation;
          const expectedChainId = CHAINS[simulation.chain].chainId;
          try {
            const evidence = await probeArchiveRpcIdentity({
              rpcUrl: process.env.SIM_ARCHIVE_PRIMARY_ETHEREUM_01,
              block: simulation.block,
              expectedChainId
            });
            fs.writeFileSync(outputPath, `${JSON.stringify(evidence, null, 2)}\n`);
            console.log(`archive_rpc_remote_chain_id=${evidence.remoteChainId}`);
            console.log(`archive_rpc_pinned_block_hash=${evidence.block.hash}`);
          } catch (error) {
            const evidence = {
              schemaVersion: 'phase7-archive-rpc-identity-v1',
              status: 'probe_failed',
              expectedChainId,
              block: simulation.block,
              error: { name: error?.name ?? 'Error', message: error?.message ?? String(error) }
            };
            fs.writeFileSync(outputPath, `${JSON.stringify(evidence, null, 2)}\n`);
            console.error(`archive RPC identity probe failed: ${evidence.error.message}`);
          }
          NODE

      - name: Record Phase 7 archive state readiness
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          mkdir -p .audit-evidence/v7-execution-v4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { probeArchiveRpcStateReadiness } from './packages/github-native-sim/src/archive-rpc-state-readiness-v1.mjs';
          import { validateDeepAssuranceRequestV2 } from './packages/github-native-sim/src/schema.mjs';

          const outputPath = '.audit-evidence/v7-execution-v4/archive-rpc-state-readiness-v1.json';
          const request = validateDeepAssuranceRequestV2(JSON.parse(fs.readFileSync('.v7-request/request.json', 'utf8')));
          if (request.phaseId !== 'fork-simulation-lifecycle') process.exit(0);
          const evidence = await probeArchiveRpcStateReadiness({
            rpcUrl: process.env.SIM_ARCHIVE_PRIMARY_ETHEREUM_01,
            block: request.configuration.simulation.block,
            account: '0x90f8bf6a479f320ead074411a4b0e7944ea8c9c1'
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(`archive_rpc_state_readiness=${evidence.status}`);
          NODE

      - name: Record Phase 7 target code readiness
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          mkdir -p .audit-evidence/v7-execution-v4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { probeArchiveContractCode } from './packages/github-native-sim/src/archive-contract-code-readiness-v1.mjs';
          import { validateDeepAssuranceRequestV2 } from './packages/github-native-sim/src/schema.mjs';

          const outputPath = '.audit-evidence/v7-execution-v4/archive-contract-code-readiness-v1.json';
          const request = validateDeepAssuranceRequestV2(JSON.parse(fs.readFileSync('.v7-request/request.json', 'utf8')));
          if (request.phaseId !== 'fork-simulation-lifecycle') process.exit(0);
          const workflow = request.configuration.simulation.workflow;
          const targetStep = workflow.steps.find((step) => typeof step.target === 'string' && /^0x[0-9a-fA-F]{40}$/.test(step.target));
          if (!targetStep) process.exit(0);
          const evidence = await probeArchiveContractCode({
            rpcUrl: process.env.SIM_ARCHIVE_PRIMARY_ETHEREUM_01,
            block: request.configuration.simulation.block,
            address: targetStep.target
          });
          fs.writeFileSync(outputPath, `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(`archive_target_code_readiness=${evidence.status}`);
          console.log(`archive_target_code_bytes=${evidence.byteLength ?? 'unavailable'}`);
          NODE

      - name: Execute V7 GitHub-native request
        env:
          AUDIT_CONTROLLER_GITHUB_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          mkdir -p .audit-evidence/v7-execution-v4
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { runGitHubNativeJob } from './packages/github-native-sim/src/run-job-file.mjs';

          const request = JSON.parse(fs.readFileSync('.v7-request/request.json', 'utf8'));
          const runnerCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const result = await runGitHubNativeJob(request, {
            workspaceRoot: '.audit-work/v7-execution-v4',
            environment: process.env
          });

          const rawPath = '.audit-evidence/v7-execution-v4/raw-result-v4.json';
          const rawBytes = `${JSON.stringify(result, null, 2)}\n`;
          fs.writeFileSync(rawPath, rawBytes);
          const artifactDigest = createHash('sha256').update(rawBytes).digest('hex');
          const resultStatus = result.status !== 'completed'
            ? 'FAIL'
            : ((result.analysisComponentFailureCount ?? 0) > 0 || (result.failedStepCount ?? 0) > 0 ? 'FINDINGS' : 'PASS');

          const evidence = {
            schemaVersion: 'audit-v7-github-execution-evidence-v1',
            requestId: request.requestId,
            requestDigest: request.requestDigest,
            processId: request.processId,
            profileId: request.profileId,
            source: request.source,
            runnerImplementation: {
              repository: process.env.GITHUB_REPOSITORY,
              commit: runnerCommit
            },
            resultStatus,
            artifactDigest,
            deploymentGasEvidence: result.deploymentGasEvidence ?? null,
            simulationEvidence: result.simulation ?? null,
            analysisComponentFailureCount: result.analysisComponentFailureCount ?? 0,
            failedStepCount: result.failedStepCount ?? 0,
            failedSteps: result.failedSteps ?? [],
            continuityDisposition: result.continuityDisposition ?? null,
            authoritativeFinding: false
          };
          fs.writeFileSync('.audit-evidence/v7-execution-v4/controller-evidence-v4.json', `${JSON.stringify(evidence, null, 2)}\n`);
          fs.writeFileSync('.audit-evidence/v7-execution-v4/execution-identity-v4.json', `${JSON.stringify({
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowSha: process.env.GITHUB_SHA,
            workflowRef: process.env.GITHUB_REF,
            runnerRepository: process.env.GITHUB_REPOSITORY,
            runnerCommit,
            requestId: request.requestId,
            requestDigest: request.requestDigest,
            source: request.source
          }, null, 2)}\n`);
          NODE

      - name: Upload V7 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-execution-v4
          path: .audit-evidence/v7-execution-v4
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce V7 execution outcome
        if: always()
        run: |
          test -f .audit-evidence/v7-execution-v4/raw-result-v4.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('.audit-evidence/v7-execution-v4/raw-result-v4.json', 'utf8'));
          if (result.status !== 'completed') {
            console.error(`V7 execution failed: ${result.error?.message ?? 'unknown failure'}`);
            process.exit(1);
          }
          NODE

name: Temporary Phase0 Authority Copy v1

on:
  push:
    branches: [main]
    paths:
      - 'process/p0-authority-copy-requests/*.json'

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted Contract-Automation main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Verify and copy exact current Lite authority
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source_path='Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38.3.3_Web_Bootstrap_Optimized_v1.zip'
          expected_sha='f21cb928bc549286164e23ea30b7b6a2739712057e6005849f7ee50d4fd7ee60'
          expected_size='587057'
          target_branch='audit/curveyield-dex-fresh-lite-p0-20260927-v1'
          target_path='campaigns/CurveYield DEX Fresh Lite Audit/authority/Audit_V7_independent_Review_skill_v38.3.3_Web_Bootstrap_Optimized_v1.zip'

          test -f "$source_path"
          test "$(sha256sum "$source_path" | awk '{print $1}')" = "$expected_sha"
          test "$(stat -c '%s' "$source_path")" = "$expected_size"

          gh auth setup-git
          rm -rf /tmp/audit-controller-authority-copy
          gh repo clone CurveYield2/Audit-Controller /tmp/audit-controller-authority-copy -- --filter=blob:none --no-checkout
          cd /tmp/audit-controller-authority-copy
          git fetch origin "$target_branch"
          git checkout -B "$target_branch" "origin/$target_branch"
          mkdir -p "$(dirname "$target_path")"
          cp "$GITHUB_WORKSPACE/$source_path" "$target_path"
          test "$(sha256sum "$target_path" | awk '{print $1}')" = "$expected_sha"
          test "$(stat -c '%s' "$target_path")" = "$expected_size"
          git config user.name 'CurveYield Phase0 Authority Copy'
          git config user.email 'phase0-authority-copy@users.noreply.github.com'
          git add -- "$target_path"
          if ! git diff --cached --quiet; then
            git commit -m 'audit(phase0): bind exact current Lite authority package'
            git push origin "HEAD:$target_branch"
          fi
          git show "HEAD:$target_path" > /tmp/verify.zip
          test "$(sha256sum /tmp/verify.zip | awk '{print $1}')" = "$expected_sha"

name: Agent File Import v3

on:
  push:
    branches: [main]
    paths:
      - '.agent-upload/requests/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: agent-audit-source-fanout-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Contract-Automation control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Locate triggering import request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.files[]? | select(.status!="removed") | .filename | select(startswith(".agent-upload/requests/") and endswith(".json"))'
          )
          [ "${#requests[@]}" -eq 1 ] || {
            echo "::error::Exactly one import request file must be created or changed per triggering commit."
            exit 1
          }
          echo "path=${requests[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate admitted import request
        id: meta
        env:
          REQUEST: ${{ steps.request.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          schema="$(jq -r '.schema // empty' "$REQUEST")"
          request_id="$(jq -r '.request_id // empty' "$REQUEST")"
          source_url="$(jq -r '.source.url // empty' "$REQUEST")"
          drive_file_id="$(jq -r '.source.drive_file_id // empty' "$REQUEST")"
          filename="$(jq -r '.source.filename // empty' "$REQUEST")"
          sha256="$(jq -r '.source.sha256 // empty' "$REQUEST")"
          size="$(jq -r '.source.size // empty' "$REQUEST")"

          [[ "$request_id" =~ ^[A-Za-z0-9._-]{1,160}$ ]]
          test -n "$source_url"
          [ "$(basename -- "$filename")" = "$filename" ]
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$size" =~ ^[0-9]+$ ]] && [ "$size" -gt 0 ]

          case "$schema" in
            curveyield-audit-source-fanout/v2)
              mode='audit_source_fanout'
              campaign_id="$(jq -r '.campaign_id // empty' "$REQUEST")"
              audit_name="$(jq -r '.audit_name // empty' "$REQUEST")"
              format='zip'
              target_path=''
              [[ "$campaign_id" =~ ^[A-Za-z0-9._-]{1,200}$ ]]
              test -n "$audit_name"
              [[ "$audit_name" != *"/"* ]]
              [[ "$audit_name" != *"\\"* ]]
              [ "$audit_name" != "." ] && [ "$audit_name" != ".." ]
              [[ "$filename" == *.zip ]]
              ;;
            curveyield-audit-skill-authority-import/v1)
              mode='audit_skill_authority'
              campaign_id="$(jq -r '.campaign_id // empty' "$REQUEST")"
              audit_name="$(jq -r '.audit_name // empty' "$REQUEST")"
              format='zip'
              [[ "$campaign_id" =~ ^[A-Za-z0-9._-]{1,200}$ ]]
              test -n "$audit_name"
              [[ "$audit_name" != *"/"* ]]
              [[ "$audit_name" != *"\\"* ]]
              [ "$audit_name" != "." ] && [ "$audit_name" != ".." ]
              [[ "$drive_file_id" =~ ^[A-Za-z0-9_-]{10,200}$ ]]
              [[ "$source_url" == *"drive.google.com/file/d/$drive_file_id"* ]]
              [[ "$filename" == *.zip ]]
              target_path="campaigns/$audit_name/authority/$filename"
              ;;
            curveyield-development-authority-import/v1)
              mode='development_authority'
              campaign_id=''
              audit_name=''
              source_type="$(jq -r '.source.type // empty' "$REQUEST")"
              format="$(jq -r '.source.format // empty' "$REQUEST")"
              target_repo="$(jq -r '.target.repository // empty' "$REQUEST")"
              target_branch="$(jq -r '.target.branch // empty' "$REQUEST")"
              target_path="$(jq -r '.target.path // empty' "$REQUEST")"
              test "$source_type" = 'google-drive'
              [[ "$drive_file_id" =~ ^[A-Za-z0-9_-]{10,200}$ ]]
              [[ "$source_url" == *"drive.google.com/file/d/$drive_file_id"* ]]
              [[ "$format" =~ ^(raw|zip)$ ]]
              if [ "$format" = 'zip' ]; then [[ "$filename" == *.zip ]]; fi
              test "$target_repo" = "$GITHUB_REPOSITORY"
              test "$target_branch" = 'main'
              [[ "$target_path" == process/development-agent-task-manager/* ]]
              [[ "$target_path" != /* ]]
              [[ "$target_path" != *".."* ]]
              [[ "$target_path" != *"\\"* ]]
              [ "$(basename -- "$target_path")" = "$filename" ]
              ;;
            *)
              echo "::error::Unsupported import schema: $schema"
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "campaign_id=$campaign_id" >> "$GITHUB_OUTPUT"
          echo "audit_name=$audit_name" >> "$GITHUB_OUTPUT"
          echo "source_url=$source_url" >> "$GITHUB_OUTPUT"
          echo "drive_file_id=$drive_file_id" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "format=$format" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "target_path=$target_path" >> "$GITHUB_OUTPUT"

      - name: Select working Audit-Controller credential
        if: steps.meta.outputs.mode == 'audit_source_fanout' || steps.meta.outputs.mode == 'audit_skill_authority' || steps.meta.outputs.mode == 'audit_skill_authority'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Verify cross-repository credential
        if: steps.meta.outputs.mode == 'audit_source_fanout'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh api repos/CurveYield2/Audit-Controller --silent
          gh api repos/CurveYield2/Audits --silent

      - name: Download import object once
        env:
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
          DRIVE_FILE_ID: ${{ steps.meta.outputs.drive_file_id }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          FORMAT: ${{ steps.meta.outputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          url="$SOURCE_URL"
          if [[ "$url" =~ drive\.google\.com/file/d/([^/]+) ]]; then
            observed_file_id="${BASH_REMATCH[1]}"
            if [ -n "$DRIVE_FILE_ID" ]; then test "$observed_file_id" = "$DRIVE_FILE_ID"; fi
            url="https://drive.usercontent.google.com/download?id=$observed_file_id&export=download&confirm=t"
          fi
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 \
            --output "/tmp/$FILENAME" "$url"
          test -s "/tmp/$FILENAME"
          if [ "$FORMAT" = 'zip' ]; then
            magic="$(xxd -p -l 4 "/tmp/$FILENAME")"
            case "$magic" in
              504b0304|504b0506|504b0708) ;;
              *) echo "Not a ZIP: magic=$magic" >&2; exit 1 ;;
            esac
          fi

      - name: Verify exact source identity
        env:
          FILENAME: ${{ steps.meta.outputs.filename }}
          EXPECTED_SHA256: ${{ steps.meta.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.meta.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(sha256sum "/tmp/$FILENAME" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "/tmp/$FILENAME")"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$actual_size" = "$EXPECTED_SIZE"

      - name: Fan out identical ZIP to Audit-Controller and Audits
        if: steps.meta.outputs.mode == 'audit_source_fanout'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          AUDIT_NAME: ${{ steps.meta.outputs.audit_name }}
          EXPECTED_SHA256: ${{ steps.meta.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          import_one() {
            repo="$1"
            destination="$2"
            work="/tmp/$(basename "$repo")-fanout"
            rm -rf "$work"
            gh repo clone "$repo" "$work" -- --depth=1 --branch main
            cd "$work"
            mkdir -p "$(dirname "$destination")"
            cp "/tmp/$FILENAME" "$destination"

            git config user.name 'CurveYield Audit Source Fanout'
            git config user.email 'audit-source-fanout@users.noreply.github.com'
            git add -- "$destination"
            if ! git diff --cached --quiet; then
              git commit -m "chore(audit): admit source for $AUDIT_NAME"
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  return 1
                fi
                if git push origin HEAD:main; then break; fi
                if [ "$attempt" -eq 5 ]; then return 1; fi
                sleep $((attempt * 2))
              done
            fi

            git fetch origin main
            git show "origin/main:$destination" > /tmp/remote-verify.zip
            remote_sha="$(sha256sum /tmp/remote-verify.zip | awk '{print $1}')"
            test "$remote_sha" = "$EXPECTED_SHA256"
            cd - >/dev/null
          }

          controller_path="campaigns/$AUDIT_NAME/source/$FILENAME"
          audits_path="$AUDIT_NAME/source/$FILENAME"

          import_one 'CurveYield2/Audit-Controller' "$controller_path"
          import_one 'CurveYield2/Audits' "$audits_path"

          printf '%s\n' "$controller_path" > /tmp/controller-path.txt
          printf '%s\n' "$audits_path" > /tmp/audits-path.txt

      - name: Import verified audit skill authority into Audit-Controller
        if: steps.meta.outputs.mode == 'audit_skill_authority'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          TARGET_PATH: ${{ steps.meta.outputs.target_path }}
          EXPECTED_SHA256: ${{ steps.meta.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.meta.outputs.size }}
          AUDIT_NAME: ${{ steps.meta.outputs.audit_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          work='/tmp/audit-skill-authority-import'
          rm -rf "$work"
          gh repo clone 'CurveYield2/Audit-Controller' "$work" -- --depth=1 --branch main
          cd "$work"
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "/tmp/$FILENAME" "$TARGET_PATH"

          git config user.name 'CurveYield Audit Skill Authority Import'
          git config user.email 'audit-skill-authority-import@users.noreply.github.com'
          git add -- "$TARGET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "chore(audit): admit skill authority for $AUDIT_NAME"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

          git fetch origin main
          git show "origin/main:$TARGET_PATH" > /tmp/audit-skill-authority-remote-verify
          remote_sha="$(sha256sum /tmp/audit-skill-authority-remote-verify | awk '{print $1}')"
          remote_size="$(stat -c '%s' /tmp/audit-skill-authority-remote-verify)"
          test "$remote_sha" = "$EXPECTED_SHA256"
          test "$remote_size" = "$EXPECTED_SIZE"
          remote_commit="$(git rev-parse origin/main)"
          remote_blob="$(git rev-parse "origin/main:$TARGET_PATH")"
          printf '%s\n' "$remote_sha" > /tmp/audit-skill-authority-remote-sha.txt
          printf '%s\n' "$remote_size" > /tmp/audit-skill-authority-remote-size.txt
          printf '%s\n' "$TARGET_PATH" > /tmp/audit-skill-authority-target-path.txt
          printf '%s\n' "$remote_commit" > /tmp/audit-skill-authority-commit.txt
          printf '%s\n' "$remote_blob" > /tmp/audit-skill-authority-blob.txt

      - name: Import verified development authority into Contract-Automation
        if: steps.meta.outputs.mode == 'development_authority'
        env:
          GH_TOKEN: ${{ github.token }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          TARGET_PATH: ${{ steps.meta.outputs.target_path }}
          EXPECTED_SHA256: ${{ steps.meta.outputs.sha256 }}
          REQUEST_ID: ${{ steps.meta.outputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          work='/tmp/development-authority-import'
          rm -rf "$work"
          gh repo clone "$GITHUB_REPOSITORY" "$work" -- --depth=1 --branch main
          cd "$work"
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "/tmp/$FILENAME" "$TARGET_PATH"

          git config user.name 'CurveYield Development Authority Import'
          git config user.email 'development-authority-import@users.noreply.github.com'
          git add -- "$TARGET_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "chore(task-manager): import authority $REQUEST_ID"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

          git fetch origin main
          git show "origin/main:$TARGET_PATH" > /tmp/development-authority-remote-verify
          remote_sha="$(sha256sum /tmp/development-authority-remote-verify | awk '{print $1}')"
          remote_size="$(stat -c '%s' /tmp/development-authority-remote-verify)"
          test "$remote_sha" = "$EXPECTED_SHA256"
          printf '%s\n' "$remote_sha" > /tmp/authority-remote-sha.txt
          printf '%s\n' "$remote_size" > /tmp/authority-remote-size.txt
          printf '%s\n' "$TARGET_PATH" > /tmp/authority-target-path.txt

      - name: Publish import completion report
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.meta.outputs.mode }}
          REQUEST_ID: ${{ steps.meta.outputs.request_id }}
          CAMPAIGN_ID: ${{ steps.meta.outputs.campaign_id }}
          AUDIT_NAME: ${{ steps.meta.outputs.audit_name }}
          DRIVE_FILE_ID: ${{ steps.meta.outputs.drive_file_id }}
          SOURCE_URL: ${{ steps.meta.outputs.source_url }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$REQUEST_ID" | tr -c 'A-Za-z0-9._-' '_')"

          if [ "$MODE" = 'audit_source_fanout' ]; then
            jq -n \
              --arg requestId "$REQUEST_ID" \
              --arg campaignId "$CAMPAIGN_ID" \
              --arg auditName "$AUDIT_NAME" \
              --arg filename "$FILENAME" \
              --arg sha256 "$SHA256" \
              --argjson size "$SIZE" \
              --arg controllerPath "$(cat /tmp/controller-path.txt)" \
              --arg auditsPath "$(cat /tmp/audits-path.txt)" \
              --arg runId "$GITHUB_RUN_ID" \
              '{
                schemaVersion:"curveyield-audit-source-fanout-report-v2",
                requestId:$requestId,campaignId:$campaignId,auditName:$auditName,status:"PASS",
                source:{filename:$filename,sha256:$sha256,size:$size},
                destinations:[
                  {repository:"CurveYield2/Audit-Controller",ref:"main",path:$controllerPath,verified:true},
                  {repository:"CurveYield2/Audits",ref:"main",path:$auditsPath,verified:true}
                ],
                workflowRunId:$runId,
                completedAt:(now|todate)
              }' > /tmp/import-report.json
            report_dir='process/source-fanout/reports'
            report_message='chore(source): record fanout report'
          elif [ "$MODE" = 'audit_skill_authority' ]; then
            jq -n \
              --arg requestId "$REQUEST_ID" \
              --arg campaignId "$CAMPAIGN_ID" \
              --arg auditName "$AUDIT_NAME" \
              --arg driveFileId "$DRIVE_FILE_ID" \
              --arg sourceUrl "$SOURCE_URL" \
              --arg filename "$FILENAME" \
              --arg sha256 "$SHA256" \
              --argjson size "$SIZE" \
              --arg path "$(cat /tmp/audit-skill-authority-target-path.txt)" \
              --arg remoteSha "$(cat /tmp/audit-skill-authority-remote-sha.txt)" \
              --argjson remoteSize "$(cat /tmp/audit-skill-authority-remote-size.txt)" \
              --arg remoteCommit "$(cat /tmp/audit-skill-authority-commit.txt)" \
              --arg remoteBlob "$(cat /tmp/audit-skill-authority-blob.txt)" \
              --arg runId "$GITHUB_RUN_ID" \
              '{
                schemaVersion:"curveyield-audit-skill-authority-import-report-v1",
                requestId:$requestId,campaignId:$campaignId,auditName:$auditName,status:"PASS",
                source:{type:"google-drive",driveFileId:$driveFileId,url:$sourceUrl,filename:$filename,sha256:$sha256,size:$size},
                destination:{repository:"CurveYield2/Audit-Controller",ref:"main",path:$path,sha256:$remoteSha,size:$remoteSize,commit:$remoteCommit,gitBlobSha:$remoteBlob,verified:true},
                workflowRunId:$runId,
                completedAt:(now|todate)
              }' > /tmp/import-report.json
            report_dir='process/audit-skill-authority-import/reports'
            report_message='chore(audit): record skill authority import'
          else
            jq -n \
              --arg requestId "$REQUEST_ID" \
              --arg driveFileId "$DRIVE_FILE_ID" \
              --arg sourceUrl "$SOURCE_URL" \
              --arg filename "$FILENAME" \
              --arg sha256 "$SHA256" \
              --argjson size "$SIZE" \
              --arg path "$(cat /tmp/authority-target-path.txt)" \
              --arg remoteSha "$(cat /tmp/authority-remote-sha.txt)" \
              --argjson remoteSize "$(cat /tmp/authority-remote-size.txt)" \
              --arg runId "$GITHUB_RUN_ID" \
              '{
                schemaVersion:"curveyield-development-authority-import-report-v1",
                requestId:$requestId,status:"PASS",
                source:{type:"google-drive",driveFileId:$driveFileId,url:$sourceUrl,filename:$filename,sha256:$sha256,size:$size},
                destination:{repository:env.GITHUB_REPOSITORY,ref:"main",path:$path,sha256:$remoteSha,size:$remoteSize,verified:true},
                workflowRunId:$runId,
                completedAt:(now|todate)
              }' > /tmp/import-report.json
            report_dir='process/development-agent-task-manager/authority-import/reports'
            report_message='chore(task-manager): record authority import'
          fi

          api="repos/$GITHUB_REPOSITORY/contents/$report_dir/$safe_id.json"
          content="$(base64 -w0 /tmp/import-report.json)"
          existing="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method PUT "$api" -f message="$report_message $REQUEST_ID" -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="$report_message $REQUEST_ID" -f content="$content" -f branch=main >/dev/null
          fi

      - name: Launch registered Phase-0 browser agent
        if: steps.meta.outputs.mode == 'audit_source_fanout'
        env:
          GH_TOKEN: ${{ github.token }}
          CAMPAIGN_ID: ${{ steps.meta.outputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          if [ ! -f "$registration" ]; then
            echo "No browser-agent registration for $CAMPAIGN_ID; source fan-out is complete and no browser wake was requested."
            exit 0
          fi

          test "$(jq -r '.schemaVersion // empty' "$registration")" = 'curveyield-browser-agent-wake-registration-v1'
          test "$(jq -r '.campaignId // empty' "$registration")" = "$CAMPAIGN_ID"

          mode="$(jq -r '.mode // "create_fresh"' "$registration")"
          chat_url="$(jq -r '.chatUrl // empty' "$registration")"
          wake_message="$(jq -r '.wakeMessage // empty' "$registration")"
          test -n "$wake_message"

          watchdog_enabled="$(jq -r '.watchdog.enabled // true' "$registration")"
          watchdog_message="$(jq -r '.watchdog.idleMessage // empty' "$registration")"
          gate_mode="$(jq -r '.watchdog.gate.mode // "LITE"' "$registration")"
          gate_repo="$(jq -r '.watchdog.gate.repository // "CurveYield2/Audit-Controller"' "$registration")"
          gate_ref="$(jq -r '.watchdog.gate.ref // "main"' "$registration")"
          gate_state_path="$(jq -r '.watchdog.gate.statePath // empty' "$registration")"
          gate_expected_phase="$(jq -r '.watchdog.gate.expectedPhaseId // "phase-0"' "$registration")"
          gate_expected_milestone="$(jq -r '.watchdog.gate.expectedMilestoneId // "P0_BOOTSTRAP"' "$registration")"
          gate_pointer_path="$(jq -r '.watchdog.gate.activePointerPath // empty' "$registration")"
          gate_stop_states="$(jq -r '(.watchdog.gate.stopStates // ["WAITING_FOR_HUMAN_RESPONSE","WAITING_FOR_SUCCESSOR_AGENT","CLOSED","STOPPED_BY_HUMAN"]) | join(",")' "$registration")"
          gate_stop_campaign_statuses="$(jq -r '(.watchdog.gate.stopCampaignStatuses // ["COMPLETE","STOPPED_BY_HUMAN"]) | join(",")' "$registration")"

          wake_id="$CAMPAIGN_ID-phase0-source-fanout-$GITHUB_RUN_ID"
          wake_b64="$(printf '%s' "$wake_message" | base64 -w0)"
          watchdog_b64="$(printf '%s' "$watchdog_message" | base64 -w0)"

          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="$wake_id" \
            -f campaign_id="$CAMPAIGN_ID" \
            -f phase_id="phase-0" \
            -f mode="$mode" \
            -f chat_url="$chat_url" \
            -f wake_message_b64="$wake_b64" \
            -f watchdog_enabled="$watchdog_enabled" \
            -f watchdog_message_b64="$watchdog_b64" \
            -f gate_mode="$gate_mode" \
            -f gate_repository="$gate_repo" \
            -f gate_ref="$gate_ref" \
            -f gate_state_path="$gate_state_path" \
            -f gate_expected_phase_id="$gate_expected_phase" \
            -f gate_expected_milestone_id="$gate_expected_milestone" \
            -f gate_active_pointer_path="$gate_pointer_path" \
            -f gate_stop_states_csv="$gate_stop_states" \
            -f gate_stop_campaign_statuses_csv="$gate_stop_campaign_statuses"

      - name: Record import failure run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ steps.request.outputs.path }}
        shell: bash
        run: |
          set -u
          request_id="run-$GITHUB_RUN_ID"
          if [ -n "${REQUEST:-}" ] && [ -f "$REQUEST" ]; then
            observed="$(jq -r '.request_id // empty' "$REQUEST" 2>/dev/null || true)"
            if [ -n "$observed" ]; then request_id="$observed"; fi
          fi
          safe_id="$(printf '%s' "$request_id" | tr -c 'A-Za-z0-9._-' '_')"
          printf '{"schemaVersion":"curveyield-agent-file-import-failure-v1","requestId":"%s","status":"FAIL","workflowRunId":"%s"}\n' "$request_id" "$GITHUB_RUN_ID" > /tmp/import-failure.json
          encoded="$(base64 -w0 /tmp/import-failure.json)"
          api="repos/$GITHUB_REPOSITORY/contents/process/agent-file-import/failures/$safe_id.json"
          existing="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ "$existing" =~ ^[0-9a-f]{40}$ ]]; then
            gh api --method PUT "$api" -f message="chore(import): record failure $request_id" -f content="$encoded" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="chore(import): record failure $request_id" -f content="$encoded" -f branch=main >/dev/null
          fi

name: V7 Execution Infrastructure Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-execution-infrastructure-qualification.yml'
      - '.github/actions/setup-v7-toolchain/**'
      - 'packages/github-native-sim/src/**'
      - 'packages/github-native-sim/test/**'
      - 'packages/runner/src/**'
      - 'packages/runner/test/**'
      - 'packages/protocol/src/**'
      - 'process/RUNNER_MANIFEST.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/v7-execution-infrastructure-qualification.yml'
      - '.github/actions/setup-v7-toolchain/**'
      - 'packages/github-native-sim/src/**'
      - 'packages/github-native-sim/test/**'
      - 'packages/runner/src/**'
      - 'packages/runner/test/**'
      - 'packages/protocol/src/**'
      - 'process/RUNNER_MANIFEST.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: v7-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-v7-execution-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: v7-qualification-npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            v7-qualification-npm-${{ runner.os }}-

      - name: Install exact Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --omit=optional
            echo "V7_DEPENDENCY_LOCKED=true" >> "$GITHUB_ENV"
          else
            npm install --package-lock-only --ignore-scripts
            npm ci --omit=optional
            echo "V7_DEPENDENCY_LOCKED=false" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap package-lock into trusted main
        if: github.event_name != 'pull_request' && env.V7_DEPENDENCY_LOCKED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/package-lock.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -z "$existing_sha" ]; then
            content="$(base64 -w0 package-lock.json)"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/package-lock.json" \
              -f message='chore(v7): generate canonical dependency lock' \
              -f content="$content" \
              -f branch='main' >/dev/null
            echo "package_lock_published=true" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "package_lock_already_present=true" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install and verify canonical V7 toolchain
        uses: ./.github/actions/setup-v7-toolchain

      - name: Initialize qualification evidence
        run: mkdir -p .audit-evidence/v7-infrastructure-qualification

      - name: Record exact toolchain verification evidence
        run: npm run v7:toolchain:verify > .audit-evidence/v7-infrastructure-qualification/toolchain.json

      - name: Verify canonical runner manifest
        run: npm run v7:manifest -- --check

      - name: V7 request and execution contract qualification
        run: node --test packages/github-native-sim/test/*.test.mjs

      - name: Anvil-only runner qualification
        run: node --test packages/runner/test/anvil-*.test.mjs packages/runner/test/full-simulation-anvil-only-v1.test.mjs

      - name: Full repository Node test suite
        run: npm test

      - name: Repository static checks
        run: npm run lint

      - name: Repository build checks
        run: npm run build

      - name: Live trusted-main Phase 6 and Phase 7 mutable-Anvil qualification
        if: github.event_name != 'pull_request'
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createPhase6MutableRpcSession } from './packages/github-native-sim/src/phase6-mutable-rpc-v1.mjs';
          import { runPhase7ForkPreflightV2 } from './packages/github-native-sim/src/phase7-fork-preflight-v2.mjs';
          import { V7_POLICY } from './packages/github-native-sim/src/v7-policy.mjs';

          const phase6Session = await createPhase6MutableRpcSession({ environment: process.env });
          let phase6;
          try {
            phase6 = {
              ...phase6Session.evidence,
              runtime: phase6Session.runtime ? {
                identityNormalized: phase6Session.runtime.identityNormalized === true,
                blockNumber: phase6Session.runtime.blockNumber,
                blockHash: phase6Session.runtime.blockHash,
                profile: phase6Session.runtime.profile,
                rpcUrlExposed: false,
              } : null,
            };
          } finally {
            await phase6Session.close();
          }

          const expectedBlockHash='0xb7f45fdc91b604d7c0450a505cf5c9571c9bb6267c86b6a8d535f4bc11b3f4ee';
          const request={
            requestId:'dar-00000000000000000000000000000000', phaseId:'fork-simulation-lifecycle', profileId:V7_POLICY.profiles.simulate,
            source:{commit:'0000000000000000000000000000000000000000'},
            configuration:{evmVersion:'cancun',harness:{recipeId:'external-readiness-v1'},simulation:{chain:'ethereum',block:25817400,workflow:{steps:[
              {action:'staticCall',target:'0x73968b9a57c6E53d41345FD57a6E6ae27d6CDB2F',function:'decimals() view returns (uint8)',args:[],label:'qualified SDT external readiness'}
            ]}}}
          };
          const preflight=await runPhase7ForkPreflightV2({request,environment:process.env});
          const qualifiedCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const observed=preflight.observedPinnedBlockHash?.toLowerCase()??null;
          const checks={
            dependencyLockPresent:fs.existsSync('package-lock.json'),
            phase6MutableRpcPass:phase6.status==='PASS',
            phase6IdentityNormalized:phase6.runtime?.identityNormalized===true && phase6.identityNormalization?.status==='PASS',
            phase6RpcSecretNotExposed:JSON.stringify(phase6).includes(process.env.SIM_ARCHIVE_PRIMARY_ETHEREUM_01)===false,
            phase7PreflightPass:preflight.status==='PASS',
            recipeEnforced:preflight.checks?.lifecycleRecipe?.status==='PASS',
            recipeId:preflight.recipeId==='external-readiness-v1',
            ethereumMutableRpcOnly:preflight.chain==='ethereum',
            anvilOnly:preflight.checks?.anvilLauncher?.engine==='anvil',
            cancunAccepted:preflight.checks?.exactHardfork?.requested==='cancun',
            chainIdentityReconciled:preflight.checks?.chainIdentity?.status==='PASS',
            historicalStateAvailable:preflight.checks?.pinnedBlockState?.status==='PASS',
            targetCodePresent:preflight.checks?.targetCode?.status==='PASS',
            impersonationBalanceControl:preflight.checks?.impersonationBalanceControl?.status==='PASS',
            fixtureBlockHashMatches:observed===expectedBlockHash,
            workflowAllowlist:preflight.checks?.workflowActions?.status==='PASS'
          };
          const qualification={
            schemaVersion:'v7-execution-infrastructure-qualification-v4',
            status:Object.values(checks).every(Boolean)?'PASS':'FAIL',
            qualifiedCommit,
            requestSchema:V7_POLICY.requestSchema,
            profiles:Object.values(V7_POLICY.profiles),
            fullSimulationBackend:'anvil',
            mutableRpcPolicy:{supportedChains:['ethereum'],rpcProfile:V7_POLICY.mutableRpc.ethereumProfile,phase6IdentityPolicy:V7_POLICY.phase6.rpcIdentityPolicy},
            toolchain:{slither:V7_POLICY.tools.slither,medusa:V7_POLICY.tools.medusa,forge:V7_POLICY.tools.forge,anvilPackage:V7_POLICY.tools.anvilPackage},
            dependencyLockPresent:fs.existsSync('package-lock.json'),
            testMatrix:{githubNative:'PASS',anvilRunner:'PASS',fullNodeSuite:'PASS',staticChecks:'PASS',buildChecks:'PASS',toolchainVerification:'PASS'},
            phase6,
            fixture:{chain:'ethereum',block:25817400,expectedBlockHash},
            checks,
            phase7:preflight
          };
          fs.writeFileSync('.audit-evidence/v7-infrastructure-qualification/qualification.json',`${JSON.stringify(qualification,null,2)}\n`);
          if(qualification.status!=='PASS') process.exit(1);
          NODE

      - name: Publish canonical current qualification status
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const qualification=JSON.parse(fs.readFileSync('.audit-evidence/v7-infrastructure-qualification/qualification.json','utf8'));
          const toolchain=JSON.parse(fs.readFileSync('.audit-evidence/v7-infrastructure-qualification/toolchain.json','utf8'));
          const status={
            schemaVersion:'curveyield-v7-current-qualification-status-v1',
            status:'PASS',
            qualifiedCommit:qualification.qualifiedCommit,
            workflowRunId:process.env.GITHUB_RUN_ID,
            qualifiedAt:new Date().toISOString(),
            requestSchema:qualification.requestSchema,
            profiles:qualification.profiles,
            dependencyLockPresent:qualification.dependencyLockPresent,
            toolchain,
            testMatrix:qualification.testMatrix,
            phase6:{status:qualification.phase6.status,identityNormalization:qualification.phase6.identityNormalization,runtime:qualification.phase6.runtime},
            phase7:{status:qualification.phase7.status,checks:qualification.phase7.checks},
          };
          fs.writeFileSync('.audit-evidence/v7-infrastructure-qualification/current-status.json',`${JSON.stringify(status,null,2)}\n`);
          NODE
          content="$(base64 -w0 .audit-evidence/v7-infrastructure-qualification/current-status.json)"
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json" \
              -f message='chore(v7): refresh canonical qualification status' \
              -f content="$content" -f sha="$existing_sha" -f branch='main' >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/process/V7_QUALIFICATION_STATUS.json" \
              -f message='chore(v7): publish canonical qualification status' \
              -f content="$content" -f branch='main' >/dev/null
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-infrastructure-qualification-${{ github.sha }}
          path: .audit-evidence/v7-infrastructure-qualification
          if-no-files-found: warn
          retention-days: 30

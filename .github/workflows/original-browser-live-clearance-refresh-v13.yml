name: Original Browser Live Clearance Refresh v13
on:
  push:
    paths:
      - 'process/browser-agent-original-phase0-v1/live-clearance-refresh/*-v*.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./packages/browser-agent-original-phase0-v5/setup-runtime-v5
      - name: Observe live clearance refresh
        shell: bash
        run: xvfb-run -a node packages/browser-agent-original-phase0-v13/live-clearance-refresh-v13.mjs

name: Stake DAO Harvester Monitor
# Scans every Stake DAO v2 Curve vault and pushes the signed hot list to the Cloudflare Worker that harvests.
# Code: process/stakedao-harvester (SPEC.md §4). Secrets: SD_ETH_RPC_URL, SD_WORKER_URL, SD_HMAC_SECRET.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stakedao-harvester-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: process/stakedao-harvester/monitor
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: process/stakedao-harvester
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: process/stakedao-harvester/monitor/package-lock.json
      - run: npm ci --omit=dev
      # ledger + vault list live in the Actions cache (no commit every 5 minutes)
      - uses: actions/cache/restore@v4
        with:
          path: process/stakedao-harvester/monitor/state
          key: sd-harvester-ledger-${{ github.run_id }}
          restore-keys: sd-harvester-ledger-
      - run: node src/monitor.mjs
        env:
          ETH_RPC_URL: ${{ secrets.SD_ETH_RPC_URL }}
          WORKER_URL: ${{ secrets.SD_WORKER_URL }}
          HMAC_SECRET: ${{ secrets.SD_HMAC_SECRET }}
          STATE_DIR: state
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: process/stakedao-harvester/monitor/state
          key: sd-harvester-ledger-${{ github.run_id }}

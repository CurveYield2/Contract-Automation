name: Katana Network Specific Anvil Simulator v5

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v5/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v5.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v5/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-katana-fx-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Discover live Katana f(x) stack
        shell: bash
        run: |
          set -u
          mkdir -p packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v5/results
          RESULT=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v5/results/KATANA_FX_STACK_RESULT_v5.md
          RPC=https://katana.drpc.org/
          ROUTER=0x01F9894f92ea9224fECc8C35482E20a05De13582
          SAFE=0x47623C62f281807D615eeb4A2CEee9d97F9D3C49
          NEW_FXUSD=0x4c03ff0f44A55e7098a09016E02a01d3cdC2FDF9
          NEW_MANAGER=0x27b3eE81DF2Dd7356D5ac282e2416991A616f96a
          VBWBTC=0x0913DA6Da4b42f538B445599b46Bb4622342Cf52
          VBUSDC=0x203A662b0BD271A6ed5a60EdFbd04bFce608FD36
          TARGET_POOL=0x2d43e7931329dbb709f33d7049c937c6794bae10
          SUSHI_FACTORY=0x203e8740894c8955cB8950759876d7E7E45E04c1
          DETAILS="$RUNNER_TEMP/katana-fx-pool-details-v5.txt"
          : > "$DETAILS"

          TOKEN0="$(cast call "$TARGET_POOL" 'token0()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
          TOKEN1="$(cast call "$TARGET_POOL" 'token1()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
          POOL_FEE="$(cast call "$TARGET_POOL" 'fee()(uint24)' --rpc-url "$RPC" 2>/dev/null | awk '{print $1}')"
          FACTORY_POOL="$(cast call "$SUSHI_FACTORY" 'getPool(address,address,uint24)(address)' "$TOKEN0" "$TOKEN1" "$POOL_FEE" --rpc-url "$RPC" 2>/dev/null || true)"
          ROUTER_OWNER="$(cast call "$ROUTER" 'owner()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
          SAFE_THRESHOLD="$(cast call "$SAFE" 'getThreshold()(uint256)' --rpc-url "$RPC" 2>/dev/null | awk '{print $1}')"
          MANAGER_FXUSD="$(cast call "$NEW_MANAGER" 'fxUSD()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
          MANAGER_FXBASE="$(cast call "$NEW_MANAGER" 'fxBASE()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
          MANAGER_CONFIG="$(cast call "$NEW_MANAGER" 'configuration()(address)' --rpc-url "$RPC" 2>/dev/null || true)"

          LATEST="$(cast block-number --rpc-url "$RPC")"
          START=24000000
          CANDIDATES="$RUNNER_TEMP/katana-fx-address-candidates-v5.txt"
          : > "$CANDIDATES"
          for FROM in $(seq "$START" 250000 "$LATEST"); do
            TO=$((FROM + 249999))
            if [ "$TO" -gt "$LATEST" ]; then TO="$LATEST"; fi
            LOGS="$(cast logs --json --rpc-url "$RPC" --from-block "$FROM" --to-block "$TO" --address "$NEW_MANAGER" 2>/dev/null || true)"
            if [ -n "$LOGS" ]; then
              printf '%s\n' "$LOGS" | grep -oE '0x[0-9a-fA-F]{64}' | sed -E 's/^0x[0-9a-fA-F]{24}/0x/' >> "$CANDIDATES" || true
            fi
          done
          sort -fu "$CANDIDATES" -o "$CANDIDATES"

          MATCHING=""
          while read -r P; do
            [ -n "$P" ] || continue
            CODE="$(cast code "$P" --rpc-url "$RPC" 2>/dev/null || true)"
            [ -n "$CODE" ] && [ "$CODE" != '0x' ] || continue
            PCOLL="$(cast call "$P" 'collateralToken()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PFXUSD="$(cast call "$P" 'fxUSD()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PMGR="$(cast call "$P" 'poolManager()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            if [ -n "$PCOLL" ] || [ -n "$PFXUSD" ] || [ -n "$PMGR" ]; then
              echo "candidate=$P collateral=$PCOLL fxUSD=$PFXUSD manager=$PMGR" >> "$DETAILS"
            fi
            if [ "$(echo "$PCOLL" | tr '[:upper:]' '[:lower:]')" = "$(echo "$VBWBTC" | tr '[:upper:]' '[:lower:]')" ] &&
               [ "$(echo "$PFXUSD" | tr '[:upper:]' '[:lower:]')" = "$(echo "$NEW_FXUSD" | tr '[:upper:]' '[:lower:]')" ] &&
               [ "$(echo "$PMGR" | tr '[:upper:]' '[:lower:]')" = "$(echo "$NEW_MANAGER" | tr '[:upper:]' '[:lower:]')" ]; then
              MATCHING="$MATCHING $P"
            fi
          done < "$CANDIDATES"

          ROUTER_CODE="$(cast code "$ROUTER" --rpc-url "$RPC" 2>/dev/null || true)"
          MANAGER_CODE="$(cast code "$NEW_MANAGER" --rpc-url "$RPC" 2>/dev/null || true)"
          GLOBAL_FEE="$(cast call "$ROUTER" 'feeBps()(uint16)' --rpc-url "$RPC" 2>/dev/null | awk '{print $1}' || true)"

          {
            echo '# Katana f(x) Stack Result v5'
            echo
            echo "- chain_id: $(cast chain-id --rpc-url "$RPC")"
            echo "- Katana_fxUSD: $NEW_FXUSD"
            echo "- PoolManager: $NEW_MANAGER"
            echo "- PoolManager_fxUSD: $MANAGER_FXUSD"
            echo "- PoolManager_fxBASE: $MANAGER_FXBASE"
            echo "- PoolManager_configuration: $MANAGER_CONFIG"
            echo "- vbWBTC: $VBWBTC"
            echo "- matching_vbWBTC_f(x)_pools: $MATCHING"
            echo "- target_Sushi_pool: $TARGET_POOL"
            echo "- target_pool_token0: $TOKEN0"
            echo "- target_pool_token1: $TOKEN1"
            echo "- target_pool_fee: $POOL_FEE"
            echo "- Sushi_factory_getPool: $FACTORY_POOL"
            echo "- router: $ROUTER"
            echo "- router_owner: $ROUTER_OWNER"
            echo "- Safe_threshold: $SAFE_THRESHOLD"
            echo "- router_global_fee_bps: $GLOBAL_FEE"
            echo
            echo '## Pool candidates decoded from PoolManager logs'
            echo '~~~text'
            cat "$DETAILS"
            echo '~~~'
            echo
            echo '## PoolManager selectors'
            echo '~~~text'
            cast selectors "$MANAGER_CODE" --resolve 2>&1 || cast selectors "$MANAGER_CODE" 2>&1 || true
            echo '~~~'
            echo
            echo '## Router selectors'
            echo '~~~text'
            cast selectors "$ROUTER_CODE" --resolve 2>&1 || cast selectors "$ROUTER_CODE" 2>&1 || true
            echo '~~~'
          } > "$RESULT"

          RC=0
          test "$(echo "$MANAGER_FXUSD" | tr '[:upper:]' '[:lower:]')" = "$(echo "$NEW_FXUSD" | tr '[:upper:]' '[:lower:]')" || RC=1
          test "$(echo "$FACTORY_POOL" | tr '[:upper:]' '[:lower:]')" = "$(echo "$TARGET_POOL" | tr '[:upper:]' '[:lower:]')" || RC=1
          test "$(echo "$ROUTER_OWNER" | tr '[:upper:]' '[:lower:]')" = "$(echo "$SAFE" | tr '[:upper:]' '[:lower:]')" || RC=1
          test "$SAFE_THRESHOLD" = '1' || RC=1
          test -n "$MATCHING" || RC=1
          echo "DISCOVERY_RC=$RC" >> "$GITHUB_ENV"

      - name: Persist Katana discovery result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CurveYield2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v5/results/KATANA_FX_STACK_RESULT_v5.md
          if ! git diff --cached --quiet; then
            git commit -m 'sim: record Katana f(x) stack discovery v5 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce Katana discovery
        shell: bash
        run: test "${DISCOVERY_RC:-1}" = '0'

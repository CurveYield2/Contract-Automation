name: Verify automatic staking reward synchronization v3
# Release scope: dedicated Fraxtal helper v5; no boost dependency on Fraxtal.
# Windows input accepts the UTF-8 byte-order mark emitted by PowerShell 5.1.
on:
  push:
    branches: ['package-boosthub-reward-sync-v1']
    paths: ['.github/workflows/package-boosthub-dual-chain-v1.yml']
permissions:
  contents: read
concurrency:
  group: package-boosthub-dual-chain-v1
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install read-only tooling on GitHub
        working-directory: github-native-sim/boosthub-dual-chain-package-v1
        run: |
          cp package_v1.json package.json
          npm install --ignore-scripts
      - name: Select configured private-source credential
        env:
          AUDIT_CONTROLLER_PROBE_REPOSITORY: CurveYield2/Audit-Controller
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: d0db80e69bf968d5c20377fed1d344b08945ced6
          token: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          sparse-checkout: audits/functional-verification/boosthub-four-contracts-v1
      - name: Install exact compilers and libraries only on GitHub
        run: |
          python3 -m pip install vyper==0.4.3
          git clone --depth 1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git .controller/audits/functional-verification/boosthub-four-contracts-v1/lib/openzeppelin-contracts
          test "$(git -C .controller/audits/functional-verification/boosthub-four-contracts-v1/lib/openzeppelin-contracts rev-parse HEAD)" = c64a1edb67b6e3f4a15cca8909c9482ad33a02b0
          mkdir -p github-native-sim/boosthub-dual-chain-package-v1/lib/solmate
          git -C github-native-sim/boosthub-dual-chain-package-v1/lib/solmate init
          git -C github-native-sim/boosthub-dual-chain-package-v1/lib/solmate remote add origin https://github.com/transmissions11/solmate.git
          git -C github-native-sim/boosthub-dual-chain-package-v1/lib/solmate fetch --depth 1 origin 89365b880c4f3c786bdd453d4b8e8fe410344a69
          git -C github-native-sim/boosthub-dual-chain-package-v1/lib/solmate checkout --detach FETCH_HEAD
          test "$(git -C github-native-sim/boosthub-dual-chain-package-v1/lib/solmate rev-parse HEAD)" = 89365b880c4f3c786bdd453d4b8e8fe410344a69
          ln -s "$GITHUB_WORKSPACE/.controller/audits/functional-verification/boosthub-four-contracts-v1/lib/openzeppelin-contracts" github-native-sim/boosthub-dual-chain-package-v1/lib/openzeppelin-contracts
      - name: Restore verified original dependencies and compile Vyper
        run: python3 github-native-sim/boosthub-dual-chain-package-v1/prepare_build_v1.py
      - name: Verify the updated Hub, both helpers and staking together
        working-directory: .controller/audits/functional-verification/boosthub-four-contracts-v1
        run: |
          cp "$GITHUB_WORKSPACE/github-native-sim/boosthub-dual-chain-package-v1/RewardTokenSync_v1.t.sol" test/RewardTokenSync_v1.t.sol
          set -o pipefail
          forge test --match-contract RewardTokenSyncTest -vv 2>&1 | tee "$GITHUB_WORKSPACE/github-native-sim/boosthub-dual-chain-package-v1/evidence/reward_sync_red_v1.txt"
      - name: Publish reward-sync baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-reward-sync-red-v1
          path: github-native-sim/boosthub-dual-chain-package-v1/evidence
          retention-days: 30

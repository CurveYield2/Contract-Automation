name: V7 v8 Conformance CI v1

on:
  push:
    branches:
      - upgrade/v7-v8-conformance-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository dependencies on GitHub runner
        run: npm install --no-package-lock

      - name: Verify active runner manifest digest
        run: |
          test "$(sha256sum process/RUNNER_MANIFEST_v1.json | awk '{print $1}')" = "2bebd99bb8ae770eb2feca0de7dc7e54596127a0c768922189e907e6658773dc"

      - name: Focused V7 v8 execution tests
        run: node --test packages/github-native-sim/test/*.test.mjs

      - name: Full Node test suite
        run: node --test

      - name: Static checks
        run: node scripts/check.mjs

      - name: Build checks
        run: node scripts/build.mjs

      - name: Record exact candidate identity
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "request_base_sha=612fa50264e587e3f24550bf4dae35719b04211c" >> "$GITHUB_STEP_SUMMARY"
          echo "runner_manifest_sha256=2bebd99bb8ae770eb2feca0de7dc7e54596127a0c768922189e907e6658773dc" >> "$GITHUB_STEP_SUMMARY"

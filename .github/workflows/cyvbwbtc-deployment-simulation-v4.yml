name: cyvbWBTC Deployment Simulation v4

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v4.mjs'
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/requests/request-v4.json'
      - '.github/workflows/cyvbwbtc-deployment-simulation-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CurveYield2/Smart-Contracts
          ref: 7978ea62c58f8efa49c91f37931cab267379e0ee
          path: .smart-contracts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --force
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git
      - name: Execute traced cyvbWBTC deployment lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cyvbwbtc-deployment-simulation-output-v4
          node packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v4.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --output cyvbwbtc-deployment-simulation-output-v4
      - name: Show summary
        if: always()
        shell: bash
        run: |
          f=cyvbwbtc-deployment-simulation-output-v4/CYVBWBTC_DEPLOYMENT_SIMULATION_SUMMARY_v4.json
          [ -f "$f" ] && cat "$f" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbwbtc-deployment-simulation-v4-${{ github.run_id }}
          path: cyvbwbtc-deployment-simulation-output-v4
          if-no-files-found: warn
          retention-days: 14

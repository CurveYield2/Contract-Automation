name: cyvbWBTC Deployment Lifecycle Simulation v1

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/requests/request-v1.json'
      - '.github/workflows/cyvbwbtc-deployment-simulation-v1.yml'
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Smart-Contracts
          ref: d071dcbb92bc318822bab0bc0b030752c62a3f0a
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation simulation dependencies
        run: npm ci --force

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in Smart-Contracts runner checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run cyvbWBTC lifecycle simulation on Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cyvbwbtc-deployment-simulation-output-v1
          node packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v1.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --output cyvbwbtc-deployment-simulation-output-v1

      - name: Show lifecycle simulation summary
        if: always()
        shell: bash
        run: |
          summary=cyvbwbtc-deployment-simulation-output-v1/CYVBWBTC_DEPLOYMENT_SIMULATION_SUMMARY_v1.json
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "::error::Simulation summary missing"
          fi

      - name: Upload lifecycle simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbwbtc-deployment-simulation-v1-${{ github.run_id }}
          path: cyvbwbtc-deployment-simulation-output-v1
          if-no-files-found: warn
          retention-days: 14

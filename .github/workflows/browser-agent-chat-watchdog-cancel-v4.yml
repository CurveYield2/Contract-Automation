name: Browser Agent Chat Watchdog Cancel v4

on:
  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-chat-watchdog/cancel/*.json'

permissions:
  actions: write
  contents: read

jobs:
  cancel_watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 2

      - name: Cancel requested watchdog run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request_path="$(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^process/browser-agent-chat-watchdog/cancel/[^/]+\.json$' |
            tail -n 1
          )"
          [ -n "$request_path" ] && [ -f "$request_path" ] || {
            echo "::error::No watchdog cancel request JSON found."
            exit 2
          }

          run_id="$(jq -r '.run_id // empty' "$request_path")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::run_id must be numeric."
            exit 2
          }

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          workflow_path="$(jq -r '.path // empty' <<<"$run_json")"
          status="$(jq -r '.status // empty' <<<"$run_json")"

          if [ "$workflow_path" != ".github/workflows/browser-agent-chat-watchdog-v7.yml" ]; then
            echo "::error::Refusing to cancel non-v7 watchdog run $run_id."
            exit 3
          fi

          [ "$status" = "completed" ] && exit 0

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
          for _ in 1 2 3 4 5; do
            sleep 3
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
            [ "$status" = "completed" ] && exit 0
          done

          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null

name: Original Browser Clearance Metadata v12
on:
  push:
    paths:
      - 'process/browser-agent-original-phase0-v1/clearance-metadata/*-v*.json'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
    steps:
      - name: Inspect non-secret clearance metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHATGPT_STORAGE_STATE_B64"
          printf '%s' "$CHATGPT_STORAGE_STATE_B64" | base64 -d > /tmp/storage.json
          now="$(date -u +%s)"
          echo "now_epoch=$now"
          jq -c --argjson now "$now" '
            [.cookies[]
             | select(.name=="cf_clearance" or .name=="__cf_bm")
             | {name,domain,path,expires,httpOnly,secure,sameSite,
                secondsRemaining:(if (.expires|type)=="number" and .expires>0 then (.expires-$now) else null end)}]
          ' /tmp/storage.json

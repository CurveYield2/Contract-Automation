name: cyvbUSDC Deployment Simulation v1

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/cyvbusdc-deployment-simulation-v1/**'
      - '.github/workflows/cyvbusdc-deployment-simulation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Smart-Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Smart-Contracts
          ref: fd0a01ab0e4a066a4e4ef8d28a6987a194ab5f45
          path: .smart-contracts
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Contract-Automation simulation dependencies
        run: npm ci --force

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std in Smart-Contracts runner checkout
        working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Run cyvbUSDC Katana deployment simulation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cyvbusdc-deployment-simulation-output
          node packages/github-native-sim/audit-harnesses/cyvbusdc-deployment-simulation-v1/run-v1.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://rpc.katana.network/ \
            --output .cyvbusdc-deployment-simulation-output

      - name: Show deployment simulation summary
        if: always()
        shell: bash
        run: |
          summary=.cyvbusdc-deployment-simulation-output/CYVBUSDC_DEPLOYMENT_SIMULATION_SUMMARY_v1.json
          if [ -f "$summary" ]; then
            cat "$summary"
          else
            echo "::error::Simulation summary missing"
          fi

      - name: Upload deployment simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbusdc-deployment-simulation-v1-${{ github.run_id }}
          path: .cyvbusdc-deployment-simulation-output
          if-no-files-found: warn
          retention-days: 14

      - name: Require deployment simulation PASS
        shell: bash
        run: |
          jq -e '.status == "PASS"' \
            .cyvbusdc-deployment-simulation-output/CYVBUSDC_DEPLOYMENT_SIMULATION_SUMMARY_v1.json >/dev/null

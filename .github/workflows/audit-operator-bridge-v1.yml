name: Audit Operator Bridge v1

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: audit-operator-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  project-private-controller-state:
    if: >-
      startsWith(github.event.issue.title, '[agent] audit-operator ') &&
      !github.event.issue.pull_request &&
      (github.event.issue.user.login == 'CurveYield-Developer-DK' || github.event.issue.user.login == 'JamesNexus')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIT_CONTROLLER_REPOSITORY: CurveYield2/Audit-Controller
    steps:
      - name: Checkout trusted public bridge
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse immutable operator trigger
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseAuditOperatorIssueV1 } from './packages/audit-operator-bridge/src/issue-trigger-v1.mjs';
          const parsed = parseAuditOperatorIssueV1({ title: process.env.ISSUE_TITLE, body: process.env.ISSUE_BODY });
          fs.writeFileSync('/tmp/audit-operator-trigger.json', JSON.stringify(parsed, null, 2) + '\n');
          for (const [key, value] of Object.entries({
            OPERATOR_REQUEST_ID: parsed.requestId,
            AUDIT_CONTROLLER_REF: parsed.controllerRef,
            OPERATOR_REQUEST_PATH: parsed.requestPath,
          })) fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          NODE

      - name: Verify private-controller bridge credential
        env:
          CONTROLLER_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CONTROLLER_TOKEN:-}" ]; then
            echo "::error::AUDIT_CONTROLLER_GITHUB_TOKEN is missing; public-to-private bridge authentication is unavailable"
            exit 41
          fi
          if ! GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/$AUDIT_CONTROLLER_REPOSITORY" --silent; then
            echo "::error::AUDIT_CONTROLLER_GITHUB_TOKEN cannot read $AUDIT_CONTROLLER_REPOSITORY; repair the existing bridge credential"
            exit 42
          fi

      - name: Checkout exact private controller commit
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: ${{ env.AUDIT_CONTROLLER_REF }}
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .audit-controller
          persist-credentials: true
          fetch-depth: 1

      - name: Verify complete private controller codebase on public runner
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          npm run verify

      - name: Validate private operator request
        shell: bash
        run: |
          set -euo pipefail
          request=".audit-controller/$OPERATOR_REQUEST_PATH"
          test -f "$request"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const request = JSON.parse(fs.readFileSync(`.audit-controller/${process.env.OPERATOR_REQUEST_PATH}`, 'utf8'));
          if (request.schemaVersion !== 'audit-workload-reduction-request-v1') throw new Error('request schemaVersion mismatch');
          const operations = new Set(['PROJECT_CURRENT_STATE','BUILD_EXECUTION_REQUEST','INGEST_EXECUTION_EVIDENCE','BUILD_SUCCESSOR_HANDOFF']);
          if (typeof request.operation !== 'string' || !operations.has(request.operation)) throw new Error('explicit supported operator operation is required');
          const operation = request.operation;
          if (request.requestId !== process.env.OPERATOR_REQUEST_ID) throw new Error('request id mismatch');
          const safePath = /^(?!\/)(?!.*\\)(?!.*(?:^|\/)\.\.(?:\/|$)).+/;
          for (const field of ['skillPackagePath','writebackDirectory']) {
            if (typeof request[field] !== 'string' || !safePath.test(request[field])) throw new Error(`invalid ${field}`);
          }
          for (const field of [
            'campaignPath','campaignStatePath','phaseContractPath','phaseStartPath','completionReportPath',
            'automationCompletionReportPath','executionTemplatePath','semanticInputPath','executionRequestPath',
            'executionEvidencePath','qualificationPath','handoffInputPath','currentWorkPacketPath'
          ]) {
            if (request[field] !== undefined && (typeof request[field] !== 'string' || !safePath.test(request[field]))) throw new Error(`invalid ${field}`);
          }
          if (request.expectedSkillSha256 !== undefined && !/^[0-9a-f]{64}$/.test(request.expectedSkillSha256)) throw new Error('invalid expectedSkillSha256');
          if (typeof request.writebackRef !== 'string' || !/^[A-Za-z0-9._\/-]+$/.test(request.writebackRef)) throw new Error('invalid writebackRef');
          fs.appendFileSync(process.env.GITHUB_ENV, `SKILL_PACKAGE_PATH=${request.skillPackagePath}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `WRITEBACK_DIRECTORY=${request.writebackDirectory}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `WRITEBACK_REF=${request.writebackRef}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_WRITEBACK_HEAD=${process.env.AUDIT_CONTROLLER_REF}\n`);
          NODE

      - name: Verify claimed Contract-Automation executions against GitHub
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const request = JSON.parse(fs.readFileSync(`.audit-controller/${process.env.OPERATOR_REQUEST_PATH}`, 'utf8'));
          if (!request.automationCompletionReportPath) process.exit(0);
          const reportPath = `.audit-controller/${request.automationCompletionReportPath}`;
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const api = (endpoint) => JSON.parse(execFileSync('gh', ['api', endpoint], { encoding:'utf8', env:process.env }));
          for (const execution of report.executions ?? []) {
            if (execution.repository !== process.env.GITHUB_REPOSITORY) throw new Error(`unsupported execution repository ${execution.repository}`);
            const run = api(`repos/${execution.repository}/actions/runs/${execution.runId}`);
            if (run.status !== 'completed') throw new Error(`run ${execution.runId} is not completed`);
            if (run.conclusion !== 'success') throw new Error(`run ${execution.runId} conclusion is ${run.conclusion}`);
            if (execution.jobId) {
              const job = api(`repos/${execution.repository}/actions/jobs/${execution.jobId}`);
              if (job.run_id !== execution.runId) throw new Error(`job ${execution.jobId} does not belong to run ${execution.runId}`);
              if (job.status !== 'completed' || job.conclusion !== 'success') throw new Error(`job ${execution.jobId} is not successful terminal evidence`);
            }
            if (execution.artifactId) {
              const artifact = api(`repos/${execution.repository}/actions/artifacts/${execution.artifactId}`);
              if (artifact.expired) throw new Error(`artifact ${execution.artifactId} is expired`);
              if (artifact.workflow_run?.id && artifact.workflow_run.id !== execution.runId) throw new Error(`artifact ${execution.artifactId} run mismatch`);
              if (execution.artifactDigest && artifact.digest) {
                const observed = String(artifact.digest).replace(/^sha256:/,'');
                if (observed !== execution.artifactDigest) throw new Error(`artifact ${execution.artifactId} digest mismatch`);
              }
            }
          }
          if (report.qualification) {
            const q = report.qualification;
            const run = api(`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${q.workflowRunId}`);
            if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('qualification run is not successful terminal evidence');
            if (run.head_sha !== q.qualifiedCommit) throw new Error('qualification commit mismatch');
          }
          NODE

      - name: Extract exact admitted skill package
        shell: bash
        run: |
          set -euo pipefail
          skill_zip=".audit-controller/$SKILL_PACKAGE_PATH"
          test -f "$skill_zip"
          expected_skill_sha="$(node -e "const r=require('./.audit-controller/' + process.env.OPERATOR_REQUEST_PATH); process.stdout.write(r.expectedSkillSha256 || '')")"
          if [ -n "$expected_skill_sha" ]; then
            observed_skill_sha="$(sha256sum "$skill_zip" | awk '{print $1}')"
            test "$observed_skill_sha" = "$expected_skill_sha"
          fi
          rm -rf .audit-skill
          mkdir -p .audit-skill
          unzip -q "$skill_zip" -d .audit-skill
          skill_home="$(find .audit-skill -type f -name SKILL.md -not -path '*/optional-modes/lite-pathway/SKILL.md' | head -n1)"
          test -n "$skill_home"
          echo "SKILL_ROOT=$(dirname "$skill_home")" >> "$GITHUB_ENV"

      - name: Generate deterministic work projection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .operator-output
          mkdir -p .operator-output
          node .audit-controller/packages/controller-core/src/audit-operator-cli-v1.mjs             --request ".audit-controller/$OPERATOR_REQUEST_PATH"             --controller-root ".audit-controller"             --skill-root "$SKILL_ROOT"             --output-dir ".operator-output"
          test -f .operator-output/RESULT_v1.json

      - name: Write projection back to private controller branch
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git fetch origin "$WRITEBACK_REF"
          remote_head="$(git rev-parse "origin/$WRITEBACK_REF")"
          if [ "$remote_head" != "$EXPECTED_WRITEBACK_HEAD" ]; then
            echo "Writeback head changed: expected $EXPECTED_WRITEBACK_HEAD observed $remote_head" >&2
            exit 1
          fi
          git checkout -B "$WRITEBACK_REF" "origin/$WRITEBACK_REF"
          mkdir -p "$WRITEBACK_DIRECTORY"
          cp ../.operator-output/* "$WRITEBACK_DIRECTORY"/
          git add "$WRITEBACK_DIRECTORY"
          if git diff --cached --quiet; then
            echo "No writeback changes required."
          else
            git config user.name 'CurveYield Audit Operator'
            git config user.email 'audit-operator@users.noreply.github.com'
            git commit -m "chore(audit): refresh workload projection $OPERATOR_REQUEST_ID"
            git push origin "HEAD:$WRITEBACK_REF"
          fi

      - name: Publish non-sensitive completion marker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          retirement="$(node -e "const r=require('./.operator-output/RESULT_v1.json'); process.stdout.write(String(r.retirementAllowed))")"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed             --comment "Audit operator request $OPERATOR_REQUEST_ID completed on the exact private controller commit. Results were written back only to the private Audit-Controller branch. retirementAllowed=$retirement."

      - name: Publish failure marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "Audit operator request failed closed. No private audit evidence is copied into this public issue. Inspect this workflow run and repair/retry through the bridge."


  verify-private-controller:
    if: >-
      startsWith(github.event.issue.title, '[agent] verify-audit-controller ') &&
      !github.event.issue.pull_request &&
      (github.event.issue.user.login == 'CurveYield-Developer-DK' || github.event.issue.user.login == 'JamesNexus')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Parse exact private controller commit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const match = process.env.ISSUE_TITLE.match(/^\[agent\] verify-audit-controller ([0-9a-f]{40})$/);
          if (!match) throw new Error('title must be exactly: [agent] verify-audit-controller <40-hex-commit>');
          fs.appendFileSync(process.env.GITHUB_ENV, `AUDIT_CONTROLLER_REF=${match[1]}\n`);
          NODE

      - name: Verify private-controller bridge credential
        env:
          CONTROLLER_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CONTROLLER_TOKEN:-}" ]; then
            echo "::error::AUDIT_CONTROLLER_GITHUB_TOKEN is missing"
            exit 41
          fi
          if ! GH_TOKEN="$CONTROLLER_TOKEN" gh api "repos/CurveYield2/Audit-Controller" --silent; then
            echo "::error::AUDIT_CONTROLLER_GITHUB_TOKEN cannot read CurveYield2/Audit-Controller"
            exit 42
          fi

      - name: Checkout exact private controller commit
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: ${{ env.AUDIT_CONTROLLER_REF }}
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .audit-controller
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run complete Audit-Controller verification
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          npm run verify

      - name: Close successful verification issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed             --comment "Exact Audit-Controller commit $AUDIT_CONTROLLER_REF passed the complete npm run verify suite on the public Contract-Automation runner."

      - name: Publish failed verification marker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"             --body "Exact Audit-Controller verification failed closed. Inspect this workflow run. No private repository contents are published in this issue."

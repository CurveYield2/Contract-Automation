name: Validate restored Contract Automation source

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  validate:
    if: ${{ github.event.issue.title == 'VALIDATE_RESTORED_CA_V1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Lint / syntax validation
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Remove one-time validator
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-restored-source-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'remove one-time restore validator'
          git push origin HEAD:main

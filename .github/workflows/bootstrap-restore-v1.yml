name: Bootstrap restored source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand clean restored source
        run: |
          set -euo pipefail
          test -f Contract-Automation_working_source_v1.zip
          unzip -oq Contract-Automation_working_source_v1.zip -d .restore_tmp
          cp -a .restore_tmp/. .
          rm -rf .restore_tmp Contract-Automation_working_source_v1.zip
          rm -f .bootstrap-trigger-v1 .github/workflows/bootstrap-restore-v1.yml
      - name: Verify restored source
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run lint
          npm run build
      - name: Commit restored tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'restore complete working contract automation source'
          git push origin HEAD:main

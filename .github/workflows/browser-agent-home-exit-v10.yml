name: Original Phase0 Home-Exit Browser v10

on:
  workflow_dispatch:
    inputs:
      action:
        description: Observe/authenticate only or send a wake
        required: true
        default: observe
        type: choice
        options:
          - observe
          - wake
      mode:
        description: Browser mode
        required: true
        default: create_fresh
        type: choice
        options:
          - create_fresh
          - resume_existing
      chat_url:
        description: Existing ChatGPT conversation URL for resume_existing
        required: false
        default: https://chatgpt.com/c/6abe90a0-fd68-83e8-8026-8af0171605fc
        type: string
      wake_message:
        description: Message to send when action=wake
        required: false
        default: "[HOME_EXIT_PLAYWRIGHT_WAKE_v10] Assistant: when you personally receive this as a new user message, reply exactly HOME_EXIT_PLAYWRIGHT_WAKE_PERSONALLY_SEEN_v10"
        type: string
      home_exit_node:
        description: Windows PC Tailscale IP or MagicDNS name
        required: true
        default: 100.112.238.56
        type: string
      interactive_view:
        description: Expose the runner Chrome display privately over Tailscale VNC
        required: true
        default: true
        type: boolean
      manual_challenge_wait_minutes:
        description: Maximum wait for manual login/verification
        required: true
        default: "15"
        type: string

permissions:
  contents: read

concurrency:
  group: original-phase0-home-exit-browser-v10
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      CHATGPT_SESSION_STATE_KEY_B64: ${{ secrets.CHATGPT_SESSION_STATE_KEY_B64 }}
      DISPLAY: ":99"
      BROWSER_HEADLESS: "false"
      CHATGPT_SESSION_STATE_PATH: /tmp/curveyield-browser-agent-v10/session-state-v1.enc.json
      CHATGPT_SESSION_STATE_UPDATED_MARKER: /tmp/curveyield-browser-agent-v10/session-state-updated
      WAKE_RESULT_PATH: /tmp/browser-agent-home-exit-v10-result.json

    steps:
      - name: Checkout trusted browser package
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up isolated Playwright runtime
        uses: ./packages/browser-agent-original-phase0-v10/runtime-v10

      - name: Restore encrypted browser session state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/curveyield-browser-agent-v10/session-state-v1.enc.json
          key: chatgpt-home-exit-session-v10-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chatgpt-home-exit-session-v10-

      - name: Install private VNC helper
        if: inputs.interactive_view
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"
          echo "Recorded runner egress fingerprint without logging the address."

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ inputs.home_exit_node }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        env:
          INTERACTIVE_VIEW: ${{ inputs.interactive_view }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-v8.log 2>&1 &
          echo $! >/tmp/xvfb-v8.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            echo "::error::Xvfb did not become ready."
            cat /tmp/xvfb-v8.log || true
            exit 1
          }

          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"

          if [ "$INTERACTIVE_VIEW" = "true" ]; then
            x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-v8.log 2>&1 &
            echo $! >/tmp/x11vnc-v8.pid
            echo "TAILSCALE_VNC=$ts_ip:5900"
            echo "Connect your VNC viewer from the Windows PC to $ts_ip:5900 while this job is running."
          fi

      - name: Route browser phase through home exit node
        shell: bash
        env:
          HOME_EXIT_NODE: ${{ inputs.home_exit_node }}
        run: |
          set -euo pipefail
          tailscale status
          sudo tailscale set --exit-node="$HOME_EXIT_NODE"

          changed=false
          for i in {1..15}; do
            current="$(curl -fsS --max-time 15 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then
                changed=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$changed" != "true" ]; then
            echo "::error::Tailscale exit node did not change runner egress."
            exit 1
          fi
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Run Playwright through home exit node
        id: browser
        shell: bash
        env:
          WAKE_ACTION: ${{ inputs.action }}
          WAKE_MODE: ${{ inputs.mode }}
          CHAT_URL: ${{ inputs.chat_url }}
          WAKE_MESSAGE: ${{ inputs.wake_message }}
          WAKE_ID: home-exit-playwright-v10-${{ github.run_id }}
          INTERACTIVE_VIEW_ENABLED: ${{ inputs.interactive_view }}
          MANUAL_CHALLENGE_WAIT_MINUTES: ${{ inputs.manual_challenge_wait_minutes }}
        run: |
          set -euo pipefail
          export MANUAL_CHALLENGE_WAIT_MS=$((MANUAL_CHALLENGE_WAIT_MINUTES * 60000))
          if [ "$INTERACTIVE_VIEW_ENABLED" = "true" ]; then
            echo "Private VNC: $TAILSCALE_RUNNER_IP:5900"
          fi

          node packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs
          test -s "$WAKE_RESULT_PATH"
          cat "$WAKE_RESULT_PATH"

          if [ "$WAKE_ACTION" = "observe" ]; then
            jq -e '.ok==true and .provider=="github-playwright"' "$WAKE_RESULT_PATH" >/dev/null
          else
            jq -e '.ok==true and .provider=="github-playwright" and (.posted==true or .skipped=="PRODUCTIVE_GENERATING")' "$WAKE_RESULT_PATH" >/dev/null
          fi

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""
          echo "Home exit-node routing disabled for post-browser workflow steps."

      - name: Save refreshed encrypted browser session state
        if: steps.browser.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /tmp/curveyield-browser-agent-v10/session-state-v1.enc.json
          key: chatgpt-home-exit-session-v10-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-v8.pid ] && kill "$(cat /tmp/x11vnc-v8.pid)" 2>/dev/null
          [ -f /tmp/xvfb-v8.pid ] && kill "$(cat /tmp/xvfb-v8.pid)" 2>/dev/null

name: Original Phase0 Home-Exit Browser v10

on:
  workflow_dispatch:
    inputs:
      action:
        description: Observe/authenticate only or send a wake
        required: true
        default: observe
        type: choice
        options:
          - observe
          - wake
          - recover
          - project_wake
      mode:
        description: Browser mode
        required: true
        default: create_fresh
        type: choice
        options:
          - create_fresh
          - resume_existing
      chat_url:
        description: Existing ChatGPT conversation URL for resume_existing
        required: false
        default: https://chatgpt.com/c/6abe90a0-fd68-83e8-8026-8af0171605fc
        type: string
      project_name:
        description: Project name for action=project_wake
        required: false
        default: "Home Exit Project Test"
        type: string
      project_url:
        description: Persisted ChatGPT Project URL to reuse for action=project_wake or recover
        required: false
        default: ""
        type: string
      recovery_chat_title:
        description: Visible Project chat title used only by action=recover
        required: false
        default: ""
        type: string
      wake_message:
        description: Message to send when action=wake or project_wake
        required: false
        default: "[HOME_EXIT_PLAYWRIGHT_WAKE_v10] Assistant: when you personally receive this as a new user message, reply exactly HOME_EXIT_PLAYWRIGHT_WAKE_PERSONALLY_SEEN_v10"
        type: string
      home_exit_node:
        description: Windows PC Tailscale IP or MagicDNS name
        required: true
        default: 100.112.238.56
        type: string
      interactive_view:
        description: Expose the runner Chrome display privately over Tailscale VNC
        required: true
        default: true
        type: boolean
      manual_challenge_wait_minutes:
        description: Maximum wait for manual login/verification
        required: true
        default: "5"
        type: string

  push:
    branches:
      - main
    paths:
      - 'process/browser-agent-home-exit-v10/current-request-v10.json'
      - 'packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: original-phase0-home-exit-browser-v10
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      DISPLAY: ":99"
      BROWSER_HEADLESS: "false"
      WAKE_RESULT_PATH: /tmp/browser-agent-home-exit-v10-result.json
      CHAT_STATE_PATH: /tmp/browser-agent-home-exit-v10-chat-state-v1.json

    steps:
      - name: Checkout trusted browser package
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1


      - name: Restore latest durable chat state
        id: prior_chat_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="/tmp/browser-agent-home-exit-v10-prior-chat-state-v1.json"
          echo "state_path=" >> "$GITHUB_OUTPUT"

          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=browser-agent-home-exit-v10-chat-state-v1&per_page=100"             --jq '[.artifacts[] | select(.expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
          if [ -z "$artifact_id" ]; then
            echo "No prior durable chat-state artifact found."
            exit 0
          fi

          rm -rf /tmp/browser-chat-state-restore /tmp/browser-chat-state.zip
          mkdir -p /tmp/browser-chat-state-restore
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"             -o /tmp/browser-chat-state.zip
          unzip -q /tmp/browser-chat-state.zip -d /tmp/browser-chat-state-restore

          restored="$(find /tmp/browser-chat-state-restore -type f -name 'browser-agent-home-exit-v10-chat-state-v1.json' -print -quit)"
          if [ -z "$restored" ] || [ ! -s "$restored" ]; then
            echo "Prior artifact did not contain durable chat state."
            exit 0
          fi

          cp "$restored" "$state"
          jq -e '.version==1 and (.chatUrl|type=="string")' "$state" >/dev/null
          echo "state_path=$state" >> "$GITHUB_OUTPUT"
          echo "Restored prior durable browser chat state."

      - name: Resolve browser request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CHAT_URL: ${{ inputs.chat_url }}
          INPUT_WAKE_MESSAGE: ${{ inputs.wake_message }}
          INPUT_PROJECT_NAME: ${{ inputs.project_name }}
          INPUT_PROJECT_URL: ${{ inputs.project_url }}
          INPUT_RECOVERY_CHAT_TITLE: ${{ inputs.recovery_chat_title }}
          INPUT_HOME_EXIT_NODE: ${{ inputs.home_exit_node }}
          INPUT_INTERACTIVE_VIEW: ${{ inputs.interactive_view }}
          INPUT_MANUAL_WAIT: ${{ inputs.manual_challenge_wait_minutes }}
          PRIOR_CHAT_STATE_PATH: ${{ steps.prior_chat_state.outputs.state_path }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            request="process/browser-agent-home-exit-v10/current-request-v10.json"
            test -s "$request"
            action="$(jq -r '.action // "observe"' "$request")"
            mode="$(jq -r '.mode // "create_fresh"' "$request")"
            chat_url="$(jq -r '.chat_url // ""' "$request")"
            wake_message="$(jq -r '.wake_message // ""' "$request")"
            project_name="$(jq -r '.project_name // ""' "$request")"
            project_url="$(jq -r '.project_url // ""' "$request")"
            recovery_chat_title="$(jq -r '.recovery_chat_title // ""' "$request")"
            home_exit_node="$(jq -r '.home_exit_node' "$request")"
            interactive_view="$(jq -r '.interactive_view // true' "$request")"
            manual_wait="$(jq -r '.manual_challenge_wait_minutes // 5' "$request")"
          else
            action="$INPUT_ACTION"
            mode="$INPUT_MODE"
            chat_url="$INPUT_CHAT_URL"
            wake_message="$INPUT_WAKE_MESSAGE"
            project_name="$INPUT_PROJECT_NAME"
            project_url="$INPUT_PROJECT_URL"
            recovery_chat_title="$INPUT_RECOVERY_CHAT_TITLE"
            home_exit_node="$INPUT_HOME_EXIT_NODE"
            interactive_view="$INPUT_INTERACTIVE_VIEW"
            manual_wait="$INPUT_MANUAL_WAIT"
          fi

          if [ "$action" = "recover" ] && [ -n "$PRIOR_CHAT_STATE_PATH" ] && [ -s "$PRIOR_CHAT_STATE_PATH" ]; then
            prior_project_name="$(jq -r '.projectName // ""' "$PRIOR_CHAT_STATE_PATH")"
            if [ -z "$project_name" ] || [ -z "$prior_project_name" ] || [ "$prior_project_name" = "$project_name" ]; then
              if [ -z "$chat_url" ]; then
                chat_url="$(jq -r '.chatUrl // ""' "$PRIOR_CHAT_STATE_PATH")"
              fi
              if [ -z "$project_url" ]; then
                project_url="$(jq -r '.projectUrl // ""' "$PRIOR_CHAT_STATE_PATH")"
              fi
              echo "Recovered durable chat/project URL from prior browser state artifact."
            fi
          fi

          {
            echo "action=$action"
            echo "mode=$mode"
            echo "chat_url=$chat_url"
            echo "wake_message=$wake_message"
            echo "project_name=$project_name"
            echo "project_url=$project_url"
            echo "recovery_chat_title=$recovery_chat_title"
            echo "home_exit_node=$home_exit_node"
            echo "interactive_view=$interactive_view"
            echo "manual_wait=$manual_wait"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up isolated Playwright runtime
        uses: ./packages/browser-agent-original-phase0-v10/runtime-v10

      - name: Install private VNC helper
        if: steps.request.outputs.interactive_view == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"
          echo "Recorded runner egress fingerprint without logging the address."

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ steps.request.outputs.home_exit_node }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        env:
          INTERACTIVE_VIEW: ${{ steps.request.outputs.interactive_view }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-v10.log 2>&1 &
          echo $! >/tmp/xvfb-v10.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            echo "::error::Xvfb did not become ready."
            cat /tmp/xvfb-v10.log || true
            exit 1
          }

          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"

          if [ "$INTERACTIVE_VIEW" = "true" ]; then
            x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-v10.log 2>&1 &
            echo $! >/tmp/x11vnc-v10.pid
            echo "TAILSCALE_VNC=$ts_ip:5900"
            echo "Connect your VNC viewer from the Windows PC to $ts_ip:5900 while this job is running."
          fi

      - name: Route browser phase through home exit node
        shell: bash
        env:
          HOME_EXIT_NODE: ${{ steps.request.outputs.home_exit_node }}
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"

          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then
                changed=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$changed" != "true" ]; then
            echo "::error::Tailscale exit node did not change runner egress."
            exit 1
          fi
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Run Playwright through home exit node
        id: browser
        shell: bash
        env:
          WAKE_ACTION: ${{ steps.request.outputs.action }}
          WAKE_MODE: ${{ steps.request.outputs.mode }}
          CHAT_URL: ${{ steps.request.outputs.chat_url }}
          WAKE_MESSAGE: ${{ steps.request.outputs.wake_message }}
          PROJECT_NAME: ${{ steps.request.outputs.project_name }}
          PROJECT_URL: ${{ steps.request.outputs.project_url }}
          RECOVERY_CHAT_TITLE: ${{ steps.request.outputs.recovery_chat_title }}
          WAKE_ID: home-exit-playwright-v10-${{ github.run_id }}
          INTERACTIVE_VIEW_ENABLED: ${{ steps.request.outputs.interactive_view }}
          MANUAL_CHALLENGE_WAIT_MINUTES: ${{ steps.request.outputs.manual_wait }}
        run: |
          set -euo pipefail
          export MANUAL_CHALLENGE_WAIT_MS=$((MANUAL_CHALLENGE_WAIT_MINUTES * 60000))
          if [ "$INTERACTIVE_VIEW_ENABLED" = "true" ]; then
            echo "Private VNC: $TAILSCALE_RUNNER_IP:5900"
          fi

          node packages/browser-agent-original-phase0-v10/browser-agent-wake-v10.mjs
          test -s "$WAKE_RESULT_PATH"
          cat "$WAKE_RESULT_PATH"

          if [ "$WAKE_ACTION" = "observe" ]; then
            jq -e '.ok==true and .provider=="github-playwright"' "$WAKE_RESULT_PATH" >/dev/null
          elif [ "$WAKE_ACTION" = "recover" ]; then
            jq -e '.ok==true and .provider=="github-playwright" and .recovered==true and (.chatUrl|test("^https://chatgpt.com/(c/|g/g-p-[^/]+/c/)"))' "$WAKE_RESULT_PATH" >/dev/null
          else
            jq -e '.ok==true and .provider=="github-playwright" and (.posted==true or .skipped=="PRODUCTIVE_GENERATING")' "$WAKE_RESULT_PATH" >/dev/null
          fi

      - name: Capture durable browser chat state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-home-exit-v10-chat-state-v1
          path: /tmp/browser-agent-home-exit-v10-chat-state-v1.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""
          echo "Home exit-node routing disabled for post-browser workflow steps."

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-v10.pid ] && kill "$(cat /tmp/x11vnc-v10.pid)" 2>/dev/null
          [ -f /tmp/xvfb-v10.pid ] && kill "$(cat /tmp/xvfb-v10.pid)" 2>/dev/null

name: Temporary Refresh Lite Manifest v1

on:
  push:
    branches:
      - fix/lite-phase7-marker-v1
    paths:
      - '.github/workflows/temp-refresh-lite-manifest-v1.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lite-phase7-marker-v1
          persist-credentials: false
          fetch-depth: 1
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Regenerate exact unpacked Lite manifest
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin fix/lite-phase7-marker-v1
          git checkout -B fix/lite-phase7-marker-v1 origin/fix/lite-phase7-marker-v1
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('Audit Skill - Current Authority')
          packages=sorted(p for p in root.iterdir() if p.is_dir() and (p/'SKILL.md').is_file())
          if len(packages)!=1: raise SystemExit('expected exactly one unpacked Lite authority package')
          pkg=packages[0]
          mp=pkg/'MANIFEST.json'; m=json.loads(mp.read_text()); files=[]
          for p in sorted(x for x in pkg.rglob('*') if x.is_file() and x.name!='MANIFEST.json'):
              b=p.read_bytes(); files.append({'path':p.relative_to(pkg).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          m['files']=files; mp.write_text(json.dumps(m,indent=2)+'\n')
          PY
          git config user.name 'CurveYield Lite Manifest Refresh'
          git config user.email 'lite-manifest-refresh@users.noreply.github.com'
          git add -- 'Audit Skill - Current Authority/'*/MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lite): refresh authority manifest after control-plane doc cleanup'
            git push origin HEAD:fix/lite-phase7-marker-v1
          fi

name: Phase 0 Deployment Only Regression v1

# Mandatory merge gate for main (required status check: "verify-deploy-only").
# Runs on every pull request, with no path filter, so it is always reported.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-deploy-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-deploy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore pinned Node dependencies
        uses: ./.github/actions/setup-phase0-node-cache

      - name: Enable pinned Forge and Cast
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1

      - name: Check Phase 0 module syntax
        run: |
          node --check packages/github-native-sim/src/phase0-randomized-simulation-v1.mjs
          node --check packages/github-native-sim/src/phase0-deployment-profile-v1.mjs
          node --check scripts/run-phase0-fork-deploy-config-v1.mjs
          node --check scripts/write-phase0-fork-deploy-outputs-v1.mjs
          node --check scripts/lite-phase0-finalize-v1.mjs
          node --check scripts/lib/lite-phase-prefill-v1.mjs
          node --check scripts/reconcile-phase0-deploy-evidence-v1.mjs
          node --check scripts/lib/phase0-deploy-gate-v2.mjs

      - name: Phase 0 deploy/config unit and wiring tests
        run: |
          node --test test/phase0-deploy-gate-v2.test.mjs
          node --test \
            packages/github-native-sim/test/lite-phase0-automation-v2.test.mjs \
            packages/github-native-sim/test/phase0-v2-consumers.test.mjs \
            packages/github-native-sim/test/phase0-v2-wiring.test.mjs \
            packages/github-native-sim/test/phase0-telemetry-smoke-guardrails-v1.test.mjs \
            packages/github-native-sim/test/phase0-optimization4-v1.test.mjs \
            packages/github-native-sim/test/phase0-randomized-simulation-v1.test.mjs \
            packages/github-native-sim/test/phase0-deployment-profile-v1.test.mjs \
            packages/github-native-sim/test/sparse-source-checkout-v1.test.mjs \
            packages/github-native-sim/test/lite-phase-packet-controller-integration-v1.test.mjs

      # Real forge scripts on real Anvil forks (local upstream; no secrets): legacy Ethereum
      # adapter, Ethereum profile and Katana profile all deploy a tiny ERC20 and pass the gate.
      - name: Phase 0 deploy lane end to end (ERC20 fixture)
        env:
          PHASE0_E2E: '1'
        run: timeout -k 10s 600s node --test packages/github-native-sim/test/phase0-erc20-deploy-e2e-v1.test.mjs

  # Temporary branch-only proof; remove before any merge into main.
  attacker-fork-proof:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/cyavkat-r4-attacker-fork-regression-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAMPAIGN_PATH: campaigns/cyavKATv25b r4
      SOURCE_SHA256: 7c620ff30c79ceff532af3ad0977d184e66d76a4e00b600d61050799f5b9c8be
      ENTRY_SHA256: c92149dbc3535ac2c69d04c96a167d3d3314e539889fca21fdc65118d81793bb
      PINNED_KATANA_BLOCK: '45121798'
    steps:
      - name: Checkout regression runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore qualified Phase-0 Node toolchain
        uses: ./.github/actions/setup-phase0-node-cache
      - name: Restore qualified native deployment toolchain
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Verify admitted source identity (fail closed)
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller main branch "$CAMPAIGN_PATH"
          SOURCE=".audit-controller/$CAMPAIGN_PATH/source/cyavKATv25b.zip"
          echo "$SOURCE_SHA256  $SOURCE" | sha256sum --check --status
          ENTRY=".audit-controller/$CAMPAIGN_PATH/source/cyavKAT/upgrade/scripts/deploy-cyavkat-unified-v1.cjs"
          echo "$ENTRY_SHA256  $ENTRY" | sha256sum --check --status
          mkdir -p attacker-output
          printf 'campaign=cyavkatv25b-r4\nsourceSha256=%s\nentrySha256=%s\ncontrollerCommit=%s\nrunnerCommit=%s\nrunId=%s\nrunUrl=%s\nblock=%s\n' "$SOURCE_SHA256" "$ENTRY_SHA256" "$(git -C .audit-controller rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$PINNED_KATANA_BLOCK" > attacker-output/SOURCE_BINDING_v1.txt
          {
            node --version
            forge --version
          } > attacker-output/TOOLCHAIN_v1.txt 2>&1
      - name: Execute test-only source-exact attacker harness on pinned fork
        id: tests
        shell: bash
        run: |
          set +e
          SRC=".audit-controller/$CAMPAIGN_PATH/source/cyavKAT/upgrade"
          cp packages/github-native-sim/audit-harnesses/cyavkat-r4-attacker-fork-v1/AttackerForkConformance_v1.t.sol "$SRC/test/katana/AttackerForkConformance_v1.t.sol"
          (
            cd "$SRC"
            timeout 1200s forge test --match-path test/katana/AttackerForkConformance_v1.t.sol --fork-url https://katana.drpc.org/ --fork-block-number "$PINNED_KATANA_BLOCK" -vvvv
          ) > attacker-output/FOUNDRY_v1.log 2>&1
          code=$?
          printf '%s\n' "$code" > attacker-output/FOUNDRY_EXIT_v1.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 140 attacker-output/FOUNDRY_v1.log
          exit 0
      - name: Verify actual tests and assertions, not runner status
        id: assert
        shell: bash
        run: |
          set +e
          test "$(cat attacker-output/FOUNDRY_EXIT_v1.txt)" = "0" &&
          grep -Eq '5 tests? passed|Ran 5 tests' attacker-output/FOUNDRY_v1.log &&
          grep -q 'CONFIRMED_UNPRIVILEGED_GATE_REPLACEMENT' attacker-output/FOUNDRY_v1.log &&
          grep -q 'CONFIRMED_OUTSIDER_GATE_SETTER_CAN_CAUSE_VIEW_DOS' attacker-output/FOUNDRY_v1.log &&
          grep -q 'CONFIRMED_FUSE_BALANCE_OVERPAYMENT' attacker-output/FOUNDRY_v1.log &&
          grep -q 'CONFIRMED_FUSE_UNDERFUNDED_REQUEST_REVERT' attacker-output/FOUNDRY_v1.log &&
          grep -q 'NEGATIVE_CONTROL_UNGRANTED_RECIPIENT_BLOCKED' attacker-output/FOUNDRY_v1.log
          code=$?
          printf '%s\n' "$code" > attacker-output/ASSERTIONS_EXIT_v1.txt
          if [ "$code" -eq 0 ]; then
            echo 'ATTACKER_REGRESSION_PASS_WITH_FIVE_REAL_TESTS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ATTACKER_REGRESSION_INCOMPLETE_OR_FAILED (do not treat workflow as successful tests)' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Build exact raw SHA256 manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find attacker-output -type f ! -name RAW_SHA256_v1.txt -print0 | sort -z | xargs -0 -r sha256sum > attacker-output/RAW_SHA256_v1.txt
      - name: Upload original raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-r4-attacker-fork-v1-${{ github.run_id }}
          path: attacker-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit immutable raw evidence under campaign only
        if: always()
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .audit-controller/.git ] || [ ! -s attacker-output/RAW_SHA256_v1.txt ]; then
            echo '::error::Source checkout or raw evidence not present'
            exit 1
          fi
          OUT=".audit-controller/$CAMPAIGN_PATH/evidence/discovery-attacker-followup/runs/$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          cp -a attacker-output/. "$OUT/"
          cd .audit-controller
          git config user.name "CurveYield2 CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$CAMPAIGN_PATH/evidence/discovery-attacker-followup/runs/$GITHUB_RUN_ID"
          git diff --cached --quiet && exit 0
          git commit -m "evidence: cyavKAT r4 attacker fork conformance run $GITHUB_RUN_ID"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          echo '::error::Could not persist raw attacker evidence'
          exit 1
      - name: Enforce suite outcome after raw preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat attacker-output/ASSERTIONS_EXIT_v1.txt)" = "0"

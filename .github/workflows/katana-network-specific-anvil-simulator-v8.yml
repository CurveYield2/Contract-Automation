name: Katana Network Specific Anvil Simulator v8

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v8.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enumerate-katana-fx-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Enumerate official Katana fxUSD markets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/results
          RESULT=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/results/KATANA_FX_MARKETS_RESULT_v8.md
          RPC=https://katana.drpc.org/
          FXUSD=0x4c03ff0f44A55e7098a09016E02a01d3cdC2FDF9
          MANAGER=0x27b3eE81DF2Dd7356D5ac282e2416991A616f96a
          VBWBTC=0x0913DA6Da4b42f538B445599b46Bb4622342Cf52

          RAW="$(cast call "$FXUSD" 'getMarkets()(address[])' --rpc-url "$RPC")"
          echo "raw_getMarkets=$RAW"
          MARKETS="$(printf '%s\n' "$RAW" | grep -oE '0x[0-9a-fA-F]{40}' | tr '\n' ' ')"
          echo "parsed_markets=$MARKETS"
          MATCHING=""
          DETAILS="$RUNNER_TEMP/katana-fx-markets-v7.txt"
          : > "$DETAILS"

          for P in $MARKETS; do
            PCOLL="$(cast call "$P" 'collateralToken()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PFXUSD="$(cast call "$P" 'fxUSD()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PMGR="$(cast call "$P" 'poolManager()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PORACLE="$(cast call "$P" 'priceOracle()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PCONFIG="$(cast call "$P" 'configuration()(address)' --rpc-url "$RPC" 2>/dev/null || true)"
            PRANGE="$(cast call "$P" 'getDebtRatioRange()(uint256,uint256)' --rpc-url "$RPC" 2>/dev/null | tr '\n' ',' || true)"
            echo "market=$P collateral=$PCOLL fxUSD=$PFXUSD manager=$PMGR oracle=$PORACLE config=$PCONFIG debtRange=$PRANGE" | tee -a "$DETAILS"
            if [ "$(echo "$PCOLL" | tr '[:upper:]' '[:lower:]')" = "$(echo "$VBWBTC" | tr '[:upper:]' '[:lower:]')" ] &&
               [ "$(echo "$PFXUSD" | tr '[:upper:]' '[:lower:]')" = "$(echo "$FXUSD" | tr '[:upper:]' '[:lower:]')" ] &&
               [ "$(echo "$PMGR" | tr '[:upper:]' '[:lower:]')" = "$(echo "$MANAGER" | tr '[:upper:]' '[:lower:]')" ]; then
              MATCHING="$MATCHING $P"
            fi
          done

          {
            echo '# Katana fxUSD Markets Result v8'
            echo
            echo "- fxUSD: $FXUSD"
            echo "- PoolManager: $MANAGER"
            echo "- fxUSD_getMarkets: $MARKETS"
            echo "- matching_vbWBTC_market: $MATCHING"
            echo
            echo '## Markets'
            echo '~~~text'
            cat "$DETAILS"
            echo '~~~'
          } > "$RESULT"

          echo "matching_vbWBTC_market=$MATCHING"

      - name: Persist Katana fxUSD market result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CurveYield2 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/results/KATANA_FX_MARKETS_RESULT_v8.md
          if ! git diff --cached --quiet; then
            git commit -m 'sim: record Katana fxUSD market enumeration v8 [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce vbWBTC market match
        shell: bash
        run: |
          set -euo pipefail
          RESULT=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v8/results/KATANA_FX_MARKETS_RESULT_v8.md
          grep -E '^- matching_vbWBTC_market: +0x[0-9a-fA-F]{40}' "$RESULT"

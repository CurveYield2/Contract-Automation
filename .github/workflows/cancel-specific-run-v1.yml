name: Cancel Specific Actions Run v1

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/cancel-specific-run/*.json'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Cancel exact requested run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'process/agent-upload/cancel-specific-run/*.json')
          [ "${#changed[@]}" -eq 1 ] || { echo "::error::Expected exactly one cancel request"; exit 1; }
          request="${changed[0]}"
          run_id="$(jq -r '.run_id // empty' "$request")"
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be numeric"; exit 1; }
          gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          sleep 2
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + ":" + (.conclusion // "")')"
          if [[ "$state" == in_progress:* || "$state" == queued:* || "$state" == pending:* ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
          fi
          echo "Cancellation requested for run $run_id" >> "$GITHUB_STEP_SUMMARY"

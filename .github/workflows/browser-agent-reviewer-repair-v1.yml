name: Browser Agent Reviewer Repair v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact campaign ID
        required: true
        type: string
      repair_mode:
        description: Resume current durable reviewer state
        required: false
        default: auto
        type: choice
        options: [auto, resume_preferred, reset_to_handoff]
      force_reset:
        description: Legacy-only reset flag
        required: false
        default: false
        type: boolean
      reason:
        description: Repair trigger/reason
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: browser-agent-reviewer-repair-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      REPAIR_MODE: ${{ inputs.repair_mode }}
      REPAIR_REASON: ${{ inputs.reason }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Resolve current or legacy repair mode
        id: route
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          test -s "$registration"
          state_path="$(jq -r '.watchdog.gate.statePath // empty' "$registration")"
          test -n "$state_path"
          if [[ "$state_path" == "Audit Campaign Directory/campaigns/"*.json ]]; then
            echo "mode=receipt" >> "$GITHUB_OUTPUT"
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
          fi
          echo "registration=$registration" >> "$GITHUB_OUTPUT"

      - name: Redispatch legacy repair for pre-receipt campaign
        if: steps.route.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run browser-agent-reviewer-repair-legacy-v1.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f campaign_id="$CAMPAIGN_ID" \
            -f repair_mode="${{ inputs.repair_mode }}" \
            -f force_reset="${{ inputs.force_reset }}" \
            -f reason="${{ inputs.reason }}"

      - name: Resolve current receipt reviewer
        if: steps.route.outputs.mode == 'receipt'
        id: current
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          REGISTRATION: ${{ steps.route.outputs.registration }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPAIR_MODE" = "reset_to_handoff" ]; then
            echo "::error::Current Lite campaigns have no reset-to-handoff control state. Repair resumes from the current phase receipt and Git history."
            exit 1
          fi
          gate_repo="$(jq -r '.watchdog.gate.repository // "CurveYield2/Audit-Controller"' "$REGISTRATION")"
          gate_ref="$(jq -r '.watchdog.gate.ref // "main"' "$REGISTRATION")"
          directory_path="$(jq -r '.watchdog.gate.statePath' "$REGISTRATION")"
          milestone="$(jq -r '.watchdog.gate.expectedMilestoneId // empty' "$REGISTRATION")"
          project_name="$(jq -r '.chatgptProject.name // empty' "$REGISTRATION")"
          gh api "repos/$gate_repo/contents/$directory_path?ref=$gate_ref" --jq '.content' | base64 -d > /tmp/campaign-directory.json
          test "$(jq -r '.campaignId' /tmp/campaign-directory.json)" = "$CAMPAIGN_ID"
          directory_status="$(jq -r '.status' /tmp/campaign-directory.json)"
          case "$directory_status" in ACTIVE|BLOCKED) ;; *) echo "::error::Receipt reviewer repair requires ACTIVE/BLOCKED campaign state; observed $directory_status"; exit 1;; esac
          receipt_path="$(jq -r '.currentReceiptPath' /tmp/campaign-directory.json)"
          gh api "repos/$gate_repo/contents/$receipt_path?ref=$gate_ref" --jq '.content' | base64 -d > /tmp/current-receipt.json
          receipt_status="$(jq -r '.phase.status' /tmp/current-receipt.json)"
          case "$receipt_status" in ACTIVE|BLOCKED) ;; *) echo "::error::Current receipt does not require reviewer repair: $receipt_status"; exit 1;; esac
          reviewer="$(jq -r '.executor.lineage' /tmp/current-receipt.json)"
          phase_id="$(jq -r '.phase.id' /tmp/current-receipt.json)"
          campaign_name="$(jq -r '.campaign.campaignName' /tmp/current-receipt.json)"
          workspace="$(jq -r '.campaign.workspacePath' /tmp/current-receipt.json)"
          [ -n "$project_name" ] || project_name="$campaign_name"
          reason="${REPAIR_REASON:-watchdog detected reviewer failure}"
          cat > /tmp/replacement-wake.txt <<EOF
          Campaign type: LITE
          Campaign name: $campaign_name
          Campaign ID: $CAMPAIGN_ID
          Incoming reviewer: $reviewer
          Current phase: $phase_id
          Current phase receipt: $receipt_path
          Current authority: https://github.com/CurveYield2/Audit-Controller/tree/main/Audit%20Skill%20-%20Current%20Authority

          You are a repair/replacement reviewer taking over because the prior reviewer stopped during this same assignment.
          Resume from the latest durable evidence and the current phase receipt. Do not restart completed work and do not reconstruct old handoff/completion/retirement paperwork.
          Read the current authority, then the current receipt, then continue exactly from the unfinished Phase $phase_id work.
          Repair reason: $reason
          EOF
          jq -cn \
            --arg routine 'audit-lite-reviewer-v1' \
            --arg project "$project_name" \
            --arg chat "$campaign_name $reviewer replacement" \
            '{routineId:$routine,projectName:$project,chatName:$chat,repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:"standard"}' \
            > /tmp/replacement-browser-context.json
          {
            echo "gate_repo=$gate_repo"
            echo "gate_ref=$gate_ref"
            echo "directory_path=$directory_path"
            echo "receipt_path=$receipt_path"
            echo "reviewer=$reviewer"
            echo "phase_id=$phase_id"
            echo "milestone=$milestone"
            echo "wake_b64=$(base64 -w0 /tmp/replacement-wake.txt)"
            echo "browser_context_b64=$(base64 -w0 /tmp/replacement-browser-context.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Retire predecessor reviewer watchdog states
        if: steps.route.outputs.mode == 'receipt'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.current.outputs.milestone }}
        shell: bash
        run: |
          set -euo pipefail
          listing="$(gh api "repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active?ref=main" 2>/dev/null || true)"
          [ -n "$listing" ] || exit 0
          while IFS=$'\t' read -r path sha; do
            [ -n "$path" ] || continue
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq '.content' 2>/dev/null || true)"
            [ -n "$encoded" ] || continue
            printf '%s' "$encoded" | base64 -d > /tmp/watchdog-candidate.json
            if jq -e --arg c "$CAMPAIGN_ID" --arg m "$MILESTONE" \
              '.campaignId==$c and (.gate.expectedMilestoneId // "")==$m and (.workerRole // "reviewer")=="reviewer"' \
              /tmp/watchdog-candidate.json >/dev/null; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="chore(watchdog): retire replaced reviewer $CAMPAIGN_ID" \
                -f sha="$sha" -f branch=main >/dev/null
            fi
          done < <(printf '%s' "$listing" | jq -r '.[]? | select(.type=="file") | [.path,.sha] | @tsv')

      - name: Clear confirmed dead reviewer chat binding
        if: steps.route.outputs.mode == 'receipt'
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRATION: ${{ steps.route.outputs.registration }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/contents/$REGISTRATION"
          sha="$(gh api "$api?ref=main" --jq '.sha')"
          gh api "$api?ref=main" --jq '.content' | base64 -d > /tmp/registration.json
          jq '.repairPreviousChat=((.activeChat // {}) + {retiredAt:(now|todate),reason:"CONFIRMED_REVIEWER_REPAIR"})
              | .chatUrl=""
              | .activeChat=((.activeChat // {}) + {url:""})
              | .updatedAt=(now|todate)' /tmp/registration.json > /tmp/registration-updated.json
          body="$(base64 -w0 /tmp/registration-updated.json)"
          gh api --method PUT "$api" -f message="chore(repair): retire dead reviewer chat $CAMPAIGN_ID" -f content="$body" -f sha="$sha" -f branch=main >/dev/null

      - name: Launch replacement reviewer from current receipt
        if: steps.route.outputs.mode == 'receipt'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          poke_b64="$(printf '%s' 'GET BACK TO WORK' | base64 -w0)"
          wake_id="$CAMPAIGN_ID-${{ steps.current.outputs.phase_id }}-${{ steps.current.outputs.reviewer }}-replacement"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="$wake_id" \
            -f campaign_id="$CAMPAIGN_ID" \
            -f phase_id="${{ steps.current.outputs.phase_id }}" \
            -f mode=create_fresh \
            -f chat_url="" \
            -f wake_message_b64="${{ steps.current.outputs.wake_b64 }}" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f watchdog_message_b64="$poke_b64" \
            -f gate_mode=LITE \
            -f gate_repository="${{ steps.current.outputs.gate_repo }}" \
            -f gate_ref="${{ steps.current.outputs.gate_ref }}" \
            -f gate_state_path="${{ steps.current.outputs.directory_path }}" \
            -f gate_expected_phase_id="${{ steps.current.outputs.phase_id }}" \
            -f gate_expected_milestone_id="${{ steps.current.outputs.milestone }}" \
            -f gate_active_pointer_path="" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN \
            -f browser_context_b64="${{ steps.current.outputs.browser_context_b64 }}"

      - name: Summarize reviewer repair
        if: always()
        shell: bash
        run: |
          {
            echo "## Reviewer repair"
            echo "- Campaign: $CAMPAIGN_ID"
            echo "- Routing: ${{ steps.route.outputs.mode }}"
            if [ "${{ steps.route.outputs.mode }}" = receipt ]; then
              echo "- Reviewer: ${{ steps.current.outputs.reviewer }}"
              echo "- Phase: ${{ steps.current.outputs.phase_id }}"
              echo "- Durable baseline: ${{ steps.current.outputs.receipt_path }}"
              echo "- Additional repair/reset receipt: none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Lite Phase Boundary Controller v2

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/lite-phase-boundary/*.json'
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: false
        default: ''
        type: string
      campaign_directory_path:
        required: false
        default: ''
        type: string
      review_kind:
        required: false
        default: phase
        type: choice
        options: [phase, master, master-test-result, sealed-rework, post-completion-followup]
      phase_sequence:
        required: false
        default: ''
        type: string
      segment_id:
        required: false
        default: ''
        type: string
      master_outcome:
        description: Master review outcome (AMENDED or ACCEPT_WITHOUT_MODIFICATIONS)
        required: false
        default: ''
        type: string
      test_plan_path:
        required: false
        default: ''
        type: string
      test_result_path:
        required: false
        default: ''
        type: string
      rework_request_path:
        description: Private Audit-Controller path to typed sealed-phase rework admission
        required: false
        default: ''
        type: string
      hold_successor_delivery:
        description: Branch qualification hold; blocks every browser wake and successor dispatch
        required: false
        default: false
        type: boolean
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # Push requests do not have workflow_dispatch inputs. A stable global lock
  # protects all campaign mutations from concurrent stale-state publishing.
  group: lite-phase-boundary-controller-v1
  cancel-in-progress: false

jobs:
  validate-bookkeep-advance:
    runs-on: ubuntu-latest
    # Phase 5 may run multiple 35-minute candidate-specific V7 executions.
    # Preflight fails immediately on missing RPC; this is only the outer ceiling.
    timeout-minutes: 90
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve controller-validation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          DISPATCH_CAMPAIGN_PATH: ${{ inputs.campaign_path }}
          DISPATCH_DIRECTORY_PATH: ${{ inputs.campaign_directory_path }}
          DISPATCH_REVIEW_KIND: ${{ inputs.review_kind }}
          DISPATCH_PHASE_SEQUENCE: ${{ inputs.phase_sequence }}
          DISPATCH_SEGMENT_ID: ${{ inputs.segment_id }}
          DISPATCH_MASTER_OUTCOME: ${{ inputs.master_outcome }}
          DISPATCH_TEST_PLAN_PATH: ${{ inputs.test_plan_path }}
          DISPATCH_TEST_RESULT_PATH: ${{ inputs.test_result_path }}
          DISPATCH_REWORK_REQUEST_PATH: ${{ inputs.rework_request_path }}
          DISPATCH_HOLD_DELIVERY: ${{ inputs.hold_successor_delivery }}
          DISPATCH_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            campaign_id="$DISPATCH_CAMPAIGN_ID"
            review_kind="${DISPATCH_REVIEW_KIND:-phase}"
            phase_sequence="$DISPATCH_PHASE_SEQUENCE"
            segment_id="$DISPATCH_SEGMENT_ID"
            master_outcome="$DISPATCH_MASTER_OUTCOME"
            master_summary_b64=""
            test_plan_path="$DISPATCH_TEST_PLAN_PATH"
            test_result_path="$DISPATCH_TEST_RESULT_PATH"
            rework_request_path="$DISPATCH_REWORK_REQUEST_PATH"
            hold_delivery="${DISPATCH_HOLD_DELIVERY:-false}"
            controller_ref="${DISPATCH_CONTROLLER_REF:-main}"
            supplied_campaign_path="$DISPATCH_CAMPAIGN_PATH"
            supplied_directory_path="$DISPATCH_DIRECTORY_PATH"
          else
            mapfile -t request_paths < <(
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[]? | select(.status != "removed") | .filename' |
              grep -E '^process/agent-upload/lite-phase-boundary/[^/]+\.json$' || true
            )
            [ "${#request_paths[@]}" -eq 1 ] || { echo "::error::Expected exactly one changed Lite phase-boundary request; found ${#request_paths[@]}."; exit 1; }
            request_path="${request_paths[0]}"
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$request_path?ref=$GITHUB_SHA" --jq '.content')"
            printf '%s' "$encoded" | base64 -d > /tmp/lite-phase-boundary-request.json
            jq -e '
              .schemaVersion=="curveyield-lite-phase-boundary-request-v1" and
              ((.campaignId|type)=="string") and (.campaignId|length)>0 and
              (((.reviewKind // "phase")=="phase" and ((.phaseSequence|type)=="number") and ((.phaseSequence|floor)==.phaseSequence) and .phaseSequence>=1 and .phaseSequence<=10) or
               ((.reviewKind // "phase")=="master" and ((.segmentId|type)=="string") and (.segmentId|length)>0 and (.masterOutcome=="AMENDED" or .masterOutcome=="ACCEPT_WITHOUT_MODIFICATIONS" or (.masterOutcome=="REQUEST_TARGETED_TESTS" and ((.testPlanPath|type)=="string") and (.testPlanPath|length)>0)) and ((.summary // "")|type)=="string") or
               ((.reviewKind // "phase")=="master-test-result" and ((.segmentId|type)=="string") and (.segmentId|length)>0 and ((.testResultPath|type)=="string") and (.testResultPath|length)>0) or
               ((.reviewKind // "phase")=="sealed-rework" and ((.phaseSequence|type)=="number") and .phaseSequence==1 and ((.reworkRequestPath|type)=="string") and (.reworkRequestPath|length)>0 and .holdSuccessorDelivery==true) or
               ((.reviewKind // "phase")=="post-completion-followup" and .phaseSequence==5 and ((.reworkRequestPath|type)=="string") and (.reworkRequestPath|length)>0 and .holdSuccessorDelivery==true)) and
              ((.auditControllerRef|type)=="string") and (.auditControllerRef|length)>0 and
              ((.attempt|type)=="number") and ((.attempt|floor)==.attempt) and .attempt>=1
            ' /tmp/lite-phase-boundary-request.json >/dev/null
            campaign_id="$(jq -r '.campaignId' /tmp/lite-phase-boundary-request.json)"
            review_kind="$(jq -r '.reviewKind // "phase"' /tmp/lite-phase-boundary-request.json)"
            phase_sequence="$(jq -r '.phaseSequence // empty' /tmp/lite-phase-boundary-request.json)"
            segment_id="$(jq -r '.segmentId // empty' /tmp/lite-phase-boundary-request.json)"
            master_outcome="$(jq -r '.masterOutcome // empty' /tmp/lite-phase-boundary-request.json)"
            master_summary_b64="$(jq -j '.summary // ""' /tmp/lite-phase-boundary-request.json | base64 -w0)"
            test_plan_path="$(jq -r '.testPlanPath // empty' /tmp/lite-phase-boundary-request.json)"
            test_result_path="$(jq -r '.testResultPath // empty' /tmp/lite-phase-boundary-request.json)"
            rework_request_path="$(jq -r '.reworkRequestPath // empty' /tmp/lite-phase-boundary-request.json)"
            hold_delivery="$(jq -r '.holdSuccessorDelivery // false' /tmp/lite-phase-boundary-request.json)"
            controller_ref="$(jq -r '.auditControllerRef' /tmp/lite-phase-boundary-request.json)"
            supplied_campaign_path=""
            supplied_directory_path=""
          fi
          [[ "$campaign_id" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]] || { echo "::error::Invalid campaign_id"; exit 1; }
          case "$review_kind" in phase|master|master-test-result|sealed-rework|post-completion-followup) ;; *) echo "::error::Invalid review_kind"; exit 1;; esac
          if [ "$review_kind" = phase ]; then [[ "$phase_sequence" =~ ^([1-9]|10)$ ]] || { echo "::error::Invalid phase_sequence"; exit 1; }; fi
          if [ "$review_kind" = master ]; then
            [[ "$segment_id" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid segment_id"; exit 1; }
            case "$master_outcome" in AMENDED|ACCEPT_WITHOUT_MODIFICATIONS|REQUEST_TARGETED_TESTS) ;; *) echo "::error::Invalid master outcome"; exit 1;; esac
            if [ "$master_outcome" = REQUEST_TARGETED_TESTS ]; then
              [[ "$test_plan_path" == campaigns/* ]] && [[ "$test_plan_path" =~ ^[A-Za-z0-9._/[:space:]-]+$ ]] || { echo "::error::Invalid campaign-local test plan"; exit 1; }
            fi
          fi
          if [ "$review_kind" = master-test-result ]; then
            [[ "$segment_id" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid segment_id"; exit 1; }
            [[ "$test_result_path" == campaigns/* ]] && [[ "$test_result_path" =~ ^[A-Za-z0-9._/[:space:]-]+$ ]] || { echo "::error::Invalid campaign-local test result"; exit 1; }
          fi
          if [ "$review_kind" = sealed-rework ]; then
            [ "$phase_sequence" = 1 ] || { echo "::error::sealed-rework is restricted to Phase 1"; exit 1; }
            [[ "$rework_request_path" == campaigns/* ]] || { echo "::error::rework_request_path must be private campaign-relative state"; exit 1; }
            [ "$hold_delivery" = true ] || { echo "::error::sealed-rework requires hold_successor_delivery"; exit 1; }
            [ "$controller_ref" != main ] || { echo "::error::sealed-rework requires an Audit-Controller review branch"; exit 1; }
          fi
          if [ "$review_kind" = post-completion-followup ]; then
            [ "$phase_sequence" = 5 ] || { echo "::error::post-completion followup must bind technical Phase-5 scope"; exit 1; }
            [ "$rework_request_path" = 'campaigns/CurveYield DEX v16 Source r4/controller/POST_COMPLETION_FOLLOWUP_REQUEST_v1.json' ] || { echo "::error::Wrong typed followup request path"; exit 1; }
            [ "$hold_delivery" = true ] || { echo "::error::Followup requires no automatic successor delivery"; exit 1; }
            [ "$controller_ref" = main ] || { echo "::error::Followup requires current accepted main campaign"; exit 1; }
          fi
          case "$hold_delivery" in true|false) ;; *) echo "::error::Invalid hold_successor_delivery"; exit 1;; esac
          [[ "$controller_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid audit_controller_ref"; exit 1; }
          {
            echo "campaign_id=$campaign_id"
            echo "review_kind=$review_kind"
            echo "phase_sequence=$phase_sequence"
            echo "segment_id=$segment_id"
            echo "master_outcome=$master_outcome"
            echo "master_summary_b64=$master_summary_b64"
            echo "test_plan_path=$test_plan_path"
            echo "test_result_path=$test_result_path"
            echo "rework_request_path=$rework_request_path"
            echo "hold_delivery=$hold_delivery"
            echo "audit_controller_ref=$controller_ref"
            echo "supplied_campaign_path=$supplied_campaign_path"
            echo "supplied_directory_path=$supplied_directory_path"
          } >> "$GITHUB_OUTPUT"
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout Audit-Controller assignment state
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "${{ steps.request.outputs.audit_controller_ref }}"
          git checkout -B "${{ steps.request.outputs.audit_controller_ref }}" "origin/${{ steps.request.outputs.audit_controller_ref }}"

      - name: Resolve canonical campaign routing
        id: routing
        shell: bash
        run: |
          set -euo pipefail
          campaign_id="${{ steps.request.outputs.campaign_id }}"
          if [[ "$campaign_id" =~ ^(.+)-r[0-9]+$ ]]; then slug="${BASH_REMATCH[1]}"; else echo "::error::campaign_id must end in -rN"; exit 1; fi
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          directory_file=".audit-controller/$directory_path"
          test -s "$directory_file"
          test "$(jq -r '.schemaVersion' "$directory_file")" = "curveyield-audit-campaign-directory-entry-v2"
          test "$(jq -r '.campaignId' "$directory_file")" = "$campaign_id"
          if [ "${{ steps.request.outputs.review_kind }}" = phase ]; then
            test "$(jq -r '.currentAssignment.phaseSequence' "$directory_file")" = "${{ steps.request.outputs.phase_sequence }}"
          elif [ "${{ steps.request.outputs.review_kind }}" = master ] || [ "${{ steps.request.outputs.review_kind }}" = master-test-result ]; then
            test "$(jq -r '.pendingMasterReview.segmentId' "$directory_file")" = "${{ steps.request.outputs.segment_id }}"
          else
            test "${{ steps.request.outputs.hold_delivery }}" = true
          fi
          campaign_path="$(jq -r '.workspacePath' "$directory_file")"
          [[ "$campaign_path" == campaigns/* ]] || { echo "::error::Canonical workspacePath must be under campaigns/"; exit 1; }
          supplied_campaign="${{ steps.request.outputs.supplied_campaign_path }}"
          supplied_directory="${{ steps.request.outputs.supplied_directory_path }}"
          [ -z "$supplied_campaign" ] || test "$supplied_campaign" = "$campaign_path"
          [ -z "$supplied_directory" ] || test "$supplied_directory" = "$directory_path"
          effective_hold="${{ steps.request.outputs.hold_delivery }}"
          campaign_status="$(jq -r '.campaignStatus // empty' "$directory_file")"
          if [ "$campaign_status" = STOPPED_BY_HUMAN ] || [ "$campaign_status" = BLOCKED ]; then
            effective_hold=true
          fi
          persistent_hold_file=".audit-controller/$campaign_path/controller/SUCCESSOR_DELIVERY_HOLD_v1.json"
          if [ -s "$persistent_hold_file" ] && [ "$(jq -r '.status // empty' "$persistent_hold_file")" = ACTIVE ]; then
            test "$(jq -r '.campaignId' "$persistent_hold_file")" = "${{ steps.request.outputs.campaign_id }}"
            effective_hold=true
          fi
          {
            echo "campaign_path=$campaign_path"
            echo "campaign_directory_path=$directory_path"
            echo "effective_hold=$effective_hold"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for controller validation and Phase-5 execution
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked Node dependencies for controller validation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --force --ignore-scripts --no-audit --no-fund

      - name: Determine whether master amendment needs Phase-5 execution
        id: phase5_plan
        if: steps.request.outputs.review_kind == 'master' && steps.request.outputs.segment_id == 'reviewer-2-phases-02-05' && steps.request.outputs.master_outcome == 'AMENDED'
        shell: bash
        run: |
          set -euo pipefail
          sha="$(jq -r '.sourceSha256' ".audit-controller/${{ steps.routing.outputs.campaign_directory_path }}")"
          decision="$(node scripts/lite-master-phase5-execution-plan-v1.mjs             .audit-controller "${{ steps.routing.outputs.campaign_path }}"             "${{ steps.request.outputs.campaign_id }}" "$sha")"
          echo "requires_execution=$(printf '%s' "$decision" | jq -r '.requiresExecution')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$decision" | jq .

      - name: Install retained audit toolchain for Phase-5 boundary execution
        if: (steps.request.outputs.review_kind == 'phase' && steps.request.outputs.phase_sequence == '5') || (steps.phase5_plan.outputs.requires_execution == 'true')
        uses: ./.github/actions/setup-v7-toolchain

      - name: Generate packet/report, validate semantic work, then bookkeep after PASS
        id: controller
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          if { [ "${{ steps.request.outputs.review_kind }}" = phase ] && [ "${{ steps.request.outputs.phase_sequence }}" = 5 ]; } ||
             { [ "${{ steps.phase5_plan.outputs.requires_execution }}" = true ]; }; then
            test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM secret missing for Phase-5 V7 fork preflight"; exit 1; }
          fi
          args=(--controller-root .audit-controller --campaign-id "${{ steps.request.outputs.campaign_id }}" --campaign-path "${{ steps.routing.outputs.campaign_path }}" --campaign-directory-path "${{ steps.routing.outputs.campaign_directory_path }}" --review-kind "${{ steps.request.outputs.review_kind }}" --audit-controller-ref "${{ steps.request.outputs.audit_controller_ref }}")
          if [ "${{ steps.request.outputs.review_kind }}" = master-test-result ]; then
            args+=(--segment-id "${{ steps.request.outputs.segment_id }}" --test-result-path "${{ steps.request.outputs.test_result_path }}")
          fi
          if [ "${{ steps.request.outputs.review_kind }}" = master ]; then
            args+=(--segment-id "${{ steps.request.outputs.segment_id }}" --master-outcome "${{ steps.request.outputs.master_outcome }}")
            if [ "${{ steps.request.outputs.master_outcome }}" = REQUEST_TARGETED_TESTS ]; then
              args+=(--test-plan-path "${{ steps.request.outputs.test_plan_path }}")
            fi
            if [ -n "${{ steps.request.outputs.master_summary_b64 }}" ]; then
              args+=(--master-summary-b64 "${{ steps.request.outputs.master_summary_b64 }}")
            fi
          else
            args+=(--phase-sequence "${{ steps.request.outputs.phase_sequence }}")
          fi
          if [ "${{ steps.request.outputs.review_kind }}" = sealed-rework ] || [ "${{ steps.request.outputs.review_kind }}" = post-completion-followup ]; then
            args+=(--rework-request-path "${{ steps.request.outputs.rework_request_path }}")
          fi
          node scripts/lite-phase-packet-controller-v1.mjs "${args[@]}" | tee /tmp/lite-phase-packet-result.json
          {
            echo "status=$(jq -r '.status' /tmp/lite-phase-packet-result.json)"
            echo "feedback_b64=$(jq -r '.feedbackB64 // empty' /tmp/lite-phase-packet-result.json)"
            echo "fresh=$(jq -r '.freshSuccessorRequired // false' /tmp/lite-phase-packet-result.json)"
            echo "same=$(jq -r '.sameReviewerAdvanced // false' /tmp/lite-phase-packet-result.json)"
            echo "next_phase=$(jq -r '.nextAssignment.phaseSequence // empty' /tmp/lite-phase-packet-result.json)"
            echo "next_reviewer=$(jq -r '.nextAssignment.reviewer // empty' /tmp/lite-phase-packet-result.json)"
            echo "campaign_name=$(jq -r '.campaignName // empty' /tmp/lite-phase-packet-result.json)"
            echo "segment_id=$(jq -r '.segmentId // empty' /tmp/lite-phase-packet-result.json)"
            echo "master_chat_url=$(jq -r '.masterChatUrl // empty' /tmp/lite-phase-packet-result.json)"
            echo "master_review=$(jq -r '.masterReviewRequired // false' /tmp/lite-phase-packet-result.json)"
            echo "master_accepted=$(jq -r '.masterReviewAccepted // false' /tmp/lite-phase-packet-result.json)"
            echo "test_reviewer=$(jq -r '.testReviewer // empty' /tmp/lite-phase-packet-result.json)"
            echo "test_request_id=$(jq -r '.testRequestId // empty' /tmp/lite-phase-packet-result.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish validation response or successful phase transaction
        if: ${{ steps.routing.outcome == 'success' && steps.controller.outcome == 'success' && (steps.controller.outputs.status == 'PASS' || steps.controller.outputs.status == 'WAITING_FOR_MASTER_REVIEW' || steps.controller.outputs.status == 'NEEDS_REWORK' || steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED' || steps.controller.outputs.status == 'FOLLOWUP_ADMITTED') }}
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite Phase Controller'
          git config user.email 'lite-phase-controller@users.noreply.github.com'
          git add -- "${{ steps.routing.outputs.campaign_path }}" "${{ steps.routing.outputs.campaign_directory_path }}"
          if ! git diff --cached --quiet; then
            git commit -m "audit(controller): ${{ steps.request.outputs.review_kind }} ${{ steps.request.outputs.phase_sequence || steps.request.outputs.segment_id }} validation ${{ steps.controller.outputs.status }} for ${{ steps.request.outputs.campaign_id }}"
            git push origin "HEAD:${{ steps.request.outputs.audit_controller_ref }}"
          fi

      - name: Resolve active reviewer chat
        id: chat
        if: steps.routing.outputs.effective_hold != 'true' && (steps.controller.outputs.status == 'NEEDS_REWORK' || steps.controller.outputs.status == 'MASTER_REVIEW_INVALID' || steps.controller.outputs.same == 'true' || (steps.controller.outputs.status == 'PASS' && steps.controller.outputs.fresh == 'true') || (steps.controller.outputs.status == 'PASS' && steps.controller.outputs.next_phase == ''))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "${{ steps.request.outputs.campaign_id }}" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content' 2>/dev/null || true)"
          if [ -z "$encoded" ]; then
            echo "::warning::No active browser registration found for controller feedback."
            echo "chat_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$encoded" | base64 -d > /tmp/registration.json
          echo "chat_url=$(jq -r '.activeChat.url // .chatUrl // empty' /tmp/registration.json)" >> "$GITHUB_OUTPUT"

      - name: Inform current reviewer of exact rework deficiencies
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'NEEDS_REWORK' && steps.chat.outputs.chat_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main             -f wake_id="${{ steps.request.outputs.campaign_id }}-phase-${{ steps.request.outputs.phase_sequence }}-packet-rework"             -f campaign_id="${{ steps.request.outputs.campaign_id }}"             -f phase_id="phase-${{ steps.request.outputs.phase_sequence }}"             -f mode=resume_existing             -f chat_url="${{ steps.chat.outputs.chat_url }}"             -f wake_message_b64="${{ steps.controller.outputs.feedback_b64 }}"             -f watchdog_enabled=true             -f worker_role=reviewer             -f gate_mode=LITE             -f gate_repository=CurveYield2/Audit-Controller             -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}"             -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}"             -f gate_expected_phase_id="phase-${{ steps.request.outputs.phase_sequence }}"             -f gate_expected_milestone_id="PHASE_${{ steps.request.outputs.phase_sequence }}_WORK_PACKET"

      - name: Inform same reviewer that next phase is authorized
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'PASS' && steps.controller.outputs.same == 'true' && steps.chat.outputs.chat_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          msg="CONTROLLER_PHASE_PASS. Phase ${{ steps.request.outputs.phase_sequence }} is sealed. Proceed now to Phase ${{ steps.controller.outputs.next_phase }} using the new Audit Campaign Directory assignment and its schema-governed work form. Do not re-check Phase ${{ steps.request.outputs.phase_sequence }} bookkeeping."
          b64="$(printf '%s' "$msg" | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main             -f wake_id="${{ steps.request.outputs.campaign_id }}-phase-${{ steps.controller.outputs.next_phase }}-continue"             -f campaign_id="${{ steps.request.outputs.campaign_id }}"             -f phase_id="phase-${{ steps.controller.outputs.next_phase }}"             -f mode=resume_existing             -f chat_url="${{ steps.chat.outputs.chat_url }}"             -f wake_message_b64="$b64"             -f watchdog_enabled=true             -f worker_role=reviewer             -f gate_mode=LITE             -f gate_repository=CurveYield2/Audit-Controller             -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}"             -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}"             -f gate_expected_phase_id="phase-${{ steps.controller.outputs.next_phase }}"             -f gate_expected_milestone_id="PHASE_${{ steps.controller.outputs.next_phase }}_WORK_PACKET"

      - name: Dispatch fresh successor after controller PASS
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'PASS' && steps.controller.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run lite-audit-browser-orchestrator-v1.yml --repo "$GITHUB_REPOSITORY" --ref main             -f campaign_id="${{ steps.request.outputs.campaign_id }}"             -f campaign_name="${{ steps.controller.outputs.campaign_name }}"             -f campaign_path="${{ steps.routing.outputs.campaign_path }}"             -f audit_controller_ref="${{ steps.request.outputs.audit_controller_ref }}"

      - name: Authorize final reviewer retirement
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'PASS' && steps.controller.outputs.next_phase == '' && steps.chat.outputs.chat_url != '' && (steps.request.outputs.review_kind == 'phase' || steps.controller.outputs.master_accepted == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          msg="CONTROLLER_PHASE_PASS. Phase 10 is sealed and the Lite campaign is COMPLETE. Your audit responsibility is complete; retire."
          b64="$(printf '%s' "$msg" | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main             -f wake_id="${{ steps.request.outputs.campaign_id }}-complete"             -f campaign_id="${{ steps.request.outputs.campaign_id }}"             -f phase_id=phase-10             -f mode=resume_existing             -f chat_url="${{ steps.chat.outputs.chat_url }}"             -f wake_message_b64="$b64"             -f watchdog_enabled=false             -f worker_role=reviewer             -f gate_mode=LITE

      - name: Resolve reviewer for master-directed tests
        id: testchat
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "${{ steps.request.outputs.campaign_id }}" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$registration?ref=main" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/master-test-registration.json
          reviewer="${{ steps.controller.outputs.test_reviewer }}"
          chat="$(jq -r --arg reviewer "$reviewer" '.agentChats[$reviewer] // empty' /tmp/master-test-registration.json)"
          [[ "$chat" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+/?$ || "$chat" =~ ^https://chatgpt\.com/g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+/?$ ]] || { echo "::error::No preassigned test reviewer chat"; exit 1; }
          echo "url=$chat" >> "$GITHUB_OUTPUT"

      - name: Wake test reviewer on master's directive
        if: steps.routing.outputs.effective_hold != 'true' && steps.controller.outputs.status == 'MASTER_TESTS_REQUESTED' && steps.testchat.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          guide='Audit Skill - Current Authority/Audit_Litemode_v11/master-review/TARGETED_TEST_DIRECTIVE_v1.md'
          message_b64="$({ printf 'AFTER YOUR MANDATORY WAKE RECEIPT, READ %s IN CurveYield2/Audit-Controller USING THE GITHUB CONNECTOR. Follow its executing-reviewer instructions exactly.\n\n' "$guide"; printf '%s' "${{ steps.controller.outputs.feedback_b64 }}" | base64 -d; } | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="${{ steps.request.outputs.campaign_id }}-${{ steps.controller.outputs.test_request_id }}-test-reviewer" \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f phase_id=master-targeted-tests \
            -f mode=resume_existing \
            -f chat_url="${{ steps.testchat.outputs.url }}" \
            -f wake_message_b64="$message_b64" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f gate_mode=LITE \
            -f gate_repository=CurveYield2/Audit-Controller \
            -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
            -f gate_expected_phase_id=master-targeted-tests \
            -f gate_expected_milestone_id="${{ steps.controller.outputs.test_request_id }}" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN

      - name: Wake master reviewer
        if: steps.routing.outputs.effective_hold != 'true' && (steps.controller.outputs.status == 'WAITING_FOR_MASTER_REVIEW' || steps.controller.outputs.status == 'MASTER_REVIEW_INVALID') && steps.controller.outputs.master_chat_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The master is woken and supervised exactly like a normal reviewer;
          # an invalid submission re-delivers the controller feedback.
          poke_b64="$(printf '%s' 'GET BACK TO WORK' | base64 -w0)"
          purpose=initial_wake
          [ "${{ steps.controller.outputs.status }}" != MASTER_REVIEW_INVALID ] || purpose=repair_notice
          browser_context_b64="$(jq -cn --arg purpose "$purpose" \
            '{routineId:"",projectName:"",projectUrl:"",chatName:"master-reviewer",repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:$purpose}' | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f wake_id="${{ steps.request.outputs.campaign_id }}-${{ steps.controller.outputs.segment_id }}-master-reviewer" \
            -f campaign_id="${{ steps.request.outputs.campaign_id }}" \
            -f phase_id=master-review \
            -f mode=resume_existing \
            -f chat_url="${{ steps.controller.outputs.master_chat_url }}" \
            -f wake_message_b64="${{ steps.controller.outputs.feedback_b64 }}" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f watchdog_message_b64="$poke_b64" \
            -f gate_mode=LITE \
            -f gate_repository=CurveYield2/Audit-Controller \
            -f gate_ref="${{ steps.request.outputs.audit_controller_ref }}" \
            -f gate_state_path="${{ steps.routing.outputs.campaign_directory_path }}" \
            -f gate_expected_phase_id=master-review \
            -f gate_expected_milestone_id="${{ steps.controller.outputs.segment_id }}" \
            -f gate_active_pointer_path="" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN,WAITING_FOR_TARGETED_TESTS \
            -f browser_context_b64="$browser_context_b64"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lite Phase Boundary Controller"
            echo "- campaign: ${{ steps.request.outputs.campaign_id }}"
            echo "- review kind: ${{ steps.request.outputs.review_kind }}"
            echo "- phase: ${{ steps.request.outputs.phase_sequence }}"
            echo "- segment: ${{ steps.controller.outputs.segment_id }}"
            echo "- delivery hold: ${{ steps.routing.outputs.effective_hold }}"
            echo "- result: ${{ steps.controller.outputs.status }}"
            echo "- packet/report ownership: controller-generated"
            echo "- bookkeeping before validation PASS: prohibited"
            echo "- machine execution timing: only when exact Phase-5 evidence cannot be safely reused"
            echo "- automation failure: ${{ steps.controller.outputs.status == 'CONTROLLER_ERROR' || steps.controller.outputs.status == 'MASTER_REVIEW_HELD' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on infrastructure error or held machine-evidence gate
        if: steps.controller.outputs.status == 'CONTROLLER_ERROR' || steps.controller.outputs.status == 'MASTER_REVIEW_HELD'
        run: |
          echo "::error::Controller maintenance required; do not request reviewer changes for automation failures."
          exit 1

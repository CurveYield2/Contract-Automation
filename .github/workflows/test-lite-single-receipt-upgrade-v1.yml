name: Lite Structured Phase Regression v2

on:
  push:
    branches:
      - main
      - upgrade/lite-single-receipt-v1
      - upgrade/lite-phase-schema-policy-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-single-receipt-regression-v1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  cross-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout tested Contract-Automation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install locked Contract-Automation dependencies
        run: npm --prefix automation ci --force

      - name: Test Contract-Automation
        run: |
          set -euo pipefail
          node --check automation/scripts/lite-phase0-finalize-v1.mjs
          node --check automation/scripts/run-phase0-randomized-simulation-v1.mjs
          node --check automation/scripts/write-phase0-simulation-outputs-v1.mjs
          node --check automation/runtime/github-native-sim/src/phase0-randomized-simulation-v1.mjs
          node --check automation/scripts/lite-phase-receipt-controller-v1.mjs
          node --check automation/scripts/lite-phase-packet-controller-v1.mjs
          node --check automation/scripts/prepare-lite-receipt-successor-v1.mjs
          node --check automation/scripts/prepare-lite-assignment-successor-v2.mjs
          node --check automation/scripts/lib/lite-phase-work-v1.mjs
          node --check automation/scripts/validate-lite-authority-automation-sync-v1.mjs
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/lite-phase-work-packet-controller-v1.yml"); YAML.load_file(".github/workflows/lite-v7-execution-dispatch-v1.yml"); YAML.load_file(".github/workflows/lite-phase0-randomized-simulation-v1.yml"); YAML.load_file(".github/workflows/lite-phase0-bootstrap-v1.yml")'
          python3 -m py_compile automation/scripts/audit-source-initialization/write-phase0-receipt-v1.py
          bash -n automation/scripts/audit-source-initialization/run-v1.sh
          test ! -e automation/scripts/audit-source-initialization/write-state-v1.py
          test ! -e .github/workflows/migrate-audit-campaign-directory-v1.yml
          test ! -e .github/workflows/migrate-lite-single-receipt-authority-v1.yml
          node --test automation/runtime/github-native-sim/test/*.test.mjs
          npm --prefix automation run lint
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash automation/scripts/select-audit-controller-token.sh

      - name: Clone matching Audit-Controller ref
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          if git ls-remote --exit-code --heads origin "$TEST_REF" >/dev/null 2>&1; then
            echo "Using matching Audit-Controller ref: $TEST_REF"
            git fetch origin "$TEST_REF"
          else
            echo "No matching Audit-Controller ref; falling back to main"
            git fetch origin main
          fi
          git checkout --detach FETCH_HEAD

      - name: Validate matching Audit-Controller ref
        working-directory: .audit-controller
        run: |
          set -euo pipefail
          npm test
          npm run check
          python3 ../scripts/validate-lite-authority-v1.py "Audit Skill - Current Authority"
          node ../scripts/validate-lite-authority-automation-sync-v1.mjs --controller-root . --automation-root ..
          test -d "Audit Campaign Directory"
          test ! -e ".deep-assurance"
          if git grep -FI -- '.deep-assurance'; then
            echo "::error::Old .deep-assurance path reference remains"
            exit 1
          fi
          authority_parent="Audit Skill - Current Authority"
          mapfile -t authority_dirs < <(find "$authority_parent" -mindepth 1 -maxdepth 1 -type d -name 'Audit_Litemode_v*' -print | sort)
          if [[ "${#authority_dirs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one unpacked current Lite authority package; found ${#authority_dirs[@]}"
            printf '%s\n' "${authority_dirs[@]}"
            exit 1
          fi
          authority="${authority_dirs[0]}"
          test -f "$authority/shared/controller/LITE_PHASE_RECEIPT_PROTOCOL.md"
          test ! -d "$authority/shared/handoff"
          for i in $(seq 0 10); do
            grep -Fq "receipts/PHASE_$(printf '%02d' "$i")_RECEIPT_v1.json" "$authority/phases/phase-$i/PHASE_CONTRACT.json"
          done
          for i in $(seq 1 10); do
            test -f "$authority/phases/phase-$i/PHASE_$(printf '%02d' "$i")_SCHEMA_v1.json"
            test -f "$authority/phases/phase-$i/resources/PHASE_$(printf '%02d' "$i")_WORK_FORM_TEMPLATE_v1.json"
            grep -Fq '"activeReceiptExistsDuringAgentWork": false' "$authority/phases/phase-$i/PHASE_CONTRACT.json"
            grep -Fq '"agentPerformsBookkeeping": false' "$authority/phases/phase-$i/PHASE_CONTRACT.json"
          done
          test -f "$authority/shared/controller/LITE_PHASE_SCHEMA_POLICY.md"
          test -f "$authority/shared/controller/PHASE_WORK_PACKET_TEMPLATE_v1.json"
          if git grep -I -E 'SUCCESSOR_HANDOFF\.json|SUCCESSOR_HANDOFF_RECEIPT\.json|PHASE0_WEB_BOOTSTRAP_COMPLETION_REPORT|PHASE0_CAPABILITY_PREFLIGHT|INSTRUCTION_READ_PROOF\.json|PROCESS_BLOCKER_RECEIPT\.json' -- "$authority" ':!**/PACKAGE_PROVENANCE.md' ':!**/LITE_PHASE_RECEIPT_PROTOCOL.md'; then
            echo "::error::Obsolete current Lite bookkeeping reference remains"
            exit 1
          fi

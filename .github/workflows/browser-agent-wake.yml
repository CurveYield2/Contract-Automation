name: Browser Agent Wake

on:
  workflow_dispatch:
    inputs:
      wake_id:
        required: true
        type: string
      campaign_id:
        required: true
        type: string
      phase_id:
        required: true
        type: string
      thinking_effort:
        description: ChatGPT reasoning effort to enforce before posting a wake
        required: false
        default: high
        type: choice
        options: [high]
      mode:
        required: true
        default: resume_existing
        type: choice
        options: [resume_existing, create_fresh]
      chat_url:
        required: false
        type: string
      wake_message_b64:
        required: true
        type: string
      watchdog_enabled:
        required: true
        default: true
        type: boolean
      worker_role:
        required: false
        default: reviewer
        type: choice
        options: [reviewer, interphase_mechanical]
      watchdog_message_b64:
        required: false
        type: string
      gate_mode:
        required: false
        default: FULL_V26
        type: choice
        options: [FULL_V26, LITE]
      gate_repository:
        required: false
        default: CurveYield2/Audit-Controller
        type: string
      gate_ref:
        required: false
        default: main
        type: string
      gate_state_path:
        required: false
        type: string
      gate_expected_phase_id:
        required: false
        type: string
      gate_expected_milestone_id:
        required: false
        type: string
      gate_active_pointer_path:
        required: false
        type: string
      gate_interphase_handoff_path:
        required: false
        type: string
      gate_interphase_work_packet_path:
        required: false
        type: string
      gate_interphase_completion_path:
        required: false
        type: string
      gate_interphase_work_packet_sha256:
        required: false
        type: string
      gate_stop_states_csv:
        required: false
        default: WAITING_FOR_HUMAN_RESPONSE,WAITING_FOR_SUCCESSOR_AGENT,CLOSED,STOPPED_BY_HUMAN
        type: string
      gate_stop_campaign_statuses_csv:
        required: false
        default: COMPLETE,STOPPED_BY_HUMAN
        type: string
      runner_retry_attempt:
        description: Internal fresh-runner retry attempt counter
        required: false
        default: '0'
        type: string
      browser_context_b64:
        description: Optional Base64 JSON browser context for routine, project, chat, and repair policy
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # WAKE owns the one shared ChatGPT browser state until delivery completes.
  # WATCHDOG cannot run until WAKE releases this queue.
  group: chatgpt-shared-browser-session-v1
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WAKE_ID: ${{ inputs.wake_id }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      PHASE_ID: ${{ inputs.phase_id }}
      CHATGPT_THINKING_EFFORT: ${{ inputs.thinking_effort }}
      WORKER_ROLE: ${{ inputs.worker_role }}
      WAKE_MODE: ${{ inputs.mode }}
      CHAT_URL: ${{ inputs.chat_url }}
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      BROWSER_HEADLESS: 'false'
      DISPLAY: ':99'
      INTERACTIVE_VIEW_ENABLED: 'true'
      MANUAL_CHALLENGE_WAIT_MS: '900000'
      HOME_EXIT_NODE: ${{ vars.BROWSER_HOME_EXIT_NODE || '100.112.238.56' }}

    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        if: inputs.gate_mode == 'LITE'
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Resolve idempotent reviewer wake
        if: inputs.worker_role == 'reviewer'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MILESTONE: ${{ inputs.gate_expected_milestone_id }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_CHAT_URL: ${{ inputs.chat_url }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
          encoded="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"
          if [ -n "$encoded" ]; then
            printf '%s' "$encoded" | base64 -d > /tmp/existing-registration.json
            existing_milestone="$(jq -r '.activeAssignment.milestoneId // empty' /tmp/existing-registration.json)"
            existing_chat="$(jq -r '.activeChat.url // .chatUrl // empty' /tmp/existing-registration.json)"
            if [ "$REQUESTED_MODE" = "create_fresh" ] \
              && [ "$existing_milestone" = "$REQUESTED_MILESTONE" ] \
              && [[ "$existing_chat" =~ ^https://chatgpt\.com/(c/[A-Za-z0-9_-]+|g/g-p-[A-Za-z0-9_-]+/c/[A-Za-z0-9_-]+)/?$ ]]; then
              echo "Fresh launch deduplicated: reviewer chat already exists for $CAMPAIGN_ID / $REQUESTED_MILESTONE."
              echo "WAKE_MODE=resume_existing" >> "$GITHUB_ENV"
              echo "CHAT_URL=$existing_chat" >> "$GITHUB_ENV"
              echo "DEDUPED_FRESH_LAUNCH=true" >> "$GITHUB_ENV"
            fi

            delivered_milestone="$(jq -r '.wakeDelivery.milestoneId // empty' /tmp/existing-registration.json)"
            delivered_chat="$(jq -r '.wakeDelivery.chatUrl // empty' /tmp/existing-registration.json)"
            if [ "$REQUESTED_MODE" = "resume_existing" ] \
              && [ "$delivered_milestone" = "$REQUESTED_MILESTONE" ] \
              && [ -n "$REQUESTED_CHAT_URL" ] \
              && [ "$delivered_chat" = "$REQUESTED_CHAT_URL" ]; then
              echo "Initial existing-chat wake already delivered for $CAMPAIGN_ID / $REQUESTED_MILESTONE; this run will use the watchdog poke message."
              echo "INITIAL_WAKE_DEDUPED=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up isolated browser-agent runtime
        uses: ./.github/actions/setup-browser-agent-runtime

      - name: Install private VNC helper
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y x11vnc xclip xdotool

      - name: Record runner egress before home exit node
        shell: bash
        run: |
          set -euo pipefail
          direct="$(curl -fsS --max-time 15 https://api.ipify.org)"
          test -n "$direct"
          printf '%s' "$direct" | sha256sum | awk '{print "DIRECT_EGRESS_HASH="$1}' >> "$GITHUB_ENV"
          echo "Recorded runner egress fingerprint without logging the address."

      - name: Connect runner to tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ env.HOME_EXIT_NODE }}

      - name: Start visible Chrome display and private tailnet VNC
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension RANDR >/tmp/xvfb-browser-agent.log 2>&1 &
          echo $! >/tmp/xvfb-browser-agent.pid
          for i in {1..20}; do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { cat /tmp/xvfb-browser-agent.log || true; exit 1; }
          ts_ip="$(tailscale ip -4 | head -n1)"
          test -n "$ts_ip"
          echo "TAILSCALE_RUNNER_IP=$ts_ip" >> "$GITHUB_ENV"
          x11vnc -display :99 -rfbport 5900 -listen "$ts_ip" -nopw -forever -shared -quiet >/tmp/x11vnc-browser-agent.log 2>&1 &
          echo $! >/tmp/x11vnc-browser-agent.pid
          echo "TAILSCALE_VNC=$ts_ip:5900"

      - name: Route browser phase through home exit node
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 3s 10s tailscale status
          timeout -k 5s 20s sudo tailscale set --exit-node="$HOME_EXIT_NODE"
          changed=false
          for i in {1..8}; do
            current="$(curl -fsS --connect-timeout 3 --max-time 5 https://api.ipify.org || true)"
            if [ -n "$current" ]; then
              current_hash="$(printf '%s' "$current" | sha256sum | awk '{print $1}')"
              if [ "$current_hash" != "$DIRECT_EGRESS_HASH" ]; then changed=true; break; fi
            fi
            sleep 2
          done
          [ "$changed" = true ] || { echo "::error::Tailscale exit node did not change runner egress."; exit 1; }
          echo "HOME_EXIT_EGRESS_ACTIVE=true"

      - name: Decode wake messages
        env:
          WAKE_MESSAGE_B64: ${{ inputs.wake_message_b64 }}
          WATCHDOG_MESSAGE_B64: ${{ inputs.watchdog_message_b64 }}
          BROWSER_CONTEXT_B64: ${{ inputs.browser_context_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${BROWSER_CONTEXT_B64:-}" ]; then
            printf '%s' "$BROWSER_CONTEXT_B64" | base64 -d > /tmp/browser-context.json
          else
            printf '{}\n' > /tmp/browser-context.json
          fi
          message_purpose="$(jq -r '.messagePurpose // "standard"' /tmp/browser-context.json)"

          # The full tailored packet is first-message-only. Every later automation
          # message to an existing reviewer chat is exactly GET BACK TO WORK except
          # the one explicit repair-context message for a replacement chat.
          if [ "$WAKE_MODE" = "create_fresh" ]; then
            printf '%s' "$WAKE_MESSAGE_B64" | base64 -d > /tmp/wake-message.txt
            test -s /tmp/wake-message.txt
          elif [ "$message_purpose" = "initial_wake" ] && [ "${INITIAL_WAKE_DEDUPED:-false}" != "true" ]; then
            printf '%s' "$WAKE_MESSAGE_B64" | base64 -d > /tmp/wake-message.txt
            test -s /tmp/wake-message.txt
          elif [ "$message_purpose" = "repair_notice" ]; then
            printf '%s' "$WAKE_MESSAGE_B64" | base64 -d > /tmp/wake-message.txt
            test -s /tmp/wake-message.txt
          else
            printf '%s\n' 'GET BACK TO WORK' > /tmp/wake-message.txt
          fi
          printf '%s\n' 'GET BACK TO WORK' > /tmp/watchdog-message.txt

          jq -e '
            type=="object"
            and ((.routineId // "")|type=="string")
            and ((.projectName // "")|type=="string")
            and ((.projectUrl // "")|type=="string")
            and ((.chatName // "")|type=="string")
            and ((.repair // {})|type=="object")
            and ((.messagePurpose // "standard")=="standard" or (.messagePurpose // "standard")=="repair_notice" or (.messagePurpose // "standard")=="initial_wake")
            and (((.routineId // "") | test("[\\r\\n]")) | not)
            and (((.projectName // "") | test("[\\r\\n]")) | not)
            and (((.projectUrl // "") | test("[\\r\\n]")) | not)
            and (((.chatName // "") | test("[\\r\\n]")) | not)
          ' /tmp/browser-context.json >/dev/null

          echo "WAKE_MESSAGE_PURPOSE=$message_purpose" >> "$GITHUB_ENV"

          {
            echo "BROWSER_ROUTINE_ID=$(jq -r '.routineId // empty' /tmp/browser-context.json)"
            echo "CHATGPT_PROJECT_NAME=$(jq -r '.projectName // empty' /tmp/browser-context.json)"
            echo "CHATGPT_PROJECT_URL=$(jq -r '.projectUrl // empty' /tmp/browser-context.json)"
            echo "CHATGPT_CHAT_NAME=$(jq -r '.chatName // empty' /tmp/browser-context.json)"
            echo "REPAIR_ENABLED=$(jq -r '.repair.enabled // false' /tmp/browser-context.json)"
            echo "REPAIR_IDLE_POKE_THRESHOLD=$(jq -r '.repair.idlePokeThreshold // 3' /tmp/browser-context.json)"
            echo "REPAIR_UNVIEWABLE_THRESHOLD=$(jq -r '.repair.unviewableThreshold // 2' /tmp/browser-context.json)"
          } >> "$GITHUB_ENV"

      - name: Deliver wake through home-exit Playwright
        id: deliver
        shell: bash
        run: |
          set -euo pipefail
          export WAKE_ACTION='wake'
          export WAKE_MESSAGE="$(cat /tmp/wake-message.txt)"
          export WAKE_RESULT_PATH='/tmp/browser-agent-wake-result.json'
          set +e
          timeout -k 10s 360s node scripts/browser-agent-wake.mjs
          rc=$?
          set -e

          if [ ! -s "$WAKE_RESULT_PATH" ]; then
            jq -n --argjson rc "$rc" '{ok:false,wakeId:"unknown",failures:[{provider:"github-playwright",code:"NO_RESULT",retryable:false,error:("browser runtime exited without a result; rc="+($rc|tostring))}]}' > "$WAKE_RESULT_PATH"
          fi

          ok="$(jq -r '.ok // false' "$WAKE_RESULT_PATH")"
          retryable="$(jq -r '[.failures[]? | select(.retryable==true)] | length > 0' "$WAKE_RESULT_PATH")"
          retry_code="$(jq -r '[.failures[]? | select(.retryable==true) | .code][0] // empty' "$WAKE_RESULT_PATH")"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "retryable=$retryable" >> "$GITHUB_OUTPUT"
          echo "retry_code=$retry_code" >> "$GITHUB_OUTPUT"
          echo "chat_url=$(jq -r '.chatUrl // .after.url // .url // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "provider=$(jq -r '.provider // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "assistant_count=$(jq -r '.after.assistantCount // .assistantCount // 0' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"
          echo "last_hash=$(jq -r '.after.lastAssistantHash // .lastAssistantHash // empty' "$WAKE_RESULT_PATH")" >> "$GITHUB_OUTPUT"

          if [ "$ok" != true ]; then
            echo "::warning::Browser wake did not complete on this runner (retryable=$retryable code=$retry_code rc=$rc)."
          fi

      - name: Disable home exit node
        if: always()
        shell: bash
        run: |
          set +e
          sudo tailscale set --exit-node=""
          echo "Home exit-node routing disabled for post-browser workflow steps."

      - name: Dispatch fresh-runner retry for retryable pre-post failure
        id: fresh-runner-retry
        if: steps.deliver.outputs.ok != 'true' && steps.deliver.outputs.retryable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_INPUTS_JSON: ${{ toJSON(inputs) }}
        shell: bash
        run: |
          set -euo pipefail
          attempt='${{ inputs.runner_retry_attempt }}'
          max=3
          [[ "$attempt" =~ ^[0-9]+$ ]] || attempt=0

          if [ "$attempt" -ge "$max" ]; then
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fresh-runner retry budget exhausted at attempt $attempt/$max."
            exit 0
          fi

          next=$((attempt + 1))
          retry_inputs="$(printf '%s' "$RETRY_INPUTS_JSON" | jq -c --arg next "$next" --arg max "$max" '
            with_entries(.value |= tostring)
            | .runner_retry_attempt=$next
          ')"

          printf '%s\n' "$retry_inputs" | gh workflow run browser-agent-wake.yml             --repo "$GITHUB_REPOSITORY"             --ref main             --json

          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "next_attempt=$next" >> "$GITHUB_OUTPUT"
          echo "Fresh-runner retry $next/$max dispatched for $WAKE_ID after ${{ steps.deliver.outputs.retry_code }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail terminal browser wake
        if: steps.deliver.outputs.ok != 'true' && steps.fresh-runner-retry.outputs.dispatched != 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq '{ok,wakeId,failures}' /tmp/browser-agent-wake-result.json
          exit 1

      - name: Create watchdog state
        if: ${{ steps.deliver.outputs.ok == 'true' && inputs.watchdog_enabled }}
        env:
          CHAT_URL_RESOLVED: ${{ steps.deliver.outputs.chat_url }}
          PROVIDER: ${{ steps.deliver.outputs.provider }}
          ASSISTANT_COUNT: ${{ steps.deliver.outputs.assistant_count }}
          LAST_HASH: ${{ steps.deliver.outputs.last_hash }}
          GATE_MODE: ${{ inputs.gate_mode }}
          GATE_REPOSITORY: ${{ inputs.gate_repository }}
          GATE_REF: ${{ inputs.gate_ref }}
          GATE_STATE_PATH: ${{ inputs.gate_state_path }}
          GATE_EXPECTED_PHASE_ID: ${{ inputs.gate_expected_phase_id }}
          GATE_EXPECTED_MILESTONE_ID: ${{ inputs.gate_expected_milestone_id }}
          GATE_ACTIVE_POINTER_PATH: ${{ inputs.gate_active_pointer_path }}
          GATE_INTERPHASE_HANDOFF_PATH: ${{ inputs.gate_interphase_handoff_path }}
          GATE_INTERPHASE_WORK_PACKET_PATH: ${{ inputs.gate_interphase_work_packet_path }}
          GATE_INTERPHASE_COMPLETION_PATH: ${{ inputs.gate_interphase_completion_path }}
          GATE_INTERPHASE_WORK_PACKET_SHA256: ${{ inputs.gate_interphase_work_packet_sha256 }}
          GATE_STOP_STATES_CSV: ${{ inputs.gate_stop_states_csv }}
          GATE_STOP_CAMPAIGN_STATUSES_CSV: ${{ inputs.gate_stop_campaign_statuses_csv }}
          REPAIR_ENABLED: ${{ env.REPAIR_ENABLED }}
          REPAIR_IDLE_POKE_THRESHOLD: ${{ env.REPAIR_IDLE_POKE_THRESHOLD }}
          REPAIR_UNVIEWABLE_THRESHOLD: ${{ env.REPAIR_UNVIEWABLE_THRESHOLD }}
        shell: bash
        run: |
          set -euo pipefail
          safe_id="$(printf '%s' "$WAKE_ID" | tr -c 'A-Za-z0-9._-' '_')"
          jq -n \
            --arg schemaVersion 'curveyield-browser-agent-watchdog-state-v1' \
            --arg wakeId "$WAKE_ID" \
            --arg campaignId "$CAMPAIGN_ID" \
            --arg phaseId "$PHASE_ID" \
            --arg workerRole "$WORKER_ROLE" \
            --arg chatUrl "$CHAT_URL_RESOLVED" \
            --arg provider "$PROVIDER" \
            --arg armedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg idleMessage "$(cat /tmp/watchdog-message.txt)" \
            --arg gateMode "$GATE_MODE" \
            --arg gateRepository "$GATE_REPOSITORY" \
            --arg gateRef "$GATE_REF" \
            --arg gateStatePath "$GATE_STATE_PATH" \
            --arg gateExpectedPhaseId "$GATE_EXPECTED_PHASE_ID" \
            --arg gateExpectedMilestoneId "$GATE_EXPECTED_MILESTONE_ID" \
            --arg gateActivePointerPath "$GATE_ACTIVE_POINTER_PATH" \
            --arg gateInterphaseHandoffPath "$GATE_INTERPHASE_HANDOFF_PATH" \
            --arg gateInterphaseWorkPacketPath "$GATE_INTERPHASE_WORK_PACKET_PATH" \
            --arg gateInterphaseCompletionPath "$GATE_INTERPHASE_COMPLETION_PATH" \
            --arg gateInterphaseWorkPacketSha256 "$GATE_INTERPHASE_WORK_PACKET_SHA256" \
            --arg gateStopStatesCsv "$GATE_STOP_STATES_CSV" \
            --arg gateStopCampaignStatusesCsv "$GATE_STOP_CAMPAIGN_STATUSES_CSV" \
            --arg repairEnabled "$REPAIR_ENABLED" \
            --arg repairIdlePokeThreshold "$REPAIR_IDLE_POKE_THRESHOLD" \
            --arg repairUnviewableThreshold "$REPAIR_UNVIEWABLE_THRESHOLD" \
            --arg lastHash "$LAST_HASH" \
            --argjson assistantCount "${ASSISTANT_COUNT:-0}" \
            '{
              schemaVersion:$schemaVersion,wakeId:$wakeId,campaignId:$campaignId,phaseId:$phaseId,workerRole:$workerRole,
              status:"ACTIVE",chatUrl:$chatUrl,lastProvider:$provider,armedAt:$armedAt,intervalMinutes:5,
              idleMessage:$idleMessage,
              observation:{assistantCount:$assistantCount,lastAssistantHash:$lastHash,observedAt:$armedAt},
              gate:{
                mode:$gateMode,
                repository:$gateRepository,
                ref:$gateRef,
                statePath:$gateStatePath,
                expectedPhaseId:$gateExpectedPhaseId,
                expectedMilestoneId:$gateExpectedMilestoneId,
                activePointerPath:$gateActivePointerPath,
                interphase:{
                  handoffPath:$gateInterphaseHandoffPath,
                  workPacketPath:$gateInterphaseWorkPacketPath,
                  completionPath:$gateInterphaseCompletionPath,
                  workPacketSha256:$gateInterphaseWorkPacketSha256
                },
                stopStates:($gateStopStatesCsv|split(",")|map(gsub("^ +| +$";""))),
                stopCampaignStatuses:($gateStopCampaignStatusesCsv|split(",")|map(gsub("^ +| +$";"")))
              },
              repair:{
                enabled:($repairEnabled=="true"),
                idlePokeThreshold:(($repairIdlePokeThreshold|tonumber?) // 3),
                unviewableThreshold:(($repairUnviewableThreshold|tonumber?) // 2),
                consecutiveIdlePokes:0,
                consecutiveUnviewable:0
              }
            }' > "/tmp/$safe_id.json"
          echo "WATCHDOG_STATE=/tmp/$safe_id.json" >> "$GITHUB_ENV"
          echo "WATCHDOG_SAFE_ID=$safe_id" >> "$GITHUB_ENV"

      - name: Persist watchdog state
        if: ${{ steps.deliver.outputs.ok == 'true' && inputs.watchdog_enabled }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 "$WATCHDOG_STATE")"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-watchdog/active/$WATCHDOG_SAFE_ID.json"
          existing="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh api --method PUT "$api" -f message="chore(watchdog): refresh $WAKE_ID" -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="chore(watchdog): arm $WAKE_ID" -f content="$content" -f branch=main >/dev/null
          fi

      - name: Persist existing-chat reviewer wake into campaign registration
        if: ${{ steps.deliver.outputs.ok == 'true' && inputs.mode == 'resume_existing' && inputs.worker_role == 'reviewer' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_CHAT_URL: ${{ steps.deliver.outputs.chat_url }}
          CURRENT_REVIEWER: ${{ env.CHATGPT_CHAT_NAME }}
          CURRENT_PHASE_ID: ${{ inputs.phase_id }}
          CURRENT_MILESTONE_ID: ${{ inputs.gate_expected_milestone_id }}
          CURRENT_THINKING_EFFORT: ${{ inputs.thinking_effort }}
          CURRENT_GATE_MODE: ${{ inputs.gate_mode }}
          CURRENT_GATE_REPOSITORY: ${{ inputs.gate_repository }}
          CURRENT_GATE_REF: ${{ inputs.gate_ref }}
          CURRENT_GATE_STATE_PATH: ${{ inputs.gate_state_path }}
          CURRENT_GATE_POINTER_PATH: ${{ inputs.gate_active_pointer_path }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          api="repos/$GITHUB_REPOSITORY/contents/process/browser-agent-wake/registrations/$safe_campaign.json"
          gh api "$api?ref=main" --jq '.content' | base64 -d > /tmp/existing-chat-registration.json
          delivered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq \
            --arg url "$RESOLVED_CHAT_URL" \
            --arg reviewer "$CURRENT_REVIEWER" \
            --arg phaseId "$CURRENT_PHASE_ID" \
            --arg milestoneId "$CURRENT_MILESTONE_ID" \
            --arg workerRole "$WORKER_ROLE" \
            --arg thinkingEffort "$CURRENT_THINKING_EFFORT" \
            --arg wakeMessage "$(cat /tmp/wake-message.txt)" \
            --arg idleMessage "$(cat /tmp/watchdog-message.txt)" \
            --arg gateMode "$CURRENT_GATE_MODE" \
            --arg gateRepository "$CURRENT_GATE_REPOSITORY" \
            --arg gateRef "$CURRENT_GATE_REF" \
            --arg gateStatePath "$CURRENT_GATE_STATE_PATH" \
            --arg gatePointerPath "$CURRENT_GATE_POINTER_PATH" \
            --arg deliveredAt "$delivered_at" \
            '.mode="resume_existing"
             | .chatUrl=$url
             | .browserRoutine=""
             | .chatgptProject={name:"",url:""}
             | .activeChat={name:$reviewer,url:$url}
             | .wakeMessage=$wakeMessage
             | .thinkingEffort=$thinkingEffort
             | .activeAssignment={phaseId:$phaseId,milestoneId:$milestoneId,workerRole:$workerRole,reviewer:$reviewer,thinkingEffort:$thinkingEffort}
             | .wakeDelivery={milestoneId:$milestoneId,chatUrl:$url,deliveredAt:$deliveredAt}
             | .watchdog=((.watchdog // {}) + {idleMessage:$idleMessage})
             | .watchdog.gate=((.watchdog.gate // {}) + {mode:$gateMode,repository:$gateRepository,ref:$gateRef,statePath:$gateStatePath,expectedPhaseId:$phaseId,expectedMilestoneId:$milestoneId,activePointerPath:$gatePointerPath})
             | .updatedAt=(now|todate)' \
            /tmp/existing-chat-registration.json > /tmp/existing-chat-registration-updated.json

          sha="$(gh api "$api?ref=main" --jq '.sha')"
          content="$(base64 -w0 /tmp/existing-chat-registration-updated.json)"
          gh api --method PUT "$api" \
            -f message="chore(wake): record existing-chat wake for $CAMPAIGN_ID $CURRENT_MILESTONE_ID" \
            -f content="$content" -f sha="$sha" -f branch=main >/dev/null

      - name: Activate prepared Lite receipt successor
        if: ${{ steps.deliver.outputs.ok == 'true' && inputs.worker_role == 'reviewer' && inputs.gate_mode == 'LITE' }}
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          DIRECTORY_PATH: ${{ inputs.gate_state_path }}
          AUDIT_CONTROLLER_REF: ${{ inputs.gate_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DIRECTORY_PATH" in "Audit Campaign Directory/campaigns/"*.json) ;; *) exit 0;; esac
          gh auth setup-git
          rm -rf .audit-controller-wake
          gh repo clone CurveYield2/Audit-Controller .audit-controller-wake -- --filter=blob:none --no-checkout
          cd .audit-controller-wake
          git fetch origin "$AUDIT_CONTROLLER_REF"
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"
          directory_schema="$(jq -r '.schemaVersion // empty' "$DIRECTORY_PATH")"
          if [ "$directory_schema" = "curveyield-audit-campaign-directory-entry-v2" ]; then
            campaign_status="$(jq -r '.campaignStatus // empty' "$DIRECTORY_PATH")"
            assignment_status="$(jq -r '.currentAssignment.status // empty' "$DIRECTORY_PATH")"
            if [ "$campaign_status" = "WAITING_FOR_SUCCESSOR_AGENT" ] && [ "$assignment_status" = "WAITING_FOR_SUCCESSOR_AGENT" ]; then
              now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              jq --arg now "$now" '.campaignStatus="ACTIVE" | .currentAssignment.status="ACTIVE" | .updatedAt=$now' "$DIRECTORY_PATH" > /tmp/directory-v2.json
              mv /tmp/directory-v2.json "$DIRECTORY_PATH"
              reviewer="$(jq -r '.currentAssignment.reviewer' "$DIRECTORY_PATH")"
              git config user.name 'CurveYield Browser Wake'
              git config user.email 'browser-wake@users.noreply.github.com'
              git add -- "$DIRECTORY_PATH"
              if ! git diff --cached --quiet; then
                git commit -m "audit(assignment): activate $CAMPAIGN_ID $reviewer"
                git push origin "HEAD:$AUDIT_CONTROLLER_REF"
              fi
            else
              echo "Assignment-v2 wake resumes the current reviewer state without creating or modifying a phase receipt."
            fi
            exit 0
          fi
          directory_status="$(jq -r '.status // empty' "$DIRECTORY_PATH")"
          if [ "$directory_status" = "ACTIVE" ] || [ "$directory_status" = "BLOCKED" ]; then
            current_path="$(jq -r '.currentReceiptPath' "$DIRECTORY_PATH")"
            test -f "$current_path"
            if [ "$directory_status" = "BLOCKED" ]; then
              now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              receipt_status="$(jq -r '.phase.status // empty' "$current_path")"
              if [ "$receipt_status" = "BLOCKED" ]; then
                jq --arg now "$now" '.phase.status="ACTIVE" | .updatedAt=$now' "$current_path" > /tmp/repaired-current-receipt.json
                mv /tmp/repaired-current-receipt.json "$current_path"
              fi
              jq --arg now "$now" '.status="ACTIVE" | .updatedAt=$now' "$DIRECTORY_PATH" > /tmp/repaired-directory.json
              mv /tmp/repaired-directory.json "$DIRECTORY_PATH"
              git config user.name 'CurveYield Browser Wake'
              git config user.email 'browser-wake@users.noreply.github.com'
              git add -- "$current_path" "$DIRECTORY_PATH"
              if ! git diff --cached --quiet; then
                git commit -m "audit(receipt): resume blocked reviewer $CAMPAIGN_ID"
                git push origin "HEAD:$AUDIT_CONTROLLER_REF"
              fi
            fi
            echo "Current Lite reviewer assignment is being resumed in a replacement chat; no successor transition is required."
            exit 0
          fi
          test "$directory_status" = "WAITING_FOR_SUCCESSOR_AGENT"
          outgoing_path="$(jq -r '.currentReceiptPath' "$DIRECTORY_PATH")"
          incoming_path="$(jq -r '.handoff.incomingReceiptPath // empty' "$outgoing_path")"
          test -n "$incoming_path"
          test -f "$incoming_path"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq --arg now "$now" '.handoff.status="SUCCESSOR_ACTIVATED" | .updatedAt=$now' "$outgoing_path" > /tmp/outgoing.json
          mv /tmp/outgoing.json "$outgoing_path"
          jq --arg now "$now" '.phase.status="ACTIVE" | .updatedAt=$now' "$incoming_path" > /tmp/incoming.json
          mv /tmp/incoming.json "$incoming_path"
          phase_seq="$(jq -r '.phase.sequence' "$incoming_path")"
          reviewer="$(jq -r '.executor.lineage' "$incoming_path")"
          jq --arg path "$incoming_path" --arg reviewer "$reviewer" --arg now "$now" --argjson seq "$phase_seq"             '.currentReceiptPath=$path | .currentPhaseSequence=$seq | .currentReviewer=$reviewer | .status="ACTIVE" | .updatedAt=$now'             "$DIRECTORY_PATH" > /tmp/directory.json
          mv /tmp/directory.json "$DIRECTORY_PATH"
          git config user.name 'CurveYield Browser Wake'
          git config user.email 'browser-wake@users.noreply.github.com'
          git add -- "$outgoing_path" "$incoming_path" "$DIRECTORY_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "audit(receipt): activate $CAMPAIGN_ID $reviewer"
            git push origin "HEAD:$AUDIT_CONTROLLER_REF"
          fi

      - name: Arm immediate watchdog observation
        if: ${{ steps.deliver.outputs.ok == 'true' && inputs.watchdog_enabled }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run browser-agent-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_id="$WAKE_ID"

      - name: Upload browser wake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-wake-evidence-${{ github.run_id }}
          path: /tmp/browser-wake-evidence-v1/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup browser display
        if: always()
        shell: bash
        run: |
          set +e
          [ -f /tmp/x11vnc-browser-agent.pid ] && kill "$(cat /tmp/x11vnc-browser-agent.pid)" 2>/dev/null
          [ -f /tmp/xvfb-browser-agent.pid ] && kill "$(cat /tmp/xvfb-browser-agent.pid)" 2>/dev/null

name: Ephemeral Anvil Qualification v1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ephemeral-anvil-qualification-v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    name: Existing Phase-0 smoke workflow
    uses: ./.github/workflows/lite-phase0-simulation-testing-v1.yml
    with:
      campaign_id: curveyield-dex-v16-source-r4
      campaign_path: campaigns/CurveYield DEX v16 Source r4
      audit_controller_ref: main
      medusa_calls: '1000'
      telemetry_calls: '0'
    secrets: inherit

  full:
    name: Existing full Phase-0 randomized workflow
    needs: smoke
    uses: ./.github/workflows/lite-phase0-randomized-simulation-v1.yml
    with:
      campaign_id: curveyield-dex-v16-source-r4
      campaign_path: campaigns/CurveYield DEX v16 Source r4
      audit_controller_ref: main
    secrets: inherit

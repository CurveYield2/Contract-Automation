name: BoostHub v11 Fraxtal Converter Anvil Simulation v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-v11-fraxtal-converter-anvil-v1.yml'
      - 'github-native-sim/boosthub-v11-fraxtal-fork-v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fraxtal-converter-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Supply third-party dependencies within GitHub runner only
        working-directory: github-native-sim/boosthub-v11-fraxtal-fork-v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib
          git clone -q --depth=1 --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone -q --depth=1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          forge --version
          git -C lib/openzeppelin-contracts rev-parse HEAD
          git -C lib/forge-std rev-parse HEAD
      - name: Verify Fraxtal upstream state before forking
        shell: bash
        env:
          FRA_RPC: ${{ secrets.RPC_FRAXTAL }}
        run: |
          set -euo pipefail
          URL="${FRA_RPC:-https://rpc.frax.com}"
          for i in 1 2 3; do
            if chainid=$(cast chain-id --rpc-url "$URL" 2>/dev/null); then break; fi
            sleep 4
          done
          test "${chainid:-}" = '252' || { echo "::error::Fraxtal RPC is unavailable or returned wrong chain"; exit 1; }
          POOL=0x3df1658e3E76d14eF3C4d410829EA7575bB83B9B
          echo "coin0: $(cast call "$POOL" 'coins(uint256)(address)' 0 --rpc-url "$URL")"
          echo "coin1: $(cast call "$POOL" 'coins(uint256)(address)' 1 --rpc-url "$URL")"
          (cast call "$POOL" 'price_oracle()(uint256)' --rpc-url "$URL" || cast call "$POOL" 'price_oracle(uint256)(uint256)' 0 --rpc-url "$URL") | tee fraxtal-ema-oracle-v1.txt
          echo "FRAXTAL_FORK_UPSTREAM=$URL" >> "$GITHUB_ENV"
      - name: Start isolated Anvil Fraxtal fork
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$FRAXTAL_FORK_UPSTREAM" --chain-id 252 --port 8545 > fraxtal-anvil-v1.log 2>&1 &
          echo $! > .fraxtal-anvil.pid
          for i in $(seq 1 90); do
            if cid=$(cast chain-id --rpc-url http://127.0.0.1:8545 2>/dev/null); then
              if [ "$cid" = '252' ]; then echo "Fraxtal fork online"; exit 0; fi
            fi
            sleep 2
          done
          echo '::error::Fraxtal Anvil fork did not come online'
          tail -100 fraxtal-anvil-v1.log
          exit 1
      - name: Compile converter source and simulate on fork
        working-directory: github-native-sim/boosthub-v11-fraxtal-fork-v1
        env:
          FRAXTAL_FORK_RPC: http://127.0.0.1:8545
        shell: bash
        run: |
          set -o pipefail
          forge test -vvv --match-path 'test/BoostHubV11FraxtalFork.t.sol' 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-v11-fraxtal-simulation-v1.log"
      - name: Archive simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-v11-fraxtal-converter-sim-v1-${{ github.run_id }}
          path: |
            boosthub-v11-fraxtal-simulation-v1.log
            fraxtal-ema-oracle-v1.txt
            fraxtal-anvil-v1.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .fraxtal-anvil.pid ]; then kill "$(cat .fraxtal-anvil.pid)" || true; fi

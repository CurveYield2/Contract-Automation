name: Katana cyvbUSDC Morpho Lending Venue v2

# Manual-only. No push/schedule/automatic deployment.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = read-only checks; apply = add lending venue plus automatic instant-withdraw fallback on Katana'
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      apply_confirmation:
        description: 'For apply only, enter ENABLE_VBUSDC_YVAUSD_INSTANT'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: katana-cyvbusdc-morpho-market-config-v2
  cancel-in-progress: false

jobs:
  configure-morpho-venue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require explicit manual apply confirmation
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'ENABLE_VBUSDC_YVAUSD_INSTANT' ]; then
            echo '::error::Apply requires exact ENABLE_VBUSDC_YVAUSD_INSTANT confirmation.'
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned repo dependencies on GitHub runner
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate or configure installed Morpho supply venue
        shell: bash
        env:
          DEPLOYER_FX: ${{ secrets.DEPLOYER_FX }}
          KATANA_RPC_URL: https://rpc.katana.network/
          MODE: ${{ inputs.mode }}
          APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
        run: |
          set -euo pipefail
          node scripts/katana/cyvbusdc-morpho-venue-v2.mjs

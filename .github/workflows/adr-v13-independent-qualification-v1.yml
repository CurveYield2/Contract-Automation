name: V13 Independent Qualification v1
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_sha:
        description: Immutable Audit-Controller commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v13-independent-qualification-${{ inputs.campaign_id }}
  cancel-in-progress: false
jobs:
  independent-private-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: v13-independent-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select exact Audit-Controller identity
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Fetch immutable campaign and private answer key
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          CAMPAIGN: ${{ inputs.campaign_path }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CONTROLLER_SHA: ${{ inputs.audit_controller_sha }}
          TRUTH_TOKEN: ${{ secrets.V13_QUALIFICATION_PRIVATE_TOKEN }}
          TRUTH_REPO: ${{ secrets.V13_QUALIFICATION_PRIVATE_REPO }}
          TRUTH_PATH: ${{ secrets.V13_QUALIFICATION_PRIVATE_PATH }}
          TRUTH_REF: ${{ secrets.V13_QUALIFICATION_PRIVATE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$CAMPAIGN_ID" =~ ^[A-Za-z0-9._-]+-r[0-9]+$ ]] || exit 1
          [[ "$CAMPAIGN" =~ ^campaigns/[A-Za-z0-9._\ -]+$ ]] || exit 1
          [[ "$CONTROLLER_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$TRUTH_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ && -n "$TRUTH_TOKEN" ]] || {
            echo "::error::Independent private manifest credential not configured"; exit 1;
          }
          [[ "$TRUTH_PATH" =~ ^[A-Za-z0-9._/-]+\.json$ && "$TRUTH_PATH" != *..* ]] || exit 1
          [[ "$TRUTH_REF" =~ ^[A-Za-z0-9._/-]+$ && "$TRUTH_REF" != *..* ]] || exit 1
          echo "::add-mask::$TRUTH_REPO"
          echo "::add-mask::$TRUTH_PATH"
          mkdir -p /tmp/v13-private
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$CONTROLLER_SHA" detach "$CAMPAIGN"
          GH_TOKEN="$TRUTH_TOKEN" gh api "repos/$TRUTH_REPO/contents/$TRUTH_PATH?ref=$TRUTH_REF" \
            --jq '.content' | base64 -d > /tmp/v13-private/truth.json
          chmod 600 /tmp/v13-private/truth.json
          echo "PRIVATE_SEEDED_TRUTH_FILE=/tmp/v13-private/truth.json" >> "$GITHUB_ENV"
          find '.audit-controller/Audit Campaign Directory/campaigns' -maxdepth 1 -name '*.json' -print0 |
            xargs -0 -r -I {} sh -c 'jq -e --arg c "$1" --arg p "$2" ".campaignId==\$c and .workspacePath==\$p and .campaignStatus==\"COMPLETE\"" "$3" >/dev/null && printf "%s\n" "$3" || true' _ "$CAMPAIGN_ID" "$CAMPAIGN" {} \
            > /tmp/v13-private/directories.txt
          test "$(wc -l < /tmp/v13-private/directories.txt)" -eq 1 || {
            echo "::error::No unique completed, source-bound audit campaign"; exit 1;
          }
          jq -e --arg c "$CAMPAIGN_ID" \
            '.schemaVersion=="curveyield-private-seeded-truth-v1" and .campaignId==$c and .expectedDefects==41 and .baselineCaught==14 and (.cases|type=="array")' \
            /tmp/v13-private/truth.json >/dev/null || {
              echo "::error::Private truth identity or baseline does not match"; exit 1;
            }
          expected="$(jq -r '.sourceSha256 // empty' /tmp/v13-private/truth.json)"
          actual="$(jq -r '.sourceSha256 // empty' "$(head -n1 /tmp/v13-private/directories.txt)")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$expected" == "$actual" ]] || {
            echo "::error::Private truth not bound to audited source hash"; exit 1;
          }
      - name: Extract submitted findings and screen reviewer-readable leakage
        env:
          CAMPAIGN: ${{ inputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/adr-v13-findings-from-campaign-v1.mjs "$PWD/.audit-controller" "$CAMPAIGN" /tmp/v13-private/findings.json
          node scripts/adr-v13-private-leak-check-v1.mjs "$PWD/.audit-controller/$CAMPAIGN/work" "$PWD/.audit-controller/$CAMPAIGN/source" \
            > /tmp/v13-private/leak.json
          jq -e '.safeToPublish==true and .leakingFileCount==0' /tmp/v13-private/leak.json >/dev/null
      - name: Score actual findings privately, publish only aggregate
        shell: bash
        run: |
          set -euo pipefail
          node packages/github-native-sim/src/adr-seeded-score-cli-v1.mjs /tmp/v13-private/findings.json \
            AUTO_PRIVATE_SOURCE_MATCH > /tmp/v13-private/score.json
          node scripts/adr-v13-public-score-v1.mjs /tmp/v13-private/score.json /tmp/v13-private/public.json
          jq -c '{defectCount,caught,decoysFlagged,cleanControlCriticalHighFalsePositiveCount,gate}' \
            /tmp/v13-private/public.json >> "$GITHUB_STEP_SUMMARY"
          echo 'This run alone does not authorize a release; independent human review and an attested qualification receipt remain required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy private truth and evidence staging
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/v13-private
          echo 'No hidden truth, full scoring records, or reviewed source was uploaded as an artifact.' >> "$GITHUB_STEP_SUMMARY"

name: Original Phase0 Healthy Preflight Resume v10
on:
  push:
    paths:
      - 'process/browser-agent-original-phase0-v1/preflight-requests/*-v*.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./packages/browser-agent-original-phase0-v5/setup-runtime-v5
      - name: Wait for healthy backend before sending
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^process/browser-agent-original-phase0-v1/preflight-requests/.*-v[0-9]+[.]json$' | tail -n1)"
          export CHAT_URL="$(jq -r '.chat_url' "$request")"
          export WAKE_MESSAGE="$(jq -r '.wake_message' "$request")"
          xvfb-run -a node packages/browser-agent-original-phase0-v10/healthy-preflight-resume-v10.mjs

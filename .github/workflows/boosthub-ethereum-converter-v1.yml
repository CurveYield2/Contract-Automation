name: Build Ethereum BoostHub unified converter v1 # inspect actual rewardRoute struct and red gate 4
on:
  push:
    branches: [build-boosthub-ethereum-converter-v1]
    paths: [.github/workflows/boosthub-ethereum-converter-v1.yml]
permissions:
  contents: read
concurrency:
  group: boosthub-ethereum-converter-v1
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned read-only tools
        working-directory: github-native-sim/boosthub-ethereum-converter-v1
        run: npm install --no-audit --no-fund
      - name: Trace live Ethereum contracts
        working-directory: github-native-sim/boosthub-ethereum-converter-v1
        run: node trace_v1.mjs
      - name: Record expected missing-converter test failure
        working-directory: github-native-sim/boosthub-ethereum-converter-v1
        run: |
          set +e
          node --test release_requirement_v1.test.mjs > trace_evidence_v1/tdd_red_v1.txt 2>&1
          status=$?
          cat trace_evidence_v1/tdd_red_v1.txt
          test "$status" -ne 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boosthub-ethereum-converter-trace-v1
          path: github-native-sim/boosthub-ethereum-converter-v1/trace_evidence_v1
          retention-days: 14

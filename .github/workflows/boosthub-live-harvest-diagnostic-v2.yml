name: BoostHub Live Harvest Diagnostic v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-live-harvest-diagnostic-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Trace live sdCRV and sdFXN harvest paths on disposable fork
        env:
          PRIVATE_RPC: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        shell: bash
        run: |
          set -u
          mkdir -p harvest-diagnostic-v2

          probe_rpc() {
            local url="$1"
            curl -sS --connect-timeout 4 --max-time 8 -X POST "$url" \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              | grep -q '"result":"0x'
          }

          RPC_URL=''
          RPC_LABEL=''
          if [ -n "${PRIVATE_RPC:-}" ] && probe_rpc "$PRIVATE_RPC"; then
            RPC_URL="$PRIVATE_RPC"; RPC_LABEL='configured-private'
          else
            for CANDIDATE in \
              'https://ethereum-rpc.publicnode.com' \
              'https://eth.llamarpc.com' \
              'https://1rpc.io/eth'; do
              if probe_rpc "$CANDIDATE"; then
                RPC_URL="$CANDIDATE"; RPC_LABEL="$CANDIDATE"; break
              fi
            done
          fi
          if [ -z "$RPC_URL" ]; then
            echo 'No responsive Ethereum RPC endpoint' >&2
            exit 1
          fi
          echo "rpc_selected=$RPC_LABEL" | tee harvest-diagnostic-v2/summary-v2.txt

          anvil --fork-url "$RPC_URL" --host 127.0.0.1 --port 8545 > harvest-diagnostic-v2/anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$ANVIL_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" != 1 ]; then
            echo 'Anvil fork did not start' >&2
            cat harvest-diagnostic-v2/anvil.log >&2 || true
            exit 1
          fi

          LOCAL=http://127.0.0.1:8545
          BLOCK=$(cast block-number --rpc-url "$LOCAL")
          echo "fork_block=$BLOCK" | tee -a harvest-diagnostic-v2/summary-v2.txt

          diagnose() {
            NAME="$1"
            STRAT="$2"
            EXPECTED_STAKING="$3"
            OUT="harvest-diagnostic-v2/${NAME}-v2.log"
            CALLER=0x1000000000000000000000000000000000000001
            {
              echo "=== $NAME ==="
              echo "strategy=$STRAT"
              echo "fork_block=$BLOCK"
              echo

              echo "--- strategy wiring ---"
              STAKING=$(cast call "$STRAT" 'staking()(address)' --rpc-url "$LOCAL" 2>&1 | awk '{print $1}')
              WANT=$(cast call "$STRAT" 'want()(address)' --rpc-url "$LOCAL" 2>&1 | awk '{print $1}')
              echo "staking=$STAKING expected=$EXPECTED_STAKING"
              echo "want=$WANT"
              echo "paused=$(cast call "$STRAT" 'paused()(bool)' --rpc-url "$LOCAL" 2>&1 || true)"
              echo "maxSlippageBps=$(cast call "$STRAT" 'maxSlippageBps()(uint256)' --rpc-url "$LOCAL" 2>&1 || true)"
              echo

              echo "--- FULL STRATEGY HARVEST TRACE ---"
              cast call "$STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" --trace 2>&1 || true
              echo

              echo "--- DIRECT STAKING HARVEST TRACE (msg.sender=strategy) ---"
              cast call "$STAKING" 'harvest()' --from "$STRAT" --rpc-url "$LOCAL" --trace 2>&1 || true
              echo

              echo "--- DIRECT CLAIM TRACE (msg.sender=strategy, receiver=strategy) ---"
              cast call "$STAKING" 'claim_rewards(address)' "$STRAT" --from "$STRAT" --rpc-url "$LOCAL" --trace 2>&1 || true
              echo

              echo "--- REWARD CONFIG / BALANCES ---"
              for IDX in 0 1 2 3 4 5 6 7; do
                TOKEN=$(cast call "$STRAT" 'rewards(uint256)(address)' "$IDX" --rpc-url "$LOCAL" 2>/dev/null | awk '{print $1}') || break
                [ -n "$TOKEN" ] || break
                [ "$TOKEN" = "0x0000000000000000000000000000000000000000" ] && break
                BAL=$(cast call "$TOKEN" 'balanceOf(address)(uint256)' "$STRAT" --rpc-url "$LOCAL" 2>&1 | awk '{print $1}')
                MIN=$(cast call "$STRAT" 'minAmounts(address)(uint256)' "$TOKEN" --rpc-url "$LOCAL" 2>&1 | awk '{print $1}')
                CONV=$(cast call "$STRAT" 'rewardConverter(address)(address)' "$TOKEN" --rpc-url "$LOCAL" 2>&1 | awk '{print $1}')
                echo "reward[$IDX]=$TOKEN balance=$BAL min=$MIN converter=$CONV"
                if [[ "$BAL" =~ ^[0-9]+$ ]] && [ "$BAL" -gt 0 ] && [[ "$CONV" =~ ^0x[0-9a-fA-F]{40}$ ]] && [ "$CONV" != "0x0000000000000000000000000000000000000000" ]; then
                  echo "preview[$IDX]=$(cast call "$CONV" 'previewConvert(address,address,uint256)(uint256)' "$TOKEN" "$WANT" "$BAL" --rpc-url "$LOCAL" 2>&1 || true)"
                fi
              done
              echo

              echo "--- SEQUENTIAL FORK TEST: staking.harvest -> claim_rewards ---"
              SNAP=$(cast rpc evm_snapshot --rpc-url "$LOCAL" | tr -d '"')
              cast rpc anvil_impersonateAccount "$STRAT" --rpc-url "$LOCAL" >/dev/null
              cast rpc anvil_setBalance "$STRAT" 0x8ac7230489e80000 --rpc-url "$LOCAL" >/dev/null
              if cast send "$STAKING" 'harvest()' --from "$STRAT" --unlocked --rpc-url "$LOCAL" --gas-limit 30000000 > /tmp/${NAME}-staking-harvest-v2.txt 2>&1; then
                echo "staking_harvest_tx=PASS"
                if cast send "$STAKING" 'claim_rewards(address)' "$STRAT" --from "$STRAT" --unlocked --rpc-url "$LOCAL" --gas-limit 30000000 > /tmp/${NAME}-claim-v2.txt 2>&1; then
                  echo "claim_rewards_tx=PASS"
                  echo "--- strategy harvest after pre-harvest+claim (conversion-focused) ---"
                  cast call "$STRAT" 'harvest()' --from "$CALLER" --rpc-url "$LOCAL" --trace 2>&1 || true
                else
                  echo "claim_rewards_tx=FAIL"
                  cat /tmp/${NAME}-claim-v2.txt
                fi
              else
                echo "staking_harvest_tx=FAIL"
                cat /tmp/${NAME}-staking-harvest-v2.txt
              fi
              cast rpc evm_revert "$SNAP" --rpc-url "$LOCAL" >/dev/null || true
            } | tee "$OUT"
          }

          diagnose sdcrv 0x93DFEfeFd5D3736381086eFa5A8810F278138ADf 0xA6730b33203f005cab6c80a2fF1d8B73E1947F2C
          diagnose sdfxn 0xc202f5137DE30b8170874e1DE55d1DbB2FA4CD45 0x7d53B437f950d6F515C8871aC985F1e875d6B52E

          echo >> harvest-diagnostic-v2/summary-v2.txt
          for F in harvest-diagnostic-v2/sdcrv-v2.log harvest-diagnostic-v2/sdfxn-v2.log; do
            echo "===== $(basename "$F") key lines =====" | tee -a harvest-diagnostic-v2/summary-v2.txt
            grep -Ei 'revert|FAIL|PASS|error|reward\[|preview\[|staking=|want=|paused=|maxSlippage|Slippage|ZeroQuote' "$F" | tail -n 200 | tee -a harvest-diagnostic-v2/summary-v2.txt || true
          done

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-live-harvest-diagnostic-v2
          path: harvest-diagnostic-v2
          if-no-files-found: warn
          retention-days: 14

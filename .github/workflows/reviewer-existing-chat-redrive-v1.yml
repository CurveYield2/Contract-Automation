name: Reviewer Existing Chat Redrive v1

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/reviewer-existing-chat-redrive/*.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout redrive request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Dispatch exact campaign orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'process/agent-upload/reviewer-existing-chat-redrive/*.json')
          [ "${#changed[@]}" -eq 1 ] || { echo "::error::Expected exactly one redrive request"; exit 1; }
          request="${changed[0]}"
          jq -e '
            .schemaVersion=="curveyield-reviewer-existing-chat-redrive-v1"
            and (.campaignId|type=="string" and length>0)
            and (.campaignName|type=="string" and length>0)
            and (.campaignPath|type=="string" and startswith("campaigns/"))
            and (.auditControllerRef|type=="string" and length>0)
          ' "$request" >/dev/null
          gh workflow run lite-audit-browser-orchestrator-v1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f campaign_id="$(jq -r '.campaignId' "$request")" \
            -f campaign_name="$(jq -r '.campaignName' "$request")" \
            -f campaign_path="$(jq -r '.campaignPath' "$request")" \
            -f audit_controller_ref="$(jq -r '.auditControllerRef' "$request")"

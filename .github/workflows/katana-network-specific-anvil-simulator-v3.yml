name: Katana Network Specific Anvil Simulator v3

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v3/requests/*.json'
      - '.github/workflows/katana-network-specific-anvil-simulator-v3.yml'
      - 'packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v3/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  katana-probe-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Probe live Katana route topology and router ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v3/results
          RESULT=packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v3/results/KATANA_ROUTE_PROBE_RESULT_v3.md
          RPC=https://katana.drpc.org/
          ROUTER=0x01F9894f92ea9224fECc8C35482E20a05De13582
          SAFE=0x47623C62f281807D615eeb4A2CEee9d97F9D3C49
          FX_POOL=0xE32B9b4C8f776687Ec54B4b6B62DbD9ce5fd4b99
          SUSHI_FACTORY=0x203e8740894c8955cB8950759876d7E7E45E04c1
          TARGET_POOL=0x2d43e7931329dbb709f33d7049c937c6794bae10
          NEW_FXUSD=0x4c03ff0f44A55e7098a09016E02a01d3cdC2FDF9
          VBWBTC=0x0913DA6Da4b42f538B445599b46Bb4622342Cf52

          FXUSD_FROM_FX_POOL="$(cast call "$FX_POOL" "fxUSD()(address)" --rpc-url "$RPC")"
          COLLATERAL="$(cast call "$FX_POOL" "collateralToken()(address)" --rpc-url "$RPC")"
          NEW_POOL_MANAGER="$(cast call "$NEW_FXUSD" "poolManager()(address)" --rpc-url "$RPC")"
          NEW_MANAGER_FXUSD="$(cast call "$NEW_POOL_MANAGER" "fxUSD()(address)" --rpc-url "$RPC")"
          NEW_MANAGER_FXBASE="$(cast call "$NEW_POOL_MANAGER" "fxBASE()(address)" --rpc-url "$RPC")"
          NEW_MANAGER_CONFIG="$(cast call "$NEW_POOL_MANAGER" "configuration()(address)" --rpc-url "$RPC")"
          TOKEN0="$(cast call "$TARGET_POOL" "token0()(address)" --rpc-url "$RPC")"
          TOKEN1="$(cast call "$TARGET_POOL" "token1()(address)" --rpc-url "$RPC")"
          POOL_FEE="$(cast call "$TARGET_POOL" "fee()(uint24)" --rpc-url "$RPC" | awk '{print $1}')"
          FACTORY_POOL="$(cast call "$SUSHI_FACTORY" "getPool(address,address,uint24)(address)" "$TOKEN0" "$TOKEN1" "$POOL_FEE" --rpc-url "$RPC")"
          ROUTER_OWNER="$(cast call "$ROUTER" "owner()(address)" --rpc-url "$RPC")"
          SAFE_THRESHOLD="$(cast call "$SAFE" "getThreshold()(uint256)" --rpc-url "$RPC" | awk '{print $1}')"
          ROUTE_0_TO_1="$(cast call "$ROUTER" "routeFor(address,address)(bytes)" "$TOKEN0" "$TOKEN1" --rpc-url "$RPC" || true)"
          ROUTE_1_TO_0="$(cast call "$ROUTER" "routeFor(address,address)(bytes)" "$TOKEN1" "$TOKEN0" --rpc-url "$RPC" || true)"
          GLOBAL_FEE_BPS="$(cast call "$ROUTER" "feeBps()(uint16)" --rpc-url "$RPC" 2>/dev/null | awk '{print $1}' || true)"
          FEE_RECIPIENT="$(cast call "$ROUTER" "feeRecipient()(address)" --rpc-url "$RPC" 2>/dev/null || true)"
          CODE="$(cast code "$ROUTER" --rpc-url "$RPC")"

          REGISTER_TOPIC=0xdfc596fabc6581c887262c97695176a79e3c8fc6ab7aaf14700820f3436b8fb9
          LATEST="$(cast block-number --rpc-url "$RPC")"
          START=25000000
          REGISTERED_POOLS=""
          for FROM in $(seq "$START" 500000 "$LATEST"); do
            TO=$((FROM + 499999))
            if [ "$TO" -gt "$LATEST" ]; then TO="$LATEST"; fi
            LOGS="$(cast logs --json --rpc-url "$RPC" --from-block "$FROM" --to-block "$TO" --address "$NEW_POOL_MANAGER" "$REGISTER_TOPIC" 2>/dev/null || true)"
            if [ -n "$LOGS" ] && [ "$LOGS" != "[]" ]; then
              FOUND="$(echo "$LOGS" | jq -r '.[].topics[1] // empty' | sed -E 's/^0x0{24}/0x/' | tr '\n' ' ')"
              REGISTERED_POOLS="$REGISTERED_POOLS $FOUND"
            fi
          done

          MATCHING_VBWBTC_POOLS=""
          POOL_DETAILS=""
          for P in $REGISTERED_POOLS; do
            PCOLL="$(cast call "$P" "collateralToken()(address)" --rpc-url "$RPC" 2>/dev/null || true)"
            PFXUSD="$(cast call "$P" "fxUSD()(address)" --rpc-url "$RPC" 2>/dev/null || true)"
            PMGR="$(cast call "$P" "poolManager()(address)" --rpc-url "$RPC" 2>/dev/null || true)"
            POOL_DETAILS="${POOL_DETAILS}\\npool=$P collateral=$PCOLL fxUSD=$PFXUSD manager=$PMGR"
            if [ "$(echo "$PCOLL" | tr '[:upper:]' '[:lower:]')" = "$(echo "$VBWBTC" | tr '[:upper:]' '[:lower:]')" ] &&
               [ "$(echo "$PFXUSD" | tr '[:upper:]' '[:lower:]')" = "$(echo "$NEW_FXUSD" | tr '[:upper:]' '[:lower:]')" ]; then
              MATCHING_VBWBTC_POOLS="$MATCHING_VBWBTC_POOLS $P"
            fi
          done

          {
            echo '# Katana Route Probe Result v3'
            echo
            echo "- chain_id: $(cast chain-id --rpc-url "$RPC")"
            echo "- router: $ROUTER"
            echo "- router_owner: $ROUTER_OWNER"
            echo "- expected_safe: $SAFE"
            echo "- safe_threshold: $SAFE_THRESHOLD"
            echo "- f(x)_pool: $FX_POOL"
            echo "- f(x)_pool_fxUSD: $FXUSD_FROM_FX_POOL"
            echo "- f(x)_pool_collateral: $COLLATERAL"
            echo "- new_fxUSD: $NEW_FXUSD"
            echo "- new_fxUSD_poolManager: $NEW_POOL_MANAGER"
            echo "- new_poolManager_fxUSD: $NEW_MANAGER_FXUSD"
            echo "- new_poolManager_fxBASE: $NEW_MANAGER_FXBASE"
            echo "- new_poolManager_configuration: $NEW_MANAGER_CONFIG"
            echo "- target_sushi_pool: $TARGET_POOL"
            echo "- target_pool_token0: $TOKEN0"
            echo "- target_pool_token1: $TOKEN1"
            echo "- target_pool_fee: $POOL_FEE"
            echo "- sushi_factory_getPool: $FACTORY_POOL"
            echo "- current_route_token0_to_token1: $ROUTE_0_TO_1"
            echo "- current_route_token1_to_token0: $ROUTE_1_TO_0"
            echo "- router_global_fee_bps: $GLOBAL_FEE_BPS"
            echo "- router_fee_recipient: $FEE_RECIPIENT"
            echo "- registered_new_manager_pools: $REGISTERED_POOLS"
            echo "- matching_vbWBTC_new_fxUSD_pools: $MATCHING_VBWBTC_POOLS"
            echo
            echo "## New PoolManager pool details"
            echo '~~~text'
            printf '%b\n' "$POOL_DETAILS"
            echo '~~~'
            echo
            echo '## Router selectors'
            echo '~~~text'
            cast selectors "$CODE" --resolve 2>&1 || cast selectors "$CODE" 2>&1 || true
            echo '~~~'
            echo
            echo '## Candidate calldata encodings'
            echo '~~~text'
            echo 'setRoute(address,address,bytes):'
            cast calldata "setRoute(address,address,bytes)" "$TOKEN0" "$TOKEN1" 0x || true
            echo 'setRouteFeeBps(address,address,uint16):'
            cast calldata "setRouteFeeBps(address,address,uint16)" "$TOKEN0" "$TOKEN1" 0 || true
            echo 'setRouteTwapGuard(address,address,uint32,uint16):'
            cast calldata "setRouteTwapGuard(address,address,uint32,uint16)" "$TOKEN0" "$TOKEN1" 900 200 || true
            echo '~~~'
          } > "$RESULT"

          test "$(echo "$ROUTER_OWNER" | tr '[:upper:]' '[:lower:]')" = "$(echo "$SAFE" | tr '[:upper:]' '[:lower:]')"
          test "$SAFE_THRESHOLD" = "1"
          test "$(echo "$FACTORY_POOL" | tr '[:upper:]' '[:lower:]')" = "$(echo "$TARGET_POOL" | tr '[:upper:]' '[:lower:]')"
          test "$(echo "$NEW_MANAGER_FXUSD" | tr '[:upper:]' '[:lower:]')" = "$(echo "$NEW_FXUSD" | tr '[:upper:]' '[:lower:]')"
          test -n "$MATCHING_VBWBTC_POOLS"

      - name: Persist Katana probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CurveYield2 CI"
          git config user.email "actions@users.noreply.github.com"
          git add packages/github-native-sim/audit-harnesses/katana-network-specific-anvil-simulator-v3/results/KATANA_ROUTE_PROBE_RESULT_v3.md
          if ! git diff --cached --quiet; then
            git commit -m "sim: record Katana route probe v3 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

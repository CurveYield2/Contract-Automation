name: BoostHub v13 Inline TWAP Compact TickMath Qualification v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boosthub-v13-inline-twap-compact-v1.yml'
      - 'github-native-sim/boosthub-v13-inline-oracle-v1/compact_ticks_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: stable}
      - name: Deployable inline V3 TWAP source, exact tick table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .boosthub-inline
          tar -xJf github-native-sim/boosthub-v13-full-stack-v1/source/BoostHub_v13_helper_overlay_v1.tar.xz -C .boosthub-inline
          python3 github-native-sim/boosthub-v13-inline-oracle-v1/inline_refactor_v1.py .boosthub-inline/beefy/contracts/converter oracle-base
          python3 github-native-sim/boosthub-v13-inline-oracle-v1/compact_ticks_v1.py .boosthub-inline/beefy/contracts/converter/BoostHubV3TwapQuote_v1.sol
          cd .boosthub-inline
          mkdir -p lib
          git clone --depth 1 -q --branch v5.4.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
          git clone --depth 1 -q https://github.com/foundry-rs/forge-std.git lib/forge-std
          cat > foundry.toml <<'EOF'
          [profile.default]
          src = "beefy/contracts/converter"
          test = "beefy/tests"
          out = "out"
          libs = ["lib"]
          solc_version = "0.8.28"
          optimizer = true
          optimizer_runs = 20
          via_ir = true
          evm_version = "cancun"
          bytecode_hash = "none"
          remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/","forge-std/=lib/forge-std/src/"]
          EOF
          forge build --skip test --silent 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-inline-compact-compile-v1.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('BoostHubEthereumRewardConverter','BoostHubFraxtalRewardConverter'):
              j=json.loads(next(Path('out').rglob(name+'.json')).read_text())
              size=(len(j['deployedBytecode']['object'])-2)//2
              print(f'INLINE_COMPACT_BYTES name={name} size={size} headroom={24576-size}',flush=True)
              assert size<=24576,f'{name} exceeds EIP170 by {size-24576} bytes'
          PY
      - name: Execute original v13 functionality suite against inline converter
        working-directory: .boosthub-inline
        env:
          ETHEREUM_RPC: ${{ secrets.RPC_ETHEREUM }}
          FRAXTAL_SECRET: ${{ secrets.RPC_FRAXTAL }}
        shell: bash
        run: |
          set -eo pipefail
          export FRAXTAL_RPC="${FRAXTAL_SECRET:-https://rpc.frax.com}"
          forge test --match-path 'beefy/tests/BoostHubMultiOracleRoutes_v1.t.sol' -vv 2>&1 | tee "$GITHUB_WORKSPACE/boosthub-inline-compact-fork-tests-v1.log"
      - name: Store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosthub-inline-compact-v1-${{ github.run_id }}
          path: |
            boosthub-inline-compact-compile-v1.log
            boosthub-inline-compact-fork-tests-v1.log
          if-no-files-found: warn
          retention-days: 14

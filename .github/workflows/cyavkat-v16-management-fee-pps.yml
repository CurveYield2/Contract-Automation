name: cyavKAT V16 Management-Fee-Neutral PPS Conformance
on:
  push:
    branches:
      - sim/cyavkat-v16-fee-neutral-pps
    paths:
      - .github/workflows/cyavkat-v16-management-fee-pps.yml
      - packages/github-native-sim/audit-harnesses/cyavkat-v16/inputs/cyavKAT_signing_layer_v16.zip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyavkat-v6-katana-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cyavkat-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v4
      - name: Verify and unpack exact V16 archive
        shell: bash
        run: |
          set -euo pipefail
          INPUT=packages/github-native-sim/audit-harnesses/cyavkat-v16/inputs/cyavKAT_signing_layer_v16.zip
          echo "14e68e1b6f0d86e3d0f0baf4f8baf241bb0f0c3a88a09cddc402d32a7af8ede0  $INPUT" | sha256sum -c -
          mkdir -p .cyavkat-v16
          unzip -q "$INPUT" -d .cyavkat-v16
          test -f .cyavkat-v16/cyavKAT/upgrade/foundry.toml
          test -f .cyavkat-v16/cyavKAT/upgrade/test/fork/ConformanceFork.t.sol
          test -f .cyavkat-v16/cyavKAT/upgrade/src/katana/CurveYieldQuestSignerConfigFuse.sol
          echo "Source: V16 SHA256 14e68e1b6f0d86e3d0f0baf4f8baf241bb0f0c3a88a09cddc402d32a7af8ede0" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Foundry in GitHub-hosted environment
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run source conformance and Merkl regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cyavkat-test-results-v16
          python3 .cyavkat-v16/cyavKAT/upgrade/scripts/check_conformance_source_v6.py 2>&1 | tee .cyavkat-test-results-v16/static.log
          python3 -m unittest discover -s .cyavkat-v16/cyavKAT/upgrade/scripts -p 'test_merkl_preflight_v6.py' -v 2>&1 | tee .cyavkat-test-results-v16/merkl.log
      - name: Start local ephemeral Katana Anvil fork
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=https://katana.drpc.org/
          HEIGHT=$(cast block-number --rpc-url "$UPSTREAM")
          test "$HEIGHT" -gt 100
          PIN=$((HEIGHT-30))
          echo "Pinned Katana block $PIN from upstream height $HEIGHT"
          nohup anvil --fork-url "$UPSTREAM" --fork-block-number "$PIN" --chain-id 747474 --host 127.0.0.1 --port 8545 > .cyavkat-test-results-v16/anvil.log 2>&1 < /dev/null &
          echo $! > .cyavkat-test-results-v16/anvil.pid
          for attempt in $(seq 1 50); do
            if cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          cast block-number --rpc-url http://127.0.0.1:8545
          echo "KATANA_RPC_URL=http://127.0.0.1:8545" >> "$GITHUB_ENV"
          echo "FORK_BLOCK=$PIN" >> "$GITHUB_ENV"
          echo "Local Anvil fork: Katana block $PIN" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile exact V16 source with Forge
        id: build
        shell: bash
        working-directory: .cyavkat-v16/cyavKAT/upgrade
        run: |
          set -o pipefail
          forge build --sizes 2>&1 | tee "$GITHUB_WORKSPACE/.cyavkat-test-results-v16/build.log"
      - name: Run all V16 unit and integration tests
        id: unit
        if: always() && steps.build.outcome == 'success'
        shell: bash
        working-directory: .cyavkat-v16/cyavKAT/upgrade
        run: |
          set -o pipefail
          forge test --no-match-path 'test/fork/*' -vv 2>&1 | tee "$GITHUB_WORKSPACE/.cyavkat-test-results-v16/unit.log"
      - name: Run V16 management-fee-neutral Katana fork conformance tests
        id: fork
        if: always() && steps.build.outcome == 'success'
        shell: bash
        working-directory: .cyavkat-v16/cyavKAT/upgrade
        run: |
          set -o pipefail
          forge test --match-path 'test/fork/*' -vv 2>&1 | tee "$GITHUB_WORKSPACE/.cyavkat-test-results-v16/fork.log"
      - name: Save complete source-level and fork test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyavkat-v16-management-fee-tests
          path: .cyavkat-test-results-v16/
          retention-days: 14
          include-hidden-files: true
      - name: Report outcomes
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.build.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          FORK: ${{ steps.fork.outcome }}
        run: |
          echo "Forge build: $BUILD; unit and integration: $UNIT; fork: $FORK" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$BUILD" = "success" && test "$UNIT" = "success" && test "$FORK" = "success"

name: Patch Wake X11 Paste v1

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/patch-wake-x11-paste/*.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Skip reload after visible existing-chat initial wake
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/browser-agent-wake.mjs')
          s = p.read_text()
          anchor = "\n".join([
              "  if (mode === 'create_fresh' && !durableChatUrl(page.url())) {",
              "    await waitForDurableChatUrl(page, 300000);",
              "  }",
              "",
              "  await humanReload(page);",
              ""
          ])
          replacement = "\n".join([
              "  if (mode === 'create_fresh' && !durableChatUrl(page.url())) {",
              "    await waitForDurableChatUrl(page, 300000);",
              "  }",
              "",
              "  if (mode === 'resume_existing' && messagePurpose === 'initial_wake') {",
              "    const passiveState = await snapshot(page).catch(() => null);",
              "    const delivery = {",
              "      writeRequestObserved: false,",
              "      writeAccepted: true,",
              "      responseBodyMarkerObserved: false,",
              "      domPersisted: true,",
              "      verification: 'visible-browser-only',",
              "      verificationMethod: beforeReload.method,",
              "      postSendChallenge: passiveState?.humanChallenge === true,",
              "      postSendHealth: null,",
              "      response: null,",
              "      responseCandidates: [],",
              "      submittedRequest,",
              "      persisted: true,",
              "      userCount: beforeReload.userCount",
              "    };",
              "    console.log('[github-playwright] delivery-state=existing-chat-visible-no-reload ' + JSON.stringify(delivery));",
              "    return delivery;",
              "  }",
              "",
              "  await humanReload(page);",
              ""
          ])
          if anchor not in s:
              raise SystemExit('post-send reload anchor not found')
          p.write_text(s.replace(anchor, replacement, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-agent-wake.mjs
          git commit -m "fix(audit): skip reload after visible existing-chat wake v5"
          git push origin HEAD:main

name: Patch Wake X11 Paste v1

on:
  push:
    branches: [main]
    paths:
      - 'process/agent-upload/patch-wake-x11-paste/*.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch reviewer wake paste keystroke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/browser-agent-wake.mjs')
          s = p.read_text()
          old = """      await composer.press('Control+V');
"""
          new = """      await new Promise((resolve, reject) => {
        const paste = spawn('xdotool', ['key', '--clearmodifiers', 'ctrl+v'], {
          env: { ...process.env, DISPLAY: process.env.DISPLAY || ':99' },
          stdio: ['ignore', 'ignore', 'pipe']
        });
        let stderr = '';
        paste.stderr?.on('data', chunk => { stderr += chunk.toString(); });
        paste.on('error', reject);
        paste.on('close', code => code === 0 ? resolve() : reject(new Error('xdotool paste failed: ' + stderr.trim())));
      });
"""
          if old not in s:
              raise SystemExit('expected Control+V block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/browser-agent-wake.mjs
          git commit -m "fix(audit): use X11 Ctrl+V for reviewer wake paste v3"
          git push origin HEAD:main

name: cyvlSDT RPC Block 25835948 Diagnostic v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cyvlsdt-rpc-block-25835948-diagnostic-v1.yml'

permissions:
  contents: read

jobs:
  rpc-block-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETH_RPC: https://ethereum-rpc.publicnode.com
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Foundry used by successful cyGOV V7 run
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Probe PublicNode Ethereum JSON-RPC methods
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url=os.environ['ETH_RPC']
          probes=[
            ('eth_chainId', []),
            ('net_version', []),
            ('eth_blockNumber', []),
            ('eth_getBlockByNumber', ['0x18a39ac', False]),
            ('eth_getCode', ['0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b','0x18a39ac']),
          ]
          out=[]
          for i,(method,params) in enumerate(probes,1):
            req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':i,'method':method,'params':params}).encode(),headers={'content-type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode('utf-8','replace')
                item={'method':method,'httpStatus':r.status,'ok':200 <= r.status < 300}
                payload=json.loads(body)
                result=payload.get('result')
                if method=='eth_getCode' and isinstance(result,str):
                  item['resultSummary']={'byteLength':0 if result=='0x' else (len(result)-2)//2}
                elif method=='eth_getBlockByNumber' and isinstance(result,dict):
                  item['resultSummary']={k:result.get(k) for k in ('number','hash','stateRoot','timestamp')}
                else:
                  item['result']=result
                if payload.get('error') is not None: item['rpcError']=payload.get('error')
                out.append(item)
            except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')
              out.append({'method':method,'httpStatus':e.code,'ok':False,'body':body[:1000]})
            except Exception as e:
              out.append({'method':method,'httpStatus':None,'ok':False,'error':type(e).__name__+': '+str(e)})
          print(json.dumps(out,indent=2))
          open('cyvlsdt-rpc-diagnostic-v1.json','w').write(json.dumps(out,indent=2)+'\n')
          assert all(x['ok'] for x in out), out
          assert int(out[0]['result'],16)==1, out[0]
          assert out[3].get('resultSummary',{}).get('number')=='0x18a39ac', out[3]
          assert out[4].get('resultSummary',{}).get('byteLength',0)>0, out[4]
          PY

      - name: Start Anvil from PublicNode at exact cyGOV block
        id: anvil
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$ETH_RPC" --fork-block-number 25835948 --chain-id 1 --hardfork cancun --port 8545 > cyvlsdt-rpc-diagnostic-anvil-v1.log 2>&1 &
          echo $! > .diag-anvil.pid
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = '1'
          test "$(cast code 0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b --rpc-url http://127.0.0.1:8545)" != '0x'
          OWNER="$(cast call 0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b 'owner()(address)' --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          test "${OWNER,,}" = '0x11b78837cadc8e894f1c6e13fa9f3a085a75fa35'
          HASH="$(cast block 25835948 --field hash --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          echo "$OWNER" | tee cyvlsdt-rpc-diagnostic-owner-v1.txt
          printf 'block=25835948\nhash=%s\nprovider=publicnode\n' "$HASH" | tee cyvlsdt-rpc-diagnostic-fork-v1.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-rpc-block-25835948-diagnostic-v1
          path: |
            cyvlsdt-rpc-diagnostic-v1.json
            cyvlsdt-rpc-diagnostic-anvil-v1.log
            cyvlsdt-rpc-diagnostic-owner-v1.txt
            cyvlsdt-rpc-diagnostic-fork-v1.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop diagnostic Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .diag-anvil.pid ]; then kill "$(cat .diag-anvil.pid)" 2>/dev/null || true; fi

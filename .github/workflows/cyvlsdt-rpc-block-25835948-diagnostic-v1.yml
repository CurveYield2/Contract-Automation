name: cyvlSDT RPC Block 25835948 Diagnostic v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cyvlsdt-rpc-block-25835948-diagnostic-v1.yml'

permissions:
  contents: read

jobs:
  rpc-block-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact Foundry used by successful cyGOV V7 run
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Probe exact upstream JSON-RPC methods
        env:
          ARCHIVE_RPC: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          url=os.environ['ARCHIVE_RPC']
          probes=[
            ('eth_chainId', []),
            ('net_version', []),
            ('eth_blockNumber', []),
            ('eth_getBlockByNumber', ['0x18a35ac', False]),
            ('eth_getCode', ['0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b','0x18a35ac']),
          ]
          out=[]
          for i,(method,params) in enumerate(probes,1):
            req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':i,'method':method,'params':params}).encode(),headers={'content-type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode('utf-8','replace')
                item={'method':method,'httpStatus':r.status,'ok':200 <= r.status < 300}
                try:
                  payload=json.loads(body)
                  result=payload.get('result')
                  if method=='eth_getCode' and isinstance(result,str):
                    item['resultSummary']={'byteLength':0 if result=='0x' else (len(result)-2)//2}
                  elif method=='eth_getBlockByNumber' and isinstance(result,dict):
                    item['resultSummary']={k:result.get(k) for k in ('number','hash','stateRoot','timestamp')}
                  else:
                    item['result']=result
                  if payload.get('error') is not None: item['rpcError']=payload.get('error')
                except Exception:
                  item['body']=body[:1000]
                out.append(item)
            except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')
              out.append({'method':method,'httpStatus':e.code,'ok':False,'body':body[:1000]})
            except Exception as e:
              out.append({'method':method,'httpStatus':None,'ok':False,'error':type(e).__name__+': '+str(e)})
          print(json.dumps(out,indent=2))
          open('cyvlsdt-rpc-diagnostic-v1.json','w').write(json.dumps(out,indent=2)+'\n')
          PY

      - name: Start Anvil exactly like successful BoostHub workflow at cyGOV block
        id: anvil
        continue-on-error: true
        env:
          ARCHIVE_RPC: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        shell: bash
        run: |
          set -euo pipefail
          anvil --fork-url "$ARCHIVE_RPC" --fork-block-number 25835948 --chain-id 1 --port 8545 > cyvlsdt-rpc-diagnostic-anvil-v1.log 2>&1 &
          echo $! > .diag-anvil.pid
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = '1'
          test "$(cast code 0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b --rpc-url http://127.0.0.1:8545)" != '0x'
          cast call 0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b 'owner()(address)' --rpc-url http://127.0.0.1:8545 | tee cyvlsdt-rpc-diagnostic-owner-v1.txt

      - name: Print Anvil diagnostic log
        if: always()
        shell: bash
        run: |
          cat cyvlsdt-rpc-diagnostic-anvil-v1.log 2>/dev/null || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-rpc-block-25835948-diagnostic-v1
          path: |
            cyvlsdt-rpc-diagnostic-v1.json
            cyvlsdt-rpc-diagnostic-anvil-v1.log
            cyvlsdt-rpc-diagnostic-owner-v1.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop diagnostic Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .diag-anvil.pid ]; then kill "$(cat .diag-anvil.pid)" 2>/dev/null || true; fi

      - name: Require exact block fork to start
        if: always()
        shell: bash
        run: |
          test '${{ steps.anvil.outcome }}' = 'success'

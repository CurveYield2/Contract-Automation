name: V7 Execution Infrastructure Qualification v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-execution-infrastructure-qualification-v2.yml'
      - 'packages/github-native-sim/src/**'
      - 'packages/github-native-sim/test/**'
      - 'packages/runner/src/**'
      - 'packages/runner/test/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.deep-assurance/qualification-trigger-v2/**'

permissions:
  contents: read

jobs:
  qualify-v7-execution-infrastructure-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Initialize evidence
        run: mkdir -p .audit-evidence/v7-infrastructure-qualification-v2
      - name: V2 request/evidence tests
        run: node --test packages/github-native-sim/test/*.test.mjs
      - name: Anvil-only tests
        run: node --test packages/runner/test/anvil-*.test.mjs packages/runner/test/full-simulation-anvil-only-v1.test.mjs
      - name: Static checks
        run: node scripts/check.mjs
      - name: Build checks
        run: node scripts/build.mjs
      - name: Live recipe-aware Ethereum archive qualification
        env:
          SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { runPhase7ForkPreflightV2 } from './packages/github-native-sim/src/phase7-fork-preflight-v2.mjs';
          const expectedBlockHash='0xb7f45fdc91b604d7c0450a505cf5c9571c9bb6267c86b6a8d535f4bc11b3f4ee';
          const request={
            requestId:'dar-00000000000000000000000000000000', phaseId:'fork-simulation-lifecycle', profileId:'github-native-simulate-v2',
            source:{commit:'0000000000000000000000000000000000000000'},
            configuration:{evmVersion:'cancun',harness:{recipeId:'external-readiness-v1'},simulation:{chain:'ethereum',block:25817400,workflow:{steps:[
              {action:'staticCall',target:'0x73968b9a57c6E53d41345FD57a6E6ae27d6CDB2F',function:'decimals() view returns (uint8)',args:[],label:'qualified SDT external readiness'}
            ]}}}
          };
          const preflight=await runPhase7ForkPreflightV2({request,environment:process.env});
          const qualifiedCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const observed=preflight.observedPinnedBlockHash?.toLowerCase()??null;
          const checks={
            preflightPass:preflight.status==='PASS', recipeEnforced:preflight.checks?.lifecycleRecipe?.status==='PASS',
            recipeId:preflight.recipeId==='external-readiness-v1', ethereumArchiveOnly:preflight.chain==='ethereum',
            anvilOnly:preflight.checks?.anvilLauncher?.engine==='anvil', cancunAccepted:preflight.checks?.exactHardfork?.requested==='cancun',
            archiveIdentityReconciled:preflight.checks?.chainIdentity?.status==='PASS', historicalStateAvailable:preflight.checks?.pinnedBlockState?.status==='PASS',
            targetCodePresent:preflight.checks?.targetCode?.status==='PASS', impersonationBalanceControl:preflight.checks?.impersonationBalanceControl?.status==='PASS',
            fixtureBlockHashMatches:observed===expectedBlockHash, workflowAllowlist:preflight.checks?.workflowActions?.status==='PASS'
          };
          const qualification={schemaVersion:'v7-execution-infrastructure-qualification-v2',status:Object.values(checks).every(Boolean)?'PASS':'FAIL',qualifiedCommit,
            requestSchema:'deep-assurance-github-request-v2',profiles:['github-native-compile-v2','github-native-simulate-v2'],fullSimulationBackend:'anvil',
            archivePolicy:{supportedChains:['ethereum'],rpcProfile:'SIM_ARCHIVE_PRIMARY_ETHEREUM_01'},fixture:{chain:'ethereum',block:25817400,expectedBlockHash},checks,preflight};
          fs.writeFileSync('.audit-evidence/v7-infrastructure-qualification-v2/qualification-v2.json',`${JSON.stringify(qualification,null,2)}\n`);
          if(qualification.status!=='PASS') process.exit(1);
          NODE
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-execution-infrastructure-qualification-v2
          path: .audit-evidence/v7-infrastructure-qualification-v2
          if-no-files-found: error
          retention-days: 90

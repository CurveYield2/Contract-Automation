name: cyvbWBTC Deployment Simulation v5

on:
  push:
    paths:
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v5.mjs'
      - 'packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/requests/request-v5.json'
      - '.github/workflows/cyvbwbtc-deployment-simulation-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CurveYield2/Smart-Contracts
          ref: 7514dbf326d7035a7bc64c0827c4b10ff515410d
          path: .smart-contracts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --force
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - working-directory: .smart-contracts
        run: forge install foundry-rs/forge-std --no-git
      - name: Run full cyvbWBTC Katana Anvil lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cyvbwbtc-deployment-simulation-output-v5
          node packages/github-native-sim/audit-harnesses/cyvbwbtc-deployment-simulation-v1/run-v5.mjs \
            --smart-contracts-root .smart-contracts \
            --fork-url https://katana.drpc.org/ \
            --output cyvbwbtc-deployment-simulation-output-v5
      - name: Show summary
        if: always()
        shell: bash
        run: |
          f=cyvbwbtc-deployment-simulation-output-v5/CYVBWBTC_DEPLOYMENT_SIMULATION_SUMMARY_v5.json
          [ -f "$f" ] && cat "$f" || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvbwbtc-deployment-simulation-v5-${{ github.run_id }}
          path: cyvbwbtc-deployment-simulation-output-v5
          if-no-files-found: warn
          retention-days: 14
      - name: Require PASS
        shell: bash
        run: |
          jq -e '.status == "PASS"' \
            cyvbwbtc-deployment-simulation-output-v5/CYVBWBTC_DEPLOYMENT_SIMULATION_SUMMARY_v5.json >/dev/null

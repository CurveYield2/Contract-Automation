name: Package Browser Home-Exit v8

on:
  push:
    paths:
      - 'process/browser-agent-home-exit-v8/package-request-v8.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Write setup instructions v8
        shell: bash
        run: |
          cat > SETUP_INSTRUCTIONS_v8.md <<'EOF'
          # CurveYield Browser Home-Exit v8 — Setup Instructions

          ## What changed

          Do not install OpenSSH for this version.

          Your Windows PC only needs Tailscale. It acts as a Tailscale exit node so the GitHub-hosted Playwright browser uses your normal home internet connection during the ChatGPT browser step.

          ## 1. Stop the OpenSSH install

          If the OpenSSH Add-WindowsCapability command is still running, press Ctrl+C.

          OpenSSH is not used by v8.

          ## 2. Turn this Windows PC into a Tailscale exit node

          Your observed Tailscale IPv4 is:

          100.112.238.56

          In the Tailscale Windows tray app:
          1. Open Exit node.
          2. Choose Run as exit node.
          3. Open the Tailscale admin console.
          4. Go to Machines.
          5. Find this Windows PC.
          6. Open its menu -> Edit route settings.
          7. Enable Use as exit node and save.
          8. Keep this PC awake while browser automation is running.

          If your tailnet uses custom ACLs/grants, the GitHub workflow node must be allowed to use autogroup:internet.

          ## 3. Create the Tailscale GitHub auth key

          In the Tailscale admin console, create an auth key for the GitHub Actions node.

          Recommended for CI:
          - reusable
          - ephemeral
          - tagged
          - pre-approved if your tailnet requires device approval

          Copy the key once.

          ## 4. Add the GitHub secret

          In CurveYield2/Contract-Automation:

          Settings -> Secrets and variables -> Actions -> New repository secret

          Create:

          TAILSCALE_AUTHKEY

          Paste the Tailscale auth key as its value.

          The existing CHATGPT_STORAGE_STATE_B64 secret remains in use.

          ## 5. First test: authentication / challenge only

          Run the GitHub workflow:

          Original Phase0 Home-Exit Browser v8

          Use:
          - action: observe
          - mode: create_fresh
          - home_exit_node: 100.112.238.56
          - interactive_view: true
          - manual_challenge_wait_minutes: 15

          This run sends no message.

          The workflow:
          1. joins your tailnet;
          2. confirms the runner's public egress changes;
          3. routes the browser phase through your Windows PC;
          4. launches Chrome under Xvfb;
          5. exposes that Chrome window privately over Tailscale VNC;
          6. waits until ChatGPT backend probes are healthy;
          7. saves refreshed browser state encrypted for future runs.

          ## 6. If manual verification is required

          In the GitHub Actions log, look for:

          TAILSCALE_VNC=<runner-tailnet-ip>:5900

          or:

          Private VNC: <runner-tailnet-ip>:5900

          On this Windows PC, open a VNC viewer and connect to that address.

          Complete only normal ChatGPT login / human verification shown in the visible Chrome window.

          The VNC listener exists only while the workflow is running and binds to the runner's private Tailscale IP.

          ## 7. Real resume test

          After the observe run succeeds, run the same workflow again with:

          - action: wake
          - mode: resume_existing
          - chat_url: https://chatgpt.com/c/6abe90a0-fd68-83e8-8026-8af0171605fc
          - home_exit_node: 100.112.238.56
          - interactive_view: true

          The default wake text contains HOME_EXIT_PLAYWRIGHT_WAKE_PERSONALLY_SEEN_v8.

          The test is successful only when the real ChatGPT /backend-api/f/conversation/prepare request succeeds. A local message bubble or Unknown error / Retry is treated as failure.

          ## Included repo files

          - .github/workflows/browser-agent-home-exit-v8.yml
          - packages/browser-agent-original-phase0-v8/browser-agent-wake-v8.mjs
          - packages/browser-agent-original-phase0-v8/browser-session-state-v1.mjs
          - packages/browser-agent-original-phase0-v8/runtime-v8/action.yml
          - packages/browser-agent-original-phase0-v8/runtime-v8/package.json
          - packages/browser-agent-original-phase0-v8/README_v8.md
          EOF

      - name: Upload exact v8 bundle
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield_Browser_Home_Exit_v8
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            SETUP_INSTRUCTIONS_v8.md
            .github/workflows/browser-agent-home-exit-v8.yml
            packages/browser-agent-original-phase0-v8/**

name: Rebuild Current Audit Skill Package v1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-current-audit-skill-v1.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout edited authority branch
        uses: actions/checkout@v4
        with:
          ref: fix/lite-phase0-handoff-order-v1
          fetch-depth: 0

      - name: Regenerate manifests and ZIP in place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, tempfile, zipfile

          repo = pathlib.Path.cwd()
          authority = repo / "Audit Skill - Current Authority"
          pkg = authority / "Audit_V7_independent_Review_skill_v38"
          zip_path = authority / "Audit_V7_independent_Review_skill_v38.3.3_Web_Bootstrap_Optimized_v1.zip"
          lite = pkg / "optional-modes" / "lite-pathway"

          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def manifest_entries(root, exclude):
              out = []
              for file in sorted(p for p in root.rglob("*") if p.is_file()):
                  if file.resolve() in exclude:
                      continue
                  rel = file.relative_to(pkg).as_posix()
                  out.append({"path": rel, "bytes": file.stat().st_size, "sha256": sha256(file)})
              return out

          lite_manifest_path = lite / "MANIFEST.json"
          lite_manifest = json.loads(lite_manifest_path.read_text())
          lite_manifest["files"] = manifest_entries(lite, {lite_manifest_path.resolve()})
          lite_manifest_path.write_text(json.dumps(lite_manifest, indent=2) + "\n")

          root_manifest_path = pkg / "MANIFEST.json"
          root_manifest = json.loads(root_manifest_path.read_text())
          root_manifest["files"] = manifest_entries(pkg, {root_manifest_path.resolve()})
          root_manifest_path.write_text(json.dumps(root_manifest, indent=2) + "\n")

          if zip_path.exists():
              zip_path.unlink()

          fixed_dt = (2026, 9, 27, 0, 0, 0)
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for file in sorted(p for p in pkg.rglob("*") if p.is_file()):
                  arc = pathlib.Path(pkg.name) / file.relative_to(pkg)
                  data = file.read_bytes()
                  info = zipfile.ZipInfo(arc.as_posix(), date_time=fixed_dt)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IMODE(file.stat().st_mode) & 0xFFFF) << 16
                  zf.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(zip_path, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              with tempfile.TemporaryDirectory() as td:
                  zf.extractall(td)
                  extracted = pathlib.Path(td) / pkg.name
                  src_files = sorted(p.relative_to(pkg).as_posix() for p in pkg.rglob("*") if p.is_file())
                  zip_files = sorted(p.relative_to(extracted).as_posix() for p in extracted.rglob("*") if p.is_file())
                  if src_files != zip_files:
                      raise SystemExit("ZIP/unpacked file list mismatch")
                  for rel in src_files:
                      if sha256(pkg / rel) != sha256(extracted / rel):
                          raise SystemExit(f"ZIP/unpacked content mismatch: {rel}")

          # Sanity assertions for this patch.
          phase0 = json.loads((lite / "phases/phase-0/PHASE_CONTRACT.json").read_text())
          actions = [s["action"] for s in phase0["steps"]]
          if any("Obtain controller" in a for a in actions):
              raise SystemExit("Phase-0 controller PASS is still a Phase Contract input step")
          if not any("P0_TO_P1" in a and "wake" in a.lower() for a in actions):
              raise SystemExit("Phase-0 handoff/wake step missing")
          wake = (lite / "shared/handoff/WAKE_UP_MESSAGE_TEMPLATE.md").read_text()
          required = [
              "Campaign type: **LITE**",
              "Campaign name:",
              "Campaign folder URL:",
              "Audit Skill - Current Authority",
              "Assigned Lite phase/milestone:"
          ]
          for marker in required:
              if marker not in wake:
                  raise SystemExit(f"Wake template missing marker: {marker}")

          print("root_manifest_files", len(root_manifest["files"]))
          print("lite_manifest_files", len(lite_manifest["files"]))
          print("zip_sha256", sha256(zip_path))
          print("zip_size", zip_path.stat().st_size)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38" \
                  "Audit Skill - Current Authority/Audit_V7_independent_Review_skill_v38.3.3_Web_Bootstrap_Optimized_v1.zip"
          git diff --cached --check
          git commit -m "chore(lite): rebuild current authority package in place v1"
          git push origin HEAD:fix/lite-phase0-handoff-order-v1

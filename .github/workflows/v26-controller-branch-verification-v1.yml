name: V26 Controller Branch Verification v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - feat/v26-machine-execution-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private Audit-Controller feature branch
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: feat/v26-machine-foundation-v1
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: controller
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair only stale active preflight fixture profiles
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              'packages/controller-core/test/card-activation-v2.test.mjs',
              'packages/controller-core/test/card-quiz-reducer-v2.test.mjs',
              'packages/controller-core/test/deep-assurance-assignments.test.mjs',
              'packages/controller-core/test/deep-assurance-v16-lifecycle.test.mjs',
              'packages/controller-core/test/deep-assurance-v6.test.mjs',
              'packages/controller-core/test/instruction-read-proof-v2.test.mjs',
              'packages/controller-core/test/orchestrator-bootstrap-quiz-v2.test.mjs',
              'packages/controller-core/test/phase0-registration-quiz-v2.test.mjs',
              'packages/controller-core/test/team-bootstrap-v2.test.mjs',
          ]
          for raw in targets:
              path = Path(raw)
              text = path.read_text()
              before = text
              for old, new in [
                  ('github-native-compile-v1', 'github-native-compile-v2'),
                  ('github-native-simulate-v1', 'github-native-simulate-v2'),
              ]:
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f'{raw}: expected at least one {old} fixture occurrence')
                  text = text.replace(old, new, 1)
                  print(f'{raw}: replaced first {old} occurrence (observed {count})')
              if text == before:
                  raise SystemExit(f'{raw}: no fixture repair applied')
              path.write_text(text)
          PY
          git diff --check
          git diff -- packages/controller-core/test

      - name: Run private controller tests
        working-directory: controller
        run: npm test

      - name: Run private controller static checks
        working-directory: controller
        run: npm run check

      - name: Commit verified fixture repair to private controller branch
        if: success()
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No fixture repair commit required.'
          else
            git config user.name 'CurveYield V26 Qualification'
            git config user.email 'actions@users.noreply.github.com'
            git add packages/controller-core/test
            git commit -m 'test(v26): update active execution profile fixtures'
            git push origin HEAD:feat/v26-machine-foundation-v1
          fi

      - name: Record exact controller commit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          commit="$(git -C controller rev-parse HEAD)"
          cat > evidence/controller-qualification-v1.json <<JSON
          {
            "schemaVersion": "v26-controller-qualification-v1",
            "controllerCommit": "$commit",
            "status": "PASS",
            "tests": "npm test",
            "checks": "npm run check"
          }
          JSON

      - name: Upload controller verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-controller-branch-verification-v1
          path: evidence
          if-no-files-found: warn
          retention-days: 30

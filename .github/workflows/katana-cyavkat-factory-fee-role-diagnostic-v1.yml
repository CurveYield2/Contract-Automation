name: Katana cyavKAT Factory Fee Role Diagnostic v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/katana-cyavkat-factory-fee-role-diagnostic-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Read Katana factory fee target function role mapping
        shell: bash
        run: |
          set -euo pipefail
          RPC=https://katana.drpc.org/
          am=0xd7f408f203c5c6a76c9c55c9f6b015929F151fAA
          vault=0xEd83daf48429cfb2C650Fd721b9241e180fd4548
          fm=0x11a81a7B7436CB1E8f73866AF74961cE499f5Ec6
          safe=0x47623C62f281807D615eeb4A2CEee9d97F9D3C49
          deployer=0x11b78837cadC8E894F1c6e13fA9f3A085a75FA35
          test "$(cast chain-id --rpc-url "$RPC")" = 747474
          for role in 1 7 100 400 500 901 902; do
            echo "ROLE $role DEPLOYER: $(cast call "$am" 'hasRole(uint64,address)(bool,uint32)' "$role" "$deployer" --rpc-url "$RPC")"
            echo "ROLE $role FEE_SAFE: $(cast call "$am" 'hasRole(uint64,address)(bool,uint32)' "$role" "$safe" --rpc-url "$RPC")"
          done
          for target in "$vault" "$fm"; do
            echo "TARGET $target"
            for signature in 'configurePerformanceFee(address,uint256)' 'configureManagementFee(address,uint256)' 'updatePerformanceFee((address,uint256)[])' 'updateManagementFee((address,uint256)[])' 'setDepositFee(uint256)'; do
              selector="$(cast sig "$signature")"
              echo "FUNCTION $signature SELECTOR $selector"
              cast call "$am" 'getTargetFunctionRole(address,bytes4)(uint64)' "$target" "$selector" --rpc-url "$RPC" || true
              cast call "$am" 'canCall(address,address,bytes4)(bool,uint32)' "$deployer" "$target" "$selector" --rpc-url "$RPC" || true
              cast call "$am" 'canCall(address,address,bytes4)(bool,uint32)' "$safe" "$target" "$selector" --rpc-url "$RPC" || true
            done
          done

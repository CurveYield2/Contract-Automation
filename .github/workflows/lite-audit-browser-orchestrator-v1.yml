name: Lite Audit Browser Orchestrator v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_name:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lite-audit-browser-orchestrator-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  launch-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: audit-wake-human-only-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh

      - name: Resolve campaign directory entry
        id: directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CAMPAIGN_PATH" == campaigns/* ]] || { echo "::error::campaign_path must be under campaigns/"; exit 1; }
          if [[ "$CAMPAIGN_ID" =~ ^(.+)-r[0-9]+$ ]]; then slug="${BASH_REMATCH[1]}"; else echo "::error::campaign_id does not end in -rN"; exit 1; fi
          directory_path="Audit Campaign Directory/campaigns/$slug.json"
          echo "path=$directory_path" >> "$GITHUB_OUTPUT"

      - name: Checkout Audit-Controller
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin "$AUDIT_CONTROLLER_REF"
          git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"
          test "$(jq -r '.campaignId' "${{ steps.directory.outputs.path }}")" = "$CAMPAIGN_ID"
          test "$(jq -r '.workspacePath' "${{ steps.directory.outputs.path }}")" = "$CAMPAIGN_PATH"

      - name: Prepare current assignment and dynamic wake message
        id: successor
        shell: bash
        run: |
          set -euo pipefail
          directory_schema="$(jq -r '.schemaVersion' ".audit-controller/${{ steps.directory.outputs.path }}")"
          if [ "$directory_schema" = "curveyield-audit-campaign-directory-entry-v2" ]; then
            node scripts/prepare-lite-assignment-successor-v2.mjs \
              --controller-root .audit-controller \
              --campaign-directory-path "${{ steps.directory.outputs.path }}" \
              --audit-controller-ref "$AUDIT_CONTROLLER_REF" | tee /tmp/lite-successor.json
            boundary="PHASE_$(jq -r '.incomingPhaseSequence' /tmp/lite-successor.json)_WORK_PACKET"
          else
            node scripts/prepare-lite-receipt-successor-v1.mjs \
              --controller-root .audit-controller \
              --campaign-directory-path "${{ steps.directory.outputs.path }}" | tee /tmp/lite-successor.json
            boundary="$(jq -r '.boundary' /tmp/lite-successor.json)"
          fi
          test "$(jq -r '.status' /tmp/lite-successor.json)" = PASS
          {
            echo "directory_schema=$directory_schema"
            echo "incoming_phase=$(jq -r '.incomingPhaseId' /tmp/lite-successor.json)"
            echo "incoming_reviewer=$(jq -r '.incomingReviewer' /tmp/lite-successor.json)"
            echo "boundary=$boundary"
            echo "wake_b64=$(jq -r '.wakeMessageB64' /tmp/lite-successor.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish legacy successor receipt preparation when applicable
        if: steps.successor.outputs.directory_schema != 'curveyield-audit-campaign-directory-entry-v2'
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Lite Browser Orchestrator'
          git config user.email 'lite-browser-orchestrator@users.noreply.github.com'
          git add -- "$CAMPAIGN_PATH/receipts"
          if ! git diff --cached --quiet; then
            git commit -m "audit(receipt): prepare ${{ steps.successor.outputs.incoming_reviewer }} for $CAMPAIGN_ID"
            git push origin "HEAD:$AUDIT_CONTROLLER_REF"
          fi

      - name: Create or refresh campaign browser registration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          api="repos/$GITHUB_REPOSITORY/contents/$registration"
          phase_id="${{ steps.successor.outputs.incoming_phase }}"
          if [ "$phase_id" = "phase-1" ]; then
            routine="audit-lite-reviewer-project-create-v1"
          else
            routine="audit-lite-reviewer-project-open-v1"
          fi

          current_payload="$(gh api "$api?ref=main" 2>/dev/null || true)"
          current="$(printf '%s' "$current_payload" | jq -r '.sha // empty')"
          project_url=""
          interaction_policy="ordinary-pointer-keyboard-only"
          if [ -n "$current" ]; then
            printf '%s' "$current_payload" | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/existing-registration.json
            project_url="$(jq -r '.chatgptProject.url // empty' /tmp/existing-registration.json)"
            existing_policy="$(jq -r '.browserInteractionPolicy // empty' /tmp/existing-registration.json)"
            [ -z "$existing_policy" ] || interaction_policy="$existing_policy"
          fi

          jq -n \
            --arg campaignId "$CAMPAIGN_ID" \
            --arg projectName "$CAMPAIGN_NAME" \
            --arg projectUrl "$project_url" \
            --arg routine "$routine" \
            --arg interactionPolicy "$interaction_policy" \
            --arg ref "$AUDIT_CONTROLLER_REF" \
            --arg directoryPath "${{ steps.directory.outputs.path }}" \
            --arg phaseId "$phase_id" \
            --arg boundary "${{ steps.successor.outputs.boundary }}" \
            --arg reviewer "${{ steps.successor.outputs.incoming_reviewer }}" \
            '{
              schemaVersion:"curveyield-browser-agent-wake-registration-v1",
              campaignId:$campaignId,mode:"create_fresh",chatUrl:"",
              browserRoutine:$routine,
              chatgptProject:{name:$projectName,url:$projectUrl},
              activeChat:{name:"",url:""},wakeMessage:"",thinkingEffort:"high",
              browserInteractionPolicy:$interactionPolicy,
              activeAssignment:{phaseId:$phaseId,milestoneId:$boundary,workerRole:"reviewer",reviewer:$reviewer,thinkingEffort:"high"},
              watchdog:{enabled:true,idleMessage:"GET BACK TO WORK",gate:{mode:"LITE",repository:"CurveYield2/Audit-Controller",ref:$ref,statePath:$directoryPath,expectedPhaseId:$phaseId,expectedMilestoneId:$boundary,activePointerPath:"",stopStates:["STOPPED_BY_HUMAN"],stopCampaignStatuses:["COMPLETE","STOPPED_BY_HUMAN"]}}
            }' > /tmp/registration.json

          body="$(base64 -w0 /tmp/registration.json)"
          if [ -n "$current" ]; then
            gh api --method PUT "$api" -f message="chore(wake): prepare $CAMPAIGN_ID ${{ steps.successor.outputs.boundary }}" -f content="$body" -f sha="$current" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" -f message="chore(wake): register $CAMPAIGN_ID ${{ steps.successor.outputs.boundary }}" -f content="$body" -f branch=main >/dev/null
          fi

      - name: Launch fresh reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          poke_b64="$(printf '%s' 'GET BACK TO WORK' | base64 -w0)"
          wake_id="$CAMPAIGN_ID-${{ steps.successor.outputs.boundary }}-${{ steps.successor.outputs.incoming_reviewer }}"
          chat_name="$CAMPAIGN_NAME ${{ steps.successor.outputs.incoming_reviewer }}"
          phase_id="${{ steps.successor.outputs.incoming_phase }}"
          if [ "$phase_id" = "phase-1" ]; then
            routine="audit-lite-reviewer-project-create-v1"
          else
            routine="audit-lite-reviewer-project-open-v1"
          fi
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          api="repos/$GITHUB_REPOSITORY/contents/$registration"
          project_url="$(gh api "$api?ref=main" --jq '.content' | base64 -d | jq -r '.chatgptProject.url // empty')"

          browser_context_b64="$(jq -cn \
            --arg routine "$routine" \
            --arg project "$CAMPAIGN_NAME" \
            --arg projectUrl "$project_url" \
            --arg chat "$chat_name" \
            '{routineId:$routine,projectName:$project,projectUrl:$projectUrl,chatName:$chat,repair:{enabled:true,idlePokeThreshold:3,unviewableThreshold:2},messagePurpose:"standard"}' | base64 -w0)"
          gh workflow run browser-agent-wake.yml --repo "$GITHUB_REPOSITORY" --ref audit-wake-human-only-v1 \
            -f wake_id="$wake_id" \
            -f campaign_id="$CAMPAIGN_ID" \
            -f phase_id="$phase_id" \
            -f mode=create_fresh \
            -f chat_url="" \
            -f wake_message_b64="${{ steps.successor.outputs.wake_b64 }}" \
            -f watchdog_enabled=true \
            -f worker_role=reviewer \
            -f watchdog_message_b64="$poke_b64" \
            -f gate_mode=LITE \
            -f gate_repository=CurveYield2/Audit-Controller \
            -f gate_ref="$AUDIT_CONTROLLER_REF" \
            -f gate_state_path="${{ steps.directory.outputs.path }}" \
            -f gate_expected_phase_id="$phase_id" \
            -f gate_expected_milestone_id="${{ steps.successor.outputs.boundary }}" \
            -f gate_active_pointer_path="" \
            -f gate_stop_states_csv=STOPPED_BY_HUMAN \
            -f gate_stop_campaign_statuses_csv=COMPLETE,STOPPED_BY_HUMAN \
            -f browser_context_b64="$browser_context_b64"

      - name: Summarize
        run: |
          {
            echo "## Lite receipt successor dispatch"
            echo "- Campaign: $CAMPAIGN_ID"
            echo "- Directory: ${{ steps.directory.outputs.path }}"
            echo "- Incoming phase: ${{ steps.successor.outputs.incoming_phase }}"
            echo "- Incoming reviewer: ${{ steps.successor.outputs.incoming_reviewer }}"
            echo "- Stored handoff/wake/start files: none"
            echo "- Active-phase receipt for assignment-v2 campaigns: none"
          } >> "$GITHUB_STEP_SUMMARY"

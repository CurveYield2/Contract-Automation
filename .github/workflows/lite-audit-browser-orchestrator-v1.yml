name: Lite Audit Browser Orchestrator v1

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Exact campaign ID
        required: true
        type: string
      campaign_name:
        description: Human-readable campaign / ChatGPT Project name
        required: true
        type: string
      campaign_path:
        description: Audit-Controller campaign path, e.g. campaigns/My Audit
        required: true
        type: string
      audit_controller_ref:
        description: Audit-Controller ref containing the campaign
        required: false
        default: main
        type: string
      phase0_extra_instruction:
        description: Optional additional Phase-0 instruction
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: lite-audit-browser-orchestrator-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Validate campaign inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$CAMPAIGN_PATH" in
            campaigns/*) ;;
            *) echo "::error::campaign_path must be under campaigns/"; exit 1 ;;
          esac
          if [[ "$CAMPAIGN_PATH" == *".."* || "$CAMPAIGN_PATH" == /* ]]; then
            echo "::error::Unsafe campaign_path"
            exit 1
          fi

      - name: Bind exact canonical campaign
        id: canonical
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          controller_api="repos/CurveYield2/Audit-Controller/contents/$CAMPAIGN_PATH/controller?ref=$AUDIT_CONTROLLER_REF"
          state_name="$(gh api "$controller_api" --jq '.[].name' | sed -n 's/^\(CAMPAIGN_STATE_v[0-9][0-9]*\.json\)$/\1/p' | sort -V | tail -n1)"
          pointer_name="$(gh api "$controller_api" --jq '.[].name' | sed -n 's/^\(ACTIVE_PHASE_POINTER_v[0-9][0-9]*\.json\)$/\1/p' | sort -V | tail -n1)"
          [ -n "$state_name" ] || { echo "::error::No versioned canonical campaign state found"; exit 1; }
          [ -n "$pointer_name" ] || { echo "::error::No versioned active phase pointer found"; exit 1; }
          state_path="$CAMPAIGN_PATH/controller/$state_name"
          pointer_path="$CAMPAIGN_PATH/controller/$pointer_name"
          api="repos/CurveYield2/Audit-Controller/contents/$state_path?ref=$AUDIT_CONTROLLER_REF"
          encoded="$(gh api "$api" --jq '.content')"
          printf '%s' "$encoded" | base64 -d > /tmp/canonical-campaign-state.json

          canonical_id="$(jq -r '.campaignId // empty' /tmp/canonical-campaign-state.json)"
          canonical_generation="$(jq -r '.campaignGenerationId // empty' /tmp/canonical-campaign-state.json)"
          pointer_encoded="$(gh api "repos/CurveYield2/Audit-Controller/contents/$pointer_path?ref=$AUDIT_CONTROLLER_REF" --jq '.content')"
          printf '%s' "$pointer_encoded" | base64 -d > /tmp/canonical-active-pointer.json
          test "$(jq -r '.campaignId // empty' /tmp/canonical-active-pointer.json)" = "$canonical_id"
          test "$(jq -r '.campaignGenerationId // empty' /tmp/canonical-active-pointer.json)" = "$canonical_generation"
          [ -n "$canonical_generation" ] || { echo "::error::Campaign generation is missing"; exit 1; }
          canonical_name="$(jq -r '.auditName // .title // .projectSlug // empty' /tmp/canonical-campaign-state.json)"
          canonical_path="$(jq -r '.controller.workspacePath // empty' /tmp/canonical-campaign-state.json)"
          canonical_ref="$(jq -r '.controller.branch // empty' /tmp/canonical-campaign-state.json)"
          canonical_mode="$(jq -r '.assuranceMode.mode // .mode // empty' /tmp/canonical-campaign-state.json)"
          current_phase="$(jq -r '.phase.id // empty' /tmp/canonical-campaign-state.json)"
          current_reviewer="$(jq -r '.activeReviewer.lineage // .phase.reviewer // empty' /tmp/canonical-campaign-state.json)"
          current_milestone="$(jq -r '.phase.milestoneId // empty' /tmp/canonical-campaign-state.json)"
          campaign_status="$(jq -r '.campaignCompletionStatus // .campaignStatus // .status // empty' /tmp/canonical-campaign-state.json)"
          if [ -z "$current_milestone" ] && [ "$current_phase" = "phase-0" ]; then current_milestone="P0_BOOTSTRAP"; fi

          [ "$canonical_id" = "$CAMPAIGN_ID" ] || { echo "::error::campaign_id does not match canonical campaign state"; exit 1; }
          [ "$canonical_path" = "$CAMPAIGN_PATH" ] || { echo "::error::campaign_path does not match canonical workspacePath"; exit 1; }
          [ "$canonical_ref" = "$AUDIT_CONTROLLER_REF" ] || { echo "::error::audit_controller_ref does not match canonical controller branch"; exit 1; }
          [ "$canonical_mode" = "LITE" ] || { echo "::error::Campaign is not Lite mode"; exit 1; }
          if [ -n "$CAMPAIGN_NAME" ] && [ -n "$canonical_name" ] && [ "$CAMPAIGN_NAME" != "$canonical_name" ]; then
            echo "::error::campaign_name does not match canonical auditName"
            exit 1
          fi

          arm_campaign_monitor=true
          bootstrap_monitor=false
          monitor_phase="$current_phase"
          monitor_milestone="$current_milestone"
          if [ "$campaign_status" = "COMPLETE" ] || [ "$campaign_status" = "STOPPED_BY_HUMAN" ]; then
            arm_campaign_monitor=false
          elif [ "$current_phase" = "phase-0" ] && [ "$current_reviewer" = "web-bootstrap-agent" ]; then
            monitor_phase="phase-0"
            monitor_milestone="P0_BOOTSTRAP"
            bootstrap_monitor=true
          elif [ "$(jq -r '.phase.state // .phase.status // empty' /tmp/canonical-campaign-state.json)" = "WAITING_FOR_SUCCESSOR_AGENT" ]; then
            history_phase="$(jq -r '.history[-1].phase // empty' /tmp/canonical-campaign-state.json)"
            history_milestone="$(jq -r '.history[-1].milestone // empty' /tmp/canonical-campaign-state.json)"
            if [ "$history_phase" = "0" ]; then monitor_milestone="P0_BOOTSTRAP"; else monitor_milestone="$history_milestone"; fi
          elif [ -z "$monitor_milestone" ] && [ -n "$current_reviewer" ]; then
            monitor_milestone="$(jq -r --arg reviewer "$current_reviewer" '[.routingPlan.workers[]? | select(.lineage==$reviewer) | .milestone][0] // empty' /tmp/canonical-campaign-state.json)"
          fi
          [ "$arm_campaign_monitor" != "true" ] || [ -n "$monitor_phase" ] || { echo "::error::Unable to resolve Lite monitor phase"; exit 1; }
          [ "$arm_campaign_monitor" != "true" ] || [ -n "$monitor_milestone" ] || { echo "::error::Unable to resolve Lite monitor milestone"; exit 1; }

          echo "campaign_generation=$canonical_generation" >> "$GITHUB_OUTPUT"
          echo "arm_campaign_monitor=$arm_campaign_monitor" >> "$GITHUB_OUTPUT"
          echo "bootstrap_monitor=$bootstrap_monitor" >> "$GITHUB_OUTPUT"
          echo "canonical_name=$canonical_name" >> "$GITHUB_OUTPUT"
          echo "current_phase=$current_phase" >> "$GITHUB_OUTPUT"
          echo "current_reviewer=$current_reviewer" >> "$GITHUB_OUTPUT"
          echo "current_milestone=$current_milestone" >> "$GITHUB_OUTPUT"
          echo "monitor_phase=$monitor_phase" >> "$GITHUB_OUTPUT"
          echo "monitor_milestone=$monitor_milestone" >> "$GITHUB_OUTPUT"
          echo "campaign_status=$campaign_status" >> "$GITHUB_OUTPUT"
          echo "state_path=$state_path" >> "$GITHUB_OUTPUT"
          echo "pointer_path=$pointer_path" >> "$GITHUB_OUTPUT"

      - name: Create or refresh campaign-chain registration
        id: registration
        if: steps.canonical.outputs.arm_campaign_monitor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          registration="process/browser-agent-wake/registrations/$safe_campaign.json"
          api="repos/$GITHUB_REPOSITORY/contents/$registration"
          existing="$(gh api "$api?ref=main" --jq '.content' 2>/dev/null || true)"

          previous_chat=""
          if [ -n "$existing" ]; then
            printf '%s' "$existing" | base64 -d > /tmp/registration-existing.json
            test "$(jq -r '.schemaVersion // empty' /tmp/registration-existing.json)" = 'curveyield-browser-agent-wake-registration-v1'
            test "$(jq -r '.campaignId // empty' /tmp/registration-existing.json)" = "$CAMPAIGN_ID"
            previous_chat="$(jq -r '.activeChat.url // .chatUrl // empty' /tmp/registration-existing.json)"
            registered_generation="$(jq -r '.campaignGenerationId // empty' /tmp/registration-existing.json)"
            if [ -n "$registered_generation" ] && [ "$registered_generation" != "${{ steps.canonical.outputs.campaign_generation }}" ]; then
              echo "::error::Existing registration belongs to another campaign generation"
              exit 1
            fi
            if [[ "$previous_chat" =~ ^https://chatgpt\.com/c/[A-Za-z0-9_-]+ ]]; then
              echo "Bound reviewer chat already exists; preserving its registration and watchdog."
              echo "arm_monitor=false" >> "$GITHUB_OUTPUT"
              echo "registration=$registration" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          jq -n \
            --arg campaignId "$CAMPAIGN_ID" \
            --arg generation "${{ steps.canonical.outputs.campaign_generation }}" \
            --arg projectName "$CAMPAIGN_NAME" \
            --arg ref "$AUDIT_CONTROLLER_REF" \
            --arg statePath "${{ steps.canonical.outputs.state_path }}" \
            --arg pointerPath "${{ steps.canonical.outputs.pointer_path }}" \
            --arg phaseId "${{ steps.canonical.outputs.monitor_phase }}" \
            --arg milestoneId "${{ steps.canonical.outputs.monitor_milestone }}" \
            --arg reviewer "${{ steps.canonical.outputs.current_reviewer }}" \
            --arg bootstrap "${{ steps.canonical.outputs.bootstrap_monitor }}" \
            --arg previousChat "$previous_chat" \
            '{
              schemaVersion:"curveyield-browser-agent-wake-registration-v1",
              campaignId:$campaignId,
              campaignGenerationId:$generation,
              mode:"create_fresh",
              chatUrl:"",
              browserRoutine:"audit-lite-reviewer-v1",
              chatgptProject:{name:$projectName,url:""},
              activeChat:{name:"",url:""},
              wakeMessage:"",
              thinkingEffort:"high",
              activeAssignment:{phaseId:$phaseId,milestoneId:$milestoneId,workerRole:"reviewer",reviewer:$reviewer,thinkingEffort:"high"},
              bootstrapMonitor:{
                status:(if $bootstrap=="true" then "ACTIVE" else "NOT_APPLICABLE" end),
                note:(if $bootstrap=="true" then "Phase 0 is the existing human-started bootstrap agent. Automation must not create a second Phase-0 chat." else "Campaign monitor is supervising the current Lite boundary/state." end),
                previousAutomationChat:(if $previousChat=="" then null else $previousChat end)
              },
              watchdog:{
                enabled:true,
                idleMessage:"GET BACK TO WORK",
                gate:{
                  mode:"LITE",
                  repository:"CurveYield2/Audit-Controller",
                  ref:$ref,
                  statePath:$statePath,
                  expectedPhaseId:$phaseId,
                  expectedMilestoneId:$milestoneId,
                  activePointerPath:$pointerPath,
                  stopStates:["STOPPED_BY_HUMAN"],
                  stopCampaignStatuses:["COMPLETE","STOPPED_BY_HUMAN"]
                }
              }
            }' > /tmp/registration.json

          current_sha="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          content="$(base64 -w0 /tmp/registration.json)"
          if [ -n "$current_sha" ]; then
            gh api --method PUT "$api" \
              -f message="chore(audit): bind lite bootstrap monitor $CAMPAIGN_ID" \
              -f content="$content" -f sha="$current_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "$api" \
              -f message="chore(audit): register lite bootstrap monitor $CAMPAIGN_ID" \
              -f content="$content" -f branch=main >/dev/null
          fi
          echo "registration=$registration" >> "$GITHUB_OUTPUT"
          echo "arm_monitor=true" >> "$GITHUB_OUTPUT"

      - name: Arm Lite campaign boundary monitor
        id: monitor
        if: steps.registration.outputs.arm_monitor == 'true'
        shell: bash
        run: |
          set -euo pipefail
          safe_campaign="$(printf '%s' "$CAMPAIGN_ID" | tr -c 'A-Za-z0-9._-' '_')"
          wake_id="$CAMPAIGN_ID-${{ steps.canonical.outputs.monitor_milestone }}-campaign-monitor"
          safe_id="$(printf '%s' "$wake_id" | tr -c 'A-Za-z0-9._-' '_')"
          state_path="process/browser-agent-watchdog/active/$safe_id.json"
          api="repos/$GITHUB_REPOSITORY/contents/$state_path"

          jq -n \
            --arg wakeId "$wake_id" \
            --arg campaignId "$CAMPAIGN_ID" \
            --arg ref "$AUDIT_CONTROLLER_REF" \
            --arg statePath "${{ steps.canonical.outputs.state_path }}" \
            --arg pointerPath "${{ steps.canonical.outputs.pointer_path }}" \
            --arg phaseId "${{ steps.canonical.outputs.monitor_phase }}" \
            --arg milestoneId "${{ steps.canonical.outputs.monitor_milestone }}" \
            --arg bootstrap "${{ steps.canonical.outputs.bootstrap_monitor }}" \
            '{
              schemaVersion:"curveyield-browser-agent-watchdog-state-v1",
              wakeId:$wakeId,
              campaignId:$campaignId,
              phaseId:$phaseId,
              workerRole:"reviewer",
              status:"ACTIVE",
              chatUrl:"",
              lastProvider:"",
              armedAt:(now|todate),
              intervalMinutes:5,
              idleMessage:"GET BACK TO WORK",
              observation:{assistantCount:0,lastAssistantHash:"",observedAt:(now|todate)},
              gate:{
                mode:"LITE",
                repository:"CurveYield2/Audit-Controller",
                ref:$ref,
                statePath:$statePath,
                expectedPhaseId:$phaseId,
                expectedMilestoneId:$milestoneId,
                activePointerPath:$pointerPath,
                interphase:{handoffPath:"",workPacketPath:"",completionPath:"",workPacketSha256:""},
                stopStates:["STOPPED_BY_HUMAN"],
                stopCampaignStatuses:["COMPLETE","STOPPED_BY_HUMAN"]
              },
              repair:{enabled:false,idlePokeThreshold:3,unviewableThreshold:2,consecutiveIdlePokes:0,consecutiveUnviewable:0},
              bootstrapMonitor:($bootstrap=="true")
            }' > /tmp/bootstrap-monitor.json

          current_sha="$(gh api "$api?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -z "$current_sha" ]; then
            content="$(base64 -w0 /tmp/bootstrap-monitor.json)"
            gh api --method PUT "$api" -f message="chore(watchdog): arm $wake_id" -f content="$content" -f branch=main >/dev/null
          else
            echo "Existing campaign monitor remains active; dispatching a sweep without resetting its observations."
          fi

          gh workflow run browser-agent-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f wake_id="$wake_id"
          echo "wake_id=$wake_id" >> "$GITHUB_OUTPUT"

      - name: Summarize orchestration
        shell: bash
        run: |
          {
            echo "## Lite audit browser orchestration"
            echo
            echo "- Campaign: $CAMPAIGN_NAME"
            echo "- Campaign ID: $CAMPAIGN_ID"
            echo "- Phase-0 bootstrap chat: NOT created by automation; this is the existing human-started bootstrap agent"
            echo "- Phase-0 boundary monitor: ${{ steps.canonical.outputs.bootstrap_monitor }}"
            echo "- First automated fresh reviewer: reviewer-1 after machine-valid P0_TO_P1"
            echo "- Successor first message: predecessor-created WAKE_UP_MESSAGE.md verbatim"
            echo "- Later messages: GET BACK TO WORK"
            echo "- Reviewer count and phase ranges: derived dynamically from canonical Audit-Controller state"
            echo "- Overall termination: campaign COMPLETE or STOPPED_BY_HUMAN only"
          } >> "$GITHUB_STEP_SUMMARY"

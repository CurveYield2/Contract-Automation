name: cyvlSDT v30 Full Two-Pass Live Fork v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyvlsdt-v30-full-two-pass-live-fork-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-two-pass-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOYMENT_TAG: v30-remediation-v3-full-two-pass-livefork
      LOCAL_RPC: http://127.0.0.1:8545
      FORK_RPC: https://rpc.flashbots.net
      FORK_BLOCK: '25835948'
      EXPECTED_BLOCK_HASH: '0x0b184e111de903ae1bf4618377a20763cabb3db48a3652bdda4f622a47eb46b8'
      CYGOV: '0x83E70Fa4AAF0aaf7f5F13C2C8261F1fB444af22b'
      CYGOV_OWNER_EXPECTED: '0x11b78837cadC8E894F1c6e13fA9f3A085a75FA35'
      FRAXSWAP_V2_FACTORY: '0x43eC799eAdd63848443E2347C49f5f52e8Fe0F6f'
      WETH: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'

    steps:
      - name: Checkout trusted Contract-Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen v30 source
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 6bde63416a4611e127b8bb3a5958e6b6d874c188
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-source
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact remediation fixture
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: 37319eab51d1ac1fc6a58916683114716157b922
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller-fixture
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Reconstruct remediation v2 and apply verifier repair
        shell: bash
        run: |
          set -euo pipefail
          ZIP='.controller-source/campaigns/CurveYield-cyvlSDT-Deployment-Package-v30.zip'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = 'cc5c4dc6f8aa5d2e48043f6c3a837317ce6a4590c291e7e0571e4206c7d9877a'
          rm -rf .cyvlsdt-v30 && mkdir -p .cyvlsdt-v30
          unzip -q "$ZIP" -d .cyvlsdt-v30
          ROOT="$(find .cyvlsdt-v30 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"
          echo "ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          cd "$ROOT"
          sha256sum -c Source-Manifest-v30.sha256 > "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-source-manifest.txt"
          cd "$GITHUB_WORKSPACE"

          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/runtime-remediation.patch.gz.b64 | gzip -dc > remediation-v2-runtime.patch
          test "$(sha256sum remediation-v2-runtime.patch | awk '{print $1}')" = 'fdd73714fad9076789c09368f6423c381165c17121e559e517701d9c141d2ae2'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/remediation-v2-runtime.patch")

          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/anvil-impersonation.patch.gz.b64 | gzip -dc > anvil-impersonation.patch
          test "$(sha256sum anvil-impersonation.patch | awk '{print $1}')" = '4454e02b672b1d7e30abab3b4b1c199284bce04c2c150147c27f82838fb936ac'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/anvil-impersonation.patch")

          base64 -d .controller-fixture/campaigns/cyvlsdt-v30-remediation-v2-livefork/vyper-0310-build.patch.gz.b64 | gzip -dc > vyper-0310-build.patch
          test "$(sha256sum vyper-0310-build.patch | awk '{print $1}')" = 'c5af9e97f34b03338e02210f0888c7339aec4c6d9cbc3d5f0bf08468555899eb'
          (cd "$ROOT" && patch -p1 --batch < "$GITHUB_WORKSPACE/vyper-0310-build.patch")

          VERIFIER="$ROOT/deployment-v20/verify-deployment-v20.js"
          test "$(sha256sum "$VERIFIER" | awk '{print $1}')" = 'f1b30f8b22c6a446aa5633bdb5c066c538fd786ea3c7d05908db561bcfd158ca'
          python - "$VERIFIER" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='''  if ((await governanceStaking.BASE_PRODUCTION_BPS()) !== 3000n) throw new Error("governance staking baseline is not 30%");\n  if ((await governanceStaking.MAX_MOD_BOOST()) !== 5000n) throw new Error("governance staking Mod cap mismatch");\n  if ((await governanceStaking.MAX_ADMIN_BOOST()) !== 15000n) throw new Error("governance staking Admin cap mismatch");\n  if ((await governanceStaking.MAX_DAO_BOOST()) !== 10000n) throw new Error("governance staking DAO cap mismatch");\n  if ((await governanceStaking.MAX_TOTAL_BOOST()) !== 30000n) throw new Error("governance staking aggregate boost cap mismatch");\n'''
          new='''  // Vyper constant values are compile-time constants and are not ABI getters.\n  // Exact boost-cap constants remain enforced by governance-staking-static-v2.py.\n  if ((await governanceStaking.workingPercentBps(ethers.ZeroAddress)) !== 3000n) {\n    throw new Error("governance staking baseline is not 30%");\n  }\n'''
          assert old in s, 'stale Vyper constant-getter block missing'
          p.write_text(s.replace(old,new,1))
          PY
          test "$(sha256sum "$VERIFIER" | awk '{print $1}')" = '71fe077decb87b8a84cef49f2b77b16d2282e3eb79cfdfafff84e4c38a785a3b'
          node --check "$VERIFIER"
          python "$ROOT/verification-v24/governance-staking-static-v2.py" | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-governance-staking-static.txt"

          test "$(sha256sum "$ROOT/deployment-v20/deploy-configure-v20.js" | awk '{print $1}')" = 'e770457d7b04d9fcc22661c8f7b51303fd27f9faa9459910658c4f0aa11992b3'
          test "$(sha256sum "$ROOT/deployment-v20/lib-v20.js" | awk '{print $1}')" = 'dcb9789aac337f5e6c2559d263dcbf73f631d4616a71fb34c1324c492b422f09'
          test "$(sha256sum "$ROOT/deployment-v27/deploy-cyvlsdt-v27-v1.js" | awk '{print $1}')" = '47532b64c08ad9e69ed45243082db1651cf1199791b5a09af8dd92cfd0f34763'
          test "$(sha256sum "$ROOT/deployment-v27/post-deploy-configure-cyvlsdt-v27-v1.js" | awk '{print $1}')" = 'be508d75c64ee4fe2b785091443e9e6f88a3e6f21ad14403b3a619975285e8d0'
          test "$(sha256sum "$ROOT/deployment-v27/production-config-v27-v1.js" | awk '{print $1}')" = 'e8997008636aadec4c345dcae932c3813147e1b0ffac778f04f44c23c70cd45e'
          test "$(sha256sum "$ROOT/deployment-v27/verify-production-cyvlsdt-v27-v1.js" | awk '{print $1}')" = '4d3c41d9d9e27522048865c378c5dbdf0d68be3c538f596e3e9881eb511e99f0'

          python - "$ROOT/operator-inputs-v27-v1.json" <<'PY'
          import json,sys
          p=sys.argv[1]; x=json.load(open(p))
          assert x['existingContracts']['governanceToken'].lower() == '0x83e70fa4aaf0aaf7f5f13c2c8261f1fb444af22b'
          x['cyGovYieldStaking']['initialTargetYield']='1'
          x['cyGovYieldStaking']['initialMaxMintRate']='1'
          x['boostStaking']['governanceEmissionRatePerSecond']='1'
          x['governanceStakingRewardSource']['periodicAmount']='1'
          x['governanceStakingRewardSource']['periodicIntervalSeconds']='1'
          json.dump(x,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY

          cd "$ROOT"
          node deployment-v27/production-config-v27-v1.js config-mainnet-v27-audited-base.json operator-inputs-v27-v1.json config-production-v30.json | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-materialize-core.txt"
          npm ci --ignore-scripts
          npx hardhat compile 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-solidity-compile.txt"
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10'
          npm run --silent build:governance-staking:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-vyper-compile.txt"
          test -f artifacts-vyper/CurveYieldGovernanceStaking.json

      - name: Start exact pinned Flashbots Anvil fork with confirmation mining
        shell: bash
        run: |
          set -euo pipefail
          test "$(cast chain-id --rpc-url "$FORK_RPC")" = '1'
          test "$(cast code "$CYGOV" --rpc-url "$FORK_RPC" --block "$FORK_BLOCK")" != '0x'
          test "$(cast code "$FRAXSWAP_V2_FACTORY" --rpc-url "$FORK_RPC" --block "$FORK_BLOCK")" != '0x'
          anvil --fork-url "$FORK_RPC" --fork-block-number "$FORK_BLOCK" --chain-id 1 --hardfork cancun --block-time 1 --port 8545 > cyvlsdt-v30-v3-anvil.log 2>&1 &
          echo $! > .anvil-v3.pid
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$LOCAL_RPC" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url "$LOCAL_RPC")" = '1'
          HASH="$(cast block "$FORK_BLOCK" --field hash --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          test "${HASH,,}" = "${EXPECTED_BLOCK_HASH,,}"
          OWNER="$(cast call "$CYGOV" 'owner()(address)' --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          test "${OWNER,,}" = "${CYGOV_OWNER_EXPECTED,,}"
          test "$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$LOCAL_RPC" | awk '{print $1}')" = '0'
          test "$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$LOCAL_RPC" | awk '{print $1}')" = '0'
          echo "CYGOV_OWNER=$OWNER" >> "$GITHUB_ENV"
          printf 'fork_block=%s\nfork_block_hash=%s\nfork_provider=flashbots\ncygov_owner=%s\n' "$FORK_BLOCK" "$HASH" "$OWNER" | tee cyvlsdt-v30-v3-fork-identity.txt

      - name: Execute literal v30 core deploy and configure first pass
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent deploy:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-deploy-pass1.txt"
          npm run --silent configure:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-configure-pass1.txt"
          STATE="deployment-output-v20/deployment-state-v20-${DEPLOYMENT_TAG}-1.json"
          test -f "$STATE"
          python - "$STATE" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['phase']=='configured-converter-pending', s.get('phase')
          assert s['productionConfigurationStatus']['coreActive'] is True
          assert s['productionConfigurationStatus']['cyGovFraxswapConverter']['deployed'] is False
          PY

      - name: Create real Fraxswap V2 cyGOV-WETH primary pair on fork
        shell: bash
        run: |
          set -euo pipefail
          cast rpc anvil_impersonateAccount "$CYGOV_OWNER" --rpc-url "$LOCAL_RPC" >/dev/null
          cast rpc anvil_setBalance "$CYGOV_OWNER" 0x56BC75E2D63100000 --rpc-url "$LOCAL_RPC" >/dev/null
          PAIR="$(cast call "$FRAXSWAP_V2_FACTORY" 'getPair(address,address)(address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          if [ "${PAIR,,}" = '0x0000000000000000000000000000000000000000' ]; then
            cast send --unlocked --from "$CYGOV_OWNER" "$FRAXSWAP_V2_FACTORY" 'createPair(address,address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC" >/dev/null
            PAIR="$(cast call "$FRAXSWAP_V2_FACTORY" 'getPair(address,address)(address)' "$CYGOV" "$WETH" --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          fi
          test "${PAIR,,}" != '0x0000000000000000000000000000000000000000'
          test "$(cast code "$PAIR" --rpc-url "$LOCAL_RPC")" != '0x'
          T0="$(cast call "$PAIR" 'token0()(address)' --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          T1="$(cast call "$PAIR" 'token1()(address)' --rpc-url "$LOCAL_RPC" | tr -d '\r\n')"
          if [ "${T0,,}" != "${CYGOV,,}" ] && [ "${T1,,}" != "${CYGOV,,}" ]; then exit 1; fi
          if [ "${T0,,}" != "${WETH,,}" ] && [ "${T1,,}" != "${WETH,,}" ]; then exit 1; fi
          echo "PRIMARY_FRAXSWAP_PAIR=$PAIR" >> "$GITHUB_ENV"
          printf 'scope=SIMULATION_ONLY_NOT_PRODUCTION\nfactory=%s\npair=%s\ntoken0=%s\ntoken1=%s\n' "$FRAXSWAP_V2_FACTORY" "$PAIR" "$T0" "$T1" | tee cyvlsdt-v30-v3-fraxswap-pair.txt

      - name: Materialize simulation-only converter config using package tooling
        shell: bash
        run: |
          set -euo pipefail
          python - "$ROOT/operator-inputs-cygov-converter-v27-v1.json" "$PRIMARY_FRAXSWAP_PAIR" <<'PY'
          import json,sys
          p,pair=sys.argv[1:]
          x=json.load(open(p))
          x['feeReceiver']=None
          x['primaryPool']=pair
          x['primaryFees']={'buyFeeBps':0,'sellFeeBps':0,'discountedSellFeeBps':0}
          x['globalFees']=None
          x['secondaryPools']=[]
          x['feeExempt']=[]
          json.dump(x,open(p,'w'),indent=2); open(p,'a').write('\n')
          PY
          cd "$ROOT"
          npm run --silent config:materialize:cygov-converter:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-materialize-converter.txt"
          python - <<'PY' | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-converter-sim-inputs.json"
          import json
          x=json.load(open('config-production-v30.json'))['cyGovFraxswapConverter']
          print(json.dumps({'scope':'SIMULATION_ONLY_NOT_PRODUCTION', **x},indent=2))
          PY

      - name: Execute literal v30 second deploy and configure pass
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent deploy:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-deploy-pass2.txt"
          npm run --silent configure:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-configure-pass2.txt"

      - name: Run repaired exact v30 final verifier
        env:
          RPC_URL: ${{ env.LOCAL_RPC }}
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.CYGOV_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run --silent verify:v30 2>&1 | tee "$GITHUB_WORKSPACE/cyvlsdt-v30-v3-verify-final.txt"

      - name: Assert fully active final state
        shell: bash
        run: |
          set -euo pipefail
          STATE="$ROOT/deployment-output-v20/deployment-state-v20-${DEPLOYMENT_TAG}-1.json"
          test -f "$STATE"
          python - "$STATE" "$PRIMARY_FRAXSWAP_PAIR" <<'PY' | tee cyvlsdt-v30-v3-final-summary.json
          import json,sys
          s=json.load(open(sys.argv[1])); pair=sys.argv[2].lower(); c=s['contracts']; status=s['productionConfigurationStatus']
          assert status['fullyActive'] is True, status
          assert status['coreActive'] is True, status
          assert status['cyGovFraxswapConverter']['active'] is True, status
          assert c['cyGovFraxswapConverter']['address']
          assert status['cyGovFraxswapConverter']['primaryPool'].lower()==pair
          assert s.get('productionVerification'), s.keys()
          print(json.dumps({
            'status':'FULL_TWO_PASS_VERIFY_PASS',
            'phase':s.get('phase'),
            'existingCyGov':c['governanceToken']['address'],
            'converter':c['cyGovFraxswapConverter']['address'],
            'primaryFraxswapPool':status['cyGovFraxswapConverter']['primaryPool'],
            'fullyActive':status['fullyActive'],
            'transactionCount':len(s.get('transactions',[])),
            'gasUsed':s.get('gasUsed'),
            'productionVerification':s.get('productionVerification'),
          },indent=2))
          PY
          CAPS="$(cast call "$CYGOV" 'totalInitialMinterCaps()(uint256)' --rpc-url "$LOCAL_RPC" | awk '{print $1}')"
          BPS="$(cast call "$CYGOV" 'totalAdditionalMinterBps()(uint256)' --rpc-url "$LOCAL_RPC" | awk '{print $1}')"
          test "$CAPS" = '50000000000000000000000000000'
          test "$BPS" = '8000'
          printf 'totalInitialMinterCaps=%s\ntotalAdditionalMinterBps=%s\n' "$CAPS" "$BPS" | tee cyvlsdt-v30-v3-cygov-final.txt

      - name: Upload full v3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyvlsdt-v30-full-two-pass-live-fork-v3
          path: |
            cyvlsdt-v30-v3-source-manifest.txt
            cyvlsdt-v30-v3-governance-staking-static.txt
            cyvlsdt-v30-v3-materialize-core.txt
            cyvlsdt-v30-v3-solidity-compile.txt
            cyvlsdt-v30-v3-vyper-compile.txt
            cyvlsdt-v30-v3-anvil.log
            cyvlsdt-v30-v3-fork-identity.txt
            cyvlsdt-v30-v3-deploy-pass1.txt
            cyvlsdt-v30-v3-configure-pass1.txt
            cyvlsdt-v30-v3-fraxswap-pair.txt
            cyvlsdt-v30-v3-materialize-converter.txt
            cyvlsdt-v30-v3-converter-sim-inputs.json
            cyvlsdt-v30-v3-deploy-pass2.txt
            cyvlsdt-v30-v3-configure-pass2.txt
            cyvlsdt-v30-v3-verify-final.txt
            cyvlsdt-v30-v3-final-summary.json
            cyvlsdt-v30-v3-cygov-final.txt
            .cyvlsdt-v30/**/config-production-v30.json
            .cyvlsdt-v30/**/deployment-output-v20/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .anvil-v3.pid ]; then kill "$(cat .anvil-v3.pid)" 2>/dev/null || true; fi

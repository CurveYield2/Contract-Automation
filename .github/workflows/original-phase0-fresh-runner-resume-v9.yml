name: Original Phase0 Fresh Runner Resume v9

on:
  push:
    paths:
      - 'process/browser-agent-original-phase0-v1/fresh-runner-requests/*-v*.json'
  workflow_dispatch:
    inputs:
      request_path:
        required: true
        type: string
      attempt:
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
      MAX_ATTEMPTS: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ./packages/browser-agent-original-phase0-v5/setup-runtime-v5

      - name: Resolve request and attempt
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REQUEST_PATH: ${{ inputs.request_path }}
          DISPATCH_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            request="$DISPATCH_REQUEST_PATH"
            attempt="$DISPATCH_ATTEMPT"
          else
            git fetch origin "$GITHUB_SHA" --depth=2 >/dev/null 2>&1 || true
            request="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^process/browser-agent-original-phase0-v1/fresh-runner-requests/.*-v[0-9]+[.]json$' | tail -n1)"
            attempt=1
          fi
          test -s "$request"
          echo "request_path=$request" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Attempt real resume delivery
        id: deliver
        continue-on-error: true
        shell: bash
        env:
          REQUEST_PATH: ${{ steps.meta.outputs.request_path }}
          ATTEMPT: ${{ steps.meta.outputs.attempt }}
        run: |
          set -euo pipefail
          export CHAT_URL="$(jq -r '.chat_url' "$REQUEST_PATH")"
          export WAKE_MESSAGE="$(jq -r '.wake_message' "$REQUEST_PATH")"
          set +e
          xvfb-run -a node packages/browser-agent-original-phase0-v9/fresh-runner-resume-v9.mjs | tee /tmp/fresh-runner-v9.log
          rc=${PIPESTATUS[0]}
          set -e
          result="$(tail -n1 /tmp/fresh-runner-v9.log)"
          printf '%s\n' "$result" > /tmp/fresh-runner-v9-result.json
          ok="$(jq -r '.ok // false' /tmp/fresh-runner-v9-result.json 2>/dev/null || echo false)"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/fresh-runner-v9-result.json

      - name: Dispatch fresh runner retry
        if: steps.deliver.outputs.ok != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.meta.outputs.request_path }}
          ATTEMPT: ${{ steps.meta.outputs.attempt }}
        run: |
          set -euo pipefail
          next=$((ATTEMPT+1))
          if [ "$next" -gt "$MAX_ATTEMPTS" ]; then
            echo "::error::Fresh-runner retries exhausted at attempt $ATTEMPT"
            exit 1
          fi
          gh workflow run original-phase0-fresh-runner-resume-v9.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f request_path="$REQUEST_PATH" \
            -f attempt="$next"
          echo "Dispatched fresh runner attempt $next/$MAX_ATTEMPTS"

      - name: Confirm real delivery
        if: steps.deliver.outputs.ok == 'true'
        shell: bash
        run: |
          echo "REAL_DELIVERY_CONFIRMED=true"
          cat /tmp/fresh-runner-v9-result.json

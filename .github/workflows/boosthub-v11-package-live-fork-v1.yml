name: BoostHub v11 Package Compile + Live Fork v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'github-native-sim/boosthub-v11-package-live-fork/**'

permissions:
  contents: read

concurrency:
  group: boosthub-v11-package-live-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-live-fork-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP_REL: campaigns/Boosthub Staking v2/source/CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11.zip
      SOURCE_ZIP_SHA256: f792b79660402e5a75006121128f244af846f2301b38be1fe01a3e8a3a0be6aa
      SOURCE_ROOT_V11: CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v11
      OUTPUT_ROOT_V12: CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v12
      OUTPUT_ZIP_V12: CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v12.zip
      BOOSTHUB: '0xFbEF8941Da53EA724385B44E91ae9672061D0263'
      DEPLOY_MAX_FEE_GWEI: '0.05'
      DEPLOY_MAX_PRIORITY_FEE_GWEI: '0.00001'

    steps:
      - name: Checkout trusted Contract-Automation runner
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout request identity from PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .request
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout Audit-Controller source
        uses: actions/checkout@v4
        with:
          repository: CurveYield2/Audit-Controller
          ref: main
          token: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          path: .controller
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Bind exact v11 ZIP and verify original package checksums
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/.controller/$SOURCE_ZIP_REL"
          test -f "$ZIP"
          ACTUAL_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$SOURCE_ZIP_SHA256"
          rm -rf .work
          mkdir -p .work
          unzip -q "$ZIP" -d .work
          ROOT="$GITHUB_WORKSPACE/.work/$SOURCE_ROOT_V11"
          test -d "$ROOT"
          cd "$ROOT"
          sha256sum -c SHA256SUMS-v11.txt | tee "$GITHUB_WORKSPACE/original-v11-integrity-v1.log"
          printf 'source_repository=CurveYield2/Audit-Controller\nsource_path=%s\nsource_zip_sha256=%s\nrequest_commit=%s\n' \
            "$SOURCE_ZIP_REL" "$ACTUAL_SHA" '${{ github.event.pull_request.head.sha }}' \
            > "$GITHUB_WORKSPACE/source-binding-v1.txt"
          mv "$ROOT" "$GITHUB_WORKSPACE/.work/$OUTPUT_ROOT_V12"
          echo "PKG_ROOT=$GITHUB_WORKSPACE/.work/$OUTPUT_ROOT_V12" >> "$GITHUB_ENV"

      - name: Apply v12 deployment gas policy and version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, os

          root = Path(os.environ['PKG_ROOT'])
          deploy = root / 'deployment-v3' / 'deploy-configure-suite-v6.js'
          lib = root / 'deployment-v3' / 'lib-v3.js'

          d = deploy.read_text()
          anchor = 'const {ROOT,saveJson,getContext,codeExists,solArtifact,vyperArtifact,deploy,send,pad8,ethers}=require("./lib-v3");\n'
          addition = (
              'const DEFAULT_MAX_FEE_GWEI="0.05";\n'
              'const DEFAULT_MAX_PRIORITY_FEE_GWEI="0.00001";\n'
              'process.env.DEPLOY_MAX_FEE_GWEI=process.env.DEPLOY_MAX_FEE_GWEI||DEFAULT_MAX_FEE_GWEI;\n'
              'process.env.DEPLOY_MAX_PRIORITY_FEE_GWEI=process.env.DEPLOY_MAX_PRIORITY_FEE_GWEI||DEFAULT_MAX_PRIORITY_FEE_GWEI;\n'
          )
          if addition not in d:
              if anchor not in d:
                  raise SystemExit('deploy script import anchor not found')
              d = d.replace(anchor, anchor + addition, 1)
          deploy.write_text(d)

          l = lib.read_text()
          old = '  const walletAddress=ethers.getAddress(await wallet.getAddress());\n  const state=fs.existsSync(statePath)?loadJson(statePath):{version:"v3",network:config.network,contracts:{},transactions:{},checks:{}};\n  return{config,provider,wallet,walletAddress,state,statePath};\n'
          new = (
              '  const walletAddress=ethers.getAddress(await wallet.getAddress());\n'
              '  const maxFeeGwei=process.env.DEPLOY_MAX_FEE_GWEI||"0.05";\n'
              '  const maxPriorityFeeGwei=process.env.DEPLOY_MAX_PRIORITY_FEE_GWEI||"0.00001";\n'
              '  const txOverrides={maxFeePerGas:ethers.parseUnits(maxFeeGwei,"gwei"),maxPriorityFeePerGas:ethers.parseUnits(maxPriorityFeeGwei,"gwei")};\n'
              '  if(txOverrides.maxPriorityFeePerGas>txOverrides.maxFeePerGas)throw new Error("priority fee exceeds max fee");\n'
              '  const state=fs.existsSync(statePath)?loadJson(statePath):{version:"v3",network:config.network,contracts:{},transactions:{},checks:{}};\n'
              '  state.checks.gasPolicy={maxFeeGwei,maxPriorityFeeGwei,maxFeePerGasWei:String(txOverrides.maxFeePerGas),maxPriorityFeePerGasWei:String(txOverrides.maxPriorityFeePerGas)};\n'
              '  return{config,provider,wallet,walletAddress,state,statePath,txOverrides};\n'
          )
          if new not in l:
              if old not in l:
                  raise SystemExit('getContext gas-policy anchor not found')
              l = l.replace(old, new, 1)
          if 'const c=await f.deploy(...args,ctx.txOverrides);' not in l:
              if 'const c=await f.deploy(...args);' not in l:
                  raise SystemExit('deploy wrapper anchor not found')
              l = l.replace('const c=await f.deploy(...args);', 'const c=await f.deploy(...args,ctx.txOverrides);', 1)
          if 'const tx=await contract[fn](...args,ctx.txOverrides);' not in l:
              if 'const tx=await contract[fn](...args);' not in l:
                  raise SystemExit('send wrapper anchor not found')
              l = l.replace('const tx=await contract[fn](...args);', 'const tx=await contract[fn](...args,ctx.txOverrides);', 1)
          lib.write_text(l)

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text())
          pkg['name'] = 'curveyield-boosthub-deployment-v12'
          pkg['version'] = '12.0.0'
          pkg['description'] = 'CurveYield BoostHub deployment package v12 (sdCRV + sdFXN) with enforced EIP-1559 deployment gas caps.'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')

          (root / 'CHANGELOG-v12.md').write_text(
              '# CHANGELOG v12\n\n'
              '- Preserves the v11 deployment package and contract source surfaces.\n'
              '- Adds enforced EIP-1559 transaction defaults to the deployment/configuration path: max fee 0.05 gwei; priority fee 0.00001 gwei.\n'
              '- Adds `compiled-and-live-fork-results-v1/` containing GitHub compilation artifacts and approved Ethereum mainnet-fork deployment evidence.\n'
          )
          (root / 'README-v12.md').write_text(
              '# CurveYield BoostHub Deployment Package v12\n\n'
              'This v12 package is derived from v11. Contract sources and production configuration are preserved. The deployment/configuration transaction path now defaults to `maxFeePerGas = 0.05 gwei` and `maxPriorityFeePerGas = 0.00001 gwei`.\n\n'
              'GitHub compilation artifacts and live-fork deployment evidence are stored under `compiled-and-live-fork-results-v1/`.\n'
          )
          PY
          node --check "$PKG_ROOT/deployment-v3/lib-v3.js"
          node --check "$PKG_ROOT/deployment-v3/deploy-configure-suite-v6.js"
          grep -n 'DEFAULT_MAX_FEE_GWEI="0.05"' "$PKG_ROOT/deployment-v3/deploy-configure-suite-v6.js"
          grep -n 'DEFAULT_MAX_PRIORITY_FEE_GWEI="0.00001"' "$PKG_ROOT/deployment-v3/deploy-configure-suite-v6.js"

      - name: Install package dependencies in GitHub only
        shell: bash
        run: |
          set -euo pipefail
          cd "$PKG_ROOT"
          npm ci --ignore-scripts 2>&1 | tee "$GITHUB_WORKSPACE/npm-ci-v1.log"

      - name: Run v12 static gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PKG_ROOT"
          npm run check:v6 2>&1 | tee "$GITHUB_WORKSPACE/static-checks-v1.log"

      - name: Compile Solidity contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$PKG_ROOT"
          npm run compile:solidity:v3 2>&1 | tee "$GITHUB_WORKSPACE/solidity-compile-v1.log"

      - name: Compile BoostHubStaking Vyper contract with 0.4.3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.4.3' > "$GITHUB_WORKSPACE/vyper-0.4.3-install-v1.log" 2>&1
          cd "$PKG_ROOT"
          npm run build:staking:v3 2>&1 | tee "$GITHUB_WORKSPACE/vyper-staking-compile-v1.log"

      - name: Compile CurveYieldGauge Vyper contract with 0.3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10' > "$GITHUB_WORKSPACE/vyper-0.3.10-install-v1.log" 2>&1
          cd "$PKG_ROOT"
          npm run build:gauge:v3 2>&1 | tee "$GITHUB_WORKSPACE/vyper-gauge-compile-v1.log"

      - name: Stage compiled-contract evidence folder
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1"
          COMPILED="$RESULTS/compiled-contracts-v1"
          mkdir -p "$COMPILED/logs" "$COMPILED/solidity-artifacts" "$COMPILED/vyper-artifacts"
          cp -a "$PKG_ROOT/artifacts-v3"/. "$COMPILED/solidity-artifacts/"
          cp -a "$PKG_ROOT/artifacts-vyper-v3"/. "$COMPILED/vyper-artifacts/"
          cp "$GITHUB_WORKSPACE/original-v11-integrity-v1.log" "$COMPILED/logs/original-v11-integrity-v1.log"
          cp "$GITHUB_WORKSPACE/npm-ci-v1.log" "$COMPILED/logs/npm-ci-v1.log"
          cp "$GITHUB_WORKSPACE/static-checks-v1.log" "$COMPILED/logs/static-checks-v1.log"
          cp "$GITHUB_WORKSPACE/solidity-compile-v1.log" "$COMPILED/logs/solidity-compile-v1.log"
          cp "$GITHUB_WORKSPACE/vyper-staking-compile-v1.log" "$COMPILED/logs/vyper-staking-compile-v1.log"
          cp "$GITHUB_WORKSPACE/vyper-gauge-compile-v1.log" "$COMPILED/logs/vyper-gauge-compile-v1.log"
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "python=$(python --version 2>&1)"
            echo "forge=$(forge --version | head -n1)"
            echo "anvil=$(anvil --version | head -n1)"
            python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.4.3' >/dev/null 2>&1
            echo "vyper_staking=$(vyper --version)"
            python -m pip install --disable-pip-version-check --no-input --force-reinstall 'vyper==0.3.10' >/dev/null 2>&1
            echo "vyper_gauge=$(vyper --version)"
          } > "$COMPILED/tool-versions-v1.txt"
          printf '{"status":"PASS","solidityArtifacts":true,"stakingVyperArtifact":true,"gaugeVyperArtifact":true}\n' > "$COMPILED/compilation-summary-v1.json"

      - name: Freeze approved Ethereum fork identity and start Anvil
        env:
          ARCHIVE_RPC: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_RPC"
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1/live-fork-simulation-v1"
          mkdir -p "$RESULTS"
          FORK_BLOCK="$(cast block-number --rpc-url "$ARCHIVE_RPC")"
          FORK_HASH="$(cast block "$FORK_BLOCK" --rpc-url "$ARCHIVE_RPC" --json | jq -r '.hash')"
          test "$FORK_HASH" != "null"
          printf 'rpc_profile=SIM_ARCHIVE_PRIMARY_ETHEREUM_01\nchain_id=1\nfork_block=%s\nfork_block_hash=%s\n' "$FORK_BLOCK" "$FORK_HASH" > "$RESULTS/fork-identity-v1.txt"
          echo "FORK_BLOCK=$FORK_BLOCK" >> "$GITHUB_ENV"
          echo "FORK_HASH=$FORK_HASH" >> "$GITHUB_ENV"

          ANVIL_ARGS=(--fork-url "$ARCHIVE_RPC" --fork-block-number "$FORK_BLOCK" --chain-id 1 --host 127.0.0.1 --port 8545 --silent)
          if anvil --help 2>&1 | grep -q -- '--block-base-fee-per-gas'; then
            ANVIL_ARGS+=(--block-base-fee-per-gas 1)
          elif anvil --help 2>&1 | grep -q -- '--base-fee'; then
            ANVIL_ARGS+=(--base-fee 1)
          fi
          anvil "${ANVIL_ARGS[@]}" > /tmp/boosthub-v11-anvil.log 2>&1 &
          echo $! > .anvil.pid
          for i in $(seq 1 45); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = '1'
          cast rpc anvil_setNextBlockBaseFeePerGas 0x1 --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || true

      - name: Resolve and fund live BoostHub owner on fork
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(cast call "$BOOSTHUB" 'owner()(address)' --rpc-url http://127.0.0.1:8545 | tr -d '\r\n')"
          [[ "$OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          cast rpc anvil_setBalance "$OWNER" 0x3635C9ADC5DEA00000 --rpc-url http://127.0.0.1:8545 >/dev/null
          echo "BOOSTHUB_OWNER=$OWNER" >> "$GITHUB_ENV"
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1/live-fork-simulation-v1"
          printf 'boosthub=%s\nimpersonated_current_owner=%s\n' "$BOOSTHUB" "$OWNER" > "$RESULTS/boosthub-owner-v1.txt"

      - name: Execute exact v12 deployment/configuration orchestrator on live fork
        env:
          RPC_URL: http://127.0.0.1:8545
          IMPERSONATE_DEPLOYER_ADDRESS: ${{ env.BOOSTHUB_OWNER }}
          DEPLOY_MAX_FEE_GWEI: '0.05'
          DEPLOY_MAX_PRIORITY_FEE_GWEI: '0.00001'
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1/live-fork-simulation-v1"
          export STATE_FILE="$RESULTS/deployment-state-v6.json"
          cd "$PKG_ROOT"
          npm run deploy:v6 2>&1 | tee "$RESULTS/deployment-success-v1.log"
          npm run verify:v6 2>&1 | tee "$RESULTS/post-deployment-verify-v1.log"

      - name: Verify fork deployment, transaction gas caps, and runtime code
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1/live-fork-simulation-v1"
          STATE="$RESULTS/deployment-state-v6.json"
          STATE="$STATE" RESULTS="$RESULTS" FORK_BLOCK="$FORK_BLOCK" FORK_HASH="$FORK_HASH" BOOSTHUB_OWNER="$BOOSTHUB_OWNER" node <<'NODE'
          const fs=require('fs');
          const {ethers}=require(process.env.PKG_ROOT + '/node_modules/ethers');
          (async()=>{
            const provider=new ethers.JsonRpcProvider('http://127.0.0.1:8545');
            const state=JSON.parse(fs.readFileSync(process.env.STATE,'utf8'));
            const exactMaxFee=ethers.parseUnits('0.05','gwei');
            const exactPriority=ethers.parseUnits('0.00001','gwei');
            const transactions=[];
            const receipts={};
            for(const [key,hash] of Object.entries(state.transactions||{})){
              const tx=await provider.getTransaction(hash);
              const receipt=await provider.getTransactionReceipt(hash);
              if(!tx||!receipt) throw new Error(`missing transaction evidence for ${key}`);
              const maxFee=tx.maxFeePerGas;
              const priority=tx.maxPriorityFeePerGas;
              if(maxFee!==exactMaxFee) throw new Error(`${key}: maxFeePerGas ${maxFee} != ${exactMaxFee}`);
              if(priority!==exactPriority) throw new Error(`${key}: maxPriorityFeePerGas ${priority} != ${exactPriority}`);
              if(receipt.status!==1) throw new Error(`${key}: transaction reverted`);
              transactions.push({key,hash,type:tx.type,maxFeePerGasWei:String(maxFee),maxPriorityFeePerGasWei:String(priority),exactPolicyMatch:true});
              receipts[key]={hash,status:receipt.status,blockNumber:receipt.blockNumber,gasUsed:String(receipt.gasUsed),contractAddress:receipt.contractAddress};
            }
            if(transactions.length===0) throw new Error('no deployment/configuration transactions recorded');

            const contracts=[];
            for(const [key,value] of Object.entries(state.contracts||{})){
              if(!value?.address) continue;
              const code=await provider.getCode(value.address);
              if(code==='0x') throw new Error(`${key}: no deployed runtime code`);
              contracts.push({key,address:value.address,runtimeCodeBytes:(code.length-2)/2,codeExists:true});
            }
            if(contracts.length===0) throw new Error('no deployed contracts recorded');
            if(state.checks?.finalVerification?.passed!==true) throw new Error('finalVerification did not pass');
            if(state.checks?.finalVerification?.sdYbDeploymentAbsent!==true) throw new Error('sdYB absence invariant did not pass');
            if(state.checks?.finalVerification?.boostHubDepositorsUnlocked!==true) throw new Error('BoostHub depositor unlocked invariant did not pass');
            const gp=state.checks?.gasPolicy;
            if(gp?.maxFeeGwei!=='0.05'||gp?.maxPriorityFeeGwei!=='0.00001') throw new Error('state gas policy mismatch');

            const results=process.env.RESULTS;
            fs.writeFileSync(results+'/gas-policy-check-v1.json',JSON.stringify({status:'PASS',policy:{maxFeeGwei:'0.05',maxPriorityFeeGwei:'0.00001',maxFeePerGasWei:String(exactMaxFee),maxPriorityFeePerGasWei:String(exactPriority)},transactionCount:transactions.length,transactions},null,2)+'\n');
            fs.writeFileSync(results+'/transaction-receipts-v1.json',JSON.stringify(receipts,null,2)+'\n');
            fs.writeFileSync(results+'/deployed-code-check-v1.json',JSON.stringify({status:'PASS',contractCount:contracts.length,contracts},null,2)+'\n');
            fs.writeFileSync(results+'/simulation-summary-v1.json',JSON.stringify({status:'PASS',executionPath:'CurveYield2/Contract-Automation existing BoostHub live-fork skeleton',rpcProfile:'SIM_ARCHIVE_PRIMARY_ETHEREUM_01',chainId:1,forkBlock:Number(process.env.FORK_BLOCK),forkBlockHash:process.env.FORK_HASH,boostHub:'0xFbEF8941Da53EA724385B44E91ae9672061D0263',impersonatedCurrentBoostHubOwner:process.env.BOOSTHUB_OWNER,deploymentPhase:state.phase,transactionCount:transactions.length,deployedContractCount:contracts.length,gasPolicy:{maxFeeGwei:'0.05',maxPriorityFeeGwei:'0.00001'},localForkBaseFeeAdjustedForGasPolicy:true,finalVerification:state.checks.finalVerification},null,2)+'\n');
          })().catch((e)=>{console.error(e);process.exit(1)});
          NODE

      - name: Build v12 package manifest, checksums, and ZIP
        shell: bash
        run: |
          set -euo pipefail
          RESULTS="$PKG_ROOT/compiled-and-live-fork-results-v1"
          cat > "$RESULTS/MANIFEST-v1.md" <<EOF
          # Compiled contracts and live-fork results v1

          - Source: CurveYield2/Audit-Controller / $SOURCE_ZIP_REL
          - Source v11 ZIP SHA-256: $SOURCE_ZIP_SHA256
          - Execution repository: CurveYield2/Contract-Automation
          - Execution workflow: .github/workflows/boosthub-v11-package-live-fork-v1.yml
          - Existing skeleton basis: .github/workflows/boosthub-v6-live-fork-v1.yml
          - Approved fork RPC profile: SIM_ARCHIVE_PRIMARY_ETHEREUM_01
          - Fork block: $FORK_BLOCK
          - Fork block hash: $FORK_HASH
          - Deployment max fee: 0.05 gwei
          - Deployment priority fee: 0.00001 gwei
          - Local Anvil base fee was reduced so the requested ultra-low fee caps could be mined during simulation.
          EOF
          cp "$GITHUB_WORKSPACE/source-binding-v1.txt" "$RESULTS/source-binding-v1.txt"
          cd "$PKG_ROOT"
          find . -type f ! -name 'SHA256SUMS-v12.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-v12.txt
          cd "$GITHUB_WORKSPACE/.work"
          zip -qr "$GITHUB_WORKSPACE/$OUTPUT_ZIP_V12" "$OUTPUT_ROOT_V12"
          unzip -t "$GITHUB_WORKSPACE/$OUTPUT_ZIP_V12" | tee "$RESULTS/final-zip-integrity-v1.log"
          sha256sum "$GITHUB_WORKSPACE/$OUTPUT_ZIP_V12" | tee "$GITHUB_WORKSPACE/final-v12-zip-sha256-v1.txt"

      - name: Upload completed v12 ZIP and execution evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v12
          path: |
            CurveYield-BoostHub-sdCRV-sdFXN-Deployment-Package-v12.zip
            final-v12-zip-sha256-v1.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stop Anvil
        if: always()
        shell: bash
        run: |
          if [ -f .anvil.pid ]; then kill "$(cat .anvil.pid)" 2>/dev/null || true; fi

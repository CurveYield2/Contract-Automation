name: Lite Master Targeted Tests Regression v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/lite-master-review-v1.mjs'
      - 'scripts/lib/lite-master-targeted-tests-v1.mjs'
      - 'scripts/lite-phase-packet-controller-v1.mjs'
      - 'scripts/tests/lite-master-targeted-tests-v1.test.mjs'
      - '.github/workflows/lite-master-targeted-tests-regression-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify controller JavaScript syntax
        run: |
          node --check scripts/lib/lite-master-review-v1.mjs
          node --check scripts/lib/lite-master-targeted-tests-v1.mjs
          node --check scripts/lite-phase-packet-controller-v1.mjs
          node --check scripts/tests/lite-master-targeted-tests-v1.test.mjs
      - name: Validate targeted-test lifecycle and terminal gate
        run: node --test scripts/tests/lite-master-targeted-tests-v1.test.mjs

name: Temporary Lite Phase Schema Authority Migration v1

on:
  push:
    branches:
      - upgrade/lite-phase-schema-policy-v1
    paths:
      - '.github/workflows/temp-migrate-lite-phase-schema-policy-v1.yml'
      - 'scripts/temp-migrate-lite-phase-schema-policy-v1.py'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/lite-phase-schema-policy-v1
          persist-credentials: false
          fetch-depth: 1
      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        run: bash scripts/select-audit-controller-token.sh
      - name: Migrate authority
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf .audit-controller
          gh repo clone CurveYield2/Audit-Controller .audit-controller -- --filter=blob:none --no-checkout
          cd .audit-controller
          git fetch origin upgrade/lite-phase-schema-policy-v1
          git checkout -B upgrade/lite-phase-schema-policy-v1 origin/upgrade/lite-phase-schema-policy-v1
          python3 ../scripts/temp-migrate-lite-phase-schema-policy-v1.py "Audit Skill - Current Authority"
          git config user.name 'CurveYield Lite Phase Schema Migration'
          git config user.email 'lite-phase-schema@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'refactor(lite): enforce one phase schema and data-producing actions'
            git push origin HEAD:upgrade/lite-phase-schema-policy-v1
          fi

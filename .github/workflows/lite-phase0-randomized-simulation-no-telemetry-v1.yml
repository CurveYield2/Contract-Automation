name: Lite Phase 0 Randomized Simulation v1 No Telemetry

on:
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string
permissions:
  contents: write
  actions: read

jobs:
  phase0-randomized-simulation:
    runs-on: ubuntu-latest
    # Simulation may run for 50 minutes; retain time for failed-run evidence upload.
    timeout-minutes: 60
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Restore pinned Node dependencies No Telemetry
        uses: ./.github/actions/setup-no-telemetry-node-cache

      - name: Validate No Telemetry fork before running an audit
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/github-native-sim/src/phase0-randomized-simulation-no-telemetry-v1.mjs
          node --check scripts/run-phase0-randomized-simulation-no-telemetry-v1.mjs
          node --check scripts/write-phase0-simulation-outputs-no-telemetry-v1.mjs
          node --check scripts/lite-phase0-finalize-no-telemetry-v1.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const engine=fs.readFileSync('packages/github-native-sim/src/phase0-randomized-simulation-no-telemetry-v1.mjs','utf8');
          const writer=fs.readFileSync('scripts/write-phase0-simulation-outputs-no-telemetry-v1.mjs','utf8');
          const finalizer=fs.readFileSync('scripts/lite-phase0-finalize-no-telemetry-v1.mjs','utf8');
          if(engine.includes('await runTelemetry(')) throw new Error('Unexpected ABI telemetry execution');
          if(!engine.includes("executionMode='NO_TELEMETRY'")) throw new Error('Missing No Telemetry mode binding');
          if(writer.includes('PHASE0_TELEMETRY_ANALYSIS_v1.json') || writer.includes('telemetry:(summary.telemetry')) throw new Error('Later-phase telemetry dependence');
          if(finalizer.includes('const telemetry=simulation.telemetry')) throw new Error('Finalizer still requires telemetry shards');
          NODE

      - name: Install retained audit toolchain
        uses: ./.github/actions/setup-no-telemetry-v7-toolchain

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact campaign
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF"

      - name: Run Anvil baseline, deployment simulation and Medusa No Telemetry
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM secret is missing"; exit 1; }
          chain_id="$(curl -fsS --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test "$chain_id" = "0x1" || { echo "::error::Ethereum fork source did not report chain ID 1"; exit 1; }
          historical_code="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_getCode","params":["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2","0x112a880"]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test -n "$historical_code" && test "$historical_code" != "0x" || { echo "::error::Ethereum fork source did not return historical WETH code at block 18000000"; exit 1; }
          rm -rf .phase0-randomized-output
          # Reserve time for diagnostics and artifact upload if RPC or Medusa stalls.
          # 50-minute HARD limit plus independent child-process watchdog: RPC
          # failure or stalled calls terminate early even if the runner is blocked.
          timeout -s TERM -k 30s 3000s node scripts/phase0-no-telemetry-watchdog-v1.mjs -- node scripts/run-phase0-randomized-simulation-no-telemetry-v1.mjs \
            --controller-root .audit-controller \
            --campaign-path "${{ inputs.campaign_path }}" \
            --output .phase0-randomized-output \
            --fork-url "$ETHEREUM_FORK_RPC_URL" | tee /tmp/phase0-randomized.json

      - name: Report randomized simulation diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          summary=.phase0-randomized-output/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
          if [ ! -f "$summary" ]; then
            echo "::warning::Phase-0 randomized simulation summary was not produced"
            exit 0
          fi
          echo "---- deployment coverage ----"
          jq '.deployment.coverage // {}' "$summary" || true
          echo "---- deployment failures / limitations ----"
          jq '[.deployment.limitations[]? | select(.type | test("SOURCE_PLAN_(DEPLOYMENT_FAILED|CONSTRUCTOR_ARGUMENT_UNRESOLVED|ARTIFACT_RESOLUTION_FAILED)"))] | .[:40]' "$summary" || true
          echo "---- failed deployment attempts ----"
          jq '[.deployment.attempts[]? | select(.status != "PASS")] | .[:40]' "$summary" || true
          echo "---- Medusa ----"
          jq '.medusa // {}' "$summary" || true
          medusa_raw="$(find .phase0-randomized-output -name MEDUSA_RAW_OUTPUT_v1.log -print -quit 2>/dev/null || true)"
          if ! jq -e '.medusa.status=="PASS" or .medusa.status=="COMPLETE_WITH_ORACLE_GAPS"' "$summary" >/dev/null && [ -n "$medusa_raw" ]; then
            echo "---- Medusa raw output (tail) ----"
            tail -n 80 "$medusa_raw" | sed -E 's#https?://[^ ]+#[URL]#g' || true
          fi

      - name: Retain raw randomized simulation output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-no-telemetry-${{ inputs.campaign_id }}-${{ github.run_id }}
          path: .phase0-randomized-output
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Require complete randomized simulation evidence
        shell: bash
        run: |
          set -euo pipefail
          summary=.phase0-randomized-output/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
          index=.phase0-randomized-output/PHASE0_SIMULATION_RUN_INDEX_v1.json
          jq -e '
            .executionMode=="NO_TELEMETRY" and
            (.telemetry?==null) and
            .executionNormalization.policy=="ALL_EVM_PACKAGES_USE_CANONICAL_ETHEREUM_ANVIL_BASELINE" and
            ((.deployment.coverage.sourcePlanUnresolved // 0)|tonumber)==0 and
            ((.deployment.coverage.sourceKnownMissingTargets // 0)|tonumber)==0 and
            (
              (((.deployment.coverage.mutableTargets // 0)|tonumber)>0 and
               (.medusa.status=="PASS" or .medusa.status=="COMPLETE_WITH_ORACLE_GAPS") and
               (.medusa.observedCalls|tonumber)>=100001 and
               .medusa.variety.status=="PASS")
              or
              (((.deployment.coverage.mutableTargets // 0)|tonumber)==0 and
               ((.deployment.coverage.sourcePlanPlanned // 0)|tonumber)==0 and
               ((.deployment.coverage.zeroArgFallbackCandidates // 0)|tonumber)==0)
            )
          ' "$summary" >/dev/null
          jq -e '
            .policy.realAbiCallsOnly==true and
            .policy.rawRandomBytes==false and
            (.policy.medusaMinimumCalls|tonumber)>=100001 and
            ([.runs[]?.type]|all(.=="MEDUSA_ANVIL_FORK")) and
            .executionNormalization.policy=="ALL_EVM_PACKAGES_USE_CANONICAL_ETHEREUM_ANVIL_BASELINE"
          ' "$index" >/dev/null

      - name: Project outputs into exact later-phase formats
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-phase0-simulation-outputs-no-telemetry-v1.mjs             --controller-root .audit-controller             --campaign-path "${{ inputs.campaign_path }}"             --simulation-output .phase0-randomized-output

      - name: Publish Phase-0 simulation evidence
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
          CAMPAIGN_PATH: ${{ inputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Phase0 Simulation Automation'
          git config user.email 'phase0-simulation@users.noreply.github.com'
          git add -- "$CAMPAIGN_PATH/evidence/phase0" "$CAMPAIGN_PATH/derived/phase-0" "$CAMPAIGN_PATH/work/phase-06"
          if git diff --cached --quiet; then
            echo "::error::Phase-0 randomized simulation produced no durable outputs"
            exit 1
          fi
          git commit -m "audit(phase0): add randomized simulation baseline ${{ inputs.campaign_id }}"
          git push origin "HEAD:$AUDIT_CONTROLLER_REF"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Phase-0 randomized simulation No Telemetry"
            echo "- State engine: Anvil Ethereum fork"
            echo "- Deployment scripts: framework-native Anvil adapters only; no source mutation"
            echo "- Medusa: Anvil-forked baseline, >100K call requirement"
            echo "- ABI telemetry stage: omitted"
            echo "- Later phases use deployment and Medusa evidence only"
          } >> "$GITHUB_STEP_SUMMARY"

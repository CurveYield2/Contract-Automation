name: Lite Phase 0 Forked Deployment and Configuration No Telemetry v2
on:
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string
      campaign_path:
        required: true
        type: string
      audit_controller_ref:
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: read

jobs:
  phase0-deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted Contract-Automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Restore pinned Node dependencies
        uses: ./.github/actions/setup-phase0-node-cache

      - name: Enable Forge for package deployment scripts only
        uses: ./.github/actions/setup-phase0-deployment-only-toolchain-v1

      - name: Select Audit-Controller credential
        env:
          AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ secrets.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          PREFLIGHTSIM_FALLBACK_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
        shell: bash
        run: bash scripts/select-audit-controller-token.sh

      - name: Checkout exact campaign source
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/checkout-audit-controller-once-v1.sh .audit-controller "$AUDIT_CONTROLLER_REF"

      - name: Run package deployment and configuration scripts on isolated Ethereum Anvil fork
        env:
          ETHEREUM_FORK_RPC_URL: ${{ secrets.RPC_ETHEREUM }}
          CAMPAIGN_PATH: ${{ inputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::RPC_ETHEREUM secret is missing"; exit 1; }
          chain_id="$(curl -fsS --max-time 15 -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$ETHEREUM_FORK_RPC_URL" | jq -r '.result // empty')"
          test "$chain_id" = "0x1" || { echo "::error::Fork source must report Ethereum chain ID 1"; exit 1; }
          rm -rf .phase0-deploy-output
          timeout -s TERM -k 30s 2400s node scripts/run-phase0-fork-deploy-config-v1.mjs \
            --controller-root .audit-controller \
            --campaign-path "$CAMPAIGN_PATH" \
            --output .phase0-deploy-output \
            --fork-url "$ETHEREUM_FORK_RPC_URL" | tee /tmp/phase0-deploy-result.json

      - name: Reconcile verified non-execution script exclusions
        shell: bash
        run: |
          set -euo pipefail
          file=.phase0-deploy-output/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
          if jq -e '.status=="BLOCKED_SCRIPT_FAILURE"' "$file" >/dev/null; then
            node scripts/reconcile-phase0-deploy-evidence-v1.mjs \
              --input "$file" --output "$file" \
              --campaign-root ".audit-controller/${{ inputs.campaign_path }}" \
              --source-run-id "$GITHUB_RUN_ID"
          fi

      - name: Retain deployment/configuration evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase0-deploy-config-${{ inputs.campaign_id }}-${{ github.run_id }}
          path: .phase0-deploy-output
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Require source package deployment/configuration completion
        shell: bash
        run: |
          set -euo pipefail
          evidence=.phase0-deploy-output/PHASE0_DEPLOY_CONFIG_EXECUTION_v1.json
          test -s "$evidence"
          node --input-type=module -e 'import fs from "node:fs";import {assertDeployGateEvidenceV2} from "./scripts/lib/phase0-deploy-gate-v2.mjs";assertDeployGateEvidenceV2(JSON.parse(fs.readFileSync(process.argv[1],"utf8")))' "$evidence"

      - name: Publish deployment evidence and Phase 6 matrix without fuzz baselines
        shell: bash
        run: |
          set -euo pipefail
          node scripts/write-phase0-fork-deploy-outputs-v1.mjs \
            --controller-root .audit-controller \
            --campaign-path "${{ inputs.campaign_path }}" \
            --simulation-output .phase0-deploy-output

      - name: Publish to exact Audit-Controller campaign ref
        env:
          GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
          AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
          CAMPAIGN_PATH: ${{ inputs.campaign_path }}
        shell: bash
        run: |
          set -euo pipefail
          cd .audit-controller
          git config user.name 'CurveYield Phase0 Deployment Automation'
          git config user.email 'phase0-deployment@users.noreply.github.com'
          # Stage the exact campaign, including deletions of retired Phase-0 derived baseline files.
          git add -A -- "$CAMPAIGN_PATH"
          if git diff --cached --quiet; then
            echo "::error::Phase-0 deployment evidence produced no durable changes"
            exit 1
          fi
          git commit -m "audit(phase0): retain only forked package deploy/config evidence ${{ inputs.campaign_id }}"
          git push origin "HEAD:$AUDIT_CONTROLLER_REF"

      - name: Summarize
        shell: bash
        run: |
          echo "## Phase 0 forked deploy/config only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native package deploy/configuration scripts on isolated Anvil fork" >> "$GITHUB_STEP_SUMMARY"
          echo "- No randomized Medusa calls, ABI telemetry, or required baseline simulation inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Script failures and unsafe adapters remain hard gate failures" >> "$GITHUB_STEP_SUMMARY"

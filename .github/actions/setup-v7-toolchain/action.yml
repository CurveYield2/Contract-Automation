name: Setup V7 toolchain
description: Install and verify the exact Slither, Medusa, and Forge toolchain used by Audit V7

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pinned Slither
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input 'slither-analyzer==0.11.6'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.6'
        cache: false

    - name: Cache Medusa Go build inputs
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: v7-medusa-go-${{ runner.os }}-${{ runner.arch }}-1.5.1
        restore-keys: |
          v7-medusa-go-${{ runner.os }}-${{ runner.arch }}-

    - name: Install pinned Medusa and expose pinned Forge
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/v7-tools/bin"
        mkdir -p "$install_dir"
        GOBIN="$install_dir" go install github.com/crytic/medusa@v1.5.1
        forge_entry="$GITHUB_WORKSPACE/node_modules/@foundry-rs/forge/bin.mjs"
        test -f "$forge_entry"
        cat > "$install_dir/forge" <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        exec node "$GITHUB_WORKSPACE/node_modules/@foundry-rs/forge/bin.mjs" "$@"
        SH
        chmod +x "$install_dir/forge"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify exact V7 toolchain
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$RUNNER_TEMP/v7-tools/bin:$PATH"
        npm run v7:toolchain:verify

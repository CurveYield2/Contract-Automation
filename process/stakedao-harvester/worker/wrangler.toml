name = "sd-harvester"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute (Cloudflare free plan: 5 cron triggers per account; this uses 1).
[triggers]
crons = ["* * * * *"]

# All logic and state live in one Durable Object (SQLite backend = free plan).
[[durable_objects.bindings]]
name = "BOT"
class_name = "BotState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotState"]

[vars]
# Set after deploying contracts/src/StakeDaoHarvester.sol
HARVESTER = "0x00D376d1f90B7e870Fd86Ee4FB4db76482E57A09"
# v1.1 batch/optional-swap path (SPEC.md "v1.1"): "1" only after a contract with harvestBatch is deployed
HARVESTER_V11 = "0"
# Transactions are sent only through MEV Blocker /noreverts: revert protection (a reverting tx is never included)
# + no front-running; searchers may only backrun (harmless here). NOT /fullprivacy: it has no revert protection.
SEND_RPC_URL = "https://rpc.mevblocker.io/noreverts"

# Secrets (wrangler secret put â€¦): ETH_RPC_URL, BOT_PRIVATE_KEY, HMAC_SECRET

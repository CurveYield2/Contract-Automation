<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Upgrade Agent Launcher</title>
  <link rel="stylesheet" href="/styles_v1.css">
</head>
<body>
  <main>
    <section class="panel">
      <p class="eyebrow">CurveYield2</p>
      <h1>Upgrade Agent Launcher</h1>
      <p class="lede">Start a focus-locked repository upgrade. Execution continues in GitHub even if this page is closed.</p>

      <form id="launch-form">
        <label>Task name
          <input id="task-name" name="taskName" maxlength="120" required autocomplete="off" placeholder="e.g. Repair manager status reporting">
        </label>

        <label>What should the agent accomplish?
          <textarea id="instruction" name="instruction" maxlength="30000" required rows="10" placeholder="Describe the exact requested end-state."></textarea>
        </label>

        <label>Target repository
          <select id="target-repository" name="targetRepository">
            <option value="CurveYield2/Contract-Automation">CurveYield2/Contract-Automation</option>
            <option value="CurveYield2/Audit-Controller">CurveYield2/Audit-Controller</option>
          </select>
        </label>

        <button id="launch-button" type="submit">Launch</button>
      </form>

      <section id="status" class="status hidden" aria-live="polite">
        <p id="status-label"></p>
        <p id="status-detail" class="muted"></p>
        <div id="links" class="links hidden">
          <a id="output-link" class="button-link" target="_blank" rel="noreferrer">Open output</a>
          <a id="project-link" class="button-link secondary" target="_blank" rel="noreferrer">Open ChatGPT Project</a>
          <a id="artifact-link" class="button-link secondary hidden" target="_blank" rel="noreferrer">Open artifact</a>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/app_v1.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Browser Monitor Click POF v1</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; font-family: sans-serif; background: #f3f4f6; }
  #panel { position: absolute; left: 80px; top: 70px; width: 720px; padding: 28px; background: white; border: 2px solid #111827; }
  h1 { margin: 0 0 24px; font-size: 28px; }
  #probe-input { width: 520px; height: 54px; font-size: 24px; padding: 0 12px; box-sizing: border-box; }
  #probe-button { display: block; margin-top: 26px; width: 300px; height: 72px; font-size: 24px; cursor: pointer; }
  #status, #typed { margin-top: 22px; font-size: 24px; }
</style>
</head>
<body>
  <div id="panel">
    <h1>Interactive Browser Monitor POF v1</h1>
    <input id="probe-input" autocomplete="off" placeholder="Type through noVNC">
    <button id="probe-button">CLICK THROUGH noVNC</button>
    <div id="status">Clicks: <span id="click-count">0</span></div>
    <div id="typed">Typed: <span id="typed-value"></span></div>
  </div>
<script>
  let clicks = 0;
  const input = document.getElementById('probe-input');
  const button = document.getElementById('probe-button');
  const clickCount = document.getElementById('click-count');
  const typedValue = document.getElementById('typed-value');

  input.addEventListener('input', () => {
    typedValue.textContent = input.value;
    document.body.dataset.keyboard = input.value;
  });

  button.addEventListener('click', () => {
    clicks += 1;
    clickCount.textContent = String(clicks);
    document.body.dataset.clicks = String(clicks);
  });
</script>
</body>
</html>

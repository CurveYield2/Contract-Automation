# Exact CurveYield DEX v16 audit overlay; no hard-coded RPC.
[profile.default]
src = "contracts"
test = "test"
out = "out-phase6-audit"
libs = ["node_modules", "vendor"]
cache_path = "cache-phase6-audit"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=node_modules/@openzeppelin/","@balancer-labs/=vendor/balancer-v3-upstream/pkg/"]
[fuzz]
runs = 1024
max_test_rejects = 65536

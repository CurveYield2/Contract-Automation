name: Phase 0 Simulation Testing v1
description: Isolated Phase-0 deployment, Anvil, Medusa, and ABI telemetry testing fork.

inputs:
  campaign_id:
    description: Existing Audit-Controller campaign ID
    required: true
  campaign_path:
    description: Existing Audit-Controller campaign path
    required: true
  audit_controller_ref:
    description: Audit-Controller ref containing the campaign
    required: false
    default: main
  audit_controller_token:
    description: Primary token for reading Audit-Controller
    required: false
  fallback_token:
    description: Fallback token for reading Audit-Controller
    required: false
  ethereum_fork_rpc_url:
    description: Ethereum archive RPC used by local Anvil fork
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install trusted runner dependencies
      shell: bash
      run: npm ci --force

    - name: Test isolated simulation adapter
      shell: bash
      run: node --test packages/github-native-sim/audit-harnesses/phase0-simulation-testing-v1/test-v1.test.mjs

    - name: Install retained audit toolchain
      uses: ./.github/actions/setup-v7-toolchain

    - name: Select Audit-Controller credential
      shell: bash
      env:
        AUDIT_CONTROLLER_PRIMARY_TOKEN: ${{ inputs.audit_controller_token }}
        PREFLIGHTSIM_FALLBACK_TOKEN: ${{ inputs.fallback_token }}
        AUDIT_CONTROLLER_TOKEN_REQUIRED: 'true'
      run: bash scripts/select-audit-controller-token.sh

    - name: Checkout exact campaign
      shell: bash
      env:
        GH_TOKEN: ${{ env.AUDIT_CONTROLLER_GITHUB_TOKEN }}
        AUDIT_CONTROLLER_REF: ${{ inputs.audit_controller_ref }}
      run: |
        set -euo pipefail
        gh auth setup-git
        rm -rf .simulation-testing-audit-controller
        gh repo clone CurveYield2/Audit-Controller .simulation-testing-audit-controller -- --filter=blob:none --no-checkout
        cd .simulation-testing-audit-controller
        git fetch origin "$AUDIT_CONTROLLER_REF"
        git checkout -B "$AUDIT_CONTROLLER_REF" "origin/$AUDIT_CONTROLLER_REF"

    - name: Run simulation testing
      shell: bash
      env:
        ETHEREUM_FORK_RPC_URL: ${{ inputs.ethereum_fork_rpc_url }}
        CAMPAIGN_PATH: ${{ inputs.campaign_path }}
      run: |
        set -euo pipefail
        test -n "${ETHEREUM_FORK_RPC_URL:-}" || { echo "::error::Ethereum fork RPC is required"; exit 1; }
        rm -rf .simulation-testing-output
        node packages/github-native-sim/audit-harnesses/phase0-simulation-testing-v1/run-v1.mjs           --controller-root .simulation-testing-audit-controller           --campaign-path "$CAMPAIGN_PATH"           --output .simulation-testing-output           --fork-url "$ETHEREUM_FORK_RPC_URL" | tee /tmp/phase0-simulation-testing-v1.json

    - name: Report simulation testing diagnostics
      if: ${{ always() }}
      shell: bash
      run: |
        summary=.simulation-testing-output/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
        if [ ! -f "$summary" ]; then
          echo "::warning::Simulation testing summary was not produced"
          exit 0
        fi
        echo "---- deployment coverage ----"
        jq '.deployment.coverage // {}' "$summary" || true
        echo "---- deployment attempts ----"
        jq '.deployment.attempts // []' "$summary" || true
        echo "---- deployment limitations ----"
        jq '.deployment.limitations // []' "$summary" || true
        echo "---- Medusa ----"
        jq '.medusa // {}' "$summary" || true
        echo "---- telemetry ----"
        jq '.telemetry // []' "$summary" || true

    - name: Retain simulation testing output
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: phase0-simulation-testing-${{ inputs.campaign_id }}-${{ github.run_id }}
        path: .simulation-testing-output
        if-no-files-found: warn
        retention-days: 14
        include-hidden-files: true

    - name: Require complete simulation testing evidence
      shell: bash
      run: |
        set -euo pipefail
        summary=.simulation-testing-output/PHASE0_RANDOMIZED_SIMULATION_SUMMARY_v1.json
        index=.simulation-testing-output/PHASE0_SIMULATION_RUN_INDEX_v1.json
        jq -e '
          .executionNormalization.policy=="ALL_EVM_PACKAGES_USE_CANONICAL_ETHEREUM_ANVIL_BASELINE" and
          ((.deployment.coverage.sourcePlanUnresolved // 0)|tonumber)==0 and
          (((.deployment.coverage.mutableTargets // 0)|tonumber)>0) and
          .medusa.status=="PASS" and
          (.medusa.observedCalls|tonumber)>=100001 and
          (.telemetry|length)>=1 and
          all(.telemetry[]; .status=="PASS")
        ' "$summary" >/dev/null
        jq -e '
          .policy.realAbiCallsOnly==true and
          .policy.rawRandomBytes==false and
          .policy.crossContractBursts==true and
          (.policy.accountingActionWeight|tonumber)>=0.8
        ' "$index" >/dev/null
